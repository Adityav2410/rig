name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating major tags
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy rig/
      - name: Check out the click target repo (used by the snapshot tests)
        run: git clone -q --depth 1 --branch 8.5.0 https://github.com/pallets/click workspaces/click
      - run: uv run pytest -q
