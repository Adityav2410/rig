<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.ico" sizes="any"><title>Agents from First Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---- tokens (Study Site Redesign Spec, Section 5). Components read only these; no hex below this block. ---- */
:root, .force-light{
  /* neutrals */
  --bg:#f4f6f5; --surface:#ffffff; --sunken:#eaeeec; --ink:#141a1c; --muted:#55606a; --line:#d9dfdc;
  --accent:#0b6b5e; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --phase-1:#0b6b5e; --phase-2:#12877a; --phase-3:#1fa396; --phase-4:#5cc2b4;
  /* semantic: fg = label and icon, tint = block background, edge = left rule */
  --concept-fg:#1f4fc2;    --concept-tint:#eef3fe;    --concept-edge:#4a78e0;
  --build-fg:#17703a;      --build-tint:#ebf6ef;      --build-edge:#2e9157;
  --experiment-fg:#6a32c9; --experiment-tint:#f3effd; --experiment-edge:#8a63e6;
  --check-fg:#8a5a00;      --check-tint:#fdf5e2;      --check-edge:#c08a1a;
  --read-fg:#4a5868;       --read-tint:#f1f4f7;       --read-edge:#7d8a99;
  --pitfall-fg:#b0281c;    --pitfall-tint:#fdefed;    --pitfall-edge:#d9483b;
  /* code (kept from the previous theme: syntax colours are not content hues) */
  --code-bg:#f0f3f1; --code-ink:#1d2a2c; --tok-k:#8a3ab9; --tok-s:#0b6b5e; --tok-c:#58636a; --tok-n:#8a5a00; --tok-f:#1f5fae;
  /* type */
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs-body:17px; --lh-body:1.65; --fs-lead:19px; --fs-meta:14px; --fs-eyebrow:12px;
  /* space (4 px base), radius, layout */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --measure:68ch; --rail:280px; --content:720px; --outline:220px;
  --shadow-float:0 8px 24px rgba(16,24,28,.12);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:150ms;
  /* aliases the two hand-drawn Start here figures use */
  --cds-chart-axis:#7d8a99; --cds-chart-categorical-1:var(--accent); --cds-text-primary:var(--ink); --cds-text-secondary:var(--muted); --cds-chart-reference-tint:var(--sunken);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0e1315; --surface:#151c1e; --sunken:#1b2427; --ink:#e3eae8; --muted:#9aa7a5; --line:#263133;
  --accent:#43c2a9; --accent-ink:#06211c; --accent-soft:#16332e;
  --phase-1:#2f9e8c; --phase-2:#43c2a9; --phase-3:#6fd3bf; --phase-4:#a3e4d6;
  --concept-fg:#93b6ff;    --concept-tint:#18233a;    --concept-edge:#5884ea;
  --build-fg:#74d49e;      --build-tint:#132a1e;      --build-edge:#3fa86d;
  --experiment-fg:#c6a9ff; --experiment-tint:#241c3a; --experiment-edge:#8f72ef;
  --check-fg:#f0c461;      --check-tint:#2d2410;      --check-edge:#c7962d;
  --read-fg:#aab7c6;       --read-tint:#1c242c;       --read-edge:#6a7a8c;
  --pitfall-fg:#ff9389;    --pitfall-tint:#3a1816;    --pitfall-edge:#e0584f;
  --shadow-float:0 8px 24px rgba(0,0,0,.45);
  --code-bg:#11181a; --code-ink:#d6e0de; --tok-k:#c792ea; --tok-s:#7fd6c2; --tok-c:#7d8b8a; --tok-n:#f0c461; --tok-f:#82aaff;
  --cds-chart-axis:#6a7a8c;
}}
:root[data-theme="dark"], .force-dark{ color-scheme:dark;
  --bg:#0e1315; --surface:#151c1e; --sunken:#1b2427; --ink:#e3eae8; --muted:#9aa7a5; --line:#263133;
  --accent:#43c2a9; --accent-ink:#06211c; --accent-soft:#16332e;
  --phase-1:#2f9e8c; --phase-2:#43c2a9; --phase-3:#6fd3bf; --phase-4:#a3e4d6;
  --concept-fg:#93b6ff;    --concept-tint:#18233a;    --concept-edge:#5884ea;
  --build-fg:#74d49e;      --build-tint:#132a1e;      --build-edge:#3fa86d;
  --experiment-fg:#c6a9ff; --experiment-tint:#241c3a; --experiment-edge:#8f72ef;
  --check-fg:#f0c461;      --check-tint:#2d2410;      --check-edge:#c7962d;
  --read-fg:#aab7c6;       --read-tint:#1c242c;       --read-edge:#6a7a8c;
  --pitfall-fg:#ff9389;    --pitfall-tint:#3a1816;    --pitfall-edge:#e0584f;
  --shadow-float:0 8px 24px rgba(0,0,0,.45);
  --code-bg:#11181a; --code-ink:#d6e0de; --tok-k:#c792ea; --tok-s:#7fd6c2; --tok-c:#7d8b8a; --tok-n:#f0c461; --tok-f:#82aaff;
  --cds-chart-axis:#6a7a8c;
}

/* ---- base ---- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{overflow-anchor:none;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/var(--lh-body) var(--body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
a{color:var(--accent);text-underline-offset:2px;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num, table, .progress-count, .stat b{font-variant-numeric:tabular-nums}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:-60px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:var(--s2) var(--s4);border-radius:var(--r-sm);border:0;font-weight:600;cursor:pointer}
.skip:focus{top:var(--s4)}
.eyebrow{margin:0;font:600 var(--fs-eyebrow)/16px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{font:500 var(--fs-meta)/20px var(--body);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;border:0;background:var(--accent);color:var(--accent-ink);padding:var(--s2) var(--s4);border-radius:var(--r-sm);font-weight:600;cursor:pointer;max-width:100%}
.btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn--quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn--quiet:hover{border-color:var(--accent)}
.bar{height:6px;background:var(--sunken);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s var(--ease)}
.badge{font:400 12px/1.4 var(--mono);background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;color:var(--muted);white-space:nowrap}

/* progress state shapes: hollow, half, filled with a check; ring = current page */
.state{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;flex:none}
.state svg{width:16px;height:16px;display:block}
.st-ring{fill:none;stroke:var(--line);stroke-width:1.6}
.st-on{fill:none;stroke:var(--accent);stroke-width:1.6}
.st-half{fill:var(--accent)}
.st-full{fill:var(--accent)}
.st-tick{fill:none;stroke:var(--accent-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.is-current .state{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

/* ---- layout: rail | content | outline ---- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;min-width:0;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.brand{padding:var(--s5) var(--s5) var(--s3)}
.brand b{display:block;font:700 19px/1.15 var(--display);letter-spacing:-.01em}
.brand span{font-size:var(--fs-meta);color:var(--muted)}
.search{padding:0 var(--s4) var(--s3);position:relative}
.search input{width:100%;min-height:40px;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg)}
.results{position:absolute;left:var(--s4);right:calc(-1 * var(--s9) - var(--s9));top:48px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-float);max-height:70vh;overflow:auto;min-width:300px}
.res-group{border-bottom:1px solid var(--line);padding:var(--s2) 0}
.res-group:last-child{border-bottom:0}
.res-page{font:600 var(--fs-eyebrow)/16px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:var(--s1) var(--s3)}
.results button{display:grid;grid-template-columns:20px 1fr;gap:var(--s2);width:100%;text-align:left;border:0;background:none;padding:var(--s2) var(--s3);cursor:pointer;font-size:var(--fs-meta);line-height:20px}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .icon{width:16px;height:16px;margin-top:2px}
.results mark{background:var(--check-tint);color:inherit;border-radius:3px}
nav.index{padding:var(--s1) var(--s2) var(--s4);flex:1}
.grp{font:600 var(--fs-eyebrow)/16px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:var(--s4) var(--s3) var(--s1);margin-top:var(--s1);display:flex;justify-content:space-between;align-items:center;gap:var(--s2);border-top:1px solid var(--line)}
.grp:first-child{border-top:0;margin-top:0}
.grp em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.grp .phase-band{display:inline-block;width:4px;height:14px;border-radius:2px;margin-right:var(--s2)}
.nav-item{display:grid;grid-template-columns:34px 1fr 18px;align-items:center;gap:var(--s2);width:100%;min-height:32px;text-align:left;border:0;background:none;padding:var(--s1) var(--s3);border-radius:var(--r-sm);cursor:pointer;font-size:14px;line-height:1.3}
.nav-item:hover{background:var(--sunken)}
.nav-item[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav-item .num{font:400 12px/1 var(--mono);color:var(--muted)}
.rail-foot{padding:var(--s4) var(--s5);border-top:1px solid var(--line);font-size:var(--fs-meta);color:var(--muted)}
.rail-foot .bar{margin:6px 0 8px}
.rail-btn{position:fixed;top:12px;left:calc(var(--rail) - 17px);z-index:12;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.rail-btn:hover{border-color:var(--accent);color:var(--accent)}
.rail-btn .icon{width:16px;height:16px;transition:transform var(--dur) var(--ease)}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .rail{width:0;border-right:0;overflow:hidden}
.app.collapsed .rail-btn{left:16px}
.app.collapsed .rail-btn .icon{transform:rotate(180deg)}
.theme-btn{position:fixed;top:12px;right:16px;z-index:12;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}:root[data-theme="dark"] .theme-btn .i-moon{display:none}
.topbar,.scrim{display:none}
main{min-width:0;padding:var(--s6) var(--s6) var(--s9)}
.page{display:grid;grid-template-columns:minmax(0,var(--content)) var(--outline);gap:var(--s7);justify-content:center}
article{min-width:0}
.outline{position:sticky;top:var(--s6);align-self:start;font-size:var(--fs-meta);max-height:calc(100vh - 64px);overflow:auto}
.outline p{margin:0 0 var(--s2)}
.outline a{display:block;padding:3px 0 3px var(--s3);border-left:2px solid var(--line);color:var(--muted);text-decoration:none;line-height:20px}
.outline a.on{border-color:var(--accent);color:var(--ink)}
.outline a.sub{padding-left:var(--s5);font-size:13px}
.toc-drop{display:none}

/* ---- type ---- */
h1{font:700 clamp(30px,4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin:var(--s2) 0 var(--s3);text-wrap:balance}
article h2{font:700 26px/32px var(--display);letter-spacing:-.01em;margin:var(--s7) 0 var(--s2);scroll-margin-top:var(--s5);text-wrap:balance;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
article h2 .icon{width:24px;height:24px}
article h3{font:600 18px/26px var(--body);margin:var(--s6) 0 var(--s2);scroll-margin-top:var(--s5)}
article h4{font:600 17px/26px var(--body);margin:var(--s4) 0 var(--s1);scroll-margin-top:var(--s5)}
article p,article li,article dd{max-width:var(--measure)}
article ul,article ol{padding-left:22px}
article li{margin:var(--s1) 0}
.lead{font:400 var(--fs-lead)/30px var(--body);color:var(--ink);margin:0 0 var(--s3);max-width:var(--measure)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.sec-count{margin-left:auto;font:500 var(--fs-meta)/20px var(--body);color:var(--muted)}
.sec-count:empty{display:none}
.sec--concept h2>.icon{color:var(--concept-fg)} .sec--build h2>.icon{color:var(--build-fg)} .sec--experiment h2>.icon{color:var(--experiment-fg)}
.sec--check h2>.icon{color:var(--check-fg)} .sec--read h2>.icon{color:var(--read-fg)}
.week-intro{margin:var(--s5) 0}

/* ---- block (base) and variants ---- */
.block{--fg:var(--ink);--tint:var(--surface);--edge:var(--line);
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--edge);
  border-radius:var(--r-md);padding:var(--s3) var(--s5);margin:var(--s3) 0;position:relative}
.block--concept{--fg:var(--concept-fg);--tint:var(--concept-tint);--edge:var(--concept-edge)}
.block--build{--fg:var(--build-fg);--tint:var(--build-tint);--edge:var(--build-edge)}
.block--experiment{--fg:var(--experiment-fg);--tint:var(--experiment-tint);--edge:var(--experiment-edge)}
.block--check{--fg:var(--check-fg);--tint:var(--check-tint);--edge:var(--check-edge)}
.block--read{--fg:var(--read-fg);--tint:var(--read-tint);--edge:var(--read-edge)}
.block--pitfall{--fg:var(--pitfall-fg);--tint:var(--pitfall-tint);--edge:var(--pitfall-edge)}
.block--filled{background:var(--tint);border-color:transparent;border-left-color:var(--edge)}
.block--scope{border-style:dashed;border-left-width:1px;color:var(--muted)}
.block__label{display:flex;align-items:center;gap:var(--s2);margin:0;color:var(--fg);
  font:600 var(--fs-eyebrow)/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase}
.block__label .icon{width:16px;height:16px}
.block__head{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0 0 2px}
.block__head .block__label{flex:none}
.block__title{font:600 18px/26px var(--body);margin:var(--s2) 0 var(--s1)}
.block__head .block__title{margin:0}
.block__title a{color:inherit}
.block__lead{margin:0}
.block>*:last-child{margin-bottom:0}
.block p{margin:var(--s2) 0}
.block .code-wrap,.block .table-wrap{margin:var(--s2) 0}
.block .block__lead{margin:var(--s1) 0 0}
.block ul,.block ol{margin:var(--s2) 0}

/* disclosure */
details.more{margin-top:var(--s1)}
details.more>summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:var(--fs-meta);list-style:none;display:inline-flex;align-items:center;min-height:24px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"\25B8";display:inline-block;margin-right:6px;transition:transform var(--dur) var(--ease)}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>*:not(summary){font-size:16px}
details.prod{margin:var(--s2) 0;border-top:1px solid var(--line);padding-top:var(--s2)}
details.prod:first-of-type{border-top:0}
details.prod>summary{color:var(--ink);font-size:var(--fs-body);font-weight:600}
details.prod>summary::before{color:var(--concept-fg)}
details.prod p{margin:var(--s1) 0 0 18px}

/* build step, experiment, self-check, checkpoint items */
.steps{list-style:none;padding:0!important;margin:var(--s4) 0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s2) var(--s3);padding:10px var(--s4);
  border:1px solid var(--line);border-left:3px solid var(--build-edge);border-radius:var(--r-md);
  background:var(--surface);margin:6px 0!important;max-width:none!important;position:relative}
.step input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent);cursor:pointer}
.step__title{display:block;font-weight:600;cursor:pointer;max-width:var(--measure)}
.step__n{font:600 12px/1 var(--mono);color:var(--build-fg);margin-right:var(--s2)}
.step__meta{display:grid;grid-template-columns:max-content 1fr;gap:2px var(--s3);margin:var(--s1) 0 0;font-size:var(--fs-meta);line-height:20px}
.step__meta div{display:contents}
.step__meta dt{color:var(--muted);font-weight:600}
.step__meta dd{margin:0}
.step:has(input:checked){background:var(--accent-soft);border-left-color:var(--accent)}
.step:has(input:checked) .step__title{text-decoration:line-through;text-decoration-color:var(--muted)}
.step--experiment{border-left-color:var(--experiment-edge)} .step--experiment .step__n{color:var(--experiment-fg)}
.step--check{border-left-color:var(--check-edge)} .step--check .step__n{color:var(--check-fg)}
.step__ans{display:inline-flex;align-items:center;min-height:24px;font-size:var(--fs-meta);color:var(--check-fg);font-weight:600;cursor:pointer;margin-top:2px}
.steps--check .step:has(input:checked) .step__title,.steps[data-cat="q"] .step:has(input:checked) .step__title{text-decoration:none}
.step p.step__title{margin:0;cursor:default}
.checkpoint .steps{margin-bottom:0}
.checkpoint .step{background:var(--surface)}
.f-todo .step:has(input:checked){display:none}
.f-done .step:not(:has(input:checked)){display:none}

/* key numbers */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s2);margin:var(--s3) 0}
.stat{background:var(--sunken);border-radius:var(--r-md);padding:var(--s2) var(--s3)}
.stat b{display:block;font:700 28px/1.1 var(--display)}
.stat span{font-size:var(--fs-meta);color:var(--muted);line-height:20px;display:block}

/* timeline (day by day) */
.timeline{list-style:none;padding:0!important;margin:var(--s4) 0;position:relative}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr);gap:var(--s3);margin:0!important;max-width:none!important;padding-bottom:var(--s4);position:relative}
.tl::before{content:"";position:absolute;left:25px;top:32px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl__day{display:grid;place-items:center;width:52px;height:32px;border-radius:var(--r-pill);background:var(--build-tint);color:var(--build-fg);font:600 13px/1 var(--mono)}
.tl__body h4{margin-top:var(--s1)}
.tl__body .step__meta{margin-top:var(--s1)}

/* collapsible sub-section (inside Build) */
details.subsec{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin:var(--s4) 0}
details.subsec>summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s5);display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
details.subsec>summary::-webkit-details-marker{display:none}
details.subsec>summary::before{content:"\25B8";color:var(--accent);transition:transform var(--dur) var(--ease)}
details.subsec[open]>summary::before{transform:rotate(90deg)}
details.subsec>summary h3{margin:0;display:inline}
.subsec__hint{font-size:var(--fs-meta);color:var(--muted)}
.subsec__body{padding:0 var(--s5) var(--s4)}

/* diagram figure */
figure.diagram{margin:var(--s3) 0;padding:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow-x:auto}

  if (!/^https?:$/.test(location.protocol)) return false;
  try{
    const r = await fetch('api/progress', {cache:'no-store'});
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return false;
    const s = migrate(await r.json()); localApi = true;
    if (s && s.done){ state.done = Object.assign({}, state.done, s.done); state.notes = Object.assign({}, state.notes, s.notes || {}); state.last = s.last || state.last; }
    setSave('Progress is saved to progress.json on your computer.');
    saveLocal(); refreshProgress(); route(); return true;
  }catch(e){ return false; }
}
async function connectStore(){
  if (await connectLocal()) return;
  if (!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    remote = db.doc('data/users/' + id + '/progress');
    const snap = await remote.get();
    if (snap.exists){
      const r = migrate(snap.data() || {}) || {};
      state.done = Object.assign({}, state.done, r.done || {});
      for (const k in (r.notes || {})) if (r.notes[k] && !state.notes[k]) state.notes[k] = r.notes[k];
      state.last = r.last || state.last;
      for (const k in state.done) if (r.done && k in r.done) state.done[k] = r.done[k];
    }
    setSave('Progress is saved to your account.');
    saveLocal(); refreshProgress(); route();
  }catch(e){ /* stay on browser storage */ }
}

function tasksOf(pid){ return taskIds[pid] ||= [...new Set([...(byId[pid]?.html || '').matchAll(/data-id="([^"]+)"/g)].map(m => m[1]))]; }
function pageTasks(id){ const u = tasksOf(id); return [u.filter(k => state.done[k]).length, u.length]; }
function status(id){ const [d,t] = pageTasks(id); return !t ? '' : d === t ? 'done' : d ? 'prog' : ''; }
const docs = {};
function doc(pid){ return docs[pid] ||= new DOMParser().parseFromString('<div id="root">' + byId[pid].html + '</div>', 'text/html').getElementById('root'); }
function taskTitle(pid, tid){

const label = x => x === 'home' ? 'Plan at a glance' : DATA.meta[x] ? 'Week ' + DATA.meta[x].n + ': ' + DATA.meta[x].focus : byId[x].short;
function stateIcon(s){
  const word = s === 'done' ? 'Done' : s === 'prog' ? 'In progress' : 'Not started';
  const svg = s === 'done' ? '<circle cx="8" cy="8" r="7" class="st-full"/><path class="st-tick" d="M4.8 8.3l2.1 2.1 4.3-4.6"/>'

// glossary: first use of each Appendix B term on a page gets a dotted underline and a definition on hover or focus
const GL = DATA.glossary.flatMap(([term, mean]) => term.split(/,\s*/).map(v => [v.trim(), term, mean])).filter(([v]) => v.length > 2);
const glMap = Object.fromEntries(GL.map(g => [g[0].toLowerCase(), g]));
const glRe = GL.length ? new RegExp('\\b(' + GL.map(g => g[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b) => b.length - a.length).join('|') + ')\\b', 'gi') : null;
let glN = 0;
function glossarize(root, pid){
  if (!glRe || pid === 'app-b' || pid === '_components') return;
  const used = new Set(), skip = 'code,pre,a,h1,h2,h3,h4,summary,label,button,th,.gloss,.stats,figure,svg,.step__title,.badge,.block__label';
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; for (let n; (n = walker.nextNode());) nodes.push(n);
  for (let node of nodes){
    glRe.lastIndex = 0; let mt;
    while ((mt = glRe.exec(node.nodeValue))){
      const g = glMap[mt[1].toLowerCase()]; if (!g || used.has(g[1])) continue;
      used.add(g[1]);
      const after = node.splitText(mt.index); const rest = after.splitText(mt[1].length);
      const span = document.createElement('span'); span.className = 'gloss'; span.tabIndex = 0; const tid = 'gl-' + (++glN);
      span.setAttribute('aria-describedby', tid);
      span.innerHTML = `${esc(after.nodeValue)}<span class="gloss__tip" role="tooltip" id="${tid}"><b>${esc(g[1])}</b>${esc(g[2])} · <a href="#app-b">Glossary</a></span>`;
      after.replaceWith(span); node = rest; glRe.lastIndex = 0;
    }
  }
}

}

let pendingFind = null;
function route(){
  const [raw, anchor] = location.hash.slice(1).split('/');
  const id = byId[raw] || raw === 'home' ? (raw || 'home') : 'home';
  if (id === 'home') renderHome(); else { renderPage(id); if (id !== state.last && !byId[id].hidden){ state.last = id; scheduleSave(); } }
  document.querySelectorAll('.nav-item').forEach(b => { const on = b.dataset.go === id; b.classList.toggle('is-current', on); if (on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.getElementById('top-title').textContent = id === 'home' ? 'Plan at a glance' : (DATA.meta[id] ? 'Week ' + DATA.meta[id].n + ' · ' + DATA.meta[id].focus : byId[id].short);
  if (id === 'home') document.getElementById('stickybar').hidden = true;
  refreshProgress();
  if (pendingFind){ const c = document.getElementById('content'); if (c) scrollToEl([...c.querySelectorAll(SEL_JOIN)].filter(leaf)[pendingFind.i], true); pendingFind = null; }
  else if (anchor){ scrollToEl(document.getElementById(anchor), true); }
  else window.scrollTo(0,0);
}

// ---- search: results grouped by page, each with the icon of the block it sits in ----
const SEL = ['p','li','td','th','h2','h3','h4','pre','summary','dd','dt','label'], SEL_JOIN = SEL.join(',');
const leaf = el => !el.querySelector(SEL_JOIN);
let sIndex = null;
function buildIndex(){
  sIndex = [];
  for (const p of pages){ [...doc(p.id).querySelectorAll(SEL_JOIN)].filter(leaf).forEach((el, i) => {
    const t = el.textContent.replace(/\s+/g, ' ').trim(); if (!t) return;
    const blk = el.closest('.block, li.step, section.sec');
    let kind = blk ? ((blk.className.match(/(?:block|step|sec)--(\w+)/) || [])[1] || 'plain') : 'plain';
    if (kind === 'filled' || kind === 'scope') kind = 'read';
    sIndex.push({ pid: p.id, i, t, kind });
  }); }
}
const qi = document.getElementById('q'), res = document.getElementById('results');
qi.addEventListener('input', () => {
  const q = qi.value.trim(); if (q.length < 2){ res.hidden = true; return; }
  if (!sIndex) buildIndex();
  const ql = q.toLowerCase(), groups = new Map();
  for (const e of sIndex){ if (!e.t.toLowerCase().includes(ql)) continue; const g = groups.get(e.pid) || []; if (g.length < 4) g.push(e); groups.set(e.pid, g); if (groups.size > 12) break; }
  const snip = t => { const k = t.toLowerCase().indexOf(ql), s = Math.max(0, k - 40); const x = t.slice(s, k + q.length + 60), j = k - s; return (s ? '…' : '') + esc(x.slice(0, j)) + '<mark>' + esc(x.slice(j, j + q.length)) + '</mark>' + esc(x.slice(j + q.length)) + '…'; };
  res.innerHTML = groups.size ? [...groups].map(([pid, es]) => `<div class="res-group"><div class="res-page">${esc(label(pid))}</div>${es.map(e => `<button type="button" data-pid="${pid}" data-i="${e.i}">${KIND_ICON[e.kind] ? ICON(KIND_ICON[e.kind]) : '<span></span>'}<span>${snip(e.t)}</span></button>`).join('')}</div>`).join('') : '<div class="res-group"><div class="res-page">No matches</div></div>';
  res.hidden = false;
});
res.addEventListener('click', e => { const b = e.target.closest('button[data-pid]'); if (!b) return; pendingFind = { i: +b.dataset.i }; res.hidden = true; qi.blur(); if (location.hash.slice(1) === b.dataset.pid) route(); else go(b.dataset.pid); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; if (!e.target.closest('.menu')) document.querySelectorAll('details.menu[open]').forEach(d => d.open = false); });
qi.addEventListener('keydown', e => { if (e.key === 'Escape'){ res.hidden = true; qi.blur(); } if (e.key === 'Enter'){ res.querySelector('button[data-pid]')?.click(); } });

// ---- delegated events: ticking anywhere, jump links, page links ----
const mainEl = document.getElementById('main');
mainEl.addEventListener('change', e => {
  const cb = e.target.closest('input[data-id]'); if (!cb) return;
  if (cb.checked) state.done[cb.dataset.id] = true; else delete state.done[cb.dataset.id];
  document.querySelectorAll(`input[data-id="${cb.dataset.id}"]`).forEach(x => x.checked = cb.checked);
  refreshProgress(); scheduleSave();
});
mainEl.addEventListener('click', e => {
  const t = e.target.closest('[data-to]'); if (t){ e.preventDefault(); scrollToEl(document.getElementById(t.dataset.to)); return; }
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); }
});
document.getElementById('jump').addEventListener('change', e => { if (e.target.value) scrollToEl(document.getElementById(e.target.value)); e.target.value = ''; });
window.addEventListener('beforeprint', () => document.querySelectorAll('#main details:not([open])').forEach(d => { d.dataset.printOpened = '1'; d.open = true; }));
window.addEventListener('afterprint', () => document.querySelectorAll('#main details[data-print-opened]').forEach(d => { d.open = false; delete d.dataset.printOpened; }));

// ---- keyboard ----
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); if (matchMedia('(max-width:1023px)').matches) document.getElementById('app').classList.add('open'); qi.focus(); }
  else if (e.key === '?'){ e.preventDefault(); document.getElementById('keys').showModal(); }
  else if (e.key === '[' || e.key === ']'){ const i = order.indexOf(routeId()), j = e.key === ']' ? i + 1 : i - 1; if (order[j]) go(order[j]); }
});

// ---- theme and drawer ----
let theme = null;
try{ theme = localStorage.getItem('rig-plan-theme'); }catch(e){}
let themeExplicit = theme === 'light' || theme === 'dark';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
if (!themeExplicit) theme = darkQuery.matches ? 'dark' : 'light';
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); document.querySelectorAll('.theme-toggle').forEach(b => b.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme')); }
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; themeExplicit = true; try{ localStorage.setItem('rig-plan-theme', theme); }catch(e){} applyTheme(); }));
darkQuery.addEventListener('change', (e) => { if (themeExplicit) return; theme = e.matches ? 'dark' : 'light'; applyTheme(); });
document.getElementById('menu').addEventListener('click', () => document.getElementById('app').classList.add('open'));
document.getElementById('scrim').addEventListener('click', () => document.getElementById('app').classList.remove('open'));

let railCollapsed = false;
try{ railCollapsed = localStorage.getItem('rig-plan-rail') === 'collapsed'; }catch(e){}
function applyRail(){
  document.getElementById('app').classList.toggle('collapsed', railCollapsed);
  document.getElementById('rail-toggle').setAttribute('aria-label', railCollapsed ? 'Show sidebar' : 'Hide sidebar');
}
document.getElementById('rail-toggle').addEventListener('click', () => {
  railCollapsed = !railCollapsed;
  try{ localStorage.setItem('rig-plan-rail', railCollapsed ? 'collapsed' : 'open'); }catch(e){}
  applyRail();
});

loadLocal(); applyTheme(); applyRail(); buildNav();
window.addEventListener('hashchange', route);
route();
connectStore();
</script>
</body></html>
