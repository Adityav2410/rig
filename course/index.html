<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.ico" sizes="any"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Agents from First Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a field manual — fixed index rail on the left, one chapter at a time in the middle, an on-page outline on the right when there is room. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunken:#e9edea; --ink:#141a1c; --muted:#5a6569; --line:#d9dfdc;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#dcefe9; --warn:#a8650f; --warn-soft:#f6e8d2;
  --code-bg:#f0f3f1; --code-ink:#1d2a2c; --tok-k:#8a3ab9; --tok-s:#0d6b5f; --tok-c:#7b8689; --tok-n:#a8650f; --tok-f:#1f5fae;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --radius:8px; --radius-sm:6px;
  --cds-chart-axis:#8b9894; --cds-chart-categorical-1:var(--accent); --cds-text-primary:var(--ink); --cds-text-secondary:var(--muted); --cds-chart-reference-tint:var(--sunken);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1315; --surface:#151c1e; --sunken:#1b2427; --ink:#e3eae8; --muted:#97a5a3; --line:#263133;
  --accent:#43c2a9; --accent-ink:#06211c; --accent-soft:#16332e; --warn:#e2a54e; --warn-soft:#3a2c17;
  --code-bg:#11181a; --code-ink:#d6e0de; --tok-k:#c792ea; --tok-s:#7fd6c2; --tok-c:#6f7d7c; --tok-n:#e2a54e; --tok-f:#82aaff;
  --cds-chart-axis:#6f7d7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1315; --surface:#151c1e; --sunken:#1b2427; --ink:#e3eae8; --muted:#97a5a3; --line:#263133;
  --accent:#43c2a9; --accent-ink:#06211c; --accent-soft:#16332e; --warn:#e2a54e; --warn-soft:#3a2c17;
  --code-bg:#11181a; --code-ink:#d6e0de; --tok-k:#c792ea; --tok-s:#7fd6c2; --tok-c:#6f7d7c; --tok-n:#e2a54e; --tok-f:#82aaff;
  --cds-chart-axis:#6f7d7c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6}
a{color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%;transition:grid-template-columns .2s}
.rail{position:sticky;top:0;height:100vh;min-width:0;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.rail-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:254px;z-index:12;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:left .2s}
.rail-btn:hover{border-color:var(--accent);color:var(--accent)}
.rail-btn svg{width:16px;height:16px;transition:transform .2s}
@media (min-width:861px){
  .app.collapsed{grid-template-columns:0 minmax(0,1fr)}
  .app.collapsed .rail{width:0;padding:0;border-right:0;overflow:hidden}
  .app.collapsed .rail-btn{left:16px}
  .app.collapsed .rail-btn svg{transform:rotate(180deg)}
}
@media (max-width:860px){.rail-btn{display:none}}
.brand{padding:20px 20px 12px}
.brand b{display:block;font-family:var(--display);font-size:19px;line-height:1.15;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.search{padding:0 16px 10px;position:relative}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.results{position:absolute;left:16px;right:16px;top:44px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:60vh;overflow:auto}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results b{font-size:13px;display:block}
.results small{font-size:12px;color:var(--muted);display:block}
.results mark{background:var(--warn-soft);color:inherit}
nav.index{padding:4px 8px 16px;flex:1}
.grp{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:15px 12px 5px;margin-top:3px;font-weight:500;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.grp:first-child{border-top:0;margin-top:0}
.grp em{font-style:normal;font-weight:400}
.nav-item{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;line-height:1.3}
.nav-item:hover{background:var(--sunken)}
.nav-item[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav-item .num{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;flex:none}
.dot.prog{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.done{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent)}
.rail-foot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--sunken);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.rail-foot .bar{margin:6px 0 8px}

.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:28px 80px;padding-inline:40px 64px}
.page{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:48px;max-width:1008px;margin:0 auto}
article{min-width:0;max-width:760px}
.outline{position:sticky;top:28px;align-self:start;font-size:13px}
.outline p{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:0 0 10px;font-weight:500}
.outline a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none}
.outline a.on{border-color:var(--accent);color:var(--ink)}
.outline a.sub{padding-left:22px;font-size:12px}

.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 14px;text-wrap:balance}
article h2{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;margin:40px 0 10px;scroll-margin-top:20px;text-wrap:balance}
article h3{font-size:17px;margin:28px 0 8px;scroll-margin-top:20px}
article p,article li{max-width:68ch}
article ul,article ol{padding-left:22px}
article li{margin:4px 0}
code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.code-wrap{position:relative;margin:14px 0 18px}
.code-wrap pre{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55;margin:0}
.code-wrap pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.copy{position:absolute;top:8px;right:8px;font-size:11.5px;padding:3px 9px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;opacity:.85}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--tok-k)}.hljs-string,.hljs-attr{color:var(--tok-s)}.hljs-comment{color:var(--tok-c);font-style:italic}.hljs-number{color:var(--tok-n)}.hljs-title,.hljs-title.function_{color:var(--tok-f)}
.table-wrap{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--sunken);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
figure.diagram{margin:20px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
figure.diagram svg{width:100%;min-width:560px;height:auto;display:block;font-family:var(--body)}
figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:3px 9px}
.chip.s-done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.s-prog{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.pagebar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.pagebar .bar{flex:1;max-width:260px}

ul.tasks,ol.tasks{list-style:none;padding-left:0}
li.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-width:none}
li.task input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);cursor:pointer}
li.task .task-body>p{margin:0}
li.task.checked{background:var(--accent-soft);border-color:transparent}
li.task.do.checked .task-body{color:var(--muted)}
.qtag{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:4px;visibility:hidden}
li.task.q.checked .qtag{visibility:visible;color:var(--accent);font-weight:600}
ol.tasks{counter-reset:t}
ol.tasks>li.task .task-body::before{counter-increment:t;content:counter(t) ". ";font-family:var(--mono);font-size:12px;color:var(--muted)}

.notes{margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.notes label{font-weight:600;display:block;margin-bottom:6px}
.notes textarea{width:100%;min-height:130px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);resize:vertical;line-height:1.5}
.notes small{color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;text-align:left;cursor:pointer}
.pager button:hover{border-color:var(--accent)}
.pager .next{text-align:right;grid-column:2}
.pager small{display:block;color:var(--muted);font-size:12px}
.filter{width:100%;max-width:360px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:6px 0 4px}
.flash{background:var(--warn-soft);border-radius:4px;transition:background 1.5s}

/* home */
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin:0 0 22px}

.roadmap{margin:0 0 24px}
.roadmap-row{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.rm-phase{min-width:0;padding:13px 16px;border-right:1px solid var(--line)}
.rm-phase:last-child{border-right:0}
.rm-ticks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.rm-tick{border:0;background:none;padding:2px;margin:-2px;cursor:pointer;border-radius:3px;line-height:0}
.rm-tick:hover .dot,.rm-tick:focus-visible .dot{border-color:var(--accent)}
.rm-label{font-size:12.5px;color:var(--ink);font-weight:600}
.rm-label span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
@media (max-width:560px){.roadmap-row{flex-wrap:wrap}.rm-phase{flex:1 1 45%!important;border-bottom:1px solid var(--line)}}

.overall{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:30px}
.overall .bar{flex:1;min-width:160px;height:8px}
.overall strong{font-family:var(--mono);font-size:13px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:var(--radius-sm);font-weight:600;cursor:pointer}
.phase{margin:28px 0 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.phase h2{margin:0;font-size:21px}
.phase span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .wk{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.card b{font-size:15px;line-height:1.3}
.card small{color:var(--muted);font-size:12.5px;line-height:1.4}
.card .bar{margin-top:auto}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:10px 0 0}
.theme-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:12;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn svg{width:18px;height:18px}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}:root[data-theme="dark"] .theme-btn .moon{display:none}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,1fr);max-width:760px}.outline{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.25)}
  .app.open .rail{transform:none}
  .scrim{display:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .topbar{display:flex;align-items:center;gap:10px;padding-right:64px!important;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer}
  .topbar span{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding-inline:16px;padding-block:18px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = {"pages": [{"id": "path", "group": "Start here", "title": "The path I chose", "short": "The path", "html": "<p>Eighteen weeks, one evolving project, one weekly rhythm: learn the primitive, build it, read one small real implementation, trace it, modify it, measure it. The goal is one assistant runtime that can do Perplexity-style research, Claude Code-style work and Muse-style personal assistance, built by someone who also understands the model underneath it.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Weeks</th>\n<th>Phase</th>\n<th>You come out able to</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1–5</td>\n<td>The machine</td>\n<td>Build and measure a coding agent: loop, harness, context, retrieval, evals</td>\n</tr>\n<tr class=\"even\">\n<td>6–8</td>\n<td>The model</td>\n<td>Read a transformer, its KV cache, a serving engine and an RL loop line by line, then decide per call which model and how much reasoning each step deserves</td>\n</tr>\n<tr class=\"odd\">\n<td>9–14</td>\n<td>The assistant</td>\n<td>Put the trust boundary in place, then build research, deep research, a workbench, memory and connectors, and serve them to many users from one deployment</td>\n</tr>\n<tr class=\"even\">\n<td>15–18</td>\n<td>Autonomy</td>\n<td>Run durable background work, browser and computer use, voice, and a production architecture</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Why this order.</strong></p>\n<ul>\n<li>Context engineering (Week 3) comes before retrieval (Week 4). Retrieval is one way of choosing context, and the first wall a coding agent hits is its own tool output.</li>\n<li>Evals and tracing are Week 5, not the last week. From Week 10 on, quality is graded by a model (answer correctness, citation precision), and an unvalidated grader turns every later comparison into noise.</li>\n<li>The model weeks sit between the machine and the assistant. By then prompt caching is a mystery worth opening, and every later latency or cost decision depends on what prefill, decode and batching actually cost.</li>\n<li>Routing and effort (Week 8) come straight after the model weeks. Once you know what prefill, decode and thinking tokens cost, choosing a model and an effort level per call is arithmetic, and Week 5's evals tell you whether quality held.</li>\n<li>Security (Week 9) comes before the open web (Week 10). The research agent reads untrusted pages, so the policy service and sandbox must exist first.</li>\n<li>The multi-user service (Week 14) comes after memory and connectors and before durability. By then rig holds every kind of per-user state, so isolation is designed once across all of it, and Week 15's durable workflows build on its Postgres and job queue.</li>\n<li>Durability (Week 15) comes before browser and voice. Approvals and background tasks that outlive a process are what make a personal agent possible.</li>\n<li>Tracing, a 12-task eval set and a sandbox start on Day 1 anyway. Later weeks make them trustworthy; they are never optional.</li>\n</ul>\n<p><strong>Pick a specialty by Week 9.</strong> Every week is done in full, but your graduation project and public write-ups go deep on one track:</p>\n<ul>\n<li>Research (retrieval, ranking, citations, latency): the Perplexity track.</li>\n<li>Personal agent (policy, connectors, memory, background work, voice): the Muse track.</li>\n<li>Work agent (workspace, code execution, artifacts): the Claude Code track.</li>\n</ul>\n<p><strong>Ground rules.</strong></p>\n<ul>\n<li>Python 3.12 for the project. Read TypeScript, Rust and C where the best implementation lives; you read those, you don't extend them.</li>\n<li>Week 1 calls one provider's API with raw HTTP, no SDK, so you see the wire format. These notes use Anthropic's Messages API concretely and map every provider-specific name (endpoints, headers, stop reasons) to OpenAI's equivalent inline, so you can build Week 1 against either. SDKs are allowed from Week 2.</li>\n<li>One provider until Week 2's provider-abstraction exercise. Default to one strong model and one cheap model from a single provider — these notes default to <code>claude-sonnet-5-5</code> for the agent and <code>claude-haiku-5-5</code> for cheap passes (summaries, graders, bulk evals), but substitute your own provider's pair throughout if you're not using Anthropic. Week 2's provider-abstraction exercise is what makes that swap mechanical; Week 8 replaces the fixed split with a router that chooses per call.</li>\n<li>No agent framework on the critical path. You read the OpenAI Agents SDK, LangGraph, OpenHands and browser-use; you don't build on them. LangChain never appears.</li>\n<li>Pin every repo you read; Appendix A has a one-time bootstrap script. File paths and line numbers in this plan were checked against the commit or tag listed there; upstream will drift.</li>\n<li>Money: a monthly spend limit on every API key, and a per-run token budget enforced in code from Day 1. Weeks 6 and 7 need a GPU for a few hours; one rented GPU is enough, and the full nanochat training run is optional.</li>\n<li>Real accounts come last. Email, calendar, payments and the browser use fixtures and throwaway accounts until Week 9's red-team suite passes.</li>\n</ul>\n<p><strong>Weekly rhythm (8 to 12 hours, about 180 hours in total).</strong></p>\n<ol type=\"1\">\n<li>Monday (1 to 1.5 h): the primitive. Read the one spec, paper or post named for the week; write a half-page note in your own words.</li>\n<li>Tuesday to Wednesday (2 to 4 h): build the small version from scratch, inside the project.</li>\n<li>Thursday (1.5 to 2 h): read the reference implementation and trace the named path end to end. Write the trace as a numbered call chain with file:line references.</li>\n<li>Friday (1 to 1.5 h): the modifications and experiments.</li>\n<li>Weekend (3 to 4 h): run the eval set, compare against last week, then attempt the checkpoint. If you can't pass it, the next week starts late; don't skip ahead.</li>\n<li>If you fall behind mid-week — say it's Friday and you've only finished Tuesday's build — don't compress the missing days into one sitting or jump straight to the weekend's eval run. Finish the remaining Build steps in order first; it's fine to drop that week's Experiments to make time, but the eval set and checkpoint are what tell you whether the week actually landed, not the calendar.</li>\n<li>One hour somewhere in the week: the frontier log (Appendix E).</li>\n</ol>\n<p><strong>Weekly note.</strong> One file per week in <code>notes/</code>, with the same seven headings: the primitive (what problem exists), my implementation, the reference implementation, differences and why, experiments and numbers, failure modes, and what I would actually ship.</p>\n<p>Every week below uses the same headings: Concepts, Build, Project increment, Read, Trace, You should be able to answer, Experiments, Production lens, Not yet, Checkpoint. Week 1 adds a day-by-day plan; Week 18 trades some of them for graduation projects.</p>\n", "toc": [], "text": "Eighteen weeks, one evolving project, one weekly rhythm: learn the primitive, build it, read one small real implementation, trace it, modify it, measure it. The goal is one assistant runtime that can do Perplexity-style research, Claude Code-style work and Muse-style personal assistance, built by someone who also understands the model underneath it. Weeks Phase You come out able to 1–5 The machine Build and measure a coding agent: loop, harness, context, retrieval, evals 6–8 The model Read a transformer, its KV cache, a serving engine and an RL loop line by line, then decide per call which model and how much reasoning each step deserves 9–14 The assistant Put the trust boundary in place, then build research, deep research, a workbench, memory and connectors, and serve them to many users from one deployment 15–18 Autonomy Run durable background work, browser and computer use, voice, and a production architecture Wh 't extend them. Week 1 calls one provider's API with raw HTTP, no SDK, so you see the wire format. These notes use Anthropic's Messages API concretely and map every provider-specific name (endpoints, headers, stop reasons) to OpenAI's equivalent inline, so you can build Week 1 against either. SDKs are allowed from Week 2. One provider until Week 2's provider-abstraction exercise. Default to one strong model and one cheap model from a single provider — these notes default to claude-sonnet-5-5 for the agent and claude-haiku-5-5 for cheap passes (summaries, graders, bulk evals), but substitute your own provider's pair throughout if you're not using Anthropic. Week 2's provider-abstraction exercise is what makes that swap mechanical; Week 8 replaces the fixed split with a router that chooses per call. No agent framework on the critical path. You read the OpenAI Agents SDK, LangGraph, OpenHands and browser-use; you don't build on them. LangChain never appears. Pin every repo you read; Appendix A has a one-time bootstrap script. File paths and line numbers in this plan were checked against the commit or tag listed there; upstream will drift. Money: a monthly spend limit on every API key, and a per-run token budget enforced in code from Day 1. Weeks 6 and 7 need a GPU for a few hours; one rented GPU is enough, and the full nanochat training run is optional. Real accounts come last. Email, calendar, payments and the browser use fixtures and throwaway accounts until Week 9's red-team suite passes. Weekly rhythm (8 to 12 hours, about 180 hours in total). Monday (1 to 1.5 h): the primitive. Read the one spec, paper or post named for the week; write a half-page note in your own words. Tuesday to Wednesday (2 to 4 h): build the small version from scratch, inside the project. Thursday (1.5 to 2 h): read the reference implementation and trace the named path end to end. Write the trace as a numbered call chain with file:line references. Friday (1 to 1.5 h): the modifications and experiments. Weekend (3 to 4 h): run the eval set, compare against last week, then attempt the checkpoint. If you can't pass it, the next week starts late; don't skip ahead. If you fall behind mid-week — say it's Friday and you've only finished Tuesday's build — don't compress the missing days into one sitting or jump straight to the weekend's eval run. Finish the remaining Build steps in order first; it's fine to drop that week's Experiments to make time, but the eval set and checkpoint are what tell you whether the week actually landed, not the calendar. One hour somewhere in the week: the frontier log (Appendix E). Weekly note. One file per week in notes/, with the same seven headings: the primitive (what problem exists), my implementation, the reference implementation, differences and why, experiments and numbers, failure modes, and what I would actually ship. Every week below uses the same headings: Concepts, Build, Project increment, Read, Trace, You should be able to answer, Experiments, Production lens, Not yet, Checkpoint. Week 1 adds a day-by-day plan; Week 18 trades some of them for graduation projects.", "tasks": 0}, {"id": "primitives", "group": "Start here", "title": "The primitives behind the vocabulary", "short": "Primitives", "html": "<p>Everything in this ecosystem reduces to five things: a stateless next-token function, a transcript, a structured-output convention, a <code>while</code> loop, and ordinary systems code wrapped around them. Learn the eight terms below as layers of that stack, not as products.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Term</th>\n<th>What it actually is</th>\n<th>Where it lives in code</th>\n<th>Fundamental or abstraction?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>LLM</td>\n<td>A stateless function from a token sequence to a distribution over the next token, sampled repeatedly. Over HTTP: a list of messages in, one message out. It remembers nothing between calls and executes nothing.</td>\n<td>One HTTP POST (<code>/v1/messages</code> on Anthropic, <code>/v1/responses</code> or <code>/v1/chat/completions</code> on OpenAI)</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Tool calling</td>\n<td>A structured-output convention. The model emits a call — an id, a name, and arguments — instead of plain text, and signals that it did (Anthropic: a <code>tool_use</code> content block, stop reason <code>tool_use</code>; OpenAI: a <code>tool_calls</code> entry, finish reason <code>tool_calls</code>). Your code runs it and appends a result tagged with the same id.</td>\n<td>~20 lines of JSON handling</td>\n<td>Fundamental: an id-correlated RPC carried inside the transcript</td>\n</tr>\n<tr class=\"odd\">\n<td>Agent loop</td>\n<td>Call the model; if it requested no tools, stop; otherwise run the tools, append results, repeat. It ends when the model stops asking for tools or a budget trips.</td>\n<td>~40 lines</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Agent</td>\n<td>A configuration of that loop: model, system prompt, tool set, stop policy. Not a separate mechanism.</td>\n<td>a dataclass</td>\n<td>Mostly naming</td>\n</tr>\n<tr class=\"odd\">\n<td>Runtime</td>\n<td>What makes a loop run reliably: event streaming, cancellation, parallel tool execution, retries, persistence, resume.</td>\n<td>pi's <code>packages/agent</code> plus its session manager</td>\n<td>Fundamental engineering; each framework's shape is a choice</td>\n</tr>\n<tr class=\"even\">\n<td>Harness</td>\n<td>Everything around the model for one product: system prompt, tool implementations and their output shaping, context assembly, compaction, permissions, UI. In eval work it also means the code that runs and grades tasks.</td>\n<td>pi's <code>packages/coding-agent</code></td>\n<td>Fundamental; most of an agent's quality lives here</td>\n</tr>\n<tr class=\"odd\">\n<td>Coding agent</td>\n<td>A harness whose environment is a repository and whose tools read, search, edit and run code. It works better than most agents because tests and compilers give cheap, honest feedback.</td>\n<td>your project</td>\n<td>A specialization</td>\n</tr>\n<tr class=\"even\">\n<td>Workflow engine</td>\n<td>Code owns the control flow (a DAG or state machine) and LLM calls are steps inside it. A durable engine persists each step's result so a crashed run resumes without redoing side effects.</td>\n<td>DBOS, Temporal, LangGraph</td>\n<td>Fundamental, and older than LLMs</td>\n</tr>\n</tbody>\n</table></div>\n<figure class=\"diagram\"><svg aria-label=\"Each term is a layer wrapped around a stateless model\" font-size=\"13\" role=\"img\" viewbox=\"0 0 760 340\"><text data-claude-text-id=\"title\" fill=\"var(--cds-text-primary)\" font-size=\"15\" font-weight=\"600\" x=\"24\" y=\"30\">Each term is a layer wrapped around a stateless model</text><g data-claude-anchor=\"workflow-engine\"><rect fill=\"none\" height=\"264\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-dasharray=\"5 4\" stroke-width=\"1.25\" width=\"712\" x=\"24\" y=\"48\"></rect><text data-claude-text-id=\"wf-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" x=\"40\" y=\"69\">Workflow engine (optional)</text><text data-claude-text-id=\"wf-desc\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"end\" x=\"720\" y=\"69\">code chooses the next step; steps are durable</text></g><g data-claude-anchor=\"harness\"><rect fill=\"none\" height=\"212\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-dasharray=\"none\" stroke-width=\"1.25\" width=\"680\" x=\"40\" y=\"84\"></rect><text data-claude-text-id=\"h-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" x=\"56\" y=\"105\">Harness</text><text data-claude-text-id=\"h-desc\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"end\" x=\"704\" y=\"105\">prompt, tools, context, permissions, UI</text></g><g data-claude-anchor=\"runtime\"><rect fill=\"none\" height=\"160\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-dasharray=\"none\" stroke-width=\"1.25\" width=\"648\" x=\"56\" y=\"120\"></rect><text data-claude-text-id=\"rt-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" x=\"72\" y=\"141\">Runtime</text><text data-claude-text-id=\"rt-desc\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"end\" x=\"688\" y=\"141\">events, cancellation, retries, persistence</text></g><g data-claude-anchor=\"agent-loop\"><rect fill=\"none\" height=\"108\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-dasharray=\"none\" stroke-width=\"1.25\" width=\"616\" x=\"72\" y=\"156\"></rect><text data-claude-text-id=\"loop-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" x=\"88\" y=\"177\">Agent loop</text><text data-claude-text-id=\"loop-desc\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"end\" x=\"672\" y=\"177\">call the model, run its tools, repeat until it asks for none</text></g><g data-claude-anchor=\"llm\"><rect fill=\"var(--cds-chart-categorical-1)\" fill-opacity=\"0.12\" height=\"56\" rx=\"8\" stroke=\"var(--cds-chart-categorical-1)\" stroke-width=\"2\" width=\"284\" x=\"88\" y=\"192\"></rect><text data-claude-text-id=\"llm-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"230\" y=\"214\">LLM</text><text data-claude-text-id=\"llm-desc\" fill=\"var(--cds-text-primary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"230\" y=\"234\">stateless: messages in, one message out</text></g><g data-claude-anchor=\"tool-calling\"><rect fill=\"none\" height=\"56\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"284\" x=\"388\" y=\"192\"></rect><text data-claude-text-id=\"tc-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"530\" y=\"214\">Tool calling</text><text data-claude-text-id=\"tc-desc\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"530\" y=\"234\">an id-correlated RPC inside the transcript</text></g></svg><figcaption>The vocabulary as nested layers</figcaption></figure>\n<p>An \"agent\" is the loop configured with a model, prompt, tools and stop policy; a coding agent is a harness specialized for a repository.</p>\n<p><strong>The distinction that matters most is who chooses the next step.</strong> In an agent loop the model chooses; in a workflow your code chooses. Most production systems are hybrids: a workflow whose steps include bounded agent loops.</p>\n<p><strong>Fundamental: learn these deeply.</strong></p>\n<ul>\n<li>The transcript is the only state the model sees. Memory, RAG, compaction, subagents and skills all reduce to one question: which bytes go into the next request?</li>\n<li>The context window is a hard resource with a price per token, like memory with a cost per byte.</li>\n<li>Prefix caching only reuses computation for a byte-identical prefix. Every prompt-layout decision is constrained by it.</li>\n<li>Side effects happen outside the transcript (files, processes, network, money). They need idempotency, permissions and isolation, exactly like any distributed system.</li>\n<li>A verification signal (tests, graders, humans) bounds how good any agent can get.</li>\n</ul>\n<p><strong>Framework abstractions: learn these by reducing them.</strong></p>\n<ul>\n<li>\"Memory\" component: read text from a store into the prompt, write text back after the run.</li>\n<li>\"Handoff\": a tool call whose effect is swapping the active system prompt and tool set.</li>\n<li>\"Subagent\": a recursive call of the loop with a fresh transcript that returns a string.</li>\n<li>\"Planner/executor\": one model call that outputs a list, then a loop over the list.</li>\n<li>\"Guardrail\": a check function run before or after a model or tool call.</li>\n<li>\"Skill\": a prompt file (often with scripts) loaded into context on demand.</li>\n<li>\"Chain\" or \"graph\": function composition, or a state machine.</li>\n<li>\"Toolkit\" or \"tool registry\": a dict from name to (JSON schema, function).</li>\n</ul>\n", "toc": [], "text": "Everything in this ecosystem reduces to five things: a stateless next-token function, a transcript, a structured-output convention, a while loop, and ordinary systems code wrapped around them. Learn the eight terms below as layers of that stack, not as products. Term What it actually is Where it lives in code Fundamental or abstraction? LLM A stateless function from a token sequence to a distribution over the next token, sampled repeatedly. Over HTTP: a list of messages in, one message out. It remembers nothing between calls and executes nothing. One HTTP POST (/v1/messages on Anthropic, /v1/responses or /v1/chat/completions on OpenAI) Fundamental Tool calling A structured-output convention. The model emits a call — an id, a name, and arguments — instead of plain text, and signals that it did (Anthropic: a tool_use content block, stop reason tool_use; OpenAI: a tool_calls entry, finish reason tool_calls). Your code runs it and appends a result tagged with the same id. ~20 lines of JSON handling Fundamental: an id-correlated RPC carried inside the transcript Agent loop Call the model; if it requested no tools, stop; otherwise run the tools, append results, repeat. It ends when the model stops asking for tools or a budget trips. ~40 lines Fundamental Agent A configuration of that loop: model, system prompt, tool set, stop policy. Not a separate mechanism. a dataclass Mostly naming Runtime What makes a loop run reliably: event streaming, cancellation, parallel tool execution, retries, persistence, resume. pi's packages/agent plus its session manager Fundamental engineering; each framework's shape is a choice Harness Everything around the model for one product: system prompt, tool implementations and their output shaping, context assembly, compaction, permissions, UI. In eval work it also means the code that runs and grades tasks. pi's packages/coding-agent Fundamental; most of an agent's quality lives here Coding agent A harness whose environment is a repository and whose tools read, search, edit and run code. It works better than most agents because tests and compilers give cheap, honest feedback. your project A specialization Workflow engine Code owns the control flow (a DAG or state machine) and LLM calls are steps inside it. A durable engine persists each step's result so a crashed run resumes without redoing side effects. DBOS, Temporal, LangGraph Fundamental, and older than LLMs Each term is a layer wrapped around a stateless model Workflow engine (optional) code chooses the next step; steps are durable Harness prompt, tools, context, permissions, UI Runtime events, cancellation, retries, persistence Agent loop call the model, run its tools, repeat until it asks for none LLM stateless: messages in, one message out Tool calling an id-correlated RPC inside the transcript The vocabulary as nested layers An \"agent\" is the loop configured with a model, prompt, tools and stop policy; a coding agent is a harness specialized for a repository. The distinction that matters most is who chooses the next step. In an agent loop the model chooses; in a workflow your code chooses. Most production systems are hybrids: a workflow whose steps include bounded agent loops. Fundamental: learn these deeply. The transcript is the only state the model sees. Memory, RAG, compaction, subagents and skills all reduce to one question: which bytes go into the next request? The context window is a hard resource with a price per token, like memory with a cost per byte. Prefix caching only reuses computation for a byte-identical prefix. Every prompt-layout decision is constrained by it. Side effects happen outside the transcript (files, processes, network, money). They need idempotency, permissions and isolation, exactly like any distributed system. A verification signal (tests, graders, humans) bounds how good any agent can get. Framework abstractions: learn these by reducing them. \"Memory\" component: read text from a store into the prompt, write text back after the run. \"Handoff\": a tool call whose effect is swapping the active system prompt and tool set. \"Subagent\": a recursive call of the loop with a fresh transcript that returns a string. \"Planner/executor\": one model call that outputs a list, then a loop over the list. \"Guardrail\": a check function run before or after a model or tool call. \"Skill\": a prompt file (often with scripts) loaded into context on demand. \"Chain\" or \"graph\": function composition, or a state machine. \"Toolkit\" or \"tool registry\": a dict from name to (JSON schema, function).", "tasks": 0}, {"id": "rig", "group": "Start here", "title": "The central project: rig", "short": "The rig project", "html": "<p>You build one Python program, <code>rig</code>. It starts as a repository agent and grows into an assistant runtime with three modes: research, work and personal. Each week adds one capability and, deliberately, the failure mode that capability brings. Nothing from a framework goes in until you have built the primitive yourself.</p>\n<p><strong>Targets.</strong> Weeks 1 to 3 use <a href=\"https://github.com/pallets/click\" rel=\"noopener\" target=\"_blank\">pallets/click</a> at tag <code>8.5.0</code>: about 12,000 lines across 16 modules in <code>src/click</code>, and 1,991 tests that finish in roughly 8 seconds — pure Python, no native deps or network needed to install or test, so it runs offline in the sandbox and stays cheap to re-run the full suite after every fix, across every task, every week. It's real production code, not a toy example, but still small enough that you can verify a fix or a grader by hand. The same codebase and the same 12-task ladder carry across Weeks 1 to 3 unchanged, so a change in pass rate, steps or cost is attributable to your harness, not to a different target. Week 4 adds <a href=\"https://github.com/openai/openai-agents-python\" rel=\"noopener\" target=\"_blank\">openai/openai-agents-python</a> at <code>v0.23.1</code> (320 source files), large enough that retrieval has something to beat; it is also Week 11 reading. From Week 10 the target is the open web, from Week 12 a fixture folder of CSVs and PDFs, and from Week 13 a fixture inbox and calendar, then one real account.</p>\n<p><strong>Layout as it grows.</strong> Week 1's <code>rig/</code> package gains one directory per capability: <code>providers/</code> (W2), <code>context/</code> (W3), <code>retrieval/</code> (W4), <code>gateway/</code> (W8), <code>research/</code> (W10), <code>mcp/</code> and <code>policy/</code> (W9, the policy service runs as its own process), <code>artifacts/</code> and <code>ingest/</code> (W12), <code>memory/</code> and <code>connectors/</code> (W13), <code>server/</code> (W14), <code>durable/</code> and <code>scheduler/</code> (W15), <code>browser/</code> (W16), <code>voice/</code> (W17), <code>app/</code> (W18).</p>\n<p><strong>Invariants that hold from Day 1.</strong></p>\n<ul>\n<li>The loop owns the transcript. Tools never see it and never mutate it.</li>\n<li>Every side effect goes through the sandbox. The host process only edits files inside the run's worktree.</li>\n<li>Every model call and tool call is an append-only trace event, flushed before the next step starts.</li>\n<li>Every run has a budget: steps, tokens, dollars and wall-clock seconds. Running out is a normal exit status, not an exception that escapes.</li>\n<li>Every capability change is judged by the eval set, not by one demo.</li>\n</ul>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Capability added</th>\n<th>Failure mode you will meet</th>\n<th>Metric that proves it worked</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Loop, five tools, container sandbox, JSONL traces, 12-task eval</td>\n<td>Runaway loops, ambiguous edits, oversized tool output</td>\n<td>Pass rate over 3 runs; steps, tokens and dollars per task</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Provider interface, streaming events, parallel tools, cancellation, steering, robust edit</td>\n<td>Malformed or truncated tool arguments; cancellation mid-tool</td>\n<td>Edit-apply failure rate; p95 step latency</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Context accounting, output shaping, compaction and tool-result clearing, deliberate cache breakpoints and TTLs, a cost ledger, project memory file</td>\n<td>Facts lost after compaction; cache misses from prompt churn</td>\n<td>Cache-read ratio; dollars lost to cache misses; pass rate on long tasks</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>BM25, embeddings, HNSW, then pgvector with Postgres full-text search, hybrid fusion, reranking and typo-tolerant matching, as one <code>retrieve</code> tool</td>\n<td>Retrieved noise crowding out useful context; misspelled queries that find nothing</td>\n<td>Recall@10 on labeled and misspelled queries; steps to first relevant file</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>OpenTelemetry spans, validated graders, trajectory metrics, versioned prompts, CI gate</td>\n<td>Flaky graders; overfitting to your own eval set</td>\n<td>Grader agreement; confidence intervals on pass rate</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>A tokenizer, a decoding loop with a KV cache, a small trained model</td>\n<td>Treating tool calling as magic rather than special tokens</td>\n<td>Decode tokens per second with and without the cache</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Paged KV cache and continuous batching; an RL environment built from your tasks</td>\n<td>Throughput that collapses under long prompts</td>\n<td>Throughput against batch size; prefix-cache hit rate</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Model gateway: per-call model and effort routing, escalation on stalls, session pinning, budget guard</td>\n<td>A cheaper average hiding a quality drop; cache lost on every switch</td>\n<td>Cost per success against always-large; share of strong calls; escalation rate</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>MCP client and server, policy service with scoped grants, OS sandbox, red team, structured outputs</td>\n<td>Prompt injection through tool output; approval fatigue</td>\n<td>Blocked violations; approvals asked per task</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Conversation-aware query rewriting, web search, fetch, extraction, evidence store, cited answers</td>\n<td>Citations that don't support the claim; stale sources</td>\n<td>Citation precision; time to first token; dollars per answer</td>\n</tr>\n<tr class=\"odd\">\n<td>11</td>\n<td>Deep research loop, subagents, planner and fan-out modes</td>\n<td>Context lost between agents; cost blow-up</td>\n<td>search_evals score against dollars per task</td>\n</tr>\n<tr class=\"even\">\n<td>12</td>\n<td>Per-user workspace, code execution, artifacts with lineage, document ingestion</td>\n<td>Silent numeric errors; artifacts nobody can audit</td>\n<td>Computation correctness; artifact audit pass rate</td>\n</tr>\n<tr class=\"odd\">\n<td>13</td>\n<td>Memory with provenance, fixture then real connectors, inbound email</td>\n<td>Wrong memory injected; injection through email</td>\n<td>Memory precision and recall; wrong-memory injection rate</td>\n</tr>\n<tr class=\"even\">\n<td>14</td>\n<td>Multi-user service: Postgres with row-level security, sign-in, a job queue with one run per conversation, per-user quotas, user deletion</td>\n<td>One user's data in another's answer; double-submitted runs; one user starving the rest</td>\n<td>Cross-user reads (target zero); p95 time to first token at 50 users; duplicate runs</td>\n</tr>\n<tr class=\"odd\">\n<td>15</td>\n<td>Durable steps, idempotent tool ledger, scheduler, durable approvals</td>\n<td>Duplicate side effects after a crash; doubled schedules</td>\n<td>Duplicates under repeated <code>kill -9</code> (target zero)</td>\n</tr>\n<tr class=\"even\">\n<td>16</td>\n<td>Browser agent with an isolated profile and a destination-aware gate</td>\n<td>Exfiltration through navigation; wrong clicks</td>\n<td>Forbidden actions completed (target zero); task success</td>\n</tr>\n<tr class=\"odd\">\n<td>17</td>\n<td>Voice loop: VAD, streaming speech-to-text, model, text-to-speech, barge-in</td>\n<td>Talking over the user; slow turn-taking</td>\n<td>End of speech to first audio, p50 and p95</td>\n</tr>\n<tr class=\"even\">\n<td>18</td>\n<td>One runtime with three modes, capability eval suites, feedback and online experiments, graduation project</td>\n<td>A change in one mode regressing another</td>\n<td>Per-capability pass^3; cost per success; p95 latency</td>\n</tr>\n</tbody>\n</table></div>\n<figure class=\"diagram\"><svg aria-label=\"Policy runs outside the agent; the sandbox wraps only code and the browser\" font-size=\"13\" role=\"img\" viewbox=\"0 0 760 580\"><defs><marker id=\"arch-arrow\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--cds-chart-axis)\"></path></marker></defs><text data-claude-text-id=\"title\" fill=\"var(--cds-text-primary)\" font-size=\"15\" font-weight=\"600\" x=\"24\" y=\"32\">Policy runs outside the agent; the sandbox wraps only code and the browser</text><g data-claude-anchor=\"connectors\" fill=\"none\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\"><path d=\"M184 96H208\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M368 96H392\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M552 96H576\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M656 132V170\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M288 132V170\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M208 206H184\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M288 242V280\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M368 316H392\" marker-end=\"url(#arch-arrow)\"></path><path d=\"M552 316H576\" marker-end=\"url(#arch- laude-text-id=\"ctx-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"472\" y=\"120\">compaction (W3–W13)</text></g><g data-claude-anchor=\"provider-adapter\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"576\" y=\"60\"></rect><text data-claude-text-id=\"prov-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"656\" y=\"84\">Model gateway</text><text data-claude-text-id=\"prov-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"104\">picks model, effort;</text><text data-claude-text-id=\"prov-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"120\">retries (W2, W8)</text></g><g data-claude-anchor=\"human-approver\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"24\" y=\"170\"></rect><text data-claude-text-id=\"hum-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"104\" y=\"194\">Human approver</text><text data-claude-text-id=\"hum-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"104\" y=\"214\">durable approvals</text><text data-claude-text-id=\"hum-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"104\" y=\"230\">(W15)</text></g><g data-claude-anchor=\"policy-service\"><rect fill=\"var(--cds-chart-categorical-1)\" fill-opacity=\"0.12\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-categorical-1)\" stroke-width=\"2\" width=\"160\" x=\"208\" y=\"170\"></rect><text data-claude-text-id=\"pol-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"288\" y=\"194\">Policy service</text><text data-claude-text-id=\"pol-b1\" fill=\"var(--cds-text-primary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"288\" y=\"214\">separate process,</text><text data-claude-text-id=\"pol-b2\" fill=\"var(--cds-text-primary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"288\" y=\"230\">scoped grants (W9)</text></g><g data-claude-anchor=\"trusted-stores\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"392\" y=\"170\"></rect><text data-claude-text-id=\"st-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"472\" y=\"194\">Trusted stores</text><text data-claude-text-id=\"st-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"472\" y=\"214\">sessions, ledger,</text><text data-claude-text-id=\"st-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"472\" y=\"230\">memory (RLS, W14)</text></g><g data-claude-anchor=\"model\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"576\" y=\"170\"></rect><text data-claude-text-id=\"model-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"656\" y=\"194\">Model</text><text data-claude-text-id=\"model-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"214\">API or own serving</text><text data-claude-text-id=\"model-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"230\">engine (W6, W7)</text></g><g data-claude-anchor=\"tool-registry\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"208\" y=\"280\"></rect><text data-claude-text-id=\"tool-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"288\" y=\"304\">Tool registry</text><text data-claude-text-id=\"tool-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"288\" y=\"324\">fs, search, research,</text><text data-claude-text-id=\"tool-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"288\" y=\"340\">subagents (W1–W11)</text></g><g data-claude-anchor=\"mcp-connectors\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"392\" y=\"280\"></rect><text data-claude-text-id=\"mcp-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"472\" y=\"304\">MCP and connectors</text><text data-claude-text-id=\"mcp-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"472\" y=\"324\">untrusted output</text><text data-claude-text-id=\"mcp-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"472\" y=\"340\">(W9, W13)</text></g><g data-claude-anchor=\"web-services\"><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1.25\" width=\"160\" x=\"576\" y=\"280\"></rect><text data-claude-text-id=\"web-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" text-anchor=\"middle\" x=\"656\" y=\"304\">Web and services</text><text data-claude-text-id=\"web-b1\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"324\">via egress proxy</text><text data-claude-text-id=\"web-b2\" fill=\"var(--cds-text-secondary)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"656\" y=\"340\">(W10, W13, W16)</text></g><g data-claude-anchor=\"sandbox\"><rect fill=\"none\" height=\"120\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-dasharray=\"5 4\" stroke-width=\"1.25\" width=\"344\" x=\"24\" y=\"372\"></rect><text data-claude-text-id=\"sb-name\" fill=\"var(--cds-text-primary)\" font-weight=\"600\" x=\"40\" y=\"394\">Sandbox (W1, W9)</text><rect fill=\"none\" fill-opacity=\"1\" height=\"72\" rx=\"8\" stroke=\"var(--cds-chart-axis)\" stroke-width=\"1. ants, OS sandbox, red team, structured outputs Prompt injection through tool output; approval fatigue Blocked violations; approvals asked per task 10 Conversation-aware query rewriting, web search, fetch, extraction, evidence store, cited answers Citations that don't support the claim; stale sources Citation precision; time to first token; dollars per answer 11 Deep research loop, subagents, planner and fan-out modes Context lost between agents; cost blow-up search_evals score against dollars per task 12 Per-user workspace, code execution, artifacts with lineage, document ingestion Silent numeric errors; artifacts nobody can audit Computation correctness; artifact audit pass rate 13 Memory with provenance, fixture then real connectors, inbound email Wrong memory injected; injection through email Memory precision and recall; wrong-memory injection rate 14 Multi-user service: Postgres with row-level security, sign-in, a job queue with one run per conversation, per-user quotas, user deletion One user's data in another's answer; double-submitted runs; one user starving the rest Cross-user reads (target zero); p95 time to first token at 50 users; duplicate runs 15 Durable steps, idempotent tool ledger, scheduler, durable approvals Duplicate side effects after a crash; doubled schedules Duplicates under repeated kill -9 (target zero) 16 Browser agent with an isolated profile and a destination-aware gate Exfiltration through navigation; wrong clicks Forbidden actions completed (target zero); task success 17 Voice loop: VAD, streaming speech-to-text, model, text-to-speech, barge-in Talking over the user; slow turn-taking End of speech to first audio, p50 and p95 18 One runtime with three modes, capability eval suites, feedback and online experiments, graduation project A change in one mode regressing another Per-capability pass^3; cost per success; p95 latency Policy runs outside the agent; the sandbox wraps only code and the browser Front ends app API, CLI, voice (W14, W17, W18) Runtime loop three modes, budgets, events Context builder memory, retrieval, compaction (W3–W13) Model gateway picks model, effort; retries (W2, W8) Human approver durable approvals (W15) Policy service separate process, scoped grants (W9) Trusted stores sessions, ledger, memory (RLS, W14) Model API or own serving engine (W6, W7) Tool registry fs, search, research, subagents (W1–W11) MCP and connectors untrusted output (W9, W13) Web and services via egress proxy (W10, W13, W16) Sandbox (W1, W9) Workspace bash, python (W1, W12) Browser isolated profile (W16) Every step is a trace span (W1, W5) and committed to the durable store before output (W15) rig v1.0 architecture, with the week each part arrives Requests flow right, from the loop through the context builder to the model. Every tool call flows down through the policy service, which can ask a person. Only code execution and the browser run inside the sandbox, so sandboxed code can never write the stores, the tool ledger or the grants.", "tasks": 0}, {"id": "w1", "group": "Weeks", "title": "Week 1: the single-agent loop", "short": "Week 1", "html": "<p>By Sunday you have a roughly 400-line Python agent that fixes seeded bugs in click inside a container, logs every step, and scores itself on 12 tasks. You can also explain every branch of mini-swe-agent's 190-line loop.</p>\n<h2 id=\"w1-concepts\">Concepts</h2>\n<p><strong>New to this provider's API entirely?</strong> Everything below assumes you've seen one plain request/response with no tools. If you haven't, spend 15 to 20 minutes first: <a href=\"https://platform.claude.com/docs/en/get-started\" rel=\"noopener\" target=\"_blank\">Get started</a> (one <code>curl</code> call, <code>user</code> message in, assistant text back) and the first two sections of <a href=\"https://platform.claude.com/docs/en/build-with-claude/working-with-messages\" rel=\"noopener\" target=\"_blank\">Using the Messages API</a> (multi-turn history, the <code>system</code> field) — skip vision and prefill, not relevant here. A tool call is then just one more kind of thing that can appear in that same response, with one extra round trip to run it and send the result back.</p>\n<p>None of this week's ideas are specific to one vendor; only the exact field names are. Pick one provider to actually call (these notes default to Anthropic's Messages API, concretely, since that's what the starter code below sends), and use this table to translate as you read docs or other people's code:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Idea</th>\n<th>Anthropic (Messages API)</th>\n<th>OpenAI (Chat Completions / Responses)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>System instructions</td>\n<td>top-level <code>system</code> string</td>\n<td>a <code>system</code>/<code>developer</code>-role message, or <code>instructions</code> (Responses)</td>\n</tr>\n<tr class=\"even\">\n<td>Model requests a tool</td>\n<td>content block <code>{type: \"tool_use\", id, name, input}</code></td>\n<td><code>tool_calls</code> entry on the assistant message: <code>{id, function: {name, arguments}}</code></td>\n</tr>\n<tr class=\"odd\">\n<td>You return the result</td>\n<td><code>tool_result</code> content block, <code>tool_use_id</code> matching the call's id</td>\n<td>a <code>role: \"tool\"</code> message, <code>tool_call_id</code> matching the call's id</td>\n</tr>\n<tr class=\"even\">\n<td>Turn finished normally</td>\n<td>stop reason <code>end_turn</code></td>\n<td>finish reason <code>stop</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Turn paused for a tool call</td>\n<td>stop reason <code>tool_use</code></td>\n<td>finish reason <code>tool_calls</code></td>\n</tr>\n<tr class=\"even\">\n<td>Output cut off</td>\n<td>stop reason <code>max_tokens</code></td>\n<td>finish reason <code>length</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Model declined to answer</td>\n<td>stop reason <code>refusal</code></td>\n<td>finish reason <code>content_filter</code></td>\n</tr>\n<tr class=\"even\">\n<td>Context window exceeded</td>\n<td><code>model_context_window_exceeded</code> error (Week 3's problem)</td>\n<td><code>context_length_exceeded</code> error</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>The wire format, regardless of vendor: a system/developer instruction, alternating user and assistant turns, and content that is either plain text, a tool call, or a tool result.</li>\n<li>Tool calling as an id-correlated RPC inside the transcript. Every tool-call id in an assistant message needs a matching tool-result message right after it, or the API rejects the next request.</li>\n<li>Stop/finish reasons and what each means for the loop: turn finished (done), tool call requested (execute and continue), output cut off (so tool arguments may be truncated), declined, and context exceeded (Week 3's problem). See the table above for each provider's exact names.</li>\n<li>Statelessness: every request resends the whole transcript. Without caching, total input tokens grow roughly with the square of the step count.</li>\n<li>Budgets are the only termination guarantee you control: steps, tokens, dollars, wall clock.</li>\n<li>Tool output is untrusted input to the next request. Treat it like user input to a web app.</li>\n</ul>\n<h2 id=\"w1-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1.5 h</td>\n<td>A throwaway script, one tool, by hand — see the Monday walkthrough just below</td>\n<td>One full tool round trip over raw <code>httpx</code>; the four JSON bodies saved under <code>notes/wire/</code></td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2 h</td>\n<td><code>llm.py</code>, <code>trace.py</code>, <code>budget.py</code>'s shape, <code>loop.py</code>, <code>list_files</code>, <code>read_file</code>; clone click; run the first prompt</td>\n<td>The agent answers the read-only trace task; <code>runs/&lt;id&gt;/trace.jsonl</code> holds one event per model call and tool call</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2 h</td>\n<td><code>search</code>, <code>bash</code>, the sandbox container</td>\n<td>The agent runs the test suite in the container and reports counts; <code>sleep 999</code> is killed at the timeout and the loop carries on</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2 h</td>\n<td><code>edit_file</code>, <code>budget.py</code> for real, <code>max_tokens</code> handling, tool error paths; read mini-swe-agent</td>\n<td>The agent fixes task T04 end to end; an artificially tiny budget ends the run with status <code>budget:*</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5 h</td>\n<td>The four experiments on T04 to T09</td>\n<td><code>notes/week1-experiments.md</code> comparing variants on the same tasks</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td><code>evals/run_evals.py</code>; run all 12 tasks 3 times</td>\n<td>A baseline table: pass rate, mean steps, tokens and dollars per task</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Read every failed trajectory; label failures; attempt the checkpoint</td>\n<td>A failure taxonomy with counts; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each day below says exactly what to build and points at the reference material further down the page — schemas, the Dockerfile, the system prompt, the task list — rather than repeating it here.</p>\n<h3 id=\"w1-day-by-day-mon\">Monday — one tool call, by hand, no modules yet.</h3>\n<p>Today's script is throwaway; you will not reuse it tomorrow. The point is to see the four raw JSON bodies with your own eyes — the request, the tool-call response, the follow-up request, the final answer — before <code>llm.py</code> hides them behind a function call for the rest of the week.</p>\n<ol type=\"1\">\n<li>Export your provider's API key and <code>pip install httpx</code>.</li>\n<li>Write a <code>count_lines(path)</code> Python function with no connection to the API at all: open the file at <code>path</code>, return how many lines it has. This is your one tool for today, deliberately trivial, so the only new thing you're learning is the wire format, not the tool's logic.</li>\n<li>Build one request body: <code>model</code>, <code>max_tokens</code>, a <code>messages</code> list with a single user turn (\"How many lines are in pyproject.toml?\"), and a <code>tools</code> list with one schema describing <code>count_lines</code> (<code>name</code>, <code>description</code>, an <code>input_schema</code> with a <code>path</code> string property — see <a href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\" rel=\"noopener\" target=\"_blank\">Define tools</a> on Anthropic, or the schema section of the <a href=\"https://developers.openai.com/api/docs/guides/function-calling\" rel=\"noopener\" target=\"_blank\">function-calling guide</a> already linked above on OpenAI, for the exact shape and field names). POST it with <code>httpx.post</code>. Save the request body to <code>notes/wire/01-request.json</code> and the raw response to <code>notes/wire/02-response.json</code>.</li>\n<li>In that response, find the stop/finish reason and the tool-call content (see the Concepts table above for your provider's exact field names). Print the tool call's name and input — confirm the model actually asked for <code>count_lines</code> with a <code>path</code> argument, not something it invented.</li>\n<li>\"Run it by hand\" means exactly that: call <code>count_lines(**input)</code> yourself, inline in the same script. There's no registry or dispatch yet — that's tomorrow's <code>tools/__init__.py</code>.</li>\n<li>Build the second request: the same <code>messages</code> list, with the assistant turn you just received appended, plus a new turn carrying the tool result (same call id, your function's return value as a string — see the Concepts table for the exact shape). POST it. Save the request to <code>notes/wire/03-request.json</code> and the response to <code>notes/wire/04-response.json</code>.</li>\n<li>Print the assistant's final text from that second response.</li>\n<li>Break it on purpose, twice, and read what comes back: send the second request with <code>tools</code> omitted; send it with the wrong tool-call id. Note what each failure actually looks like — <code>run_tool</code> on Wednesday has to turn failures just like these into something the model can recover from.</li>\n</ol>\n<h3 id=\"w1-day-by-day-tue\">Tuesday — the real loop, pointed at a read-only question.</h3>\n<p>Today you build the reusable modules Monday's throwaway script stood in for: a real HTTP client with retries, an event log, and the agent loop itself. You point that loop at a read-only question about click so you can grade it against a known answer key before the agent is allowed to change a single file. By tonight you have a working, if toothless, agent that can read and reason about code but can't yet edit anything.</p>\n<ol type=\"1\">\n<li>Lay out the repo per <strong>Repository layout</strong> below.</li>\n<li>Write <code>rig/llm.py</code>: the raw HTTP client, and the only thing in the codebase that talks to the network. Its whole job is one request in, one parsed response out, retrying only the failures that are safe to retry — it knows nothing about tools, messages history, or the loop. See <strong>Starter code</strong> below for the exact retry policy — type it in, don't paste.</li>\n<li>Write <code>rig/trace.py</code>: the append-only event log every later week's metrics (and today's own grading) come from — one JSON line per model call and tool call, flushed immediately so a crash still leaves a readable prefix. Also get <code>rig/budget.py</code>'s shape in place: it will be the single place that decides when a run has to stop (steps, tokens, dollars, wall clock), so nothing else in the codebase needs to know the thresholds. Both are sketched in <strong>Starter code</strong>. You only need <code>trace.py</code> working today; giving <code>Budget</code> its interface now (even with <code>check()</code> never tripping) means <code>loop.py</code> doesn't change shape when you make the limits real on Thursday.</li>\n<li>Write <code>rig/loop.py</code>: the agent itself. It owns the one <code>messages</code> list nothing else may append to, and on each turn decides whether to call the model again, run the tools it asked for, or stop — see <strong>Starter code</strong> below.</li>\n<li>Implement <code>list_files</code> (lets the model see what exists before it goes looking) and <code>read_file</code> (lets it see a file's contents, numbered, so it can cite a location precisely) from the contracts in <strong>The first five tools</strong> below — both are a few lines each. <code>edit_file</code> and <code>bash</code> (the two tools with real engineering in them) aren't due until Wednesday and Thursday.</li>\n<li>Write a minimal <code>workspace.py</code> from the Tuesday shape in <strong>Starter code</strong> below: today it's just a small object holding <code>root</code> (the checkout path) and <code>name</code>, so <code>loop.py</code> and your tools have a <code>ws</code> to call — the container lifecycle in <strong>Sandbox from Day 1</strong> doesn't arrive until Wednesday. Then <code>git -C reading/click archive 8.5.0</code> into <code>workspaces/</code> and point it at that checkout — a plain checkout, no sandbox yet.</li>\n<li>Run <strong>the first prompt to give your agent</strong> below, read-only, and grade yourself against the answer key given there.</li>\n<li>Confirm <code>runs/&lt;id&gt;/trace.jsonl</code> has one line per model call and tool call, and that every line is valid JSON even if you kill the process mid-run.</li>\n</ol>\n<h3 id=\"w1-day-by-day-wed\">Wednesday — the sandbox, and two tools that touch it.</h3>\n<p>Today the agent gets permission to actually run things: a disposable, network-isolated Docker container per run, plus the <code>search</code> and <code>bash</code> tools that use it. This is where the sandbox stops being a diagram and becomes a real boundary — you'll deliberately make a command misbehave (<code>sleep 999</code>) and confirm the agent recovers instead of hanging forever.</p>\n<ol type=\"1\">\n<li>Build the image from the Dockerfile in <strong>Sandbox from Day 1</strong> below. Sanity-check it stands alone first — <code>docker run --rm rig-sandbox python -c \"print(1)\"</code> — before wiring it into rig.</li>\n<li>Implement <code>tools/shell.py</code>'s <code>bash</code>: the escape hatch for everything the other tools can't do, chiefly running tests — exactly as given in <strong>Starter code</strong>. Implement <code>tools/search.py</code>'s <code>search</code>: today's grep-based baseline for finding things in the repo, which Week 4's real retrieval has to beat — from the contract in <strong>The first five tools</strong>.</li>\n<li>Extend <code>workspace.py</code> to the Wednesday shape in <strong>Starter code</strong> below, which adds <code>exec_prefix</code>: it owns the sandbox's whole lifecycle — snapshotting the repo fresh per run, starting and stopping the container, and the path jail that keeps host-side file edits inside the worktree. Follow the snapshot-and-run steps in <strong>Sandbox from Day 1</strong>: fresh snapshot, start the container with <code>--network none</code>, offline <code>pip install</code>.</li>\n<li>Smoke-test the sandbox by hand before trusting the agent with it: <code>docker exec</code> into a running container and run <code>python -m pytest -q</code> yourself; the counts should match T03's baseline (1,991 passed / 24 skipped / 1 xfailed).</li>\n<li>Give the agent a prompt that runs <code>sleep 999</code> and confirm the inner <code>timeout</code> kills it and the loop continues rather than hanging.</li>\n</ol>\n<h3 id=\"w1-day-by-day-thu\">Thursday — editing, real budgets, and mini-swe-agent.</h3>\n<p>Today the agent can finally fix bugs, not just read about them: <code>edit_file</code> with its uniqueness-matching safety net, and <code>budget.py</code> enforced for real so a runaway agent stops itself instead of burning your API budget unattended. You close the day by reading mini-swe-agent, the smallest possible counterpoint to everything you've built this week — one tool, no permission model, and reportedly comparable results.</p>\n<ol type=\"1\">\n<li>Implement <code>edit_file</code> exactly as given in <strong>Starter code</strong>; the uniqueness check is the whole point of it, don't loosen it.</li>\n<li>Finish <code>budget.py</code> for real: steps, input tokens, dollars and wall clock each raise <code>BudgetExceeded(&lt;reason&gt;)</code> from <code>check()</code>; fill in a price table from your provider's current pricing page for <code>charge()</code>.</li>\n<li>Add <code>max_tokens</code> handling in <code>loop.py</code> (the <code>TRUNCATED</code> branch, already shown in <strong>Starter code</strong>) and confirm every tool failure becomes an <code>is_error</code> result rather than an exception that escapes (also shown there).</li>\n<li>Point the agent at task T04 end to end — fix, run tests, stop — see <strong>Task ladder and initial eval set</strong> below for the exact bug and grader.</li>\n<li>Set an artificially tiny budget (for example <code>max_steps=2</code>) and confirm the run ends with status <code>budget:steps</code>, not an exception.</li>\n<li>Read <strong>mini-swe-agent</strong> below and trace the path given there; answer its seven questions in your notes.</li>\n</ol>\n<h3 id=\"w1-day-by-day-fri\">Friday — break your own agent on purpose.</h3>\n<p>No new code today. You spend the day running controlled variants of the agent you already built — fewer tools, no line numbers, different truncation limits, no error signaling — against the same tasks, to start forming opinions backed by numbers about which of this week's design choices actually mattered.</p>\n<p>Run the four experiments in <strong>Experiments (Friday)</strong> below against T04 to T09 (each experiment names its own task range). Write up what changed in <code>notes/week1-experiments.md</code>: pass rate, steps, tokens, and the specific step in the trace where behavior diverged.</p>\n<h3 id=\"w1-day-by-day-sat\">Saturday — the eval harness.</h3>\n<p>Today you build the harness that turns \"it seems to work\" into a number: a script that snapshots click fresh for every task, runs the agent, grades the result in the sandbox, and logs everything to <code>results.jsonl</code>. Then you run the full 12-task ladder three times each to get your first real baseline — pass rate, steps, tokens, dollars — to compare every future week against.</p>\n<ol type=\"1\">\n<li>Write <code>evals/run_evals.py</code> per <strong>Repository layout</strong> below: per task, a fresh snapshot, apply the seed if the task has one, run the agent, run the grader inside the container, append one line to <code>results.jsonl</code>.</li>\n<li>Run it over all 12 tasks in <strong>Task ladder and initial eval set</strong> below, three times each.</li>\n<li>Compute pass@1 and pass^3 (see the note under that table) and the per-run and per-batch rows of <strong>Metrics to record from the start</strong> below.</li>\n</ol>\n<h3 id=\"w1-day-by-day-sun\">Sunday — read your own failures, then the checkpoint.</h3>\n<p>No new code today either. A pass rate alone tells you something's wrong, not what — so you read every failed run end to end and assign it a cause. Then you attempt the week's checkpoint cold; whether you pass it, not whether you got through the calendar, is the real signal for whether you're ready for Week 2.</p>\n<ol type=\"1\">\n<li>For every failed run, read the trace end to end and assign it exactly one label: wrong location, bad edit, edited tests, gave up, looped, budget, tool error.</li>\n<li>Write the counts per label in your weekly note.</li>\n<li>Attempt <strong>Checkpoint</strong> below. If you can't pass it cold, that's a real signal, not a formality — redo the relevant day rather than carrying the gap into Week 2.</li>\n</ol>\n<h2 id=\"w1-repository-layout\">Repository layout</h2>\n<div class=\"code-wrap\"><pre><code class=\"language-text\">rig/\n  pyproject.toml            # deps: httpx, pyyaml, pytest (for rig's own tests)\n  rig/\n    cli.py                  # rig run --repo PATH --task FILE_OR_TEXT --budget-usd 0.50\n    llm.py                  # raw Messages API client: retries, backoff, usage\n    loop.py                 # run_agent(): the loop, stop conditions\n    budget.py               # steps / tokens / dollars / wall clock\n    trace.py                # append-only JSONL writer\n    workspace.py            # snapshot creation, container lifecycle, path jail\n    tools/\n      __init__.py           # registry, dispatch, truncation\n      fs.py                 # list_files, read_file, edit_file\n      search.py             # search (ripgrep)\n      shell.py              # bash\n    prompts/system.md\n  docker/Dockerfile.sandbox\n  evals/\n    tasks/week1.yaml        # id, prompt, seed, grader\n    seeds/                  # one patch per seeded bug (never shown to the agent)\n    hidden/                 # hidden tests (never copied into the agent's workspace)\n    run_evals.py\n    report.py\n  tests/                    # tests for rig itself: tool contracts, truncation, budget\n  runs/                     # gitignored: &lt;run_id&gt;/{trace.jsonl, messages.json, diff.patch, result.json}\n  reading/                  # gitignored pinned clones + SHAS.txt\n  notes/</code></pre></div>\n<h2 id=\"w1-minimal-architecture\">Minimal architecture</h2>\n<p>One process, one thread, no framework. Five rules:</p>\n<ol type=\"1\">\n<li><code>loop.py</code> owns the <code>messages</code> list; nothing else append
