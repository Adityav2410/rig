n of. Swarm is archived and tiny on purpose — one file, one mechanism — so today's reading gives you the concept with nothing else competing for attention.</p>\n<ol type=\"1\">\n<li>Read <code>swarm/core.py</code> and <code>swarm/types.py</code> in <strong>Read</strong>: <code>run</code>, <code>handle_tool_calls</code>, <code>handle_function_result</code>.</li>\n<li>Trace the Swarm path given there: a tool returning an <code>Agent</code> is the entire handoff.</li>\n<li>Write a half-page note: agent-as-tool versus handoff, per <strong>Concepts</strong>' first bullet, in your own words before you build either.</li>\n</ol>\n<h3 id=\"w11-day-by-day-tue\">Tuesday — two subagents, read-only and narrow.</h3>\n<p>Today's two subagents are deliberately the simplest possible case for context isolation: one reads broadly and reports back in 400 words, the other filters a wall of test output down to what actually failed. Both exist so the parent's context never has to hold what they held.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: <code>explore(question)</code> — read-only tools, fresh transcript, a step cap, a dollar limit, at most 400 words with citations, a child trace span.</li>\n<li>Implement <strong>Build</strong> step 2: <code>run_tests(selector)</code>, deciding (and writing down why) whether it needs to be a subagent or a plain function.</li>\n<li>Run it on a real question about rig's own code and check the parent never has to re-read what <code>explore</code> already read.</li>\n</ol>\n<h3 id=\"w11-day-by-day-wed\">Wednesday — budgets that nest, and a plan that survives failure.</h3>\n<p>Today's two pieces are what keep multi-agent mode from either overspending or stalling: a budget a child can't exceed, and a planner/executor loop that replans instead of giving up when a step's check fails.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3 using the <code>run_subagent</code> sketch there: children reserve from the parent's remaining budget, unused reserve returns, depth caps at 2.</li>\n<li>Implement <strong>Build</strong> step 4: the planner emits a JSON plan (goal, files, check) per step; the executor runs the loop and replans on a failed check.</li>\n<li>Force a step to fail on purpose and confirm the executor replans rather than looping or crashing.</li>\n</ol>\n<h3 id=\"w11-day-by-day-thu\">Thursday — fan-out for real, and the SDK behind handoffs.</h3>\n<p>Today's build is the first one where isolation matters for a concrete reason: three fixer subagents working the same task in parallel, each in its own worktree, with a merge step that has to detect when two of them touched the same file. You read the production version of handoffs and agent-as-tool right after, since you just built working examples of both ideas.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: one fixer subagent per symptom on T17, each in its own git worktree, merged with <code>git apply --3way</code> and the full suite rerun.</li>\n<li>Read the <code>openai-agents-python</code> entries in <strong>Read</strong>: <code>Handoff</code>, <code>handoff</code>, <code>Agent.as_tool</code>, and selectively through <code>turn_resolution.py</code>.</li>\n<li>Trace the Agents SDK path given there and compare it against what you just built by hand.</li>\n</ol>\n<h3 id=\"w11-day-by-day-fri\">Friday — a real handoff, and where fan-out breaks.</h3>\n<p>Today adds the one piece Tuesday through Thursday's subagents didn't need: a tool that actually hands the conversation to someone else, with filtered history. Then you spend the rest of the day finding where this week's isolation helps and where it silently loses information or picks a winner it shouldn't.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 6: <code>transfer_to_reviewer</code>, swapping rig's system prompt and tools with a filtered history; compare it against calling the reviewer as a plain tool.</li>\n<li>Run <strong>Experiment</strong> 3: a fresh-context reviewer against self-review on T10 and T11, where the visible tests pass despite the bug.</li>\n<li>Run <strong>Experiment</strong> 4: let two fan-out workers touch the same file and confirm the merge step flags the conflict instead of picking one silently.</li>\n</ol>\n<h3 id=\"w11-day-by-day-sat\">Saturday — deep research, end to end.</h3>\n<p>This is the week's payoff: Week 10's single-pipeline research loop, run wider. A planner decomposes the question, three researchers run the pipeline in parallel under their own budgets, a writer synthesizes from evidence ids rather than prose, and a reviewer with fresh context checks citations before anything reaches the user.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 7: <code>rig ask --deep</code> — planner, three parallel researchers on Week 10's pipeline, a writer, a fresh-context citation reviewer.</li>\n<li>Confirm evidence ids, not summaries, cross the researcher-to-writer boundary, per <strong>Concepts</strong>' \"evidence travels\" bullet.</li>\n<li>Run it on two or three R01-R30 questions from Week 10 and compare against last week's single-pipeline answers.</li>\n</ol>\n<h3 id=\"w11-day-by-day-sun\">Sunday — score it against a real benchmark, then checkpoint.</h3>\n<p>Your own eval set tells you if deep mode helps on your own questions; search_evals tells you where it stands against questions designed to need broad research. Today wires up the harness, runs the comparison, and closes with the checkpoint.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 8: subclass <code>BaseHarness</code> so <code>run()</code> calls <code>rig ask --deep</code>; run 50-task subsets of BrowseComp and DeepSearchQA with <code>--limit</code>.</li>\n<li>Read the <code>perplexityai/search_evals</code> entries in <strong>Read</strong> and trace the harness path given there.</li>\n<li>Run <strong>Experiments</strong> 1, 2 and 5: single agent against <code>explore</code>, planner/executor and fan-out on T01-T23 plotted as pass rate against dollars; the <code>explore</code> report-limit sweep; the four-architecture comparison across R01-R30 and your search_evals subset.</li>\n<li>Answer <strong>You should be able to answer</strong>, then attempt <strong>Checkpoint</strong>.</li>\n</ol>\n<h2 id=\"w11-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w11.build.1\"><input aria-label=\"Done\" data-id=\"w11.build.1\" id=\"c-w11-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>explore(question)</code>: a subagent with read-only tools, a fresh transcript, a cap of 15 steps and a small dollar limit, returning at most 400 words with <code>path:line</code> or evidence-id citations. Its trace is a child span linked to the parent run.</div></li>\n<li class=\"task do\" data-id=\"w11.build.2\"><input aria-label=\"Done\" data-id=\"w11.build.2\" id=\"c-w11-build-2\" type=\"checkbox\"/><div class=\"task-body\"><code>run_tests(selector)</code>: a subagent (or a plain function; decide which and say why) that returns only failing test ids and the first lines of each error.</div></li>\n<li class=\"task do\" data-id=\"w11.build.3\"><input aria-label=\"Done\" data-id=\"w11.build.3\" id=\"c-w11-build-3\" type=\"checkbox\"/><div class=\"task-body\">Hierarchical budgets: children reserve from the parent's remaining budget, unused reserve returns, and depth is capped at 2 (sketch below).</div></li>\n<li class=\"task do\" data-id=\"w11.build.4\"><input aria-label=\"Done\" data-id=\"w11.build.4\" id=\"c-w11-build-4\" type=\"checkbox\"/><div class=\"task-body\">A planner/executor variant: the planner emits a JSON plan of steps (goal, files, check); the executor runs the loop per step and replans after a failed check.</div></li>\n<li class=\"task do\" data-id=\"w11.build.5\"><input aria-label=\"Done\" data-id=\"w11.build.5\" id=\"c-w11-build-5\" type=\"checkbox\"/><div class=\"task-body\">Fan-out on T17: one fixer subagent per symptom, each in its own git worktree; the parent merges with <code>git apply --3way</code> and runs the full suite.</div></li>\n<li class=\"task do\" data-id=\"w11.build.6\"><input aria-label=\"Done\" data-id=\"w11.build.6\" id=\"c-w11-build-6\" type=\"checkbox\"/><div class=\"task-body\">A handoff toy: a <code>transfer_to_reviewer</code> tool that swaps rig's system prompt and tools and keeps a filtered history. Compare it with a reviewer called as a tool.</div></li>\n<li class=\"task do\" data-id=\"w11.build.7\"><input aria-label=\"Done\" data-id=\"w11.build.7\" id=\"c-w11-build-7\" type=\"checkbox\"/><div class=\"task-body\"><code>rig ask --deep</code>: planner, three parallel researchers running Week 10's pipeline, a writer that synthesizes from evidence ids, and a fresh-context citation reviewer.</div></li>\n<li class=\"task do\" data-id=\"w11.build.8\"><input aria-label=\"Done\" data-id=\"w11.build.8\" id=\"c-w11-build-8\" type=\"checkbox\"/><div class=\"task-body\">A search_evals harness for rig: subclass <code>BaseHarness</code> so <code>run()</code> calls <code>rig ask --deep</code>, then run 50-task subsets of BrowseComp and DeepSearchQA with <code>--limit</code>. Its graders call OpenAI models, so budget for that key, and treat Perplexity's published full-suite scores as context, not as a target your subset can match.</div></li>\n</ol>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># a sketch of hierarchical budgets; the parent's budget is the only one the user sees\ndef run_subagent(parent, task: str, tool_names: list[str], max_usd: float, max_steps: int = 15):\n    if parent.depth &gt;= 2:\n        raise ToolError(\"Subagent depth limit reached; do this step yourself.\")\n    reserve = parent.budget.reserve(usd=min(max_usd, 0.5 * parent.budget.remaining_usd()), steps=max_steps)\n    try:\n        result = run_agent(task, tools=parent.tools.subset(tool_names), budget=reserve,\n                           depth=parent.depth + 1, trace=parent.trace.child(task))\n    finally:\n        parent.budget.settle(reserve)    # unused reserve returns to the parent\n    return result.final[:2000]           # findings and evidence ids, never the child's transcript</code></pre></div>\n<h2 id=\"w11-project-increment\">Project increment</h2>\n<p>rig v0.11: <code>explore</code>, test summarization, hierarchical budgets, planner and fan-out modes behind flags, and <code>rig ask --deep</code>. Every mode runs on the same eval sets and on search_evals subsets, so they can be compared on quality and dollars per correct answer.</p>\n<h2 id=\"w11-read\">Read</h2>\n<p><strong><a href=\"https://github.com/openai/swarm\" rel=\"noopener\" target=\"_blank\">openai/swarm</a></strong>, <code>swarm/core.py</code> (292 lines) and <code>swarm/types.py</code> (41). Read <code>run</code> (231), <code>handle_tool_calls</code> (89) and <code>handle_function_result</code> (71): if a tool returns an <code>Agent</code>, the active agent changes, and that is the whole handoff mechanism. Swarm is archived as an educational project and superseded by the Agents SDK; read it as the specification of the idea.</p>\n<p><strong><a href=\"https://github.com/openai/openai-agents-python\" rel=\"noopener\" target=\"_blank\">openai/openai-agents-python</a> at <code>v0.23.1</code></strong>, which is what Swarm's idea becomes in production. It is also your Week 4 corpus, so use rig's <code>retrieve</code> on it. Read <code>src/agents/handoffs/__init__.py</code> (<code>HandoffInputData</code> at 71, <code>Handoff</code> at 126, <code>handoff</code> at 229), <code>handoffs/history.py</code>, and <code>Agent.as_tool</code> in <code>src/agents/agent.py</code> (606). Then, in <code>src/agents/run_internal/turn_resolution.py</code> (3,738 lines, so read selectively): <code>process_model_response</code> (2799), <code>execute_tools_and_side_effects</code> (795), <code>execute_handoffs</code> (529) and <code>get_single_step_result_from_response</code> (3657). Note <code>resolve_interrupted_turn</code> (1145) for Week 15.</p>\n<p><strong><a href=\"https://github.com/perplexityai/search_evals\" rel=\"noopener\" target=\"_blank\">perplexityai/search_evals</a></strong> at <code>cab4c5d</code>: Perplexity's open-source runner for deep-research benchmarks (BrowseComp, DeepSearchQA, HLE's retrieval subset, WideSearch), with resumable runs, cost accounting and per-task traces. Read <code>search_evals/harnesses/base.py</code> (67 lines: <code>BaseHarness</code> at 36, <code>run</code> at 67), <code>runner.py</code> (<code>EvalRunner.run</code> at 65, <code>_run_task</code> at 95) and <code>suites/graders.py</code> (<code>DeepResearchGrader.grade</code> at 93).</p>\n<p>Optional essay: Anthropic's write-up of <a href=\"https://www.anthropic.com/engineering/built-multi-agent-research-system\" rel=\"noopener\" target=\"_blank\">how its multi-agent research system was built</a>, which is candid about token cost and coordination failures.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>Swarm: <code>run</code> → <code>get_chat_completion</code> (the active agent's instructions and functions) → <code>handle_tool_calls</code> → <code>handle_function_result</code> (an <code>Agent</code> result sets the new active agent) → the loop continues with the new agent and the same history.</li>\n<li>Agents SDK: a turn's model response → <code>process_model_response</code> (classifies output items into tool calls, handoffs and final output) → <code>execute_tools_and_side_effects</code> → <code>execute_handoffs</code> (applies the input filter to history and switches agent) → <code>get_single_step_result_from_response</code> decides between final output, handoff and run again.</li>\n<li>search_evals: CLI → <code>EvalRunner.run</code> → <code>_run_task</code> per task (attempt directories, retries) → your harness's <code>run</code> → the suite's grader → summary with cost.</li>\n</ul>\n<h2 id=\"w11-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w11.q.1\"><input aria-label=\"I can answer this\" data-id=\"w11.q.1\" id=\"c-w11-q-1\" type=\"checkbox\"/><div class=\"task-body\">In Swarm, what exactly changes in the next request after a handoff, and what stays the same?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.2\"><input aria-label=\"I can answer this\" data-id=\"w11.q.2\" id=\"c-w11-q-2\" type=\"checkbox\"/><div class=\"task-body\">What does a handoff input filter receive and return, and why do production systems need one?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.3\"><input aria-label=\"I can answer this\" data-id=\"w11.q.3\" id=\"c-w11-q-3\" type=\"checkbox\"/><div class=\"task-body\">How does <code>Agent.as_tool</code> differ from a handoff in who owns the conversation afterwards?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.4\"><input aria-label=\"I can answer this\" data-id=\"w11.q.4\" id=\"c-w11-q-4\" type=\"checkbox\"/><div class=\"task-body\">Where does the Agents SDK enforce its maximum number of turns, and what happens when it trips?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.5\"><input aria-label=\"I can answer this\" data-id=\"w11.q.5\" id=\"c-w11-q-5\" type=\"checkbox\"/><div class=\"task-body\">Why should researchers return evidence ids rather than prose summaries?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.6\"><input aria-label=\"I can answer this\" data-id=\"w11.q.6\" id=\"c-w11-q-6\" type=\"checkbox\"/><div class=\"task-body\">In your fan-out run on T17, where were tokens spent: the subagents' exploration or the parent's coordination?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.7\"><input aria-label=\"I can answer this\" data-id=\"w11.q.7\" id=\"c-w11-q-7\" type=\"checkbox\"/><div class=\"task-body\">Which information did your <code>explore</code> subagent lose that the parent later needed? How did you detect it?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w11.q.8\"><input aria-label=\"I can answer this\" data-id=\"w11.q.8\" id=\"c-w11-q-8\" type=\"checkbox\"/><div class=\"task-body\">On your search_evals subset, where did deep mode gain, and what did each extra point cost?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w11-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w11.exp.1\"><input aria-label=\"Done\" data-id=\"w11.exp.1\" id=\"c-w11-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Single agent against single agent with <code>explore</code>, planner/executor and fan-out on T01 to T23. Plot pass rate against dollars per solved task.</div></li>\n<li class=\"task do\" data-id=\"w11.exp.2\"><input aria-label=\"Done\" data-id=\"w11.exp.2\" id=\"c-w11-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Vary the <code>explore</code> report limit (100, 400, 1,500 words) and measure how often the parent re-reads what the subagent already reported.</div></li>\n<li class=\"task do\" data-id=\"w11.exp.3\"><input aria-label=\"Done\" data-id=\"w11.exp.3\" id=\"c-w11-exp-3\" type=\"checkbox\"/><div class=\"task-body\">A reviewer as a fresh-context subagent against self-review in the same context, on T10 and T11 (where the visible tests pass with the bug).</div></li>\n<li class=\"task do\" data-id=\"w11.exp.4\"><input aria-label=\"Done\" data-id=\"w11.exp.4\" id=\"c-w11-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Let two fan-out workers touch the same file and confirm the merge step detects the conflict rather than silently picking one.</div></li>\n<li class=\"task do\" data-id=\"w11.exp.5\"><input aria-label=\"Done\" data-id=\"w11.exp.5\" id=\"c-w11-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Four research architectures on R01–R30 and a 50-task search_evals subset, measuring answer quality, evidence recall, citation precision, latency, tokens, cost per correct answer, and parent re-reads caused by information lost at the boundary:</div></li>\n</ol>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Mode</th>\n<th>Hypothesis</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Single agent</td>\n<td>Strong baseline; lowest coordination cost</td>\n</tr>\n<tr class=\"even\">\n<td>Manager and one researcher</td>\n<td>Context isolation with little overhead</td>\n</tr>\n<tr class=\"odd\">\n<td>Three parallel researchers</td>\n<td>Broader evidence and lower wall time when the question decomposes</td>\n</tr>\n<tr class=\"even\">\n<td>Researchers and an independent reviewer</td>\n<td>Fresh-context verification catches synthesis and citation errors</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"w11-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Budgets are hierarchical.</strong> A child cannot spend more than the parent has left, and the root's budget is the only one the user sees.</li>\n<li><strong>Cancellation propagates</strong> down the tree; orphaned children are a cost leak.</li>\n<li><strong>Idempotency across agents:</strong> two workers must not both run the same side effect. Give mutating work an owner.</li>\n<li><strong>Tracing:</strong> parent and child spans share a trace id, so one query shows the whole tree and its cost.</li>\n<li><strong>Rate limits</strong> become the real limit on fan-out; queue rather than spawn.</li>\n</ul>\n<h2 id=\"w11-not-yet\">Not yet</h2>\n<p>Agent-to-agent network protocols, large \"crew\" or role-play frameworks, debate setups, and self-improving agent societies. They are compositions of the loop; judge each by your eval numbers, not its diagram.</p>\n<h2 id=\"w11-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w11.check.1\"><input aria-label=\"Done\" data-id=\"w11.check.1\" id=\"c-w11-check-1\" type=\"checkbox\"/><div class=\"task-body\">You can implement a handoff and an agent-as-tool in rig in under an hour each, and explain the trade-off with your own numbers.</div></li>\n<li class=\"task do\" data-id=\"w11.check.2\"><input aria-label=\"Done\" data-id=\"w11.check.2\" id=\"c-w11-check-2\" type=\"checkbox\"/><div class=\"task-body\">You have one multi-agent mode that beats the single agent on some task category at an acceptable cost, or a documented result showing none did.</div></li>\n<li class=\"task do\" data-id=\"w11.check.3\"><input aria-label=\"Done\" data-id=\"w11.check.3\" id=\"c-w11-check-3\" type=\"checkbox\"/><div class=\"task-body\">rig runs on a search_evals subset end to end, and one trace query shows the full agent tree for any run with per-node cost.</div></li>\n</ul>\n", "toc": [["w11-concepts", "Concepts", []], ["w11-day-by-day", "Day by day", [["w11-day-by-day-mon", "Monday — the smallest possible handoff."], ["w11-day-by-day-tue", "Tuesday — two subagents, read-only and narrow."], ["w11-day-by-day-wed", "Wednesday — budgets that nest, and a plan that survives failure."], ["w11-day-by-day-thu", "Thursday — fan-out for real, and the SDK behind handoffs."], ["w11-day-by-day-fri", "Friday — a real handoff, and where fan-out breaks."], ["w11-day-by-day-sat", "Saturday — deep research, end to end."], ["w11-day-by-day-sun", "Sunday — score it against a real benchmark, then checkpoint."]]], ["w11-build", "Build", []], ["w11-project-increment", "Project increment", []], ["w11-read", "Read", []], ["w11-you-should-be-able-to-answer", "You should be able to answer", []], ["w11-experiments", "Experiments", []], ["w11-production-lens", "Production lens", []], ["w11-not-yet", "Not yet", []], ["w11-checkpoint", "Checkpoint", []]], "text": "A subagent is run_agent() called as a tool: a fresh transcript, a narrower tool set, a budget drawn from its parent's, and a short result returned to the caller. A handoff is a tool call that swaps the active system prompt and tools. Deep research is where this pays off first: questions that need dozens of searches benefit from parallel researchers with clean contexts. This week you build both and let your evals and Perplexity's search_evals decide. Concepts Agent-as-tool versus handoff. With agent-as-tool the caller keeps control and receives a result. With a handoff the callee takes over the conversation, usually with filtered history. The main benefit is context isolation. An exploration subagent can read 40 files or pages and return 300 words; the parent's context stays clean. The second benefit is parallelism. The cost is tokens (often several times a single agent) and information lost at the boundary. Deep research is Week 10's loop run wider and longer: a planner decomposes the question, researchers run the pipeline in parallel under their own budgets, a writer synthesizes, and a reviewer with fresh context checks citations. Evidence travels, not prose. Researchers return evidence ids and short findings; the writer synthesizes from the passages themselves. That defeats the telephone game. Planner/executor is one model call that emits a plan, then a loop over its steps, plus a rule for replanning when a step fails. A plan kept as a file the single agent edits is often enough. Orchestrator-workers fan out independent subtasks. Writers need isolation (one git worktree each) and a merge step that detects conflicts. Where it helps: broad exploration, truly independent subtasks, verification with fresh eyes. Where it hurts: tightly coupled edits, long sequential reasoning, tight budgets. Failure modes: detail lost in summaries, duplicated work, conflicting writes, unbounded recursion, cost blow-up, and confident errors propagated upward. Day by day The week moves from the smallest possible handoff (Swarm, 292 lines) to rig's own deep-research mode, with the production SDK's version of the same idea read in between. Day Time Do Working by end of day Mon 1–1.5 h Read openai/swarm's core.py and types.py A half-page note on what a handoff actually changes in the next request Tue 2–3 h Build steps 1-2: explore and run_tests subagents Both return a bounded summary, not a transcript, with child spans in the trace Wed 2–3 h Build steps 3-4: hierarchical budgets, then planner/executor A child cannot overspend its parent; a failed check triggers a replan, not a crash Thu 2–2.5 h Build step 5: fan-out on T17; read and trace the Agents SDK handoff/as-tool path Three fixer subagents in separate worktrees, merged with git apply --3way Fri 1.5–2 h Build step 6: the handoff toy; run experiments 3-4 transfer_to_reviewer swaps system prompt and tools; a worker merge conflict is caught, not silently resolved Sat 3–4 h Build step 7: rig ask --deep Planner, three parallel researchers, a writer, and a fresh-context citation reviewer, run end to end Sun 3–4 h Build step 8: the search_evals harness; run remaining experiments; checkpoint rig runs a search_evals subset end to end; one trace query shows cost for the whole tree Monday — the smallest possible handoff. Before building any of rig's multi-agent machinery, read the thing it's all a production-grade version of. Swarm is archived and tiny on purpose — one file, one mechanism — so today's reading gives you the concept with nothing else competing for attention. Read swarm/core.py and swarm/types.py in Read: run, handle_tool_calls, handle_function_result. Trace the Swarm path given there: a tool returning an Agent is the entire handoff. Write a half-page note: agent-as-tool versus handoff, per Concepts' first bullet, in your own words before you build either. Tuesday — two subagents, read-only and narrow. Today's two subagents are deliberately the simplest possible case for context isolation: one reads broadly and reports back in 400 words, the other filters a wall of test output down to what actually failed. Both exist so the parent's context never has to hold what they held. Implement Build step 1: explore(question) — read-only tools, fresh transcript, a step cap, a dollar limit, at most 400 words with citations, a child trace span. Implement Build step 2: run_tests(selector), deciding (and writing down why) whether it needs to be a subagent or a plain function. Run it on a real question about rig's own code and check the parent never has to re-read what explore already read. Wednesday — budgets that nest, and a plan that survives failure. Today's two pieces are what keep multi-agent mode from either overspending or stalling: a budget a child can't exceed, and a planner/executor loop that replans instead of giving up when a step's check fails. Implement Build step 3 using the run_subagent sketch there: children reserve from the parent's remaining budget, unused reserve returns, depth caps at 2. Implement Build step 4: the planner emits a JSON plan (goal, files, check) per step; the executor runs the loop and replans on a failed check. Force a step to fail on purpose and confirm the executor replans rather than looping or crashing. Thursday — fan-out for real, and the SDK behind handoffs. Today's build is the first one where isolation matters for a concrete reason: three fixer subagents working the same task in parallel, each in its own worktree, with a merge step that has to detect when two of them touched the same file. You read the production version of handoffs and agent-as-tool right after, since you just built working examples of both ideas. Implement Build step 5: one fixer subagent per symptom on T17, each in its own git worktree, merged with git apply --3way and the full suite rerun. Read the openai-agents-python entries in Read: Handoff, handoff, Agent.as_tool, and selectively through turn_resolution.py. Trace the Agents SDK path given there and compare it against what you just built by hand. Friday — a real handoff, and where fan-out breaks. Today adds the one piece Tuesday through Thursday's subagents didn't need: a tool that actually hands the conversation to someone else, with filtered history. Then you spend the rest of the day finding where this week's isolation helps and where it silently loses information or picks a winner it shouldn't. Implement Build step 6: transfer_to_reviewer, swapping rig's system prompt and tools with a filtered history; compare it against calling the reviewer as a plain tool. Run Experiment 3: a fresh-context reviewer against self-review on T10 and T11, where the visible tests pass despite the bug. Run Experiment 4: let two fan-out workers touch the same file and confirm the merge step flags the conflict instead of picking one silently. Saturday — deep research, end to end. This is the week's payoff: Week 10's single-pipeline research loop, run wider. A planner decomposes the question, three researchers run the pipeline in parallel under their own budgets, a writer synthesizes from evidence ids rather than prose, and a reviewer with fresh context checks citations before anything reaches the user. Implement Build step 7: rig ask --deep — planner, three parallel researchers on Week 10's pipeline, a writer, a fresh-context citation reviewer. Confirm evidence ids, not summaries, cross the researcher-to-writer boundary, per Concepts' \"evidence travels\" bullet. Run it on two or three R01-R30 questions from Week 10 and compare against last week's single-pipeline answers. Sunday — score it against a real benchmark, then checkpoint. Your own eval set tells you if deep mode helps on your own questions; search_evals tells you where it stands against questions designed to need broad research. Today wires up the harness, runs the comparison, and closes with the checkpoint. Implement Build step 8: subclass BaseHarness so run() calls rig ask --deep; run 50-task subsets of BrowseComp and DeepSearchQA with --limit. Read the perplexityai/search_evals entries in Read and trace the harness path given there. Run Experiments 1, 2 and 5: single agent against explore, planner/executor and fan-out on T01-T23 plotted as pass rate against dollars; the explore report-limit sweep; the four-architecture comparison across R01-R30 and your search_evals subset. Answer You should be able to answer, then attempt Checkpoint. Build explore(question): a subagent with read-only tools, a fresh transcript, a cap of 15 steps and a small dollar limit, returning at most 400 words with path:line or evidence-id citations. Its trace is a child span linked to the parent run. run_tests(selector): a subagent (or a plain function; decide which and say why) that returns only failing test ids and the first lines of each error. Hierarchical budgets: children reserve from the parent's remaining budget, unused reserve returns, and depth is capped at 2 (sketch below). A planner/executor variant: the planner emits a JSON plan of steps (goal, files, check); the executor runs the loop per step and replans after a failed check. Fan-out on T17: one fixer subagent per symptom, each in its own git worktree; the parent merges with git apply --3way and runs the full suite. A handoff toy: a transfer_to_reviewer tool that swaps rig's system prompt and tools and keeps a filtered history. Compare it with a reviewer called as a tool. rig ask --deep: planner, three parallel researchers running Week 10's pipeline, a writer that synthesizes from evidence ids, and a fresh-context citation reviewer. A search_evals harness for rig: subclass BaseHarness so run() calls rig ask --deep, then run 50-task subsets of BrowseComp and DeepSearchQA with --limit. Its graders call OpenAI models, so budget for that key, and treat Perplexity's published full-suite scores as context, not as a target your subset can match. # a sketch of hierarchical budgets; the parent's budget is the only one the user sees\ndef run_subagent(parent, task: str, tool_names: list[str], max_usd: float, max_steps: int = 15):\n    if parent.depth >= 2:\n        raise ToolError(\"Subagent depth limit reached; do this step yourself.\")\n    reserve = parent.budget.reserve(usd=min(max_usd, 0.5 * parent.budget.remaining_usd()), steps=max_steps)\n    try:\n        result = run_agent(task, tools=parent.tools.subset(tool_names), budget=reserve,\n                           depth=parent.depth + 1, trace=parent.trace.child(task))\n    finally:\n        parent.budget.settle(reserve)    # unused reserve returns to the parent\n    return result.final[:2000]           # findings and evidence ids, never the child's transcript Project increment rig v0.11: explore, test summarization, hierarchical budgets, planner and fan-out modes behind flags, and rig ask --deep. Every mode runs on the same eval sets and on search_evals subsets, so they can be compared on quality and dollars per correct answer. Read openai/swarm, swarm/core.py (292 lines) and swarm/types.py (41). Read run (231), handle_tool_calls (89) and handle_function_result (71): if a tool returns an Agent, the active agent changes, and that is the whole handoff mechanism. Swarm is archived as an educational project and superseded by the Agents SDK; read it as the specification of the idea. openai/openai-agents-python at v0.23.1, which is what Swarm's idea becomes in production. It is also your Week 4 corpus, so use rig's retrieve on it. Read src/agents/handoffs/__init__.py (HandoffInputData at 71, Handoff at 126, handoff at 229), handoffs/history.py, and Agent.as_tool in src/agents/agent.py (606). Then, in src/agents/run_internal/turn_resolution.py (3,738 lines, so read selectively): process_model_response (2799), execute_tools_and_side_effects (795), execute_handoffs (529) and get_single_step_result_from_response (3657). Note resolve_interrupted_turn (1145) for Week 15. perplexityai/search_evals at cab4c5d: Perplexity's open-source runner for deep-research benchmarks (BrowseComp, DeepSearchQA, HLE's retrieval subset, WideSearch), with resumable runs, cost accounting and per-task traces. Read search_evals/harnesses/base.py (67 lines: BaseHarness at 36, run at 67), runner.py (EvalRunner.run at 65, _run_task at 95) and suites/graders.py (DeepResearchGrader.grade at 93). Optional essay: Anthropic's write-up of how its multi-agent research system was built, which is candid about token cost and coordination failures. Trace these paths: Swarm: run → get_chat_completion (the active agent's instructions and functions) → handle_tool_calls → handle_function_result (an Agent result sets the new active agent) → the loop continues with the new agent and the same history. Agents SDK: a turn's model response → process_model_response (classifies output items into tool calls, handoffs and final output) → execute_tools_and_side_effects → execute_handoffs (applies the input filter to history and switches agent) → get_single_step_result_from_response decides between final output, handoff and run again. search_evals: CLI → EvalRunner.run → _run_task per task (attempt directories, retries) → your harness's run → the suite's grader → summary with cost. You should be able to answer In Swarm, what exactly changes in the next request after a handoff, and what stays the same? Can answer What does a handoff input filter receive and return, and why do production systems need one? Can answer How does Agent.as_tool differ from a handoff in who owns the conversation afterwards? Can answer Where does the Agents SDK enforce its maximum number of turns, and what happens when it trips? Can answer Why should researchers return evidence ids rather than prose summaries? Can answer In your fan-out run on T17, where were tokens spent: the subagents' exploration or the parent's coordination? Can answer Which information did your explore subagent lose that the parent later needed? How did you detect it? Can answer On your search_evals subset, where did deep mode gain, and what did each extra point cost? Can answer Experiments Single agent against single agent with explore, planner/executor and fan-out on T01 to T23. Plot pass rate against dollars per solved task. Vary the explore report limit (100, 400, 1,500 words) and measure how often the parent re-reads what the subagent already reported. A reviewer as a fresh-context subagent against self-review in the same context, on T10 and T11 (where the visible tests pass with the bug). Let two fan-out workers touch the same file and confirm the merge step detects the conflict rather than silently picking one. Four research architectures on R01–R30 and a 50-task search_evals subset, measuring answer quality, evidence recall, citation precision, latency, tokens, cost per correct answer, and parent re-reads caused by information lost at the boundary: Mode Hypothesis Single agent Strong baseline; lowest coordination cost Manager and one researcher Context isolation with little overhead Three parallel researchers Broader evidence and lower wall time when the question decomposes Researchers and an independent reviewer Fresh-context verification catches synthesis and citation errors Production lens Budgets are hierarchical. A child cannot spend more than the parent has left, and the root's budget is the only one the user sees. Cancellation propagates down the tree; orphaned children are a cost leak. Idempotency across agents: two workers must not both run the same side effect. Give mutating work an owner. Tracing: parent and child spans share a trace id, so one query shows the whole tree and its cost. Rate limits become the real limit on fan-out; queue rather than spawn. Not yet Agent-to-agent network protocols, large \"crew\" or role-play frameworks, debate setups, and self-improving agent societies. They are compositions of the loop; judge each by your eval numbers, not its diagram. Checkpoint You can implement a handoff and an agent-as-tool in rig in under an hour each, and explain the trade-off with your own numbers. You have one multi-agent mode that beats the single agent on some task category at an acceptable cost, or a documented result showing none did. rig runs on a search_evals subset end to end, and one trace query shows the full agent tree for any run with per-node cost.", "tasks": 24}, {"id": "w12", "group": "Weeks", "title": "Week 12: a Claude-style workbench", "short": "Week 12", "html": "<p>A workbench agent is Week 1's loop with a bigger environment: a per-user workspace where it reads files, runs code and produces artifacts someone else can audit. Meta's Muse gives each user a private virtual machine; this week you build the small version, plus the lineage that makes its outputs trustworthy.</p>\n<h2 id=\"w12-concepts\">Concepts</h2>\n<ul>\n<li><strong>The workspace boundary.</strong> The agent talks to its workspace through a narrow interface (run a command, read, write, upload, download, diff). Local process, container or remote VM: the agent should not be able to tell.</li>\n<li><strong>Per-user isolation and its economics.</strong> One VM or container per user means cold starts, idle pause and resume, snapshots and quotas. Containers share a kernel; VMs don't.</li>\n<li><strong>Code is the analysis tool.</strong> The model writes Python, runs it and reads the result. Numbers in a report come from executed code, not from the model's head.</li>\n<li><strong>Artifact lineage.</strong> Every artifact records its inputs (by hash), the exact code that produced it, and the run and step. An artifact without lineage is a claim without a citation.</li>\n<li><strong>Silent numeric errors</strong> (a wrong join, mismatched units, an off-by-one quarter) are the dominant failure. Independent recomputation and assertions inside generated code catch them.</li>\n<li><strong>Ingestion is most of RAG.</strong> PDFs, slides and spreadsheets arrive as layout, not text: reading order, tables, headers, scanned pages. Parse them into a structured document first, chunk along the structure (sections, tables kept whole) to a token budget, and prefix each chunk with its context: the heading path, or a short model-written note on where it sits in the document. Anthropic's <a href=\"https://www.anthropic.com/engineering/contextual-retrieval\" rel=\"noopener\" target=\"_blank\">contextual retrieval</a> write-up reports that a 50-to-100-token context per chunk cut top-20 retrieval failures by 35% with embeddings alone, by 49% with contextual BM25 added, and by 67% with reranking, at about $1 per million document tokens with the document cached as the prompt prefix.</li>\n<li><strong>Confirmation by risk.</strong> In OpenHands a pluggable security analyzer rates each pending action (one option reads a risk label the model attaches to its own tool call; others match patterns), and a confirmation policy decides which ratings need the user. The analyzers live in the SDK's security package. Compare that with Week 9's grants: who is trusted to decide the risk?</li>\n</ul>\n<h2 id=\"w12-day-by-day\">Day by day</h2>\n<p>The week's real test is a single planted question — why did revenue fall? — answered with executed code and an audit trail, not a confident guess.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1–1.5 h</td>\n<td>Read <strong>Concepts</strong>; run three OpenHands examples</td>\n<td>A note on the workspace boundary, artifact lineage, and what confirmation-by-risk trusts</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2–4 h</td>\n<td>Build steps 1-2: the workspace protocol, local and remote; the <code>python</code> tool</td>\n<td>The same agent code runs code in a local container and in one behind an HTTP API</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2–4 h</td>\n<td>Build steps 3-4: the artifact store with lineage; the fixture folder and task</td>\n<td><code>sales.csv</code>, <code>marketing.csv</code>, <code>earnings.pdf</code> built with a planted cause; the task runs end to end once</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2–2.5 h</td>\n<td>Build step 5: eval assertions W01-W10; read and trace the OpenHands agent/workspace path</td>\n<td>Computed values, sources, artifacts and the planted cause all check automatically</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5–2 h</td>\n<td>Run experiments 1-3</td>\n<td>Numbers on what the <code>python</code> tool and recomputation actually catch</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3–4 h</td>\n<td>Build steps 6-7: <code>rig audit</code>; ingestion with Docling; read docling-core's chunkers</td>\n<td>An artifact's lineage replays in a fresh workspace; uploaded PDFs are chunked and searchable</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2–3 h</td>\n<td>Run remaining experiments; checkpoint</td>\n<td>The revenue task solved with a traceable report; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w12-day-by-day-mon\">Monday — the workspace boundary and lineage, before you build either.</h3>\n<p>This week's agent is still Week 1's loop; what's new is the environment around it and the paper trail its outputs leave. Today you see both ideas working in someone else's finished system before building your own versions.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> in full, especially the workspace-boundary, artifact-lineage and silent-numeric-errors bullets.</li>\n<li>Run <code>examples/01_standalone_sdk/01_hello_world.py</code>, <code>04_confirmation_mode_example.py</code> and <code>09_pause_example.py</code> from <strong>Read</strong>'s OpenHands SDK, to see the workspace boundary, confirmation-by-risk and pause working before you design your own.</li>\n<li>Write a half-page note: what crosses your <code>Workspace</code> protocol's boundary, and what an artifact needs besides a file path to be trustworthy.</li>\n</ol>\n<h3 id=\"w12-day-by-day-tue\">Tuesday — one interface, two workspaces.</h3>\n<p>Today's build makes \"local container\" and \"remote machine\" the same thing from the agent's point of view: one <code>Workspace</code> protocol, two implementations, no change to the agent code that calls it. The <code>python</code> tool is what turns that workspace into an actual analysis engine rather than a sandbox that just runs <code>bash</code>.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: the <code>Workspace</code> protocol (<code>execute</code>, <code>read</code>, <code>write</code>, <code>upload</code>, <code>download</code>, <code>diff</code>, <code>pause</code>, <code>resume</code>) over Week 1's local container, then the same container behind a small HTTP API on another machine.</li>\n<li>Implement <strong>Build</strong> step 2: a <code>python</code> tool that runs code in the workspace with a timeout and returns stdout, stderr and any new files.</li>\n<li>Run the same script against both implementations and confirm the agent-facing code didn't change.</li>\n</ol>\n<h3 id=\"w12-day-by-day-wed\">Wednesday — lineage, and the question you'll spend the week answering.</h3>\n<p>Numbers in a report are only trustworthy if you can trace each one back to the code and inputs that produced it. Today you build that record, then construct the actual puzzle — three files engineered so revenue fell for a specific, plantable reason — that the rest of the week's eval, audit and ingestion work will all point at.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: the artifact store with lineage, per the <code>Artifact</code> dataclass given there — sha256, run id, step, the exact code, and input hashes.</li>\n<li>Implement <strong>Build</strong> step 4: the fixture folder (<code>sales.csv</code>, <code>marketing.csv</code>, <code>earnings.pdf</code>) with a planted cause, and run the revenue-decline task against it once by hand.</li>\n<li>Confirm every artifact the run produces records its lineage, not just its content.</li>\n</ol>\n<h3 id=\"w12-day-by-day-thu\">Thursday — grading the task, and how OpenHands does the same thing.</h3>\n<p>Today turns \"it looks right\" into assertions you can rerun, and you read the codebase that separates agent, tools and workspace more cleanly than most — including the exact mechanism that decided your own confirmation-by-risk question on Monday.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: eval assertions W01-W10 — computed values within tolerance, expected columns and sources used, artifacts exist and open, the chart exists, the report names the planted cause, the generated code re-executes to the same numbers.</li>\n<li>Read the OpenHands SDK entries in <strong>Read</strong>: <code>Agent.step</code>/<code>_step</code>, <code>_requires_user_confirmation</code>, <code>BaseWorkspace</code>, <code>LocalConversation</code>, the context-view invariants, and the long-lived terminal.</li>\n<li>Trace the path given there and compare <code>_requires_user_confirmation</code> against your own notes from Monday.</li>\n</ol>\n<h3 id=\"w12-day-by-day-fri\">Friday — find out what the python tool and recomputation are actually worth.</h3>\n<p>No new build today. You already have a task with a known right answer; now you take pieces away and measure what breaks.</p>\n<p>Run <strong>Experiments</strong> 1-3: the revenue task with and without the <code>python</code> tool; three planted silent errors (wrong join, mismatched units, off-by-one quarter) with and without independent recomputation; a long-lived terminal against one-shot <code>bash</code> on a multi-step data task. Write down which errors recomputation actually caught, not just whether the final report looked right.</p>\n<h3 id=\"w12-day-by-day-sat\">Saturday — auditing a run, and turning documents into something searchable.</h3>\n<p>Today closes the lineage story — anyone can replay an artifact's exact history in a clean workspace — and opens a new one: PDFs and spreadsheets arrive as layout, not text, and today's ingestion pipeline is what turns them into chunks worth retrieving.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 6: <code>rig audit &lt;artifact&gt;</code> — rerun its lineage in a fresh workspace and diff the result.</li>\n<li>Implement <strong>Build</strong> step 7: <code>rig/ingest/</code> — Docling parsing into a structured document, its hybrid chunker (tables whole), context added per chunk (heading path, then a model-written note), indexed into Week 4's Postgres tables, re-ingested only when hash or version changes.</li>\n<li>Read the docling-core entries in <strong>Read</strong>: <code>HybridChunker</code>, <code>TripletTableSerializer</code>, and <code>contextualize</code>.</li>\n</ol>\n<h3 id=\"w12-day-by-day-sun\">Sunday — remote latency, chunking quality, then checkpoint.</h3>\n<p>The last two experiments check costs and trade-offs you've been assuming all week: how much the remote workspace costs in latency, and how much structure-aware chunking with context actually buys you over naive text splitting.</p>\n<ol type=\"1\">\n<li>Run <strong>Experiment</strong> 4: tool-call latency for the remote workspace against the local one.</li>\n<li>Run <strong>Experiment</strong> 5: questions about <code>earnings.pdf</code> from fixed-size chunks, structure-aware chunks, and structure-aware chunks with model-written context — recall@10, answer correctness, one-time ingestion cost.</li>\n<li>Answer <strong>You should be able to answer</strong>, then attempt <strong>Checkpoint</strong>: the revenue task solved, lineage traceable with <code>rig audit</code>, the same agent code running against both workspaces.</li>\n</ol>\n<h2 id=\"w12-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w12.build.1\"><input aria-label=\"Done\" data-id=\"w12.build.1\" id=\"c-w12-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/workspace/</code>: a <code>Workspace</code> protocol (<code>execute</code>, <code>read</code>, <code>write</code>, <code>upload</code>, <code>download</code>, <code>diff</code>, <code>pause</code>, <code>resume</code>) with two implementations: Week 1's local container, and the same container behind a small HTTP API on another machine.</div></li>\n<li class=\"task do\" data-id=\"w12.build.2\"><input aria-label=\"Done\" data-id=\"w12.build.2\" id=\"c-w12-build-2\" type=\"checkbox\"/><div class=\"task-body\">A <code>python</code> tool that runs code in the workspace with a timeout and returns stdout, stderr and any new files.</div></li>\n<li class=\"task do\" data-id=\"w12.build.3\"><input aria-label=\"Done\" data-id=\"w12.build.3\" id=\"c-w12-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/artifacts/</code>: an artifact store with lineage (below).</div></li>\n<li class=\"task do\" data-id=\"w12.build.4\"><input aria-label=\"Done\" data-id=\"w12.build.4\" id=\"c-w12-build-4\" type=\"checkbox\"/><div class=\"task-body\">The practical project: a fixture folder with <code>sales.csv</code>, <code>marketing.csv</code> and <code>earnings.pdf</code>, built so revenue fell last quarter for a cause you plant (say, a price change in one region). The task: \"Determine why revenue declined last quarter. Validate the hypothesis quantitatively. Produce a chart and a written report.\"</div></li>\n<li class=\"task do\" data-id=\"w12.build.5\"><input aria-label=\"Done\" data-id=\"w12.build.5\" id=\"c-w12-build-5\" type=\"checkbox\"/><div class=\"task-body\">Eval assertions W01–W10: computed values within tolerance, the expected columns and sources used, artifacts exist and open, a chart was produced, the report names the planted cause, and the generated code re-executes to the same numbers.</div></li>\n<li class=\"task do\" data-id=\"w12.build.6\"><input aria-label=\"Done\" data-id=\"w12.build.6\" id=\"c-w12-build-6\" type=\"checkbox\"/><div class=\"task-body\"><code>rig audit &lt;artifact&gt;</code>: re-runs an artifact's lineage in a fresh workspace and diffs the result.</div></li>\n<li class=\"task do\" data-id=\"w12.build.7\"><input aria-label=\"Done\" data-id=\"w12.build.7\" id=\"c-w12-build-7\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/ingest/</code>: parse uploaded PDF and DOCX files with Docling into a structured document, chunk them with its hybrid chunker (tables whole), add context (the heading path, then a model-written note with the whole document as a cached prefix), and index the chunks into Week 4's Postgres tables. Re-ingest a file only when its hash, the parser version or the chunker version changes.</div></li>\n</ol>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">@dataclass(frozen=True)\nclass Artifact:\n    id: str\n    path: str                  # inside the workspace\n    sha256: str\n    mime_type: str\n    run_id: str\n    step: int                  # trace step that produced it\n    code_sha256: str           # the exact code cell that wrote it\n    inputs: dict[str, str]     # input path -&gt; sha256 when it was read\n    created_at: datetime</code></pre></div>\n<h2 id=\"w12-project-increment\">Project increment</h2>\n<p>rig v0.12: a <code>work</code> mode with a workspace, a <code>python</code> tool and artifacts with lineage, plus <code>rig audit</code>. Uploaded documents are parsed, chunked and searchable.</p>\n<h2 id=\"w12-read-openhands-software-agent-sdk\">Read: OpenHands Software Agent SDK</h2>\n<p><a href=\"https://github.com/OpenHands/software-agent-sdk\" rel=\"noopener\" target=\"_blank\">OpenHands/software-agent-sdk</a> at <code>69e2688</code> separates agent logic, tool execution, context and the workspace boundary more cleanly than most agent codebases.</p>\n<ol type=\"1\">\n<li>Run a few of <code>examples/01_standalone_sdk/</code> first: <code>01_hello_world.py</code>, <code>04_confirmation_mode_example.py</code>, <code>09_pause_example.py</code>, <code>10_persistence.py</code>, <code>14_context_condenser.py</code> and <code>32_configurable_security_policy.py</code>.</li>\n<li><code>openhands-sdk/openhands/sdk/agent/agent.py</code> (1,622 lines): <code>Agent.init_state</code> (497), <code>step</code> (693) and <code>_step</code> (706), <code>_requires_user_confirmation</code> (1130) and <code>_extract_security_risk</code> (1173).</li>\n<li><code>openhands-sdk/openhands/sdk/workspace/base.py</code> (282 lines): <code>BaseWorkspace.execute_command</code> (172), <code>file_upload</code> (195), <code>file_download</code> (215), <code>git_changes</code> (235), <code>git_diff</code> (249), <code>pause</code> (262) and <code>resume</code> (273). Then one implementation under <code>openhands-workspace/openhands/workspace/docker/</code>.</li>\n<li><code>openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py</code>: <code>LocalConversation.send_message</code> (1807), <code>run</code> (1902), <code>_run</code> (1917) and <code>pause</code> (2719).</li>\n<li><code>openhands-sdk/openhands/sdk/context/view/properties/</code>: <code>tool_call_matching.py</code> (95 lines), <code>batch_atomicity.py</code> (88) and <code>tool_loop_atomicity.py</code> (126). These are the invariants a condensed context must keep, Week 3's safe cut points written as code. Then <code>context/condenser/llm_summarizing_condenser.py</code>: <code>get_condensation_reasons</code> (136) and <code>_get_forgotten_events</code> (278).</li>\n<li><code>openhands-tools/openhands/tools/terminal/</code>: <code>impl.py</code> and <code>terminal/tmux_terminal.py</code>, a long-lived shell, against rig's one-shot <code>bash</code>.</li>\n</ol>\n<p><strong>Also read <a href=\"https://github.com/docling-project/docling-core\" rel=\"noopener\" target=\"_blank\">docling-project/docling-core</a></strong> at <code>v2.101.1</code>, the document model and chunkers behind <a href=\"https://github.com/docling-project/docling\" rel=\"noopener\" target=\"_blank\">Docling</a>. In <code>docling_core/transforms/chunker/</code>: <code>hybrid_chunker.py</code> (413 lines): <code>HybridChunker</code> (55), <code>_split_by_doc_items</code> (161), <code>_merge_chunks_with_matching_metadata</code> (344) and <code>chunk</code> (390); <code>hierarchical_chunker.py</code>: <code>TripletTableSerializer</code> (46), which turns a table into text a retriever can match; <code>base.py</code>: <code>contextualize</code> (82), the heading-path version of contextual retrieval.</p>\n<p><strong>Trace this path:</strong> <code>LocalConversation.send_message</code> → <code>run</code> → <code>_run</code> loop → <code>Agent.step</code> → <code>_step</code> (condensed view, model call, actions) → <code>_requires_user_confirmation</code> → the tool executes in the workspace (<code>execute_command</code>) → observation events → persisted conversation state → next step or pause.</p>\n<h2 id=\"w12-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w12.q.1\"><input aria-label=\"I can answer this\" data-id=\"w12.q.1\" id=\"c-w12-q-1\" type=\"checkbox\"/><div class=\"task-body\">What exactly crosses OpenHands' workspace boundary, and what changes when the workspace moves to another machine?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.2\"><input aria-label=\"I can answer this\" data-id=\"w12.q.2\" id=\"c-w12-q-2\" type=\"checkbox\"/><div class=\"task-body\">Where does OpenHands decide an action needs confirmation, and where does the risk label come from? What does that design trust?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.3\"><input aria-label=\"I can answer this\" data-id=\"w12.q.3\" id=\"c-w12-q-3\" type=\"checkbox\"/><div class=\"task-body\">Which invariants do the view properties enforce, and which Week 3 bug does each one prevent?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.4\"><input aria-label=\"I can answer this\" data-id=\"w12.q.4\" id=\"c-w12-q-4\" type=\"checkbox\"/><div class=\"task-body\">What does <code>pause</code> do to a running conversation and to its workspace?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.5\"><input aria-label=\"I can answer this\" data-id=\"w12.q.5\" id=\"c-w12-q-5\" type=\"checkbox\"/><div class=\"task-body\">Why must every number in a report come from executed code, and how do you check that it did?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.6\"><input aria-label=\"I can answer this\" data-id=\"w12.q.6\" id=\"c-w12-q-6\" type=\"checkbox\"/><div class=\"task-body\">What does it cost to keep a per-user VM warm, and when would you pause or snapshot it instead?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w12.q.7\"><input aria-label=\"I can answer this\" data-id=\"w12.q.7\" id=\"c-w12-q-7\" type=\"checkbox\"/><div class=\"task-body\">Why chunk along a document's structure instead of fixed windows, and what does a chunk lose when its heading is cut away?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w12-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w12.exp.1\"><input aria-label=\"Done\" data-id=\"w12.exp.1\" id=\"c-w12-exp-1\" type=\"checkbox\"/><div class=\"task-body\">The revenue task with and without the <code>python</code> tool: correctness of the stated cause and of the numbers.</div></li>\n<li class=\"task do\" data-id=\"w12.exp.2\"><input aria-label=\"Done\" data-id=\"w12.exp.2\" id=\"c-w12-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Plant three silent errors (a wrong join, mismatched units, an off-by-one quarter) and measure how often rig catches each, with and without an independent recomputation step.</div></li>\n<li class=\"task do\" data-id=\"w12.exp.3\"><input aria-label=\"Done\" data-id=\"w12.exp.3\" id=\"c-w12-exp-3\" type=\"checkbox\"/><div class=\"task-body\">A long-lived terminal against one-shot <code>bash</code> on a multi-step data task.</div></li>\n<li class=\"task do\" data-id=\"w12.exp.4\"><input aria-label=\"Done\" data-id=\"w12.exp.4\" id=\"c-w12-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Tool-call latency for the remote workspace against the local one.</div></li>\n<li class=\"task do\" data-id=\"w12.exp.5\"><input aria-label=\"Done\" data-id=\"w12.exp.5\" id=\"c-w12-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Questions about <code>earnings.pdf</code> answered from fixed-size text chunks, from structure-aware chunks, and from structure-aware chunks with model-written context: recall@10, answer correctness and the one-time ingestion cost.</div></li>\n</ol>\n<h2 id=\"w12-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Per-user isolation costs money.</strong> Idle timeouts, snapshot and restore, and quotas on CPU, memory, disk and egress decide the unit economics.</li>\n<li><strong>Data lifecycle.</strong> User files live in the workspace; deleting a user deletes the VM and every snapshot.</li>\n<li><strong>Confidential computing.</strong> Meta has said it is building a version of Muse's workspace that Meta itself can't see into. Know what trusted execution environments hide, and what they don't.</li>\n<li><strong>Ingestion is a pipeline.</strong> Queue it, version the parser and the chunker, and re-index when either changes.</li>\n<li><strong>Provenance is an audit requirement</strong> wherever numbers drive decisions: finance, health, compliance.</li>\n</ul>\n<h2 id=\"w12-not-yet\">Not yet</h2>\n<p>Notebook interfaces, collaborative editing, GPU workspaces and enterprise data connectors.</p>\n<h2 id=\"w12-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w12.check.1\"><input aria-label=\"Done\" data-id=\"w12.check.1\" id=\"c-w12-check-1\" type=\"checkbox\"/><div class=\"task-body\">rig solves the revenue task, and another engineer can trace every number in the report back to input files, code and trace steps with <code>rig audit</code>.</div></li>\n<li class=\"task do\" data-id=\"w12.check.2\"><input aria-label=\"Done\" data-id=\"w12.check.2\" id=\"c-w12-check-2\" type=\"checkbox\"/><div class=\"task-body\">Your workspace runs locally and remotely behind the same interface, with no change to the agent.</div></li>\n<li class=\"task do\" data-id=\"w12.check.3\"><input aria-label=\"Done\" data-id=\"w12.check.3\" id=\"c-w12-check-3\" type=\"checkbox\"/><div class=\"task-body\">You can explain OpenHands' confirmation path and its context-view invariants with line references.</div></li>\n</ul>\n", "toc": [["w12-concepts", "Concepts", []], ["w12-day-by-day", "Day by day", [["w12-day-by-day-mon", "Monday — the workspace boundary and lineage, before you build either."], ["w12-day-by-day-tue", "Tuesday — one interface, two workspaces."], ["w12-day-by-day-wed", "Wednesday — lineage, and the question you'll spend the week answering."], ["w12-day-by-day-thu", "Thursday — grading the task, and how OpenHands does the same thing."], ["w12-day-by-day-fri", "Friday — find out what the python tool and recomputation are actually worth."], ["w12-day-by-day-sat", "Saturday — auditing a run, and turning documents into something searchable."], ["w12-day-by-day-sun", "Sunday — remote latency, chunking quality, then checkpoint."]]], ["w12-build", "Build", []], ["w12-project-increment", "Project increment", []], ["w12-read-openhands-software-agent-sdk", "Read: OpenHands Software Agent SDK", []], ["w12-you-should-be-able-to-answer", "You should be able to answer", []], ["w12-experiments", "Experiments", []], ["w12-production-lens", "Production lens", []], ["w12-not-yet", "Not yet", []], ["w12-checkpoint", "Checkpoint", []]], "text": "A workbench agent is Week 1's loop with a bigger environment: a per-user workspace where it reads files, runs code and produces artifacts someone else can audit. Meta's Muse gives each user a private virtual machine; this week you build the small version, plus the lineage that makes its outputs trustworthy. Concepts The workspace boundary. The agent talks to its workspace through a narrow interface (run a command, read, write, upload, download, diff). Local process, container or remote VM: the agent should not be able to tell. Per-user isolation and its economics. One VM or container per user means cold starts, idle pause and resume, snapshots and quotas. Containers share a kernel; VMs don't. Code is the analysis tool. The model writes Python, runs it and reads the result. Numbers in a report come from executed code, not from the model's head. Artifact lineage. Every artifact records its inputs (by hash), the exact code that produced it, and the run and step. An artifact without lineage is a claim without a citation. Silent numeric errors (a wrong join, mismatched units, an off-by-one quarter) are the dominant failure. Independent recomputation and assertions inside generated code catch them. Ingestion is most of RAG. PDFs, slides and spreadsheets arrive as layout, not text: reading order, tables, headers, scanned pages. Parse them into a structured document first, chunk along the structure (sections, tables kept whole) to a token budget, and prefix each chunk with its context: the heading path, or a short model-written note on where it sits in the document. Anthropic's contextual retrieval write-up reports that a 50-to-100-token context per chunk cut top-20 retrieval failures by 35% with embeddings alone, by 49% with contextual BM25 added, and by 67% with reranking, at about $1 per million document tokens with the document cached as the prompt prefix. Confirmation by risk. In OpenHands a pluggable security analyzer rates each pending action (one option reads a risk label the model attaches to its own tool call; others match patterns), and a confirmation policy decides which ratings need the user. The analyzers live in the SDK's security package. Compare that with Week 9's grants: who is trusted to decide the risk? Day by day The week's real test is a single planted question — why did revenue fall? — answered with executed code and an audit trail, not a confident guess. Day Time Do Working by end of day Mon 1–1.5 h Read Concepts; run three OpenHands examples A note on the workspace boundary, artifact lineage, and what confirmation-by-risk trusts Tue 2–4 h Build steps 1-2: the workspace protocol, local and remote; the python tool The same agent code runs code in a local container and in one behind an HTTP API Wed 2–4 h Build steps 3-4: the artifact store with lineage; the fixture folder and task sales.csv, marketing.csv, earnings.pdf built with a planted cause; the task runs end to end once Thu 2–2.5 h Build step 5: eval assertions W01-W10; read and trace the OpenHands agent/workspace path Computed values, sources, artifacts and the planted cause all check automatically Fri 1.5–2 h Run experiments 1-3 Numbers on what the python tool and recomputation actually catch Sat 3–4 h Build steps 6-7: rig audit; ingestion with Docling; read docling-core's chunkers An artifact's lineage replays in a fresh workspace; uploaded PDFs are chunked and searchable Sun 2–3 h Run remaining experiments; checkpoint The revenue task solved with a traceable report; checkpoint passed or a redo list Monday — the workspace boundary and lineage, before you build either. This week's agent is still Week 1's loop; what's new is the environment around it and the paper trail its outputs leave. Today you see both ideas working in someone else's finished system before building your own versions. Read Concepts in full, especially the workspace-boundary, artifact-lineage and silent-numeric-errors bullets. Run examples/01_standalone_sdk/01_hello_world.py, 04_confirmation_mode_example.py and 09_pause_example.py from Read's OpenHands SDK, to see the workspace boundary, confirmation-by-risk and pause working before you design your own. Write a half-page note: what crosses your Workspace protocol's boundary, and what an artifact needs besides a file path to be trustworthy. Tuesday — one interface, two workspaces. Today's build makes \"local container\" and \"remote machine\" the same thing from the agent's point of view: one Workspace protocol, two implementations, no change to the agent code that calls it. The python tool is what turns that workspace into an actual analysis engine rather than a sandbox that just runs bash. Implement Build step 1: the Workspace protocol (execute, read, write, upload, download, diff, pause, resume) over Week 1's local container, then the same container behind a small HTTP API on another machine. Implement Build step 2: a python tool that runs code in the workspace with a timeout and returns stdout, stderr and any new files. Run the same script against both implementations and confirm the agent-facing code didn't change. Wednesday — lineage, and the question you'll spend the week answering. Numbers in a report are only trustworthy if you can trace each one back to the code and inputs that produced it. Today you build that record, then construct the actual puzzle — three files engineered so revenue fell for a specific, plantable reason — that the rest of the week's eval, audit and ingestion work will all point at. Implement Build step 3: the artifact store with lineage, per the Artifact dataclass given there — sha256, run id, step, the exact code, and input hashes. Implement Build step 4: the fixture folder (sales.csv, marketing.csv, earnings.pdf) with a planted cause, and run the revenue-decline task against it once by hand. Confirm every artifact the run produces records its lineage, not just its content. Thursday — grading the task, and how OpenHands does the same thing. Today turns \"it looks right\" into assertions you can rerun, and you read the codebase that separates agent, tools and workspace more cleanly than most — including the exact mechanism that decided your own confirmation-by-risk question on Monday. Implement Build step 5: eval assertions W01-W10 — computed values within tolerance, expected columns and sources used, artifacts exist and open, the chart exists, the report names the planted cause, the generated code re-executes to the same numbers. Read the OpenHands SDK entries in Read: Agent.step/_step, _requires_user_confirmation, BaseWorkspace, LocalConversation, the context-view invariants, and the long-lived terminal. Trace the path given there and compare _requires_user_confirmation against your own notes from Monday. Friday — find out what the python tool and recomputation are actually worth. No new build today. You already have a task with a known right answer; now you take pieces away and measure what breaks. Run Experiments 1-3: the revenue task with and without the python tool; three planted silent errors (wrong join, mismatched units, off-by-one quarter) with and without independent recomputation; a long-lived terminal against one-shot bash on a multi-step data task. Write down which errors recomputation actually caught, not just whether the final report looked right. Saturday — auditing a run, and turning documents into something searchable. Today closes the lineage story — anyone can replay an artifact's exact history in a clean workspace — and opens a new one: PDFs and spreadsheets arrive as layout, not text, and today's ingestion pipeline is what turns them into chunks worth retrieving. Implement Build step 6: rig audit <artifact> — rerun its lineage in a fresh workspace and diff the result. Implement Build step 7: rig/ingest/ — Docling parsing into a structured document, its hybrid chunker (tables whole), context added per chunk (heading path, then a model-written note), indexed into Week 4's Postgres tables, re-ingested only when hash or version changes. Read the docling-core entries in Read: HybridChunker, TripletTableSerializer, and contextualize. Sunday — remote latency, chunking quality, then checkpoint. The last two experiments check costs and trade-offs you've been assuming all week: how much the remote workspace costs in latency, and how much structure-aware chunking with context actually buys you over naive text splitting. Run Experiment 4: tool-call latency for the remote workspace against the local one. Run Experiment 5: questions about earnings.pdf from fixed-size chunks, structure-aware chunks, and structure-aware chunks with model-written context — recall@10, answer correctness, one-time ingestion cost. Answer You should be able to answer, then attempt Checkpoint: the revenue task solved, lineage traceable with rig audit, the same agent code running against both workspaces. Build rig/workspace/: a Workspace protocol (execute, read, write, upload, download, diff, pause, resume) with two implementations: Week 1's local container, and the same container behind a small HTTP API on another machine. A python tool that runs code in the workspace with a timeout and returns stdout, stderr and any new files. rig/artifacts/: an artifact store with lineage (below). The practical project: a fixture folder with sales.csv, marketing.csv and earnings.pdf, built so revenue fell last quarter for a cause you plant (say, a price change in one region). The task: \"Determine why revenue declined last quarter. Validate the hypothesis quantitatively. Produce a chart and a written report.\" Eval assertions W01–W10: computed values within tolerance, the expected columns and sources used, artifacts exist and open, a chart was produced, the report names the planted cause, and the generated code re-executes to the same numbers. rig audit <artifact>: re-runs an artifact's lineage in a fresh workspace and diffs the result. rig/ingest/: parse uploaded PDF and DOCX files with Docling into a structured document, chunk them with its hybrid chunker (tables whole), add context (the heading path, then a model-written note with the whole document as a cached prefix), and index the chunks into Week 4's Postgres tables. Re-ingest a file only when its hash, the parser version or the chunker version changes. @dataclass(frozen=True)\nclass Artifact:\n    id: str\n    path: str                  # inside the workspace\n    sha256: str\n    mime_type: str\n    run_id: str\n    step: int                  # trace step that produced it\n    code_sha256: str           # the exact code cell that wrote it\n    inputs: dict[str, str]     # input path -> sha256 when it was read\n    created_at: datetime Project increment rig v0.12: a work mode with a workspace, a python tool and artifacts with lineage, plus rig audit. Uploaded documents are parsed, chunked and searchable. Read: OpenHands Software Agent SDK OpenHands/software-agent-sdk at 69e2688 separates agent logic, tool execution, context and the workspace boundary more cleanly than most agent codebases. Run a few of examples/01_standalone_sdk/ first: 01_hello_world.py, 04_confirmation_mode_example.py, 09_pause_example.py, 10_persistence.py, 14_context_condenser.py and 32_configurable_security_policy.py. openhands-sdk/openhands/sdk/agent/agent.py (1,622 lines): Agent.init_state (497), step (693) and _step (706), _requires_user_confirmation (1130) and _extract_security_risk (1173). openhands-sdk/openhands/sdk/workspace/base.py (282 lines): BaseWorkspace.execute_command (172), file_upload (195), file_download (215), git_changes (235), git_diff (249), pause (262) and resume (273). Then one implementation under openhands-workspace/openhands/workspace/docker/. openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py: LocalConversation.send_message (1807), run (1902), _run (1917) and pause (2719). openhands-sdk/openhands/sdk/context/view/properties/: tool_call_matching.py (95 lines), batch_atomicity.py (88) and tool_loop_atomicity.py (126). These are the invariants a condensed context must keep, Week 3's safe cut points written as code. Then context/condenser/llm_summarizing_condenser.py: get_condensation_reasons (136) and _get_forgotten_events (278). openhands-tools/openhands/tools/terminal/: impl.py and terminal/tmux_terminal.py, a long-lived shell, against rig's one-shot bash. Also read docling-project/docling-core at v2.101.1, the document model and chunkers behind Docling. In docling_core/transforms/chunker/: hybrid_chunker.py (413 lines): HybridChunker (55), _split_by_doc_items (161), _merge_chunks_with_matching_metadata (344) and chunk (390); hierarchical_chunker.py: TripletTableSerializer (46), which turns a table into text a retriever can match; base.py: contextualize (82), the heading-path version of contextual retrieval. Trace this path:LocalConversation.send_message → run → _run loop → Agent.step → _step (condensed view, model call, actions) → _requires_user_confirmation → the tool executes in the workspace (execute_command) → observation events → persisted conversation state → next step or pause. You should be able to answer What exactly crosses OpenHands' workspace boundary, and what changes when the workspace moves to another machine? Can answer Where does OpenHands decide an action needs confirmation, and where does the risk label come from? What does that design trust? Can answer Which invariants do the view properties enforce, and which Week 3 bug does each one prevent? Can answer What does pause do to a running conversation and to its workspace? Can answer Why must every number in a report come from executed code, and how do you check that it did? Can answer What does it cost to keep a per-user VM warm, and when would you pause or snapshot it instead? Can answer Why chunk along a document's structure instead of fixed windows, and what does a chunk lose when its heading is cut away? Can answer Experiments The revenue task with and without the python tool: correctness of the stated cause and of the numbers. Plant three silent errors (a wrong join, mismatched units, an off-by-one quarter) and measure how often rig catches each, with and without an independent recomputation step. A long-lived terminal against one-shot bash on a multi-step data task. Tool-call latency for the remote workspace against the local one. Questions about earnings.pdf answered from fixed-size text chunks, from structure-aware chunks, and from structure-aware chunks with model-written context: recall@10, answer correctness and the one-time ingestion cost. Production lens Per-user isolation costs money. Idle timeouts, snapshot and restore, and quotas on CPU, memory, disk and egress decide the unit economics. Data lifecycle. User files live in the workspace; deleting a user deletes the VM and every snapshot. Confidential computing. Meta has said it is building a version of Muse's workspace that Meta itself can't see into. Know what trusted execution environments hide, and what they don't. Ingestion is a pipeline. Queue it, version the parser and the chunker, and re-index when either changes. Provenance is an audit requirement wherever numbers drive decisions: finance, health, compliance. Not yet Notebook interfaces, collaborative editing, GPU workspaces and enterprise data connectors. Checkpoint rig solves the revenue task, and another engineer can trace every number in the report back to input files, code and trace steps with rig audit. Your workspace runs locally and remotely behind the same interface, with no change to the agent. You can explain OpenHands' confirmation path and its context-view invariants with line references.", "tasks": 22}, {"id": "w13", "group": "Weeks", "title": "Week 13: memory, personalization and connectors", "short": "Week 13", "html": "<p>Memory is a policy problem (what to store, retrieve, supersede, expire and redact) far more than a storage problem. Connectors are OAuth, incremental sync and rate limits. Together they make an agent personal, and they bring the two biggest new risks: wrong memories, and untrusted text arriving through your own inbox.</p>\n<h2 id=\"w13-concepts\">Concepts</h2>\n<ul>\n<li><strong>Four kinds of memory.</strong> Profile (stable facts and preferences), episodic (what
