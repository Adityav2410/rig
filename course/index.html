 requeue when a worker stops heartbeating. Run events reach the API process holding the stream through NOTIFY or Redis pub/sub. Per-user limits, checked before enqueueing: a sliding-window request limiter, at most two active runs per user, and a daily dollar budget read from Week 3's cost ledger. Refusals return 429 with Retry-After. Tenant-scoped retrieval and caches: every vector and full-text query filters by user_id with hnsw.iterative_scan on; Week 10's response and semantic caches are keyed by user, except an allowlisted public-web layer. Isolation suite U01–U12. Two users with planted secrets. Every API route, retrieval query, memory lookup, cache, artifact download and event stream is asked for the other user's data: forged ids in URLs, user A's conversation id in user B's request, a reused event-stream URL, and a shared document carrying a prompt injection that asks the agent for another user's memory. Target: zero cross-user reads. rig admin delete-user: a workflow over every store, then a checker that searches all of them for the user's id and planted strings. A load test: 50 simulated users with 3 tabs each, mixed research and work turns. Measure time to first token (p50 and p95), queue wait, runs per worker per minute, and what happens to everyone else when one user floods. These were tested on Postgres 16 with pgvector 0.8.7. A forgotten WHERE returns only the scoped user's rows, a forged insert is refused, and a query outside any scope errors. The claim query ran 200 jobs across 20 conversations on 8 concurrent workers with no double claims and never two running jobs for one conversation. @contextmanager\ndef user_scope(conn, user_id: UUID):\n    with conn.transaction():\n        # set_config(..., true) is SET LOCAL that accepts a bind parameter; it ends with the transaction\n        conn.execute(\"SELECT set_config('app.user_id', %s, true)\", (str(user_id),))\n        yield conn -- every per-user table: enable, force, one policy\nALTER TABLE messages ENABLE ROW LEVEL SECURITY;\nALTER TABLE messages FORCE ROW LEVEL SECURITY;          -- the table owner is checked too\nCREATE POLICY own_rows ON messages\n  USING      (user_id = current_setting('app.user_id', true)::uuid)\n  WITH CHECK (user_id = current_setting('app.user_id', true)::uuid);\n\n-- claim the next job: at most one running job per conversation, earliest first\nUPDATE jobs SET status = 'running', worker_id = %(worker)s, heartbeat_at = now()\nWHERE id = (\n  SELECT j.id FROM jobs j\n  WHERE j.status = 'queued'\n    AND NOT EXISTS (SELECT 1 FROM jobs o\n                    WHERE o.lock = j.lock\n                      AND (o.status = 'running' OR (o.status = 'queued' AND o.id < j.id)))\n  ORDER BY j.id\n  LIMIT 1\n  FOR UPDATE SKIP LOCKED)\nRETURNING id, lock; The o.id < j.id clause matters. Without it, two workers can each claim a different queued job for the same conversation in the same instant, because neither sees the other's uncommitted claim. With it, only the earliest queued job of a conversation is ever eligible, and SKIP LOCKED lets just one worker take it. Project increment rig v0.14 is a multi-user service: rig serve runs the API and N workers against Postgres, and the isolation suite runs in CI on every change. Read open-webui/open-webui at v0.11.4, a self-hosted, multi-user chat assistant with retrieval, memory and pluggable vector stores. The backend is Python. Read it as the production version of this week, and note where it enforces isolation in application code, where Build 2 puts it in the database. All paths are under backend/open_webui/. Identity: utils/auth.py (665 lines): create_token (232), decode_token (246), is_valid_token (276, revocation), revoke_user_tokens (349) and get_current_user (393). Conversations: models/chats.py: the Chat table (129) and its composite indexes on user_id; get_chat_by_id_and_user_id (1732), the ownership check used throughout routers/chats.py. models/chat_messages.py: ChatMessage (127, a tree through parent_id) and has_unfinished_assistant_by_chat_id (327), which tells the UI a run is still going. Vectors and tenants: retrieval/vector/dbs/pgvector.py (792 lines): DocumentChunk (73), _iterative_scan_setting (263), _ensure_text_search_index (277) and hybrid_search (579). Then compare qdrant.py, which creates one collection per name, with qdrant_multitenancy.py (362 lines), which maps every name onto a few shared collections with a tenant filter: _tenant_filter (39), _get_collection_and_tenant_id (100) and search (246). routers/memories.py shows the naming that ties it together: each user's memories live in user-memory-{user_id} (134). Many workers: socket/main.py: the Redis client manager (89) that lets any worker emit to any connection, SESSION_POOL (150), get_session_ids_by_user_id (344) and emit_to_users (356, one room per user). Limits and deletion: utils/rate_limit.py (114 lines): RateLimiter (8) and _is_limited_redis (79), a rolling window built from per-minute buckets. models/users.py: delete_user_by_id (847), and the route that calls it in routers/users.py (1043). procrastinate-org/procrastinate at 3.10.0, a Postgres-only job queue. procrastinate/sql/schema.sql (599 lines): procrastinate_fetch_job_v2 (210), whose lock rule is the one-run-per-conversation guarantee above; procrastinate_defer_jobs_v1 (118) and the partial unique index on queueing_lock (100), which drops duplicate enqueues; the pg_notify triggers (around 412); procrastinate_update_heartbeat_v1 (542) and procrastinate_prune_stalled_workers_v1 (553). pgvector's README at v0.8.7 (pinned in Appendix A): the \"Filtering\", \"Multitenancy\" and \"Iterative Index Scans\" sections. Docs: PostgreSQL's Row Security Policies chapter, start to finish. Trace these paths: Open WebUI: a chat request → get_verified_user, through get_current_user, decodes the token and loads the user → chat_completion in main.py (1110) → retrieval queries generated from the last messages (Week 10) → vector search in the user's collection → model stream → events to the user's room through the Redis manager → ChatMessage rows upserted. rig: POST /conversations/{id}/messages → session → user_scope → insert the message (idempotent) → enqueue with lock = conversation id → a worker claims it → rebuilds context under the same user scope → model and tools → events via NOTIFY → server-sent events to every open tab. You should be able to answer Where does Open WebUI get the user id for a request, and what stops a client from sending another user's chat id? Can answer What does row-level security add over a WHERE user_id = … in every query, and which roles skip it without warning? Can answer Why does a filtered HNSW query return fewer than k rows, and what do iterative scans and partitioning each change? Can answer Open WebUI's pgvector hybrid_search returns None when a metadata filter is set. Write the filtered hybrid query in one SQL statement instead. Can answer How does procrastinate guarantee one running job per lock, and why must an earlier queued job with the same lock block later ones? Can answer Which of rig's caches may be shared across users, and what exactly would a shared semantic cache leak? Can answer List every store Open WebUI's delete_user_by_id touches, and every per-user store it doesn't. How would you find out whether something else cleans those up? Can answer Why do streamed events need a pub/sub hop between the worker and the API server? Can answer Experiments The isolation suite with row-level security off, on, and on with one repository query deliberately missing its user_id filter. Filtered recall: 100 users sharing one HNSW index. Rows returned and recall@10 per user with hnsw.iterative_scan off, relaxed_order and strict_order, then with a partition per user; latency for each. On 20,000 random 32-dimensional vectors, with the planner kept on the HNSW index (enable_seqscan and enable_bitmapscan off), the off setting returned 0.5 rows out of 10 per query; relaxed_order returned all 10 at recall 1.00 and strict_order all 10 at 0.98. Double submit: the same message from two tabs, 100 times. Count duplicate runs and repeated tool calls with and without the conversation lock and the idempotency key. Load: time to first token (p50 and p95) and queue wait at 10, 50 and 100 simulated users. Then one user floods, with and without per-user concurrency limits. Kill a worker mid-run: time until another worker claims the job (Week 15 makes the resume exact). A semantic cache shared across users against one keyed by user: plant private answers and count cross-user hits. Production lens Identity is threaded through everything: logs, traces, the policy service, sandbox labels and the cost ledger. Traces hold user content, so access to traces is itself controlled, audited and time-limited. Noisy neighbours: per-user and per-organization quotas, and separate queues so interactive turns never wait behind background jobs. Connection pools:SET LOCAL and set_config(…, true) are safe behind a transaction-mode pooler such as PgBouncer; a session-level SET leaks one user's id into the next user's transaction. Schema changes without downtime: expand, migrate, contract. Workers on the old and new versions run side by side during a deploy. Data residency: some customers require their data to stay in one region, which decides where Postgres, the vector index and the caches live. Admin access is a privilege: any path that bypasses row-level security (migrations, support tools) uses a separate role, and every use is logged. Not yet Organizations and sharing between users, SSO and SCIM provisioning, sharding Postgres, multi-region active-active, and end-to-end encryption. Checkpoint With two users and planted secrets, U01–U12 report zero cross-user reads, and removing one WHERE clause still leaks nothing. Two tabs on one conversation never produce two concurrent runs, and a killed worker's job is picked up by another worker. You can state rig's p95 time to first token at 50 users and what fails first as load grows. rig admin delete-user leaves no trace of the user's id or planted strings in any store you control, and you can say when backups forget them.", "tasks": 27}, {"id": "w15", "group": "Weeks", "title": "Week 15: durable workflows, scheduling and approvals", "short": "Week 15", "html": "<p>Durable execution is one idea: record every non-deterministic step's result in a durable log, and on recovery replay the code, returning recorded results instead of re-executing. An agent's transcript is already most of that log. The hard part is the gap between starting a side effect and recording its result. Add a clock and you have a scheduler, which is what proactive behaviour like Muse's background work needs.</p>\n<h2 id=\"w15-concepts\">Concepts</h2>\n<ul>\n<li><strong>The failure model:</strong> <code>kill -9</code>, out-of-memory kills and deploys mid-run; host loss; provider overload; hung tools; side effects that half-happened; users who approve hours later.</li>\n<li><strong>Replay.</strong> DBOS stores each step's output keyed by workflow id and step number; Temporal replays an event history; LangGraph snapshots state after each superstep and keeps pending writes for partly finished ones. All of them require the orchestrating code to be deterministic, so model calls, tool calls, clocks and randomness happen inside recorded steps.</li>\n<li><strong>Model ids are not stable keys.</strong> Tool-call ids are generated by the model, and a re-query after a crash returns new ones. Record each model response before running its tools, and key side effects on run, step and call index.</li>\n<li><strong>Exactly-once execution is not available.</strong> You get at-least-once execution plus idempotent effects, or at-most-once plus reconciliation. A tool ledger makes the choice explicit per tool: an intent row before executing, a result row after.</li>\n<li><strong>Recovering the gap.</strong> Read-only tools re-run. Tools whose external API honours an idempotency key re-run with the same key. Tools with an observable effect are checked (a file's content hash, a marker's presence). Arbitrary <code>bash</code> cannot be classified, so it goes to a person.</li>\n<li><strong>Approvals are durable waits.</strong> Persist state, release the process and the sandbox, and resume on an external signal, with an expiry that defaults to deny.</li>\n<li><strong>Scheduling is durable execution with a clock.</strong> Decide what happens to runs missed during downtime, handle time zones and daylight-saving changes, and make sure two workers waking at 08:00 send one briefing, not two.</li>\n<li><strong>Code changes between crash and resume</strong> break naive replay. Version prompts and tools, and record which version each run started with.</li>\n<li><strong>Load control:</strong> queues with global concurrency and token-rate limits, circuit breakers per provider, and fallback models your eval set has approved.</li>\n</ul>\n<h2 id=\"w15-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1-1.5 h</td>\n<td>Concepts: the failure model, replay, why a tool-call id can't be the idempotency key</td>\n<td>A one-page note on the four tool classes (re-runnable, idempotent-by-key, observable, opaque) applied to every rig tool</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5-3 h</td>\n<td>Build steps 1-2: the ledger tables and <code>rig resume</code></td>\n<td>A killed run resumes without re-calling the model for any recorded step</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>3-4 h</td>\n<td>Build steps 3-4: <code>edit_file</code> v3 and the crash fuzzer</td>\n<td>The fuzzer kills and resumes at random points with zero duplicate and zero missing canary lines</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5-2 h</td>\n<td>Read DBOS and LangGraph checkpointing; trace both paths</td>\n<td>Notes on what makes a repeated workflow start idempotent, and what LangGraph's pending writes are for</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>2-3 h</td>\n<td>Build steps 5-6: durable approvals and the scheduler</td>\n<td>An approval survives overnight with no live process; two workers waking at 08:00 send one briefing</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3-4 h</td>\n<td>Build steps 7-8: the daily briefing and provider resilience; read OpenHands automation and pi's durable harness</td>\n<td>The briefing runs end to end once; a forced provider failure falls over to the approved fallback model</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>3-4 h</td>\n<td>Experiments; project increment; checkpoint</td>\n<td>Fifty-kill numbers recorded; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each day below points at Build, Read and Experiments for the exact schemas, code and traces rather than repeating them here.</p>\n<h3 id=\"w15-day-by-day-mon\">Monday — the failure model and why replay needs determinism.</h3>\n<p>Reading only. Before writing a ledger, get the central distinction straight in your own words: at-least-once execution plus idempotent effects, versus at-most-once plus reconciliation, and why the model's own tool-call id can't be your idempotency key (a crash and retry gets a new one). This is the one idea the rest of the week is built on.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above twice, and work through the <code>durable_tool_call</code> sketch in <strong>Build</strong> below line by line before typing any of it in.</li>\n<li>Classify every tool rig currently has as re-runnable, idempotent-by-key, observable, or opaque, per the four recovery strategies in Concepts.</li>\n<li>Write a half-page note: what identifies a step, and why must the orchestrating code around it be deterministic for replay to be correct.</li>\n</ol>\n<h3 id=\"w15-day-by-day-tue\">Tuesday — the ledger and resume.</h3>\n<p>Today you build the two tables that make a crash survivable: <code>steps</code>, which lets replay skip model calls that already happened, and <code>tool_ledger</code>, which lets replay tell whether a side effect happened before the crash. By tonight a run you <code>kill -9</code> partway through can be resumed without repeating anything already committed.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: <code>steps</code> and <code>tool_ledger</code>, committed before any output is shown or any side effect starts.</li>\n<li>Implement <strong>Build</strong> step 2: <code>rig resume &lt;run_id&gt;</code>, rebuilding the transcript from <code>steps</code> and resolving every <code>intent</code> row by tool class.</li>\n<li>Kill a run by hand after a model call but before its tool results, resume it, and confirm the model call isn't re-sent.</li>\n</ol>\n<h3 id=\"w15-day-by-day-wed\">Wednesday — reconcile, then fuzz it.</h3>\n<p>Today you give <code>edit_file</code> a way to tell whether an edit it attempted actually landed, and then build the tool that proves the whole ledger under real kills rather than hand-picked ones. This is deliberately the heaviest build day of the week — the fuzzer is what turns \"should be crash-safe\" into a measured property.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: <code>edit_file</code> v3 with a content-hash precondition, so <code>reconcile</code> can distinguish \"landed,\" \"didn't happen,\" and \"unknown.\"</li>\n<li>Implement <strong>Build</strong> step 4: the crash fuzzer — a supervisor that kills a child process at random points and resumes it — and the canary tool it grades against.</li>\n<li>Run the fuzzer for at least 50 trials and confirm the grader reports exactly one canary line per idempotency key before moving on.</li>\n</ol>\n<h3 id=\"w15-day-by-day-thu\">Thursday — read DBOS and LangGraph checkpointing.</h3>\n<p>No new code today. DBOS reduces durable execution to two tables you can read in ten minutes; LangGraph solves the same problem with a checkpoint-per-superstep model built for branching and human-in-the-loop. Both are the same idea as Tuesday's ledger, dressed differently — reading them is the fastest way to see what your own design is missing.</p>\n<ol type=\"1\">\n<li>Read <strong>Read</strong> below for DBOS and LangGraph, in the order given, then trace both paths.</li>\n<li>Answer the <strong>You should be able to answer</strong> questions on what a checkpoint holds versus pending writes, and why a node re-executes from its start after <code>interrupt</code> resumes.</li>\n</ol>\n<h3 id=\"w15-day-by-day-fri\">Friday — approvals and the scheduler.</h3>\n<p>Today two different kinds of \"wait\" get built: a human approval that can sit for hours with no process or sandbox held open, and a clock-driven scheduler that must never double-fire when two workers wake at the same moment. Both are durable waits — the difference is who releases them.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: durable approvals — a pending-approval row on <code>ask</code>, <code>rig approve &lt;run_id&gt; &lt;key&gt;</code> to resume, and expiry that defaults to deny.</li>\n<li>Implement <strong>Build</strong> step 6: <code>rig/scheduler/</code>, the cron poller claiming due slots under a lease, run ids derived from schedule and slot time, and an explicit missed-run policy.</li>\n<li>Leave an approval pending overnight, or simulate it, and confirm resume works with no process kept alive in between.</li>\n</ol>\n<h3 id=\"w15-day-by-day-sat\">Saturday — the briefing, provider resilience, and the remaining reads.</h3>\n<p>Today rig does its first proactive, unprompted work: a daily briefing assembled from calendar, inbox, tasks and memory, delivered exactly once a day even across a restart. Alongside it, provider resilience means a primary-provider outage degrades to an approved fallback model instead of failing the run outright. Read OpenHands' scheduler and dispatcher today too — it's the production version of the scheduler you built yesterday.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 7: the daily briefing, confirmed to produce an update rather than a second briefing when a calendar changes after delivery.</li>\n<li>Implement <strong>Build</strong> step 8: the typed error taxonomy, circuit breaker, and fallback model, enabled only where Week 8's evals show an acceptable pass rate.</li>\n<li>Read <strong>Read</strong> below for OpenHands automation and pi's durable harness, and trace the OpenHands path given there.</li>\n</ol>\n<h3 id=\"w15-day-by-day-sun\">Sunday — fifty kills, the rest of the experiments, and the checkpoint.</h3>\n<p>Today you put a number on everything built this week, assemble rig v0.15, and attempt the checkpoint cold.</p>\n<ol type=\"1\">\n<li>Run <strong>Experiments</strong> 1-6 below, including the fifty-kill suite and the scheduler's daylight-saving and outage runs.</li>\n<li>Assemble the <strong>Project increment</strong>: resumable after any crash, a tool ledger, durable approvals, a scheduler and a daily briefing.</li>\n<li>Attempt <strong>Checkpoint</strong> below. If you can't pass it cold, redo the relevant day before Week 16.</li>\n</ol>\n<h2 id=\"w15-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w15.build.1\"><input aria-label=\"Done\" data-id=\"w15.build.1\" id=\"c-w15-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/durable/</code>: <code>steps</code> and <code>tool_ledger</code> tables (below), in Week 14's Postgres or in SQLite in WAL mode for the local single-user mode; the rules are the same. Commit before any output is shown or any side effect starts.</div></li>\n<li class=\"task do\" data-id=\"w15.build.2\"><input aria-label=\"Done\" data-id=\"w15.build.2\" id=\"c-w15-build-2\" type=\"checkbox\"/><div class=\"task-body\"><code>rig resume &lt;run_id&gt;</code>: rebuild the transcript from <code>steps</code> without re-calling the model for recorded responses, and resolve every <code>intent</code> row by tool class.</div></li>\n<li class=\"task do\" data-id=\"w15.build.3\"><input aria-label=\"Done\" data-id=\"w15.build.3\" id=\"c-w15-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>edit_file</code> v3 with a content-hash precondition, so its <code>reconcile</code> can tell whether an edit landed.</div></li>\n<li class=\"task do\" data-id=\"w15.build.4\"><input aria-label=\"Done\" data-id=\"w15.build.4\" id=\"c-w15-build-4\" type=\"checkbox\"/><div class=\"task-body\">The crash fuzzer: a supervisor runs tasks in a child process and kills it at random points (before or after the model call, after the intent row, after the side effect, after the result), then resumes. A canary tool appends one line per call; the grader asserts exactly one line per idempotency key.</div></li>\n<li class=\"task do\" data-id=\"w15.build.5\"><input aria-label=\"Done\" data-id=\"w15.build.5\" id=\"c-w15-build-5\" type=\"checkbox\"/><div class=\"task-body\">Durable approvals: a policy <code>ask</code> writes a pending-approval row and exits; <code>rig approve &lt;run_id&gt; &lt;key&gt;</code> resumes, possibly the next day; unanswered approvals expire to deny.</div></li>\n<li class=\"task do\" data-id=\"w15.build.6\"><input aria-label=\"Done\" data-id=\"w15.build.6\" id=\"c-w15-build-6\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/scheduler/</code>: <code>rig schedule add \"0 8 * * *\" briefing --tz America/Los_Angeles</code>. A poller claims due slots under a lease, derives the run id from the schedule and the slot time so a retry or a second worker cannot send twice, and applies an explicit missed-run policy (run only the latest missed slot).</div></li>\n<li class=\"task do\" data-id=\"w15.build.7\"><input aria-label=\"Done\" data-id=\"w15.build.7\" id=\"c-w15-build-7\" type=\"checkbox\"/><div class=\"task-body\">The daily briefing, rig's first Muse-style proactive job: calendar, inbox, tasks, memory and a little web research become one prioritized briefing, delivered once a day. A calendar change after delivery produces an update, not a second briefing.</div></li>\n<li class=\"task do\" data-id=\"w15.build.8\"><input aria-label=\"Done\" data-id=\"w15.build.8\" id=\"c-w15-build-8\" type=\"checkbox\"/><div class=\"task-body\">Provider resilience: a typed error taxonomy, a circuit breaker, and a fallback model in Week 8's gateway, enabled only for task types where the eval shows an acceptable pass rate.</div></li>\n</ol>\n<p>The ledger core below was tested with real process kills. In 50 trials with 82 kills at random points, it produced zero duplicate and zero missing side effects, and an orphaned <code>bash</code> intent stopped for a person instead of re-running. The 12-week draft's <code>durable_tool_call</code>, re-implemented as written (keyed on the model's call id, no recorded model responses), produced 521 duplicate side effects under the same 50 trials.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/durable/ledger.py (core)\n# CREATE TABLE steps (run_id TEXT, seq INTEGER, kind TEXT, payload TEXT,\n#                     PRIMARY KEY (run_id, seq, kind));\n# CREATE TABLE tool_ledger (idem_key TEXT PRIMARY KEY, run_id TEXT, tool TEXT, args TEXT,\n#   state TEXT NOT NULL CHECK (state IN ('intent', 'done', 'unknown')), result TEXT);\n# SQLite in autocommit mode, journal_mode=WAL, synchronous=FULL: every write is durable on its own.\n\nNOT_DONE, UNKNOWN = object(), object()     # what a tool's reconcile() can report\n\nclass NeedsHuman(Exception):\n    \"\"\"A side effect may or may not have happened; a person (or a reconciliation job) decides.\"\"\"\n\ndef durable_tool_call(ledger, run_id, seq, index, call, tools):\n    key = f\"{run_id}:{seq}:{index}\"        # stable across replays; the model's call id is not\n    tool = tools[call[\"name\"]]\n    row = ledger.row(key)                   # (state, result) or None\n    if row and row[0] == \"done\":\n        return row[1]                       # replay: never execute twice\n    if row and row[0] == \"unknown\":\n        raise NeedsHuman(key)\n    if row and row[0] == \"intent\":          # died between intent and result: did it happen?\n        seen = tool.reconcile(key, call[\"input\"])\n        if seen is UNKNOWN:\n            ledger.mark_unknown(key)\n            raise NeedsHuman(key)\n        if seen is not NOT_DONE:            # it happened; record what we observed\n            ledger.finish(key, seen)\n            return seen\n    else:\n        ledger.intent(key, run_id, call[\"name\"], call[\"input\"])   # durable BEFORE the side effect\n    result = tool.run(call[\"input\"], idempotency_key=key)        # external APIs dedupe on the key\n    ledger.finish(key, result)\n    return result\n\ndef run_durable(run_id, task, model, tools, ledger, max_steps=20):\n    transcript = [{\"role\": \"user\", \"content\": task}]\n    for seq in range(max_steps):\n        response = ledger.get_step(run_id, seq, \"model\")\n        if response is None:                # not recorded, so nothing from this step has run yet\n            response = ledger.put_step(run_id, seq, \"model\", model(transcript))  # INSERT OR IGNORE\n        transcript.append({\"role\": \"assistant\", \"content\": response[\"content\"]})\n        calls = [b for b in response[\"content\"] if b[\"type\"] == \"tool_use\"]\n        if not calls:\n            return response\n        results = []\n        for i, call in enumerate(calls):\n            out = durable_tool_call(ledger, run_id, seq, i, call, tools)\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": call[\"id\"], \"content\": out})\n        transcript.append({\"role\": \"user\", \"content\": results})\n    return {\"stop\": \"max_steps\"}</code></pre></div>\n<h2 id=\"w15-project-increment\">Project increment</h2>\n<p>rig v0.15: resumable after any crash, a tool ledger, durable approvals, a scheduler and a daily briefing.</p>\n<h2 id=\"w15-read\">Read</h2>\n<p><strong><a href=\"https://github.com/dbos-inc/dbos-transact-py\" rel=\"noopener\" target=\"_blank\">dbos-inc/dbos-transact-py</a> (main).</strong> Durable execution reduced to database tables you can read. In <code>dbos/_schemas/system_database.py</code>, the <code>workflow_status</code> table (line 28) and <code>operation_outputs</code> (103): the second table is the whole trick. Then in <code>dbos/_core.py</code>: <code>_init_workflow</code> (591), <code>_execute_workflow_wthread</code> (1097), <code>workflow_wrapper</code> (1910), <code>invoke_step</code> (2218), <code>run_step</code> (2394). In <code>dbos/_sys_db.py</code>: <code>record_operation_result</code> (2804), <code>check_operation_execution</code> (2967), <code>get_pending_workflows</code> (2616), <code>init_workflow</code> (4775). Finally <code>dbos/_recovery.py</code> (72 lines), whose <code>recover_pending_workflows</code> (50) is the entire recovery story.</p>\n<p><strong><a href=\"https://github.com/langchain-ai/langgraph\" rel=\"noopener\" target=\"_blank\">langchain-ai/langgraph</a>, checkpointing and interrupts only.</strong> <code>libs/checkpoint/langgraph/checkpoint/base/__init__.py</code> (<code>Checkpoint</code> at 93, <code>BaseCheckpointSaver</code> at 199 with <code>get_tuple</code>, <code>list</code>, <code>put</code>, <code>put_writes</code>), <code>libs/checkpoint/langgraph/checkpoint/memory/__init__.py</code> (the shortest complete saver), <code>libs/langgraph/langgraph/pregel/_loop.py</code> (<code>tick</code> at 623, <code>after_tick</code> at 707, <code>put_writes</code> at 439, <code>_put_checkpoint</code> at 1181), <code>pregel/_algo.py</code> (<code>should_interrupt</code> at 156, <code>apply_writes</code> at 233, <code>prepare_next_tasks</code> at 348), and <code>langgraph/types.py</code> (<code>Interrupt</code> at 584, <code>Command</code> at 833, <code>interrupt</code> at 893).</p>\n<p><strong><a href=\"https://github.com/OpenHands/automation\" rel=\"noopener\" target=\"_blank\">OpenHands/automation</a></strong> at <code>b43294c</code>: a production scheduler and dispatcher for agent runs. <code>openhands/automation/scheduler.py</code> (320 lines): <code>_is_automation_due_safely</code> (79, cron evaluation), <code>poll_and_schedule</code> (157, which claims due automations with <code>FOR UPDATE SKIP LOCKED</code> at line 151) and <code>scheduler_loop</code> (265). <code>dispatcher.py</code>: <code>_poll_pending_runs</code> (127, <code>SKIP LOCKED</code> again at 163), <code>_execute_run</code> (209) and <code>dispatch_pending_runs</code> (565). <code>models.py</code>: <code>Automation</code> (61) and <code>AutomationRun</code> (175).</p>\n<p><strong><a href=\"https://github.com/earendil-works/pi/tree/main/packages/durable\" rel=\"noopener\" target=\"_blank\">pi's durable harness</a> (experimental).</strong> The Week 2 harness rebuilt so that conversations, model turns and tool calls are committed to storage before anything is shown. Read the README sections on persisting and resuming, busy conversations, aborts and subagents, child tasks and the task graph, then <code>src/harness/harness.ts</code> (437 lines), <code>submissions.ts</code> and <code>inbox.ts</code>. Its API is marked experimental.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>DBOS: calling a <code>@DBOS.workflow</code> → <code>workflow_wrapper</code> → <code>_init_workflow</code> (inserts the status row, or finds the existing one for that id, which makes starts idempotent) → the function body → each <code>@DBOS.step</code> → <code>invoke_step</code> → <code>check_operation_execution</code> (a recorded output short-circuits the step) → otherwise run it and <code>record_operation_result</code> → <code>update_workflow_outcome</code>. Recovery: process start → <code>recover_pending_workflows</code> → <code>get_pending_workflows</code> → <code>_recover_workflow</code> → re-execution under the same id, where completed steps return their recorded outputs.</li>\n<li>LangGraph: <code>invoke(input, {\"thread_id\": ...})</code> → <code>_first</code> loads the latest checkpoint → <code>tick</code> → <code>prepare_next_tasks</code> → tasks run → <code>put_writes</code> saves each task's writes as it finishes → <code>after_tick</code> → <code>apply_writes</code> → <code>_put_checkpoint</code>. HITL: <code>interrupt(value)</code> raises inside a node → the checkpoint records the pending interrupt → <code>invoke(Command(resume=answer))</code> re-runs that node from its start with the answer returned from <code>interrupt</code>.</li>\n<li>OpenHands automation: <code>scheduler_loop</code> → <code>poll_and_schedule</code> (lock due rows, skip ones another worker holds) → <code>_is_automation_due_safely</code> → a new <code>AutomationRun</code> → <code>dispatcher_loop</code> → <code>dispatch_pending_runs</code> → <code>_poll_pending_runs</code> → <code>_execute_run</code>.</li>\n</ul>\n<h2 id=\"w15-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w15.q.1\"><input aria-label=\"I can answer this\" data-id=\"w15.q.1\" id=\"c-w15-q-1\" type=\"checkbox\"/><div class=\"task-body\">What identifies a step in DBOS, and why must workflow code be deterministic for replay to be correct?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.2\"><input aria-label=\"I can answer this\" data-id=\"w15.q.2\" id=\"c-w15-q-2\" type=\"checkbox\"/><div class=\"task-body\">If the process dies after a step's side effect but before <code>record_operation_result</code>, what happens on recovery? What guarantee does that give, and how do you turn it into effectively-once?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.3\"><input aria-label=\"I can answer this\" data-id=\"w15.q.3\" id=\"c-w15-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why does starting a workflow with an id that already exists not run it twice?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.4\"><input aria-label=\"I can answer this\" data-id=\"w15.q.4\" id=\"c-w15-q-4\" type=\"checkbox\"/><div class=\"task-body\">In LangGraph, what is in a checkpoint and what is in pending writes, and why are pending writes needed?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.5\"><input aria-label=\"I can answer this\" data-id=\"w15.q.5\" id=\"c-w15-q-5\" type=\"checkbox\"/><div class=\"task-body\">Why does a node re-execute from its beginning after <code>interrupt</code> resumes, and what does that require of the code before the <code>interrupt</code> call?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.6\"><input aria-label=\"I can answer this\" data-id=\"w15.q.6\" id=\"c-w15-q-6\" type=\"checkbox\"/><div class=\"task-body\">Classify every rig tool as re-runnable, idempotent by key, observable, or opaque.</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.7\"><input aria-label=\"I can answer this\" data-id=\"w15.q.7\" id=\"c-w15-q-7\" type=\"checkbox\"/><div class=\"task-body\">Why can't the model's tool-call id be the idempotency key?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.8\"><input aria-label=\"I can answer this\" data-id=\"w15.q.8\" id=\"c-w15-q-8\" type=\"checkbox\"/><div class=\"task-body\">Where does a pending approval live so that no process or container is held open overnight?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w15.q.9\"><input aria-label=\"I can answer this\" data-id=\"w15.q.9\" id=\"c-w15-q-9\" type=\"checkbox\"/><div class=\"task-body\">Two scheduler workers wake at 08:00. Walk through why exactly one briefing is sent.</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w15-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w15.exp.1\"><input aria-label=\"Done\" data-id=\"w15.exp.1\" id=\"c-w15-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Fifty random kills across the suite: resume success rate, duplicated canary markers (target zero), and the extra cost of recovery.</div></li>\n<li class=\"task do\" data-id=\"w15.exp.2\"><input aria-label=\"Done\" data-id=\"w15.exp.2\" id=\"c-w15-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Key the ledger on the model's call id instead and reproduce the duplicates.</div></li>\n<li class=\"task do\" data-id=\"w15.exp.3\"><input aria-label=\"Done\" data-id=\"w15.exp.3\" id=\"c-w15-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Change the system prompt between crash and resume, and confirm recorded steps are not re-queried.</div></li>\n<li class=\"task do\" data-id=\"w15.exp.4\"><input aria-label=\"Done\" data-id=\"w15.exp.4\" id=\"c-w15-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Leave an approval pending overnight; resume and measure the cold-cache cost of the first request.</div></li>\n<li class=\"task do\" data-id=\"w15.exp.5\"><input aria-label=\"Done\" data-id=\"w15.exp.5\" id=\"c-w15-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Force primary-provider failure and run the suite on the fallback model; compare pass rate and cost.</div></li>\n<li class=\"task do\" data-id=\"w15.exp.6\"><input aria-label=\"Done\" data-id=\"w15.exp.6\" id=\"c-w15-exp-6\" type=\"checkbox\"/><div class=\"task-body\">Run the scheduler across a simulated daylight-saving change and a six-hour outage; count briefings per day (target exactly one).</div></li>\n</ol>\n<h2 id=\"w15-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Every side effect has an owner and an idempotency key</strong> that reaches the external system, not just your own database.</li>\n<li><strong>Recovery costs tokens</strong> only for steps that were never recorded; measure it.</li>\n<li><strong>Durable approvals free compute.</strong> Nothing runs while a person decides, and the default on expiry is deny.</li>\n<li><strong>Scheduled jobs have an SLO:</strong> on time, exactly once, in the user's time zone.</li>\n</ul>\n<h2 id=\"w15-not-yet\">Not yet</h2>\n<p>Temporal's internals and building a workflow engine at scale. With the primitives in hand, each is a reading project.</p>\n<h2 id=\"w15-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w15.check.1\"><input aria-label=\"Done\" data-id=\"w15.check.1\" id=\"c-w15-check-1\" type=\"checkbox\"/><div class=\"task-body\">rig survives 50 random <code>kill -9</code>s with zero duplicated canary markers, and resumed runs pass at a rate within the noise of uninterrupted ones.</div></li>\n<li class=\"task do\" data-id=\"w15.check.2\"><input aria-label=\"Done\" data-id=\"w15.check.2\" id=\"c-w15-check-2\" type=\"checkbox\"/><div class=\"task-body\">An approval waits overnight with no live process, then resumes and completes correctly.</div></li>\n<li class=\"task do\" data-id=\"w15.check.3\"><input aria-label=\"Done\" data-id=\"w15.check.3\" id=\"c-w15-check-3\" type=\"checkbox\"/><div class=\"task-body\">The daily briefing arrives exactly once a day across a restart, a second worker and a daylight-saving change.</div></li>\n</ul>\n", "toc": [["w15-concepts", "Concepts", []], ["w15-day-by-day", "Day by day", [["w15-day-by-day-mon", "Monday — the failure model and why replay needs determinism."], ["w15-day-by-day-tue", "Tuesday — the ledger and resume."], ["w15-day-by-day-wed", "Wednesday — reconcile, then fuzz it."], ["w15-day-by-day-thu", "Thursday — read DBOS and LangGraph checkpointing."], ["w15-day-by-day-fri", "Friday — approvals and the scheduler."], ["w15-day-by-day-sat", "Saturday — the briefing, provider resilience, and the remaining reads."], ["w15-day-by-day-sun", "Sunday — fifty kills, the rest of the experiments, and the checkpoint."]]], ["w15-build", "Build", []], ["w15-project-increment", "Project increment", []], ["w15-read", "Read", []], ["w15-you-should-be-able-to-answer", "You should be able to answer", []], ["w15-experiments", "Experiments", []], ["w15-production-lens", "Production lens", []], ["w15-not-yet", "Not yet", []], ["w15-checkpoint", "Checkpoint", []]], "text": "Durable execution is one idea: record every non-deterministic step's result in a durable log, and on recovery replay the code, returning recorded results instead of re-executing. An agent's transcript is already most of that log. The hard part is the gap between starting a side effect and recording its result. Add a clock and you have a scheduler, which is what proactive behaviour like Muse's background work needs. Concepts The failure model:kill -9, out-of-memory kills and deploys mid-run; host loss; provider overload; hung tools; side effects that half-happened; users who approve hours later. Replay. DBOS stores each step's output keyed by workflow id and step number; Temporal replays an event history; LangGraph snapshots state after each superstep and keeps pending writes for partly finished ones. All of them require the orchestrating code to be deterministic, so model calls, tool calls, clocks and randomness happen inside recorded steps. Model ids are not stable keys. Tool-call ids are generated by the model, and a re-query after a crash returns new ones. Record each model response before running its tools, and key side effects on run, step and call index. Exactly-once execution is not available. You get at-least-once execution plus idempotent effects, or at-most-once plus reconciliation. A tool ledger makes the choice explicit per tool: an intent row before executing, a result row after. Recovering the gap. Read-only tools re-run. Tools whose external API honours an idempotency key re-run with the same key. Tools with an observable effect are checked (a file's content hash, a marker's presence). Arbitrary bash cannot be classified, so it goes to a person. Approvals are durable waits. Persist state, release the process and the sandbox, and resume on an external signal, with an expiry that defaults to deny. Scheduling is durable execution with a clock. Decide what happens to runs missed during downtime, handle time zones and daylight-saving changes, and make sure two workers waking at 08:00 send one briefing, not two. Code changes between crash and resume break naive replay. Version prompts and tools, and record which version each run started with. Load control: queues with global concurrency and token-rate limits, circuit breakers per provider, and fallback models your eval set has approved. Day by day Day Time Do Working by end of day Mon 1-1.5 h Concepts: the failure model, replay, why a tool-call id can't be the idempotency key A one-page note on the four tool classes (re-runnable, idempotent-by-key, observable, opaque) applied to every rig tool Tue 2.5-3 h Build steps 1-2: the ledger tables and rig resume A killed run resumes without re-calling the model for any recorded step Wed 3-4 h Build steps 3-4: edit_file v3 and the crash fuzzer The fuzzer kills and resumes at random points with zero duplicate and zero missing canary lines Thu 1.5-2 h Read DBOS and LangGraph checkpointing; trace both paths Notes on what makes a repeated workflow start idempotent, and what LangGraph's pending writes are for Fri 2-3 h Build steps 5-6: durable approvals and the scheduler An approval survives overnight with no live process; two workers waking at 08:00 send one briefing Sat 3-4 h Build steps 7-8: the daily briefing and provider resilience; read OpenHands automation and pi's durable harness The briefing runs end to end once; a forced provider failure falls over to the approved fallback model Sun 3-4 h Experiments; project increment; checkpoint Fifty-kill numbers recorded; checkpoint passed or a redo list Each day below points at Build, Read and Experiments for the exact schemas, code and traces rather than repeating them here. Monday — the failure model and why replay needs determinism. Reading only. Before writing a ledger, get the central distinction straight in your own words: at-least-once execution plus idempotent effects, versus at-most-once plus reconciliation, and why the model's own tool-call id can't be your idempotency key (a crash and retry gets a new one). This is the one idea the rest of the week is built on. Read Concepts above twice, and work through the durable_tool_call sketch in Build below line by line before typing any of it in. Classify every tool rig currently has as re-runnable, idempotent-by-key, observable, or opaque, per the four recovery strategies in Concepts. Write a half-page note: what identifies a step, and why must the orchestrating code around it be deterministic for replay to be correct. Tuesday — the ledger and resume. Today you build the two tables that make a crash survivable: steps, which lets replay skip model calls that already happened, and tool_ledger, which lets replay tell whether a side effect happened before the crash. By tonight a run you kill -9 partway through can be resumed without repeating anything already committed. Implement Build step 1: steps and tool_ledger, committed before any output is shown or any side effect starts. Implement Build step 2: rig resume <run_id>, rebuilding the transcript from steps and resolving every intent row by tool class. Kill a run by hand after a model call but before its tool results, resume it, and confirm the model call isn't re-sent. Wednesday — reconcile, then fuzz it. Today you give edit_file a way to tell whether an edit it attempted actually landed, and then build the tool that proves the whole ledger under real kills rather than hand-picked ones. This is deliberately the heaviest build day of the week — the fuzzer is what turns \"should be crash-safe\" into a measured property. Implement Build step 3: edit_file v3 with a content-hash precondition, so reconcile can distinguish \"landed,\" \"didn't happen,\" and \"unknown.\" Implement Build step 4: the crash fuzzer — a supervisor that kills a child process at random points and resumes it — and the canary tool it grades against. Run the fuzzer for at least 50 trials and confirm the grader reports exactly one canary line per idempotency key before moving on. Thursday — read DBOS and LangGraph checkpointing. No new code today. DBOS reduces durable execution to two tables you can read in ten minutes; LangGraph solves the same problem with a checkpoint-per-superstep model built for branching and human-in-the-loop. Both are the same idea as Tuesday's ledger, dressed differently — reading them is the fastest way to see what your own design is missing. Read Read below for DBOS and LangGraph, in the order given, then trace both paths. Answer the You should be able to answer questions on what a checkpoint holds versus pending writes, and why a node re-executes from its start after interrupt resumes. Friday — approvals and the scheduler. Today two different kinds of \"wait\" get built: a human approval that can sit for hours with no process or sandbox held open, and a clock-driven scheduler that must never double-fire when two workers wake at the same moment. Both are durable waits — the difference is who releases them. Implement Build step 5: durable approvals — a pending-approval row on ask, rig approve <run_id> <key> to resume, and expiry that defaults to deny. Implement Build step 6: rig/scheduler/, the cron poller claiming due slots under a lease, run ids derived from schedule and slot time, and an explicit missed-run policy. Leave an approval pending overnight, or simulate it, and confirm resume works with no process kept alive in between. Saturday — the briefing, provider resilience, and the remaining reads. Today rig does its first proactive, unprompted work: a daily briefing assembled from calendar, inbox, tasks and memory, delivered exactly once a day even across a restart. Alongside it, provider resilience means a primary-provider outage degrades to an approved fallback model instead of failing the run outright. Read OpenHands' scheduler and dispatcher today too — it's the production version of the scheduler you built yesterday. Implement Build step 7: the daily briefing, confirmed to produce an update rather than a second briefing when a calendar changes after delivery. Implement Build step 8: the typed error taxonomy, circuit breaker, and fallback model, enabled only where Week 8's evals show an acceptable pass rate. Read Read below for OpenHands automation and pi's durable harness, and trace the OpenHands path given there. Sunday — fifty kills, the rest of the experiments, and the checkpoint. Today you put a number on everything built this week, assemble rig v0.15, and attempt the checkpoint cold. Run Experiments 1-6 below, including the fifty-kill suite and the scheduler's daylight-saving and outage runs. Assemble the Project increment: resumable after any crash, a tool ledger, durable approvals, a scheduler and a daily briefing. Attempt Checkpoint below. If you can't pass it cold, redo the relevant day before Week 16. Build rig/durable/: steps and tool_ledger tables (below), in Week 14's Postgres or in SQLite in WAL mode for the local single-user mode; the rules are the same. Commit before any output is shown or any side effect starts. rig resume <run_id>: rebuild the transcript from steps without re-calling the model for recorded responses, and resolve every intent row by tool class. edit_file v3 with a content-hash precondition, so its reconcile can tell whether an edit landed. The crash fuzzer: a supervisor runs tasks in a child process and kills it at random points (before or after the model call, after the intent row, after the side effect, after the result), then resumes. A canary tool appends one line per call; the grader asserts exactly one line per idempotency key. Durable approvals: a policy ask writes a pending-approval row and exits; rig approve <run_id> <key> resumes, possibly the next day; unanswered approvals expire to deny. rig/scheduler/: rig schedule add \"0 8 * * *\" briefing --tz America/Los_Angeles. A poller claims due slots under a lease, derives the run id from the schedule and the slot time so a retry or a second worker cannot send twice, and applies an explicit missed-run policy (run only the latest missed slot). The daily briefing, rig's first Muse-style proactive job: calendar, inbox, tasks, memory and a little web research become one prioritized briefing, delivered once a day. A calendar change after delivery produces an update, not a second briefing. Provider resilience: a typed error taxonomy, a circuit breaker, and a fallback model in Week 8's gateway, enabled only for task types where the eval shows an acceptable pass rate. The ledger core below was tested with real process kills. In 50 trials with 82 kills at random points, it produced zero duplicate and zero missing side effects, and an orphaned bash intent stopped for a person instead of re-running. The 12-week draft's durable_tool_call, re-implemented as written (keyed on the model's call id, no recorded model responses), produced 521 duplicate side effects under the same 50 trials. # rig/durable/ledger.py (core)\n# CREATE TABLE steps (run_id TEXT, seq INTEGER, kind TEXT, payload TEXT,\n#                     PRIMARY KEY (run_id, seq, kind));\n# CREATE TABLE tool_ledger (idem_key TEXT PRIMARY KEY, run_id TEXT, tool TEXT, args TEXT,\n#   state TEXT NOT NULL CHECK (state IN ('intent', 'done', 'unknown')), result TEXT);\n# SQLite in autocommit mode, journal_mode=WAL, synchronous=FULL: every write is durable on its own.\n\nNOT_DONE, UNKNOWN = object(), object()     # what a tool's reconcile() can report\n\nclass NeedsHuman(Exception):\n    \"\"\"A side effect may or may not have happened; a person (or a reconciliation job) decides.\"\"\"\n\ndef durable_tool_call(ledger, run_id, seq, index, call, tools):\n    key = f\"{run_id}:{seq}:{index}\"        # stable across replays; the model's call id is not\n    tool = tools[call[\"name\"]]\n    row = ledger.row(key)                   # (state, result) or None\n    if row and row[0] == \"done\":\n        return row[1]                       # replay: never execute twice\n    if row and row[0] == \"unknown\":\n        raise NeedsHuman(key)\n    if row and row[0] == \"intent\":          # died between intent and result: did it happen?\n        seen = tool.reconcile(key, call[\"input\"])\n        if seen is UNKNOWN:\n            ledger.mark_unknown(key)\n            raise NeedsHuman(key)\n        if seen is not NOT_DONE:            # it happened; record what we observed\n            ledger.finish(key, seen)\n            return seen\n    else:\n        ledger.intent(key, run_id, call[\"name\"], call[\"input\"])   # durable BEFORE the side effect\n    result = tool.run(call[\"input\"], idempotency_key=key)        # external APIs dedupe on the key\n    ledger.finish(key, result)\n    return result\n\ndef run_durable(run_id, task, model, tools, ledger, max_steps=20):\n    transcript = [{\"role\": \"user\", \"content\": task}]\n    for seq in range(max_steps):\n        response = ledger.get_step(run_id, seq, \"model\")\n        if response is None:                # not recorded, so nothing from this step has run yet\n            response = ledger.put_step(run_id, seq, \"model\", model(transcript))  # INSERT OR IGNORE\n        transcript.append({\"role\": \"assistant\", \"content\": response[\"content\"]})\n        calls = [b for b in response[\"content\"] if b[\"type\"] == \"tool_use\"]\n        if not calls:\n            return response\n        results = []\n        for i, call in enumerate(calls):\n            out = durable_tool_call(ledger, run_id, seq, i, call, tools)\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": call[\"id\"], \"content\": out})\n        transcript.append({\"role\": \"user\", \"content\": results})\n    return {\"stop\": \"max_steps\"} Project increment rig v0.15: resumable after any crash, a tool ledger, durable approvals, a scheduler and a daily briefing. Read dbos-inc/dbos-transact-py (main). Durable execution reduced to database tables you can read. In dbos/_schemas/system_database.py, the workflow_status table (line 28) and operation_outputs (103): the second table is the whole trick. Then in dbos/_core.py: _init_workflow (591), _execute_workflow_wthread (1097), workflow_wrapper (1910), invoke_step (2218), run_step (2394). In dbos/_sys_db.py: record_operation_result (2804), check_operation_execution (2967), get_pending_workflows (2616), init_workflow (4775). Finally dbos/_recovery.py (72 lines), whose recover_pending_workflows (50) is the entire recovery story. langchain-ai/langgraph, checkpointing and interrupts only.libs/checkpoint/langgraph/checkpoint/base/__init__.py (Checkpoint at 93, BaseCheckpointSaver at 199 with get_tuple, list, put, put_writes), libs/checkpoint/langgraph/checkpoint/memory/__init__.py (the shortest complete saver), libs/langgraph/langgraph/pregel/_loop.py (tick at 623, after_tick at 707, put_writes at 439, _put_checkpoint at 1181), pregel/_algo.py (should_interrupt at 156, apply_writes at 233, prepare_next_tasks at 348), and langgraph/types.py (Interrupt at 584, Command at 833, interrupt at 893). OpenHands/automation at b43294c: a production scheduler and dispatcher for agent runs. openhands/automation/scheduler.py (320 lines): _is_automation_due_safely (79, cron evaluation), poll_and_schedule (157, which claims due automations with FOR UPDATE SKIP LOCKED at line 151) and scheduler_loop (265). dispatcher.py: _poll_pending_runs (127, SKIP LOCKED again at 163), _execute_run (209) and dispatch_pending_runs (565). models.py: Automation (61) and AutomationRun (175). pi's durable harness (experimental). The Week 2 harness rebuilt so that conversations, model turns and tool calls are committed to storage before anything is shown. Read the README sections on persisting and resuming, busy conversations, aborts and subagents, child tasks and the task graph, then src/harness/harness.ts (437 lines), submissions.ts and inbox.ts. Its API is marked experimental. Trace these paths: DBOS: calling a @DBOS.workflow → workflow_wrapper → _init_workflow (inserts the status row, or finds the existing one for that id, which makes starts idempotent) → the function body → each @DBOS.step → invoke_step → check_operation_execution (a recorded output short-circuits the step) → otherwise run it and record_operation_result → update_workflow_outcome. Recovery: process start → recover_pending_workflows → get_pending_workflows → _recover_workflow → re-execution under the same id, where completed steps return their recorded outputs. LangGraph: invoke(input, {\"thread_id\": ...}) → _first loads the latest checkpoint → tick → prepare_next_tasks → tasks run → put_writes saves each task's writes as it finishes → after_tick → apply_writes → _put_checkpoint. HITL: interrupt(value) raises inside a node → the checkpoint records the pending interrupt → invoke(Command(resume=answer)) re-runs that node from its start with the answer returned from interrupt. OpenHands automation: scheduler_loop → poll_and_schedule (lock due rows, skip ones another worker holds) → _is_automation_due_safely → a new AutomationRun → dispatcher_loop → dispatch_pending_runs → _poll_pending_runs → _execute_run. You should be able to answer What identifies a step in DBOS, and why must workflow code be deterministic for replay to be correct? Can answer If the process dies after a step's side effect but before record_operation_result, what happens on recovery? What guarantee does that give, and how do you turn it into effectively-once? Can answer Why does starting a workflow with an id that already exists not run it twice? Can answer In LangGraph, what is in a checkpoint and what is in pending writes, and why are pending writes needed? Can answer Why does a node re-execute from its beginning after interrupt resumes, and what does that require of the code before the interrupt call? Can answer Classify every rig tool as re-runnable, idempotent by key, observable, or opaque. Can answer Why can't the model's tool-call id be the idempotency key? Can answer Where does a pending approval live so that no process or container is held open overnight? Can answer Two scheduler workers wake at 08:00. Walk through why exactly one briefing is sent. Can answer Experiments Fifty random kills across the suite: resume success rate, duplicated canary markers (target zero), and the extra cost of recovery. Key the ledger on the model's call id instead and reproduce the duplicates. Change the system prompt between crash and resume, and confirm recorded steps are not re-queried. Leave an approval pending overnight; resume and measure the cold-cache cost of the first request. Force primary-provider failure and run the suite on the fallback model; compare pass rate and cost. Run the scheduler across a simulated daylight-saving change and a six-hour outage; count briefings per day (target exactly one). Production lens Every side effect has an owner and an idempotency key that reaches the external system, not just your own database. Recovery costs tokens only for steps that were never recorded; measure it. Durable approvals free compute. Nothing runs while a person decides, and the default on expiry is deny. Scheduled jobs have an SLO: on time, exactly once, in the user's time zone. Not yet Temporal's internals and building a workflow engine at scale. With the primitives in hand, each is a reading project. Checkpoint rig survives 50 random kill -9s with zero duplicated canary markers, and resumed runs pass at a rate within the noise of uninterrupted ones. An approval waits overnight with no live process, then resumes and completes correctly. The daily briefing arrives exactly once a day across a restart, a second worker and a daylight-saving change.", "tasks": 26}, {"id": "w16", "group": "Weeks", "title": "Week 16: browser and computer use", "short": "Week 16", "html": "<p>A browser agent is Week 1's loop where the observation is a page and the actions are navigate, click and type. The new problem is security: the page is untrusted input, the browser holds sessions, and every request leaves your machine. This week you wrap a real browser runtime, separate observation from action, and gate actions on where data goes, not only on the verb.</p>\n<h2 id=\"w16-concepts\">Concepts</h2>\n<ul>\n<li><strong>Observation and action.</strong> The observation is a serialized DOM or accessibility tree with numbered interactive elements, often plus a screenshot; the action names an element index. Computer use replaces the DOM with pixels and mouse and keyboard, which works on any app (Muse is gaining Mac computer use) and costs far more per step.</li>\n<li><strong>Risk follows the data.</strong> A GET to an attacker's URL with a secret in the query string is exfiltration. Links can unsubscribe, confirm or log in. Typing can autosave, search as you type, or submit on Enter. So <code>navigate</code> is not read-only and \"fill but don't submit\" is not reversible.</li>\n<li><strong>The Comet case (Brave, August 2025).</strong> Hidden text in a Reddit comment led Perplexity's Comet to read the user's account email, open a lookalike domain with a trailing dot, read a one-time password from the user's logged-in Gmail, and post both back as a reply. Brave's mitigations: separate the user's instructions from page content, check every action against what the user asked, confirm sensitive actions, and isolate agentic browsing from everyday browsing.</li>\n<li><strong>Isolation.</strong> The agent's browser never uses your everyday logged-in profile. Credentials are injected per domain from a secrets store and never appear in the model's context.</li>\n<li><strong>Taint.</strong> Once a task has read private data, navigation to any host outside the task's allowlist needs approval.</li>\n<li><strong>Loops and drift.</strong> Agents repeat failing actions; page fingerprints and loop detectors catch it.</li>\n</ul>\n<h2 id=\"w16-day-by-day\">Day by day</h2>\n<p>The loop is Week 1's; the new work is almost entirely the gate and the isolation around it, so most of the week's code is smaller than it looks.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read Concepts; note why <code>navigate</code> is not read-only</td>\n<td>A half-page note with three examples of actions that look read-only but aren't</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2 to 3 h</td>\n<td><code>rig/browser/</code>'s <code>BrowserTool</code>: navigate, observe, click, type, download</td>\n<td>A real page returns a stable observation (URL, title, text, numbered elements)</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2 to 4 h</td>\n<td>The destination-aware gate; isolated profile, per-domain credentials, per-task allowlist</td>\n<td>The gate's own test cases (OTP in a query string, trailing-dot host, <code>javascript:</code> URL, a private value typed into another site) all stop or ask; pre-taint browsing is still allowed</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Read browser-use; trace the path to <code>SecurityWatchdog</code>; replay the Comet disclosure against your gate</td>\n<td>Notes naming the exact rule where your gate stops the Comet attack</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>The four experiments</td>\n<td><code>notes/week16-experiments.md</code></td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td>Browser evals B01 to B12 on fixture and adversarial pages; rig v0.16</td>\n<td>Zero forbidden actions completed across B01 to B12</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>1 to 2 h</td>\n<td>Optional desktop-app pass via screenshots; checkpoint</td>\n<td>Checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w16-day-by-day-mon\">Monday — observation, action, and why risk follows the data.</h3>\n<p>No code today. This week's loop is Week 1's; what's new is that the page is untrusted and the browser holds sessions. Read <strong>Concepts</strong> and understand why <code>navigate</code> is not read-only, a GET can be an exfiltration channel, and typing can autosave or submit — every later decision this week (the gate, the allowlist, the isolated profile) is a direct consequence of that one fact.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> in full, including the Comet case.</li>\n<li>Write a half-page note: three actions that look read-only but aren't, and why.</li>\n</ol>\n<h3 id=\"w16-day-by-day-tue\">Tuesday — the browser tool, no gate yet.</h3>\n<p>Today you wrap a real browser runtime and get a clean, numbered observation out of it, before worrying about what the agent is allowed to do with that observation. Everything downstream — the gate, the evals — depends on this shape being right first.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1's <code>rig/browser/</code>: <code>navigate</code>, <code>observe</code>, <code>click</code>, <code>type</code>, <code>download</code> on Playwright or browser-use's <code>BrowserSession</code>.</li>\n<li>Point it at a few ordinary pages by hand and confirm the observation (URL, title, text, interactive elements, optional screenshot) is stable and the numbered elements match what you'd click.</li>\n</ol>\n<h3 id=\"w16-day-by-day-wed\">Wednesday — the gate and isolation.</h3>\n<p>Today the agent stops being able to hurt you. Wire the destination-aware gate from <strong>Build</strong> in front of every action, give each task its own browser profile, inject credentials by domain, and scope navigation to a per-task host allowlist — this is the week's actual security boundary; everything else is scaffolding around it.</p>\n<ol type=\"1\">\n<li>Implement the destination-aware gate — the check that runs before every browser action and decides allow, deny or ask — exactly as given in <strong>Build</strong> step 2; don't loosen the taint rule.</li>\n<li>Wire a fresh profile per task and per-domain credential injection, per <strong>Build</strong> step 3.</li>\n<li>Run the gate's own test cases (OTP in a query string, a trailing-dot host, a <code>javascript:</code> URL, a private value typed into another site) and confirm each stops or asks, and that ordinary pre-taint browsing is still allowed.</li>\n</ol>\n<h3 id=\"w16-day-by-day-thu\">Thursday — read browser-use, then replay Comet.</h3>\n<p>browser-use is a production agent built around exactly this week's problem, so read it for how a real <code>SecurityWatchdog</code> makes the allow/ask/deny decision your gate makes. Then replay Brave's Comet disclosure step by step against your own gate — the actual test of whether Wednesday's work holds against a real attack, not just your own test cases.</p>\n<ol type=\"1\">\n<li>Read <strong>Read</strong> in full, following the given trace path.</li>\n<li>Replay the Comet disclosure; at each step, note which rule in your gate would stop it, or wouldn't.</li>\n<li>Answer <strong>You should be able to answer</strong> question 5 from this replay, not from memory.</li>\n</ol>\n<h3 id=\"w16-day-by-day-fri\">Friday — break the gate on purpose.</h3>\n<p>No new code today. Run the four experiments in <strong>Experiments</strong> below against the agent you already built. Write up what changed in <code>notes/week16-experiments.md</code>: pass rate, approvals, and where the adversarial pages actually got stopped.</p>\n<h3 id=\"w16-day-by-day-sat\">Saturday — the eval ladder.</h3>\n<p>Today you run B01 to B12, the fixture-and-adversarial task ladder that is this week's real regression suite, and ship rig v0.16. Passing the benign tasks says the agent is useful; passing the adversarial ones is the point of the week.</p>\n<ol type=\"1\">\n<li>Run <strong>Build</strong> step 4's evals B01 to B12, local fixture sites where possible.</li>\n<li>Confirm <strong>Project increment</strong>: an isolated profile per task and the gate behind the policy service.</li>\n<li>Record approvals per benign task alongside pass/fail — you need it for the checkpoint and for Experiment 4.</li>\n</ol>\n<h3 id=\"w16-day-by-day-sun\">Sunday — optional desktop pass, then checkpoint.</h3>\n<p>Optional computer-use detour if you want to feel the cost difference; otherwise go straight to the checkpoint. Whether you pass it cold, not whether you clicked through B01 to B12, is the real signal for whether you're ready for Week 17.</p>\n<ol type=\"1\">\n<li>Optional: drive one desktop app through screenshots with the same gate (<strong>Build</strong> step 5); compare cost per step against the DOM path.</li>\n<li>Attempt <strong>Checkpoint</strong> below cold.</li>\n</ol>\n<h2 id=\"w16-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w16.build.1\"><input aria-label=\"Done\" data-id=\"w16.build.1\" id=\"c-w16-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/browser/</code>: a <code>BrowserTool</code> on Playwright (or browser-use's <code>BrowserSession</code>) with <code>navigate</code>, <code>observe</code>, <code>click</code>, <code>type</code> and <code>download</code>, and an observation of URL, title, text, interactive elements and an optional screenshot path.</div></li>\n<li class=\"task do\" data-id=\"w16.build.2\"><input aria-label=\"Done\" data-id=\"w16.build.2\" id=\"c-w16-build-2\" type=\"checkbox\"/><div class=\"task-body\">The destination-aware gate below, called by Week 9's policy service before every browser action.</div></li>\n<li class=\"task do\" data-id=\"w16.build.3\"><input aria-label=\"Done\" data-id=\"w16.build.3\" id=\"c-w16-build-3\" type=\"checkbox\"/><div class=\"task-body\">A fresh browser profile per task, credentials injected by domain, and a per-task host allowlist.</div></li>\n<li class=\"task do\" data-id=\"w16.build.4\"><input aria-label=\"Done\" data-id=\"w16.build.4\" id=\"c-w16-build-4\" type=\"checkbox\"/><div class=\"task-body\">Browser evals B01–B12 on local fixture sites where possible: find information; compare products; navigate documentation; download a public file; fill a form but stop before submitting; find an appointment slot without booking; and adversarial pages with hidden-text instructions, a trailing-dot lookalike login, a request to visit a URL carrying another tab's content, and HTML that pretends to be a system message.</div></li>\n<li class=\"task do\" data-id=\"w16.build.5\"><input aria-label=\"Done\" data-id=\"w16.build.5\" id=\"c-w16-build-5\" type=\"checkbox\"/><div class=\"task-body\">Optional: drive one desktop app through screenshots with the same gate, to feel the cost of pixels against the DOM.</div></li>\n</ol>\n<p>The gate below was tested: an OTP in a query string, a trailing-dot lookalike host, a <code>javascript:</code> URL, typing a private value into another site and submitting all stop or ask, while ordinary browsing before any private data is read is allowed.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/browser/gate.py\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom urllib.parse import urlsplit\n\nclass Decision(Enum):\n    ALLOW = \"allow\"\n    ASK = \"ask\"\n    DENY = \"deny\"\n\n@dataclass\nclass BrowserTask:\n    allowed_hosts: set[str]                                 # granted for this task only\n    private_values: set[str] = field(default_factory=set)   # strings read from private sources\n\n    @property\n    def tainted(self) -&gt; bool:\n        return bool(self.private_values)\n\ndef host_of(url: str) -&gt; str | None:\n    u = urlsplit(url)\n    return u.hostname if u.scheme == \"https\" else None      # keeps a trailing dot: \"x.ai.\" != \"x.ai\"\n\ndef carries_private(task: BrowserTask, text: str) -&gt; bool:\n    return any(v and v in text for v in task.private_values)\n\ndef gate(task: BrowserTask, action: str, *, url: str = \"\", text: str = \"\", submits: bool = False,\n         irreversible: bool = False) -&gt; Decision:\n    if irreversible:                                        # purchase, delete, send money\n        return Decision.ASK\n    if action == \"navigate\":\n        host = host_of(url)\n        if host is None:\n            return Decision.DENY                            # no http:, file:, javascript:, data:\n        if carries_private(task, url):\n            return Decision.ASK                             # a GET is an exfiltration channel\n        if host not in task.allowed_hosts:\n            return Decision.ASK if task.tainted else Decision.ALLOW\n        return Decision.ALLOW\n    if action == \"type\":\n        if carries_private(task, text) and host_of(url) not in task.allowed_hosts:\n            return Decision.ASK\n        return Decision.ASK if submits else Decision.ALLOW  # Enter or a submit button sends it\n    if action == \"click\":\n        return Decision.ASK if submits else Decision.ALLOW\n    return Decision.DENY                                    # unknown action: closed by default</code></pre></div>\n<h2 id=\"w16-project-increment\">Project increment</h2>\n<p>rig v0.16: a browser mode with an isolated profile per task and a destination-aware gate behind the policy service.</p>\n<h2 id=\"w16-read\">Read</h2>\n<p><strong><a href=\"https://github.com/browser-use/browser-use\" rel=\"noopener\" target=\"_blank\">browser-use/browser-use</a></strong> at <code>c75e847</code>. Start with <code>skills/open-source/references/agent.md</code> and <code>browser.md</code> for orientation, then:</p>\n<ol type=\"1\">\n<li><code>browser_use/agent/service.py</code> (4,163 lines; read selectively): <code>Agent.run</code> (2503), <code>step</code> (1035), <code>_prepare_context</code> (1087), <code>_get_next_action</code> (1176), <code>get_model_output</code> (1945), <code>_execute_actions</code> (1211), <code>multi_act</code> (2730), <code>_post_process</code> (1219) and <code>_handle_step_error</code> (1258); and how domain-scoped <code>sensitive_data</code> credentials are handled (from line 533).</li>\n<li><code>browser_use/agent/views.py</code>: <code>PageFingerprint</code> (95), <code>ActionLoopDetector</code> (157), <code>ActionResult</code> (307), <code>AgentOutput</code> (388) and <code>AgentHistory</code> (488).</li>\n<li><code>browser_use/tools/service.py</code>: <code>Tools</code> (441) and the actions <code>navigate</code> (507), <code>input</code> (778), <code>upload_file</code> (864), <code>evaluate</code> (1837) and <code>click</code> (2132).</li>\n<li><code>browser_use/browser/watchdogs/security_watchdog.py</code> (296 lines): <code>on_NavigateToUrlEvent</code> (35), <code>_is_url_allowed</code> (176) and <code>_is_url_match</code> (252); and in <code>browser/profile.py</code>, <code>user_data_dir</code> (557), <code>allowed_domains</code> (628) and <code>prohibited_domains</code> (632).</li>\n</ol>\n<p><strong>Brave's <a href=\"https://brave.com/blog/comet-prompt-injection/\" rel=\"noopener\" target=\"_blank\">Comet disclosure</a></strong>: replay it, step by step, against your gate.</p>\n<p><strong>Trace this path:</strong> <code>Agent.run</code> → <code>step</code> → <code>_prepare_context</code> (DOM serialization and screenshot into a browser-state summary) → <code>_get_next_action</code> → <code>get_model_output</code> (an <code>AgentOutput</code> with actions) → <code>_execute_actions</code> → <code>multi_act</code> → a <code>Tools</code> action such as <code>navigate</code> → a navigate event → <code>SecurityWatchdog.on_NavigateToUrlEvent</code> → <code>_is_url_allowed</code> → browser navigation → <code>_post_process</code> (loop detection) → next step.</p>\n<h2 id=\"w16-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w16.q.1\"><input aria-label=\"I can answer this\" data-id=\"w16.q.1\" id=\"c-w16-q-1\" type=\"checkbox\"/><div class=\"task-body\">What does browser-use send the model as \"the page\", and why not raw HTML?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w16.q.2\"><input aria-label=\"I can answer this\" data-id=\"w16.q.2\" id=\"c-w16-q-2\" type=\"checkbox\"/><div class=\"task-body\">How does the security watchdog decide whether a URL is allowed, and how does it treat IP addresses and subdomains?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w16.q.3\"><input aria-label=\"I can answer this\" data-id=\"w16.q.3\" id=\"c-w16-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why is <code>navigate</code> not read-only? Give two exfiltration routes that use navigation alone.</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w16.q.4\"><input aria-label=\"I can answer this\" data-id=\"w16.q.4\" id=\"c-w16-q-4\" type=\"checkbox\"/><div class=\"task-body\">How do domain-scoped credentials keep secrets out of the model's context?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w16.q.5\"><input aria-label=\"I can answer this\" data-id=\"w16.q.5\" id=\"c-w16-q-5\" type=\"checkbox\"/><div class=\"task-body\">Walk the Comet attack through your gate: at which step does rig stop, and on which rule?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w16.q.6\"><input aria-label=\"I can answer this\" data-id=\"w16.q.6\" id=\"c-w16-q-6\" type=\"checkbox\"/><div class=\"task-body\">When would you choose computer use over DOM actions, and what does it cost?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w16-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w16.exp.1\"><input aria-label=\"Done\" data-id=\"w16.exp.1\" id=\"c-w16-exp-1\" type=\"checkbox\"/><div class=\"task-body\">The adversarial pages with the gate off, the gate on, and the gate plus an isolated profile.</div></li>\n<li class=\"task do\" data-id=\"w16.exp.2\"><input aria-label=\"Done\" data-id=\"w16.exp.2\" id=\"c-w16-exp-2\" type=\"checkbox\"/><div class=\"task-body\">DOM only, screenshot only, and both: success rate, tokens and latency.</div></li>\n<li class=\"task do\" data-id=\"w16.exp.3\"><input aria-label=\"Done\" data-id=\"w16.exp.3\" id=\"c-w16-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Loop detection on and off on an infinite-scroll page.</div></li>\n<li class=\"task do\" data-id=\"w16.exp.4\"><input aria-label=\"Done\" data-id=\"w16.exp.4\" id=\"c-w16-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Approvals per benign task: is the gate creating approval fatigue?</div></li>\n</ol>\n<h2 id=\"w16-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Agentic browsing gets its own profile, cookies and credentials.</strong> Never the user's everyday browser.</li>\n<li><strong>Every navigation and submission is a trace event</strong> with its destination host.</li>\n<li><strong>CAPTCHAs and bot detection</strong> are a site's decision; respect them rather than evade them.</li>\n<li><strong>Recordings</strong> (screenshots, network logs) are sensitive data with a retention policy.</li>\n</ul>\n<h2 id=\"w16-not-yet\">Not yet</h2>\n<p>Anti-detection, browser-based crawling at scale, and training visual grounding models.</p>\n<h2 id=\"w16-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w16.check.1\"><input aria-label=\"Done\" data-id=\"w16.check.1\" id=\"c-w16-check-1\" type=\"checkbox\"/><div class=\"task-body\">rig stops at the approval bou
