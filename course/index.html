each, on every change to rig's prompts or tools; nightly, the full suite three times.</div></li>\n<li class=\"task do\" data-id=\"w5.build.6\"><input aria-label=\"Done\" data-id=\"w5.build.6\" id=\"c-w5-build-6\" type=\"checkbox\"/><div class=\"task-body\">Versioned prompts: load every prompt from <code>prompts/</code>, record each one's content hash on the root span, and show in every report which prompt hashes changed between the two runs it compares. For contrast, Open WebUI (Week 14's main read) stores edits to its user prompt library as commits with parents: <code>backend/open_webui/models/prompt_history.py</code> at <code>v0.11.4</code>, <code>PromptHistory</code> (19) and <code>compute_diff</code> (148).</div></li>\n<li class=\"task do\" data-id=\"w5.build.7\"><input aria-label=\"Done\" data-id=\"w5.build.7\" id=\"c-w5-build-7\" type=\"checkbox\"/><div class=\"task-body\">Run the nightly suite through the Message Batches API (half the price; most batches finish within an hour, all within 24 hours) with a 1-hour cache on the shared prefix, and keep CI on the synchronous API. Cache hits in batches are best-effort, so record the hit rate you actually get.</div></li>\n<li class=\"task do\" data-id=\"w5.build.8\"><input aria-label=\"Done\" data-id=\"w5.build.8\" id=\"c-w5-build-8\" type=\"checkbox\"/><div class=\"task-body\">A held-out set of 20 tasks (new seeds, new questions) that you do not open until Week 18.</div></li>\n</ol>\n<h2 id=\"w5-project-increment\">Project increment</h2>\n<p>rig v0.5: OTel traces, validated graders, trajectory metrics and a regression gate. The weekly report becomes the artifact you look at first.</p>\n<h2 id=\"w5-read\">Read</h2>\n<p><strong><a href=\"https://github.com/SWE-bench/SWE-bench\" rel=\"noopener\" target=\"_blank\">SWE-bench/SWE-bench</a> harness.</strong> The canonical outcome grader for coding agents. In <code>swebench/harness/grading.py</code>: <code>test_passed</code> (85), <code>test_failed</code> (101), <code>get_logs_eval</code> (113), <code>get_eval_tests_report</code> (179), <code>compute_fail_to_pass</code> (288), <code>compute_pass_to_pass</code> (298), <code>get_resolution_status</code> (309), <code>get_eval_report</code> (329). Then <code>run_instance</code> in <code>run_evaluation.py</code> (229), <code>log_parsers/python.py</code>, and <code>infra_failure.py</code>.</p>\n<p><strong><a href=\"https://github.com/UKGovernmentBEIS/inspect_ai\" rel=\"noopener\" target=\"_blank\">UKGovernmentBEIS/inspect_ai</a>, selected files.</strong> Its decomposition (task = dataset + solver + scorer) is the right one, and its transcript events are a good reference for trajectory data. Read <code>src/inspect_ai/agent/_react.py</code> (<code>react</code> at 57 and <code>_handle_overflow</code> at 619), <code>scorer/_model.py</code> (<code>model_graded_fact</code> at 35, <code>model_graded_qa</code> at 115, <code>chat_history</code> at 463, <code>neutralize_structural_delimiters</code> at 513), and <code>model/_call_tools.py</code> (<code>execute_tools</code> at 226, <code>call_tool</code> at 842). Skim <code>_eval/task/run.py</code> only for <code>task_run_sample</code> (2259); the file is 4,022 lines.</p>\n<p><strong><a href=\"https://github.com/open-telemetry/semantic-conventions-genai\" rel=\"noopener\" target=\"_blank\">OpenTelemetry GenAI semantic conventions</a>.</strong> These moved out of the main semantic-conventions repository into their own. Read <code>docs/gen-ai/gen-ai-agent-spans.md</code> (the agent, workflow, plan and tool spans), <code>docs/gen-ai/gen-ai-spans.md</code>, and the attribute registry in <code>docs/registry/attributes/gen-ai.md</code>.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>SWE-bench: <code>main</code> → <code>run_instances</code> → <code>run_instance</code> (start the instance container, apply the model's patch, run the eval script, save the log) → <code>get_eval_report</code> → <code>get_logs_eval</code> (parse the log into a test-to-status map) → <code>get_eval_tests_report</code> (success and failure lists for FAIL_TO_PASS and PASS_TO_PASS) → <code>get_resolution_status</code>.</li>\n<li>inspect_ai: <code>eval</code> → <code>task_run</code> → <code>task_run_sample</code> → the <code>react</code> solver's generate and <code>execute_tools</code> loop → scorer → <code>log_sample</code>.</li>\n</ul>\n<h2 id=\"w5-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w5.q.1\"><input aria-label=\"I can answer this\" data-id=\"w5.q.1\" id=\"c-w5-q-1\" type=\"checkbox\"/><div class=\"task-body\">Why does SWE-bench need PASS_TO_PASS at all, and what would scores look like without it?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.2\"><input aria-label=\"I can answer this\" data-id=\"w5.q.2\" id=\"c-w5-q-2\" type=\"checkbox\"/><div class=\"task-body\">How is a test's status recovered from a raw log, and which kinds of flakiness does that expose?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.3\"><input aria-label=\"I can answer this\" data-id=\"w5.q.3\" id=\"c-w5-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why are infrastructure failures counted separately from model failures?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.4\"><input aria-label=\"I can answer this\" data-id=\"w5.q.4\" id=\"c-w5-q-4\" type=\"checkbox\"/><div class=\"task-body\">How does inspect's model-graded scorer present a transcript to the judge, and why does it neutralize structural delimiters first?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.5\"><input aria-label=\"I can answer this\" data-id=\"w5.q.5\" id=\"c-w5-q-5\" type=\"checkbox\"/><div class=\"task-body\">How does inspect's <code>react</code> agent recover from a context overflow, and how does that compare with your Week 3 approach?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.6\"><input aria-label=\"I can answer this\" data-id=\"w5.q.6\" id=\"c-w5-q-6\" type=\"checkbox\"/><div class=\"task-body\">What is the smallest set of spans and attributes that reconstructs cost and latency per run?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.7\"><input aria-label=\"I can answer this\" data-id=\"w5.q.7\" id=\"c-w5-q-7\" type=\"checkbox\"/><div class=\"task-body\">pass@k versus pass^k: which one should a product team track, and why?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w5.q.8\"><input aria-label=\"I can answer this\" data-id=\"w5.q.8\" id=\"c-w5-q-8\" type=\"checkbox\"/><div class=\"task-body\">Roughly how many tasks and runs do you need to detect a 10-point change in pass rate?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w5-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w5.exp.1\"><input aria-label=\"Done\" data-id=\"w5.exp.1\" id=\"c-w5-exp-1\" type=\"checkbox\"/><div class=\"task-body\"><strong>Noise floor.</strong> Run the full suite five times with identical configuration. Compute per-task pass rates and intervals. Compare that noise with every \"improvement\" you made in Weeks 2 to 4.</div></li>\n<li class=\"task do\" data-id=\"w5.exp.2\"><input aria-label=\"Done\" data-id=\"w5.exp.2\" id=\"c-w5-exp-2\" type=\"checkbox\"/><div class=\"task-body\"><strong>Judge calibration.</strong> Label 30 answers from T02 and T18 to T23 yourself; measure the judge's agreement with and without a rubric.</div></li>\n<li class=\"task do\" data-id=\"w5.exp.3\"><input aria-label=\"Done\" data-id=\"w5.exp.3\" id=\"c-w5-exp-3\" type=\"checkbox\"/><div class=\"task-body\"><strong>Outcome versus trajectory.</strong> Find passing runs with bad trajectories and failing runs with good ones; write a grader for each pattern.</div></li>\n<li class=\"task do\" data-id=\"w5.exp.4\"><input aria-label=\"Done\" data-id=\"w5.exp.4\" id=\"c-w5-exp-4\" type=\"checkbox\"/><div class=\"task-body\"><strong>A real A/B.</strong> Re-decide one earlier change (fuzzy edits, the repo map, observation masking) with a paired bootstrap.</div></li>\n<li class=\"task do\" data-id=\"w5.exp.5\"><input aria-label=\"Done\" data-id=\"w5.exp.5\" id=\"c-w5-exp-5\" type=\"checkbox\"/><div class=\"task-body\"><strong>Content-free tracing.</strong> Turn off content capture and try to debug three failures. Decide what content you must keep, and how you will redact it.</div></li>\n</ol>\n<h2 id=\"w5-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Redaction</strong> of secrets and personal data before traces leave the process; content capture off by default.</li>\n<li><strong>Sampling and volume:</strong> full traces for failures and a sample of successes; cost per stored trace.</li>\n<li><strong>Dashboards</strong> you would want on call: success rate, cost per success, p95 latency per step, tool error rate by tool, overflow and retry counts, budget exits.</li>\n<li><strong>Non-determinism:</strong> fixed temperature does not make runs reproducible; your saved transcripts and diffs do.</li>\n</ul>\n<h2 id=\"w5-not-yet\">Not yet</h2>\n<p>Comparing hosted eval and observability platforms, reinforcement learning on trajectories, process reward models, and full SWE-bench runs (a 20-instance subset is plenty for learning and costs far less).</p>\n<h2 id=\"w5-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w5.check.1\"><input aria-label=\"Done\" data-id=\"w5.check.1\" id=\"c-w5-check-1\" type=\"checkbox\"/><div class=\"task-body\">Your weekly report shows intervals and a paired comparison with last week, and you can say which of your earlier changes were real.</div></li>\n<li class=\"task do\" data-id=\"w5.check.2\"><input aria-label=\"Done\" data-id=\"w5.check.2\" id=\"c-w5-check-2\" type=\"checkbox\"/><div class=\"task-body\">Your judge agrees with your labels on at least 85% of the calibration set, or you have documented why not and stopped relying on it.</div></li>\n<li class=\"task do\" data-id=\"w5.check.3\"><input aria-label=\"Done\" data-id=\"w5.check.3\" id=\"c-w5-check-3\" type=\"checkbox\"/><div class=\"task-body\">Questions such as \"why did Tuesday's runs cost more?\" or \"which tool fails most often?\" are answered by one query over your traces.</div></li>\n<li class=\"task do\" data-id=\"w5.check.4\"><input aria-label=\"Done\" data-id=\"w5.check.4\" id=\"c-w5-check-4\" type=\"checkbox\"/><div class=\"task-body\">You can implement the SWE-bench resolution rule for a new repository from memory.</div></li>\n</ul>\n", "toc": [["w5-concepts", "Concepts", []], ["w5-day-by-day", "Day by day", [["w5-day-by-day-mon", "Monday — the vocabulary this week makes precise."], ["w5-day-by-day-tue", "Tuesday — spans and graders."], ["w5-day-by-day-wed", "Wednesday — trajectory, statistics, and a gate."], ["w5-day-by-day-thu", "Thursday — prompt hashes and batches, then read the two canonical harnesses."], ["w5-day-by-day-fri", "Friday — look at your own traces, not new numbers."], ["w5-day-by-day-sat", "Saturday — seal the held-out set, then find your noise floor."], ["w5-day-by-day-sun", "Sunday — re-decide one earlier change, then the checkpoint."]]], ["w5-build", "Build", []], ["w5-project-increment", "Project increment", []], ["w5-read", "Read", []], ["w5-you-should-be-able-to-answer", "You should be able to answer", []], ["w5-experiments", "Experiments", []], ["w5-production-lens", "Production lens", []], ["w5-not-yet", "Not yet", []], ["w5-checkpoint", "Checkpoint", []]], "text": "You have been tracing and evaluating since Day 1. This week you make the results trustworthy: standard spans, graders you have validated, trajectory metrics, and statistics that tell you whether a change was real. By Sunday you should distrust any single-run improvement, including your own. Everything from Week 10 on is graded by a model, so the grader you validate this week is the instrument for the rest of the plan. Concepts Spans, not logs. A trace is a tree of timed spans with attributes. The OpenTelemetry GenAI conventions name the agent operations: invoke_agent, chat, execute_tool, plan, invoke_workflow, create_agent. Usage lands in gen_ai.usage.*, tools in gen_ai.tool.*. Capturing message content is opt-in for privacy reasons. The anatomy of an eval: a dataset of tasks with pinned environments, a solver (the agent), a grader, and metrics. Graders are deterministic (tests, exact match), model-graded (a judge with a rubric), or human. Outcome versus trajectory. Outcome grading checks the final state. Trajectory grading checks the path: wasted steps, repeated reads, edits outside scope, tests never run after the last edit, policy violations, recovery after tool errors. A pass with a bad trajectory is a future failure. The SWE-bench rule. An instance is resolved only if every FAIL_TO_PASS test now passes and every PASS_TO_PASS test still passes. Your T04 to T11 already follow it. Statistics. pass@k (at least one of k runs passes) flatters agents; pass^k (all k pass) measures reliability. Use Wilson intervals for rates and paired comparisons on the same tasks for A/B tests. Twelve tasks run three times cannot resolve small differences. Judges need validation. An LLM judge is a classifier; measure its agreement with your labels and watch for verbosity and position bias, and for prompt injection from the transcript it grades. Prompts are code. System prompts, tool descriptions, routing policies and grader rubrics live in files under version control. Each run records the hash of every prompt it used, so a regression points at the change that caused it. Eval hygiene: infrastructure failures are excluded from model metrics, a held-out set is never used for tuning, and eval data never leaks into prompts. Day by day Eight Build steps this week, but the real deliverable is trust: by Sunday you should distrust any single-run improvement, including your own. The schedule below front-loads the instruments (spans, graders, statistics) so the weekend's noise-floor and judge-calibration runs have something real to measure against. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts above; note the eval anatomy Half-page note: spans vs logs, outcome vs trajectory, pass@k vs pass^k Tue 3 to 4 h Build steps 1 and 2 A root invoke_agent span per run with chat/execute_tool children; graders.py with all five graders returning verdict plus evidence Wed 3 to 4 h Build steps 3 to 5 Trajectory metrics extracted from traces; report.py with Wilson intervals and a paired bootstrap; a CI gate wired to every prompt/tool change Thu 1.5 to 2 h Build steps 6 and 7; read SWE-bench, inspect_ai and the OTel conventions; trace both paths Prompt hashes shown in every report; the nightly suite running through the Batches API with a measured cache-hit rate Fri 1 to 1.5 h Experiments 3 and 5 A labeled pass-with-bad-trajectory and fail-with-good-trajectory example each; a decision on what trace content you must keep Sat 3 to 4 h Build step 8; Experiments 1 and 2 The sealed 20-task held-out set; the noise floor from five identical runs; judge agreement measured against 30 hand-labeled answers Sun 2 to 3 h Experiment 4; answer remaining questions; attempt Checkpoint One earlier change re-decided with a paired bootstrap; checkpoint passed or a redo list Monday — the vocabulary this week makes precise. \"It passed\" and \"it got better\" are claims you've been making loosely since Week 1. Today you read the vocabulary that lets you stop: spans instead of logs, outcome versus trajectory, pass@k versus pass^k. Everything you build this week exists to make those claims checkable. Read Concepts above. Write a half-page note: the OTel GenAI span types, and why pass@k flatters an agent while pass^k measures its reliability. Tuesday — spans and graders. Today you build the two things every later measurement depends on: a trace that's actually a tree of timed spans instead of a flat JSONL, and a set of graders that return evidence, not just a boolean. Get the grader contract right now, because this week's whole point is that you validate these graders before trusting any of them. Build step 1: OTel instrumentation — a root invoke_agent span per run, chat per model call, execute_tool per tool call, with GenAI attributes; a JSONL-to-OTLP converter, not a replacement for the JSONL. Build step 2: evals/graders.py — tests_pass, no_test_edits, hidden_tests, answer_mentions, llm_judge, each returning a verdict plus evidence. Wednesday — trajectory, statistics, and a gate. A pass rate alone doesn't tell you if a run was good, and a single run's pass rate doesn't tell you if a change was real. Today you build the metrics that grade the path, the statistics that grade the comparison, and the gate that runs both automatically. Build step 3: trajectory metrics from traces — redundant reads, repeated calls, time to first relevant file, edit churn, tests run after the last edit, tool-error recovery, policy events, cost. Build step 4: evals/report.py — pass@1 and pass^3 with Wilson intervals, and a paired bootstrap between two rig versions on the same tasks. Build step 5: a CI gate — T01 to T09 once on every prompt or tool change, the full suite three times nightly. Thursday — prompt hashes and batches, then read the two canonical harnesses. Two small Build steps left; both fit before the day's main work, reading SWE-bench's grading code and inspect_ai's task/solver/scorer split, the two references your own harness has been converging on since Week 1. Build step 6: versioned prompts — every prompt loaded from prompts/, its content hash on the root span, changed hashes surfaced in every comparison report. Build step 7: the nightly suite through the Message Batches API with a 1-hour cache on the shared prefix; record the actual cache-hit rate you get. Read SWE-bench's grading.py and run_evaluation.py, and inspect_ai's _react.py, scorer/_model.py and _call_tools.py, listed under Read above. Trace both paths given there: SWE-bench's main through get_resolution_status, and inspect_ai's eval through task_run_sample to the scorer. Friday — look at your own traces, not new numbers. No new runs today, just a close read of what you already have. The point is to find the gap between \"passed\" and \"good,\" and to decide what a trace absolutely must capture before you turn content capture off by default. Run Experiments 3 and 5: find one passing run with a bad trajectory and one failing run with a good one, and write a grader for each pattern; then turn off content capture and try to debug three failures, and decide what you must keep. Saturday — seal the held-out set, then find your noise floor. Today's Build step is a one-line discipline with real consequences: twenty tasks you write and then don't look at again until Week 18. The rest of the day answers the question this whole week has been building toward — how much of what you called \"progress\" in Weeks 2 to 4 was actually noise. Build step 8: write 20 held-out tasks (new seeds, new questions); do not open this set again before Week 18. Run Experiment 1, the noise floor: the full suite five times with identical configuration; compute per-task pass rates and intervals. Run Experiment 2: label 30 answers from T02 and T18 to T23 yourself, then measure the judge's agreement with and without a rubric. Sunday — re-decide one earlier change, then the checkpoint. No new code today. Pick one change from Weeks 2 to 4 you were proud of and find out, with a real paired comparison, whether it actually did anything. Run Experiment 4: re-decide one earlier change (fuzzy edits, the repo map, observation masking) with a paired bootstrap against Saturday's noise floor. Answer the remaining questions in You should be able to answer. Attempt Checkpoint above. If your judge disagrees with your own labels more than 15% of the time, document why before leaning on it again. Build OTel instrumentation: a root invoke_agent span per run, a chat span per model call, an execute_tool span per tool call, with the GenAI attributes. Write a converter from your JSONL to OTLP rather than replacing the JSONL, so the mapping is explicit. View traces in any local OTLP backend. evals/graders.py: tests_pass(f2p, p2p), no_test_edits(), hidden_tests(path), answer_mentions(items, ordered=True), llm_judge(rubric). Every grader returns a verdict plus evidence. Trajectory metrics from traces: redundant reads, repeated identical calls, time to first relevant file, edit churn (lines changed then reverted), tests run after the last edit, tool-error recovery, policy events, cost. evals/report.py: pass@1 and pass^3 with Wilson intervals, and a paired bootstrap between two rig versions on the same task set. A CI gate: T01 to T09, one run each, on every change to rig's prompts or tools; nightly, the full suite three times. Versioned prompts: load every prompt from prompts/, record each one's content hash on the root span, and show in every report which prompt hashes changed between the two runs it compares. For contrast, Open WebUI (Week 14's main read) stores edits to its user prompt library as commits with parents: backend/open_webui/models/prompt_history.py at v0.11.4, PromptHistory (19) and compute_diff (148). Run the nightly suite through the Message Batches API (half the price; most batches finish within an hour, all within 24 hours) with a 1-hour cache on the shared prefix, and keep CI on the synchronous API. Cache hits in batches are best-effort, so record the hit rate you actually get. A held-out set of 20 tasks (new seeds, new questions) that you do not open until Week 18. Project increment rig v0.5: OTel traces, validated graders, trajectory metrics and a regression gate. The weekly report becomes the artifact you look at first. Read SWE-bench/SWE-bench harness. The canonical outcome grader for coding agents. In swebench/harness/grading.py: test_passed (85), test_failed (101), get_logs_eval (113), get_eval_tests_report (179), compute_fail_to_pass (288), compute_pass_to_pass (298), get_resolution_status (309), get_eval_report (329). Then run_instance in run_evaluation.py (229), log_parsers/python.py, and infra_failure.py. UKGovernmentBEIS/inspect_ai, selected files. Its decomposition (task = dataset + solver + scorer) is the right one, and its transcript events are a good reference for trajectory data. Read src/inspect_ai/agent/_react.py (react at 57 and _handle_overflow at 619), scorer/_model.py (model_graded_fact at 35, model_graded_qa at 115, chat_history at 463, neutralize_structural_delimiters at 513), and model/_call_tools.py (execute_tools at 226, call_tool at 842). Skim _eval/task/run.py only for task_run_sample (2259); the file is 4,022 lines. OpenTelemetry GenAI semantic conventions. These moved out of the main semantic-conventions repository into their own. Read docs/gen-ai/gen-ai-agent-spans.md (the agent, workflow, plan and tool spans), docs/gen-ai/gen-ai-spans.md, and the attribute registry in docs/registry/attributes/gen-ai.md. Trace these paths: SWE-bench: main → run_instances → run_instance (start the instance container, apply the model's patch, run the eval script, save the log) → get_eval_report → get_logs_eval (parse the log into a test-to-status map) → get_eval_tests_report (success and failure lists for FAIL_TO_PASS and PASS_TO_PASS) → get_resolution_status. inspect_ai: eval → task_run → task_run_sample → the react solver's generate and execute_tools loop → scorer → log_sample. You should be able to answer Why does SWE-bench need PASS_TO_PASS at all, and what would scores look like without it? Can answer How is a test's status recovered from a raw log, and which kinds of flakiness does that expose? Can answer Why are infrastructure failures counted separately from model failures? Can answer How does inspect's model-graded scorer present a transcript to the judge, and why does it neutralize structural delimiters first? Can answer How does inspect's react agent recover from a context overflow, and how does that compare with your Week 3 approach? Can answer What is the smallest set of spans and attributes that reconstructs cost and latency per run? Can answer pass@k versus pass^k: which one should a product team track, and why? Can answer Roughly how many tasks and runs do you need to detect a 10-point change in pass rate? Can answer Experiments Noise floor. Run the full suite five times with identical configuration. Compute per-task pass rates and intervals. Compare that noise with every \"improvement\" you made in Weeks 2 to 4. Judge calibration. Label 30 answers from T02 and T18 to T23 yourself; measure the judge's agreement with and without a rubric. Outcome versus trajectory. Find passing runs with bad trajectories and failing runs with good ones; write a grader for each pattern. A real A/B. Re-decide one earlier change (fuzzy edits, the repo map, observation masking) with a paired bootstrap. Content-free tracing. Turn off content capture and try to debug three failures. Decide what content you must keep, and how you will redact it. Production lens Redaction of secrets and personal data before traces leave the process; content capture off by default. Sampling and volume: full traces for failures and a sample of successes; cost per stored trace. Dashboards you would want on call: success rate, cost per success, p95 latency per step, tool error rate by tool, overflow and retry counts, budget exits. Non-determinism: fixed temperature does not make runs reproducible; your saved transcripts and diffs do. Not yet Comparing hosted eval and observability platforms, reinforcement learning on trajectories, process reward models, and full SWE-bench runs (a 20-instance subset is plenty for learning and costs far less). Checkpoint Your weekly report shows intervals and a paired comparison with last week, and you can say which of your earlier changes were real. Your judge agrees with your labels on at least 85% of the calibration set, or you have documented why not and stopped relying on it. Questions such as \"why did Tuesday's runs cost more?\" or \"which tool fails most often?\" are answered by one query over your traces. You can implement the SWE-bench resolution rule for a new repository from memory.", "tasks": 25}, {"id": "w6", "group": "Weeks", "title": "Week 6: the model, from tokenizer to KV cache", "short": "Week 6", "html": "<p>Everything above the API is a loop around one function: tokens in, a distribution over the next token out. This week you open that function. By Sunday you can follow a chat message from text to token ids to logits and back, show that tool calling is special tokens plus code that intercepts them, and measure what a KV cache saves.</p>\n<h2 id=\"w6-concepts\">Concepts</h2>\n<ul>\n<li><strong>Tokenization.</strong> Byte-level BPE learns merges from data. Special tokens are reserved ids that mark roles and tool calls; a chat template is nothing more than those ids wrapped around text.</li>\n<li><strong>The forward pass.</strong> Embeddings, then blocks of attention (with rotary position embeddings and a causal mask) and MLP on a residual stream, then logits over the vocabulary.</li>\n<li><strong>Prefill versus decode.</strong> Prefill runs the whole prompt in parallel and is compute-bound. Decode produces one token at a time and reads the entire KV cache each step, so it is memory-bandwidth-bound. That is why time to first token grows with prompt length, and why output tokens are priced higher than input tokens.</li>\n<li><strong>The KV cache.</strong> Keys and values for every layer and every token already processed: 2 × layers × KV heads × head dimension × bytes per value, per token. Week 3's prompt caching is this tensor kept between requests.</li>\n<li><strong>Sampling.</strong> Temperature and top-k reshape the distribution before one token is drawn. Determinism is a property of the whole serving stack, not of temperature alone.</li>\n<li><strong>The training stack in one sentence each.</strong> Pretraining is next-token loss on text. Supervised fine-tuning is the same loss on conversations, masked so only assistant tokens are learned. Reinforcement learning samples completions, scores them and pushes up the probability of the better ones.</li>\n<li><strong>Tool calling at the token level.</strong> The model emits a start token, the call, and an end token; the inference engine stops, runs the tool and forces the result tokens back into the sequence. Week 1's <code>tool_use</code> and <code>tool_result</code> blocks are the API's rendering of exactly this.</li>\n</ul>\n<h2 id=\"w6-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1-1.5 h</td>\n<td>Concepts: tokenization, the forward pass, prefill/decode, the KV cache; clone nanochat at the pinned commit</td>\n<td>A half-page note on tokenization and the forward pass; nanochat cloned and its CPU run ready to kick off</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5-3 h</td>\n<td>Build step 1 (BPE trainer); start Build step 2's CPU run in the background</td>\n<td>Your own byte-level BPE trainer/encoder passing a sanity check; <code>runs/runcpu.sh</code> training in the background</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2.5-3 h</td>\n<td>Build step 4 (transformer block forward pass); check on the CPU run or optional GPU speedrun</td>\n<td>Your block's forward pass matches <code>Block.forward</code> to floating-point tolerance; a trained nanochat checkpoint on disk</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2 h</td>\n<td>Read nanochat (<code>tokenizer.py</code>, <code>engine.py</code>); trace the generate path; Build step 5 (swap in rig's <code>search</code> tool)</td>\n<td>The annotated trace of <code>chat_cli.py</code> to a sampled token; a copy of <code>Engine.generate</code> that calls <code>search</code> instead of the calculator</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5 h</td>\n<td>Build step 3 (<code>kvdemo.py</code>)</td>\n<td>A tokens-per-second-vs-context-length plot, cache on and off</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3-4 h</td>\n<td>Experiments 1-4; rig v0.6 project increment</td>\n<td>Experiment numbers written up; rig traces carry time-to-first-token and time-per-output-token</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2-3 h</td>\n<td>Answer the seven questions; attempt the checkpoint</td>\n<td>Checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w6-day-by-day-mon\">Monday — tokens in, logits out, nothing running yet.</h3>\n<p>Today is reading and arithmetic, not code: you need the shape of the forward pass and what a KV cache actually stores before any of this week's builds make sense, since Tuesday through Thursday all assume you already know what a block, a head and a cache entry are. Spend most of the time on Concepts above, especially prefill versus decode and the KV-cache size formula, and work the bytes-per-token arithmetic for nanochat's default model by hand before you check it against the real helper on Thursday.</p>\n<ol type=\"1\">\n<li>Read Concepts above twice; write a half-page note covering tokenization, the forward pass, prefill versus decode, and the KV cache.</li>\n<li>Compute <code>kv_bytes_per_token</code> for nanochat's default config by hand (layers x KV heads x head dimension x 2 x bytes per value).</li>\n<li>Clone nanochat at the pinned commit (see <strong>Read: nanochat</strong> below) and confirm <code>runs/runcpu.sh</code> runs a trivial smoke step without error.</li>\n</ol>\n<h3 id=\"w6-day-by-day-tue\">Tuesday — your own tokenizer, then start the clock on nanochat's run.</h3>\n<p>Build step 1 is the cheapest way to make byte-level BPE concrete: training your own merges on real source and comparing token counts against nanochat's tokenizer tells you immediately whether your mental model of \"merges learned from data\" is right. The nanochat CPU run (Build step 2) takes tens of minutes, so start it today and let it run while you work rather than treating it as separate idle time.</p>\n<ol type=\"1\">\n<li>Implement Build step 1: a byte-level BPE trainer and encoder in about 100 lines, trained on click's source.</li>\n<li>Compare token counts for rig's system prompt under your tokenizer against nanochat's.</li>\n<li>Kick off Build step 2's CPU run (or the GPU <code>speedrun.sh</code>, if you're renting one this week) in the background; let it keep running if it's not done by the time you stop.</li>\n</ol>\n<h3 id=\"w6-day-by-day-wed\">Wednesday — a transformer block by hand, and a trained checkpoint to show for it.</h3>\n<p>Writing your own forward pass for one block and checking it against nanochat's <code>Block.forward</code> is the only way to confirm you actually understand attention and the residual stream, rather than just being able to describe them. By tonight yesterday's run should also be finished, giving you a real checkpoint for Thursday's and Friday's tools.</p>\n<ol type=\"1\">\n<li>Implement Build step 4: one transformer block's forward pass with plain tensor operations (rotary embeddings, causal mask, MLP, residual stream).</li>\n<li>Check it matches <code>Block.forward</code> to floating-point tolerance, feeding it the same weights.</li>\n<li>Confirm yesterday's nanochat run finished and you have a checkpoint; an undertrained CPU run is fine, it only needs to produce tokens for Thursday and Friday.</li>\n</ol>\n<h3 id=\"w6-day-by-day-thu\">Thursday — read nanochat end to end, then make its tool calling yours.</h3>\n<p>Today is the week's reference-implementation day: read the tokenizer and engine files in the order given in <strong>Read: nanochat</strong> below, and trace the exact path from <code>chat_cli.py</code> to a sampled token so the KV cache and the tool state machine stop being diagrams. Then do Build step 5 — swapping the calculator for rig's <code>search</code> tool inside a copy of <code>Engine.generate</code> — because it demonstrates, concretely, that tool calling is trained behavior: the plumbing works first try, and the model still uses the tool badly.</p>\n<ol type=\"1\">\n<li>Read <code>tokenizer.py</code> and <code>engine.py</code> per <strong>Read: nanochat</strong> below; write out the trace from <code>chat_cli.py</code> to a sampled token.</li>\n<li>Implement Build step 5: copy <code>Engine.generate</code>, swap <code>use_calculator</code> for rig's <code>search</code>, run a few prompts, and note exactly how the model misuses it.</li>\n</ol>\n<h3 id=\"w6-day-by-day-fri\">Friday — the KV cache's payoff, measured.</h3>\n<p>No new reading today. You already know what the KV cache stores and traced the engine that uses it; today you measure what it's actually worth, which is Build step 3 and nothing else.</p>\n<ol type=\"1\">\n<li>Implement <code>rig/kvdemo.py</code>: decode with and without a KV cache from your trained model, plotting tokens per second as context grows from 128 to 2,048 tokens.</li>\n<li>Compare the shape of the curve against your bytes-per-token arithmetic from Monday.</li>\n</ol>\n<h3 id=\"w6-day-by-day-sat\">Saturday — the four experiments, and the project increment.</h3>\n<p>Today you turn this week's pieces into numbers you can compare: the KV-cache curve, sampling determinism, tokenizer vocabulary size, and FLOPs against your own measured latency. This is also when rig gains the instrumentation — time to first token and time per output token — that Week 8's routing decisions and Week 10's latency budgets both depend on.</p>\n<ol type=\"1\">\n<li>Run Experiments 1-4 in <strong>Experiments</strong> below.</li>\n<li>Ship rig v0.6 per <strong>Project increment</strong> below: time to first token and time per output token recorded for every model call, from the streaming events.</li>\n</ol>\n<h3 id=\"w6-day-by-day-sun\">Sunday — answer for it, then the checkpoint.</h3>\n<p>No new code today. Go through the seven questions in <strong>You should be able to answer</strong> below from memory first, then check yourself against the reading; anything you can't answer without looking is a gap to close before Week 7's serving engine, which assumes all of this.</p>\n<ol type=\"1\">\n<li>Answer each of the seven questions in <strong>You should be able to answer</strong> below in your notes.</li>\n<li>Attempt <strong>Checkpoint</strong> below; redo the relevant day if you can't pass it cold.</li>\n</ol>\n<h2 id=\"w6-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w6.build.1\"><input aria-label=\"Done\" data-id=\"w6.build.1\" id=\"c-w6-build-1\" type=\"checkbox\"/><div class=\"task-body\">A byte-level BPE trainer and encoder in about 100 lines. Train it on click's source and compare token counts for rig's system prompt against nanochat's tokenizer.</div></li>\n<li class=\"task do\" data-id=\"w6.build.2\"><input aria-label=\"Done\" data-id=\"w6.build.2\" id=\"c-w6-build-2\" type=\"checkbox\"/><div class=\"task-body\">Run nanochat end to end with <code>runs/runcpu.sh</code> on CPU or Apple Silicon; the README describes a deliberately tiny model that trains in tens of minutes. Optional: <code>runs/speedrun.sh</code> on a rented 8×H100 node for a GPT-2-level model in about 2 hours, roughly $48 at the README's $3 per GPU-hour.</div></li>\n<li class=\"task do\" data-id=\"w6.build.3\"><input aria-label=\"Done\" data-id=\"w6.build.3\" id=\"c-w6-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/kvdemo.py</code>: decode with and without a KV cache from your small model and plot tokens per second as context grows from 128 to 2,048 tokens.</div></li>\n<li class=\"task do\" data-id=\"w6.build.4\"><input aria-label=\"Done\" data-id=\"w6.build.4\" id=\"c-w6-build-4\" type=\"checkbox\"/><div class=\"task-body\">Write one transformer block's forward pass with plain tensor operations and check it matches <code>Block.forward</code> to within floating-point tolerance.</div></li>\n<li class=\"task do\" data-id=\"w6.build.5\"><input aria-label=\"Done\" data-id=\"w6.build.5\" id=\"c-w6-build-5\" type=\"checkbox\"/><div class=\"task-body\">In a copy of <code>Engine.generate</code>, swap the calculator for rig's <code>search</code> tool. The plumbing works first time; the model uses it badly, because tool use is trained behaviour, not an interface.</div></li>\n</ol>\n<h2 id=\"w6-project-increment\">Project increment</h2>\n<p>rig v0.6 records time to first token and time per output token for every model call (from the streaming events), so prefill and decode costs appear in your traces next to the token counts.</p>\n<h2 id=\"w6-read-nanochat\">Read: nanochat</h2>\n<p><a href=\"https://github.com/karpathy/nanochat\" rel=\"noopener\" target=\"_blank\">karpathy/nanochat</a> at <code>92d63d4</code> covers tokenizer, pretraining, fine-tuning, RL, inference and a chat CLI in one small repository with no framework. Its README frames the goal as a readable, forkable baseline rather than a configurable framework. Read in this order:</p>\n<ol type=\"1\">\n<li><code>nanochat/tokenizer.py</code>: <code>SPECIAL_TOKENS</code> (line 9), <code>RustBPETokenizer.train_from_iterator</code> (42), <code>encode</code> (96) and <code>render_conversation</code> (140). The mask in <code>render_conversation</code> decides what is trained: the tool call is learned (line 206, mask 1) and the tool's output is not (line 212, mask 0).</li>\n<li><code>nanochat/gpt.py</code> (555 lines): <code>GPTConfig</code> (29), <code>apply_rotary_emb</code> (57), <code>CausalSelfAttention.forward</code> (84), <code>MLP</code> (131), <code>Block</code> (144), <code>GPT.forward</code> (459), and the cost helpers <code>estimate_decode_flops</code> (351), <code>estimate_prefill_flops</code> (362) and <code>kv_bytes_per_token</code> (374).</li>\n<li><code>nanochat/engine.py</code> (352 lines): <code>KVCache</code> (82), <code>sample_next_token</code> (141) and <code>Engine.generate</code> (176), which prefills once at batch size 1 (194), copies the cache for each sample (217), then decodes. The tool-call state machine starts at 252: it collects tokens after <code>&lt;|python_start|&gt;</code>, calls <code>use_calculator</code> (259) and forces <code>&lt;|output_start|&gt;</code>, the result and <code>&lt;|output_end|&gt;</code> into the sequence (262).</li>\n<li><code>scripts/chat_sft.py</code>: <code>sft_data_generator_bos_bestfit</code> (180) packs conversations and their masks into fixed-length rows.</li>\n<li><code>scripts/base_train.py</code>: the training loop (<code>while True</code>, line 416) and gradient accumulation (510).</li>\n</ol>\n<p><strong>Trace this path:</strong> <code>scripts/chat_cli.py</code> builds an <code>Engine</code> (line 35) → <code>Engine.generate</code> → <code>GPT.forward</code> on the full prompt (prefill) → <code>KVCache.prefill</code> copies it per sample → loop: <code>GPT.forward</code> on the last token only → <code>sample_next_token</code> → tool state machine (sample, or pop a forced token) → yield the token → stop on <code>&lt;|assistant_end|&gt;</code> or <code>max_tokens</code>.</p>\n<h2 id=\"w6-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w6.q.1\"><input aria-label=\"I can answer this\" data-id=\"w6.q.1\" id=\"c-w6-q-1\" type=\"checkbox\"/><div class=\"task-body\">Why does a chat template need special tokens, and what would go wrong if role markers were ordinary text?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.2\"><input aria-label=\"I can answer this\" data-id=\"w6.q.2\" id=\"c-w6-q-2\" type=\"checkbox\"/><div class=\"task-body\">What exactly does the KV cache store, and how many bytes per token for nanochat's default model? Check your arithmetic against <code>kv_bytes_per_token</code>.</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.3\"><input aria-label=\"I can answer this\" data-id=\"w6.q.3\" id=\"c-w6-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why is prefill compute-bound and decode bandwidth-bound? Which one dominates a rig step with a 30,000-token prompt and a 300-token reply?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.4\"><input aria-label=\"I can answer this\" data-id=\"w6.q.4\" id=\"c-w6-q-4\" type=\"checkbox\"/><div class=\"task-body\">In <code>render_conversation</code>, why are tool outputs masked out of the loss while tool calls are not?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.5\"><input aria-label=\"I can answer this\" data-id=\"w6.q.5\" id=\"c-w6-q-5\" type=\"checkbox\"/><div class=\"task-body\">What does <code>Engine.generate</code> do differently for forced tokens, and why does it record which tokens were sampled?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.6\"><input aria-label=\"I can answer this\" data-id=\"w6.q.6\" id=\"c-w6-q-6\" type=\"checkbox\"/><div class=\"task-body\">Map Week 1's <code>stop_reason: \"tool_use\"</code> onto the token-level loop. Where does the API server stop sampling?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w6.q.7\"><input aria-label=\"I can answer this\" data-id=\"w6.q.7\" id=\"c-w6-q-7\" type=\"checkbox\"/><div class=\"task-body\">Why does a model ignore a tool it was never trained to call, even when the plumbing works?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w6-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w6.exp.1\"><input aria-label=\"Done\" data-id=\"w6.exp.1\" id=\"c-w6-exp-1\" type=\"checkbox\"/><div class=\"task-body\">KV cache on versus off: tokens per second against context length. Fit the curve and explain its shape.</div></li>\n<li class=\"task do\" data-id=\"w6.exp.2\"><input aria-label=\"Done\" data-id=\"w6.exp.2\" id=\"c-w6-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Temperature 0 versus 0.7 on ten prompts, five samples each: count distinct outputs.</div></li>\n<li class=\"task do\" data-id=\"w6.exp.3\"><input aria-label=\"Done\" data-id=\"w6.exp.3\" id=\"c-w6-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Train your BPE at three vocabulary sizes; compare tokens per line of click's source and how many tokens a typical tool call costs.</div></li>\n<li class=\"task do\" data-id=\"w6.exp.4\"><input aria-label=\"Done\" data-id=\"w6.exp.4\" id=\"c-w6-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Compute prefill and decode FLOPs for one of your rig steps with the helpers in <code>gpt.py</code>, and compare with the latency split you now record.</div></li>\n</ol>\n<h2 id=\"w6-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Latency has two numbers.</strong> Time to first token (prefill plus queueing) and time per output token (decode). Every latency budget in Weeks 10, 16 and 17 is a sum of these.</li>\n<li><strong>Cost follows the same split.</strong> Long prompts cost prefill compute once per request unless cached; long outputs cost decode time for every token.</li>\n<li><strong>Context length is a memory budget</strong> on the serving side: the KV cache, not the weights, limits how many long conversations a GPU can hold at once.</li>\n</ul>\n<h2 id=\"w6-not-yet\">Not yet</h2>\n<p>Distributed training, mixture-of-experts, quantization schemes, custom kernels and scaling-law fitting. They matter at a frontier lab; for building on models, the forward pass, the cache and the loss mask are what you need.</p>\n<h2 id=\"w6-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w6.check.1\"><input aria-label=\"Done\" data-id=\"w6.check.1\" id=\"c-w6-check-1\" type=\"checkbox\"/><div class=\"task-body\">You can draw nanochat's path from <code>chat_cli.py</code> to a sampled token, with the KV cache and the tool state machine, from memory.</div></li>\n<li class=\"task do\" data-id=\"w6.check.2\"><input aria-label=\"Done\" data-id=\"w6.check.2\" id=\"c-w6-check-2\" type=\"checkbox\"/><div class=\"task-body\">Your <code>kvdemo.py</code> numbers match a back-of-envelope estimate from <code>kv_bytes_per_token</code> and your hardware's memory bandwidth to within a factor of two.</div></li>\n<li class=\"task do\" data-id=\"w6.check.3\"><input aria-label=\"Done\" data-id=\"w6.check.3\" id=\"c-w6-check-3\" type=\"checkbox\"/><div class=\"task-body\">You can explain to a colleague, with nanochat line numbers, why \"the model calls a tool\" is a sentence about tokens.</div></li>\n</ul>\n", "toc": [["w6-concepts", "Concepts", []], ["w6-day-by-day", "Day by day", [["w6-day-by-day-mon", "Monday — tokens in, logits out, nothing running yet."], ["w6-day-by-day-tue", "Tuesday — your own tokenizer, then start the clock on nanochat's run."], ["w6-day-by-day-wed", "Wednesday — a transformer block by hand, and a trained checkpoint to show for it."], ["w6-day-by-day-thu", "Thursday — read nanochat end to end, then make its tool calling yours."], ["w6-day-by-day-fri", "Friday — the KV cache's payoff, measured."], ["w6-day-by-day-sat", "Saturday — the four experiments, and the project increment."], ["w6-day-by-day-sun", "Sunday — answer for it, then the checkpoint."]]], ["w6-build", "Build", []], ["w6-project-increment", "Project increment", []], ["w6-read-nanochat", "Read: nanochat", []], ["w6-you-should-be-able-to-answer", "You should be able to answer", []], ["w6-experiments", "Experiments", []], ["w6-production-lens", "Production lens", []], ["w6-not-yet", "Not yet", []], ["w6-checkpoint", "Checkpoint", []]], "text": "Everything above the API is a loop around one function: tokens in, a distribution over the next token out. This week you open that function. By Sunday you can follow a chat message from text to token ids to logits and back, show that tool calling is special tokens plus code that intercepts them, and measure what a KV cache saves. Concepts Tokenization. Byte-level BPE learns merges from data. Special tokens are reserved ids that mark roles and tool calls; a chat template is nothing more than those ids wrapped around text. The forward pass. Embeddings, then blocks of attention (with rotary position embeddings and a causal mask) and MLP on a residual stream, then logits over the vocabulary. Prefill versus decode. Prefill runs the whole prompt in parallel and is compute-bound. Decode produces one token at a time and reads the entire KV cache each step, so it is memory-bandwidth-bound. That is why time to first token grows with prompt length, and why output tokens are priced higher than input tokens. The KV cache. Keys and values for every layer and every token already processed: 2 × layers × KV heads × head dimension × bytes per value, per token. Week 3's prompt caching is this tensor kept between requests. Sampling. Temperature and top-k reshape the distribution before one token is drawn. Determinism is a property of the whole serving stack, not of temperature alone. The training stack in one sentence each. Pretraining is next-token loss on text. Supervised fine-tuning is the same loss on conversations, masked so only assistant tokens are learned. Reinforcement learning samples completions, scores them and pushes up the probability of the better ones. Tool calling at the token level. The model emits a start token, the call, and an end token; the inference engine stops, runs the tool and forces the result tokens back into the sequence. Week 1's tool_use and tool_result blocks are the API's rendering of exactly okenizer and engine files in the order given in Read: nanochat below, and trace the exact path from chat_cli.py to a sampled token so the KV cache and the tool state machine stop being diagrams. Then do Build step 5 — swapping the calculator for rig's search tool inside a copy of Engine.generate — because it demonstrates, concretely, that tool calling is trained behavior: the plumbing works first try, and the model still uses the tool badly. Read tokenizer.py and engine.py per Read: nanochat below; write out the trace from chat_cli.py to a sampled token. Implement Build step 5: copy Engine.generate, swap use_calculator for rig's search, run a few prompts, and note exactly how the model misuses it. Friday — the KV cache's payoff, measured. No new reading today. You already know what the KV cache stores and traced the engine that uses it; today you measure what it's actually worth, which is Build step 3 and nothing else. Implement rig/kvdemo.py: decode with and without a KV cache from your trained model, plotting tokens per second as context grows from 128 to 2,048 tokens. Compare the shape of the curve against your bytes-per-token arithmetic from Monday. Saturday — the four experiments, and the project increment. Today you turn this week's pieces into numbers you can compare: the KV-cache curve, sampling determinism, tokenizer vocabulary size, and FLOPs against your own measured latency. This is also when rig gains the instrumentation — time to first token and time per output token — that Week 8's routing decisions and Week 10's latency budgets both depend on. Run Experiments 1-4 in Experiments below. Ship rig v0.6 per Project increment below: time to first token and time per output token recorded for every model call, from the streaming events. Sunday — answer for it, then the checkpoint. No new code today. Go through the seven questions in You should be able to answer below from memory first, then check yourself against the reading; anything you can't answer withou l, even when the plumbing works? Can answer Experiments KV cache on versus off: tokens per second against context length. Fit the curve and explain its shape. Temperature 0 versus 0.7 on ten prompts, five samples each: count distinct outputs. Train your BPE at three vocabulary sizes; compare tokens per line of click's source and how many tokens a typical tool call costs. Compute prefill and decode FLOPs for one of your rig steps with the helpers in gpt.py, and compare with the latency split you now record. Production lens Latency has two numbers. Time to first token (prefill plus queueing) and time per output token (decode). Every latency budget in Weeks 10, 16 and 17 is a sum of these. Cost follows the same split. Long prompts cost prefill compute once per request unless cached; long outputs cost decode time for every token. Context length is a memory budget on the serving side: the KV cache, not the weights, limits how many long conversations a GPU can hold at once. Not yet Distributed training, mixture-of-experts, quantization schemes, custom kernels and scaling-law fitting. They matter at a frontier lab; for building on models, the forward pass, the cache and the loss mask are what you need. Checkpoint You can draw nanochat's path from chat_cli.py to a sampled token, with the KV cache and the tool state machine, from memory. Your kvdemo.py numbers match a back-of-envelope estimate from kv_bytes_per_token and your hardware's memory bandwidth to within a factor of two. You can explain to a colleague, with nanochat line numbers, why \"the model calls a tool\" is a sentence about tokens.", "tasks": 19}, {"id": "w7", "group": "Weeks", "title": "Week 7: serving and post-training", "short": "Week 7", "html": "<p>A serving engine is a scheduler and a memory allocator around Week 6's forward pass, and post-training an agent is Week 5's eval harness with a gradient attached. This week you read both at line level (nano-vllm's paged KV cache and continuous batching, nanochat's RL loop), then turn rig's eval tasks into a reinforcement-learning environment.</p>\n<h2 id=\"w7-concepts\">Concepts</h2>\n<ul>\n<li><strong>Paged KV cache.</strong> Each sequence's cache lives in fixed-size blocks, and a block table maps logical positions to physical blocks, like virtual memory pages. No fragmentation, and blocks can be shared.</li>\n<li><strong>Prefix caching with chained hashes.</strong> Each full block is hashed together with its parent block's hash, so identical prefixes map to the same physical blocks. This is the serving-side half of Week 3.</li>\n<li><strong>Continuous batching.</strong> Every step the scheduler admits new sequences, mixes prefill and decode work, and preempts a sequence when blocks run out (it is recomputed later).</li>\n<li><strong>CUDA graphs.</strong> The decode step is captured once per batch size and replayed, removing per-kernel launch overhead.</li>\n<li><strong>Throughput against latency.</strong> Bigger batches raise tokens per second and slow each token. Every serving decision sits on that curve.</li>\n<li><strong>Post-training for agents.</strong> Supervised fine-tuning on good trajectories, then reinforcement learning with verifiable rewards: sample several completions per prompt, score them, and raise the probability of the above-average ones.</li>\n<li><strong>An RL environment is your eval harness.</strong> Task set-up, a harness that runs tools, and a grader that returns a reward. Reward hacking is the RL name for Week 1's \"edited the tests\" failure.</li>\n<li><strong>Harness or model?</strong> Harness and prompt fixes are instant, cheap and brittle; post-training is slow, expensive and generalizes. A Staff engineer can argue which one a failure needs.</li>\n</ul>\n<h2 id=\"w7-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1-1.5 h</td>\n<td>Concepts: paged KV cache, prefix caching, continuous batching, CUDA graphs, post-training for agents; provision the GPU and clone nano-vllm</td>\n<td>A half-page note on paging and continuous batching; nano-vllm cloned at the pinned commit, a toy generate call working on the rented GPU</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5-3 h</td>\n<td>Read nano-vllm's engine, scheduler, block manager; Build step 1 (throughput/TTFT sweep)</td>\n<td>A throughput and p50-TTFT table at 1, 8, 64 and 256 concurrent sequences</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2.5-3 h</td>\n<td>Finish the nano-vllm read; trace the full step; Build steps 2-3 (prefix-cache experiment, <code>sched_sim.py</code>)</td>\n<td>Cache-hit and prefill-time-saved numbers; <code>sched_sim.py</code> reproducing preemption against a replayed trace</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2 h</td>\n<td>Read nanochat's <code>chat_rl.py</code>; Build step 4 (RL by hand)</td>\n<td>A toy policy-gradient loop matching nanochat's advantage computation; notes on what each removed GRPO piece would add back</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5-2 h</td>\n<td>Read verifiers (decomposition only); start Build step 5 (rig's own <code>reset</code>/<code>step</code>/<code>reward</code>)</td>\n<td>rig's environment interface working by hand against one eval task</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3-4 h</td>\n<td>Finish Build step 5 (port to verifiers, run rollouts); rig v0.7 project increment; Experiments 1-3</td>\n<td>A reward distribution per task from a small open model's rollouts; <code>rig env export</code> working; three experiments written up</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2-3 h</td>\n<td>Experiment 4 (reward hacking); answer the seven questions; checkpoint</td>\n<td>A rollout caught reward-hacking, and the fix that stops it; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w7-day-by-day-mon\">Monday — paging, prefix caching, and getting the GPU warm.</h3>\n<p>Today is concepts plus logistics, not code: the paged KV cache and continuous batching ideas in Concepts above are what every file you read Tuesday and Wednesday implements, and nano-vllm needs a real NVIDIA GPU (Triton, flash-attn), so getting that environment working today keeps Tuesday's sweep from being blocked on a driver problem.</p>\n<ol type=\"1\">\n<li>Read Concepts above; write a half-page note covering paged KV cache, chained-hash prefix caching, continuous batching and CUDA graphs.</li>\n<li>Provision the GPU you're renting for this week (and any leftover Week 6 training) — path.md notes one rented GPU is enough for both weeks.</li>\n<li>Clone nano-vllm at the pinned commit and run one <code>LLM.generate</code> call against Qwen3-0.6B to confirm the environment works before you trust any numbers from it.</li>\n</ol>\n<h3 id=\"w7-day-by-day-tue\">Tuesday — read the scheduler, then put load through it.</h3>\n<p>Read <code>llm_engine.py</code>, <code>scheduler.py</code> and <code>block_manager.py</code> first today, before running Build step 1's sweep, because a throughput number means nothing until you know whether a given step was prefill, decode, or a preemption. By tonight you have the week's first real serving numbers: throughput and time-to-first-token as concurrency rises from 1 to 256.</p>\n<ol type=\"1\">\n<li>Read the three files per <strong>Read</strong> below, items 1-3; note where admission, allocation and preemption happen.</li>\n<li>Implement Build step 1: throughput and p50 time-to-first-token at 1, 8, 64 and 256 concurrent sequences against Qwen3-0.6B.</li>\n</ol>\n<h3 id=\"w7-day-by-day-wed\">Wednesday — prefix caching, the full trace, and your own simulator.</h3>\n<p>Finish the nano-vllm read (the model runner and the attention kernel) and trace the complete step end to end, from <code>LLM.generate</code> down to <code>Attention.forward</code> and back — this is the path every later serving decision in Weeks 10, 16 and 17 assumes you can draw. Then measure what chained-hash prefix caching is actually worth with real traffic, and write the 150-line simulator that lets you replay your own rig traces against a block budget without a GPU.</p>\n<ol type=\"1\">\n<li>Read <code>model_runner.py</code> and <code>attention.py</code> per <strong>Read</strong> below, items 4-5; write out the trace given there.</li>\n<li>Implement Build step 2: 100 requests sharing a 2,000-token prefix (rig's system prompt and tool schemas) against 100 with unique prefixes; count cache-hit blocks and prefill time saved.</li>\n<li>Implement Build step 3: <code>rig/sched_sim.py</code>, replaying arrival times and prompt lengths from your own traces and reproducing preemption.</li>\n</ol>\n<h3 id=\"w7-day-by-day-thu\">Thursday — RL by hand, from nanochat's four simplifications.</h3>\n<p>Today's read is <code>chat_rl.py</code>, specifically for its docstring's list of what it deliberately leaves out of GRPO (no KL penalty, no PPO clipping, token-level normalization, advantage as reward minus the group mean) — each omission is a design decision you should be able to defend or object to, not just note. Build step 4 makes that concrete: implement the stripped-down version yourself on a toy problem, then add each removed piece back one at a time and watch what changes.</p>\n<ol type=\"1\">\n<li>Read <code>chat_rl.py</code> per <strong>Read</strong> below; trace <code>get_batch</code> through the advantage computation and the training loop.</li>\n<li>Implement Build step 4: nanochat's advantage and policy-gradient loss on a toy problem, then reintroduce the KL penalty and PPO-style clipping one at a time.</li>\n</ol>\n<h3 id=\"w7-day-by-day-fri\">Friday — rig's eval tasks as an environment, interface first.</h3>\n<p>No deep new reading today beyond verifiers, read only for its decomposition into task, taskset, environment and harness — you are explicitly not meant to learn its API in depth. The real work is writing <code>reset</code>/<code>step</code>/<code>reward</code> yourself, by hand, before any library's abstractions tell you how to shape it, because the interface you'd naturally write is the thing worth comparing against a production one.</p>\n<ol type=\"1\">\n<li>Read <code>docs/v1/architecture.md</code> and the four files listed under verifiers in <strong>Read</strong> below.</li>\n<li>Start Build step 5: write <code>reset(task)</code>, <code>step(action)</code> and <code>reward()</code> yourself against one of rig's existing eval tasks, using Week 5's grader as <code>reward()</code>.</li>\n</ol>\n<h3 id=\"w7-day-by-day-sat\">Saturday — port it, run rollouts, ship the increment.</h3>\n<p>Today you find out what a production RL-environment library buys you over what you wrote by hand yesterday, by porting the same task to verifiers' <code>Task</code> and <code>Taskset</code> and comparing. Training is optional and the shape is the point: what matters is a reward distribution you can look at per task, and rig gaining the ability to export any eval task set as an environment.</p>\n<ol type=\"1\">\n<li>Finish Build step 5: port to verifiers' <code>Task</code>/<code>Taskset</code>; run rollouts with a small open model and record the reward distribution per task.</li>\n<li>Ship rig v0.7 per <strong>Project increment</strong> below: <code>rig env export</code>, reward per rollout recorded alongside the trace.</li>\n<li>Run Experiments 1-3 in <strong>Experiments</strong> below.</li>\n</ol>\n<h3 id=\"w7-day-by-day-sun\">Sunday — break the reward on purpose, then the checkpoint.</h3>\n<p>Experiment 4 is the week's most important number: a reward of \"visible tests pass\" alone, shown actually being reward-hacked by a rollout that edits tests, followed by the <code>no_test_edits</code> grader that catches it. Then close the week the same way every week closes: answer from memory, attempt the checkpoint cold.</p>\n<ol type=\"1\">\n<li>Run Experiment 4: reward hacking on purpose, then the fix.</li>\n<li>Answer each of the seven questions in <strong>You should be able to answer</strong> below.</li>\n<li>Attempt <strong>Checkpoint</strong> below.</li>\n</ol>\n<h2 id=\"w7-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w7.build.1\"><input aria-label=\"Done\" data-id=\"w7.build.1\" id=\"c-w7-build-1\" type=\"checkbox\"/><div class=\"task-body\">Run nano-vllm on one GPU with Qwen3-0.6B (the README's benchmark used an 8 GB laptop GPU). Measure throughput and p50 time to first token at 1, 8, 64 and 256 concurrent sequences.</div></li>\n<li class=\"task do\" data-id=\"w7.build.2\"><input aria-label=\"Done\" data-id=\"w7.build.2\" id=\"c-w7-build-2\" type=\"checkbox\"/><div class=\"task-body\">Prefix-cache experiment: 100 requests that share a 2,000-token prefix (rig's system prompt and tool schemas) against 100 with unique prefixes. Count cache-hit blocks and the prefill time saved.</div></li>\n<li class=\"task do\" data-id=\"w7.build.3\"><input aria-label=\"Done\" data-id=\"w7.build.3\" id=\"c-w7-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/sched_sim.py</code>: a 150-line continuous-batching simulator with a block budget. Replay arrival times and prompt lengths from your traces and reproduce preemption.</div></li>\n<li class=\"task do\" data-id=\"w7.build.4\"><input aria-label=\"Done\" data-id=\"w7.build.4\" id=\"c-w7-build-4\" type=\"checkbox\"/><div class=\"task-body\">RL by hand: implement nanochat's advantage (reward minus the group mean) and policy-gradient loss on a toy problem, then put back the pieces it removed one at a time.</div></li>\n<li class=\"task do\" data-id=\"w7.build.5\"><input aria-label=\"Done\" data-id=\"w7.build.5\" id=\"c-w7-build-5\" type=\"checkbox\"/><div class=\"task-body\">Turn rig's eval tasks into an environment. Write the interface yourself first: <code>reset(task)</code> sets up the click snapshot, <code>step(action)</code> runs a rig tool, <code>reward()</code> is your Week 5 grader. Then port it to verifiers' <code>Task</code> and <code>Taskset</code> to see what a production library adds. Run rollouts with a small open model and record the reward distribution per task. Training is optional; the shape is the point.</div></li>\n</ol>\n<h2 id=\"w7-project-increment\">Project increment</h2>\n<p>rig v0.7 can export any eval task set as an environment (<code>rig env export</code>) and records reward per rollout alongside the usual trace.</p>\n<h2 id=\"w7-read\">Read</h2>\n<p><strong><a href=\"https://github.com/GeeeekExplorer/nano-vllm\" rel=\"noopener\" target=\"_blank\">GeeeekExplorer/nano-vllm</a></strong> at <code>bb823b3</code>: vLLM's core ideas in about 1,200 lines of Python, with throughput its README reports as comparable to vLLM on one small GPU. It needs an NVIDIA GPU (Triton and flash-attn).</p>\n<ol type=\"1\">\n<li><code>nanovllm/engine/llm_engine.py</code>: <code>LLMEngine.add_request</code> (43), <code>step</code> (49), <code>generate</code> (60).</li>\n<li><code>nanovllm/engine/scheduler.py</code>: <code>schedule</code> (25: prefill admission with chunked prefill for the first sequence, then decode), <code>preempt</code> (75), <code>postprocess</code> (81).</li>\n<li><code>nanovllm/engine/block_manager.py</code>: <code>compute_hash</code> (36, chained <code>xxhash</code>), <code>can_allocate</code> (58), <code>allocate</code> (75), <code>deallocate</code> (94), <code>may_append</code> (106), <code>hash_blocks</code> (110).</li>\n<li><code>nanovllm/engine/model_runner.py</code>: <code>allocate_kv_cache</code> (103), <code>prepare_block_tables</code> (123), <code>prepare_prefill</code> (129), <code>prepare_decode</code> (172), <code>run_model</code> (196), <code>capture_cudagraph</code> (223).</li>\n<li><code>nanovllm/layers/attention.py</code>: the Triton <code>store_kvcache_kernel</code> (11) and <code>Attention.forward</code> (59).</li>\n</ol>\n<p><strong><a href=\"https://github.com/karpathy/nanochat\" rel=\"noopener\" target=\"_blank\">karpathy/nanochat</a></strong> <code>scripts/chat_rl.py</code> (326 lines). The docstring (lines 1–15) lists its four simplifications of GRPO: no KL penalty, no PPO ratio and clipping (it is on-policy), token-level normalization, and advantages as reward minus the mean. Then <code>get_batch</code> (86): sample completions, score each with <code>train_task.reward</code> (125), compute advantages (143–144); then the training loop (222).</p>\n<p><strong><a href=\"https://github.com/PrimeIntellect-ai/verifiers\" rel=\"noopener\" target=\"_blank\">PrimeIntellect-ai/verifiers</a></strong> at <code>da75527</code>, for the decomposition only: <code>docs/v1/architecture.md</code>, then <code>verifiers/v1/task.py</code> (<code>Task.setup</code> 185, <code>finalize</code> 188, <code>stage_verifier</code> 191), <code>taskset.py</code> (<code>Taskset.load</code> 66), <code>env.py</code> (<code>Env.run_episode</code> 234) and <code>harness.py</code> (<code>Harness.score</code> 224). It is a large, fast-moving library; don't learn its API in depth.</p>\n<p><strong>Trace this path:</strong> <code>LLM.generate</code> → <code>LLMEngine.add_request</code> → loop over <code>step</code>: <code>Scheduler.schedule</code> (prefill first: <code>can_allocate</code>, then <code>allocate</code>, which reuses blocks found in <code>hash_to_block_id</code>; otherwise decode: <code>may_append</code>, <code>preempt</code> on shortage) → <code>ModelRunner.run</code> → <code>prepare_prefill</code> or <code>prepare_decode</code> (slot mapping and block tables) → <code>run_model</code> (a captured CUDA graph for decode) → <code>Attention.forward</code> → <code>store_kvcache</code> → sampling → <code>Scheduler.postprocess</code> (append the token, finish, <code>deallocate</code>).</p>\n<h2 id=\"w7-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w7.q.1\"><input aria-label=\"I can answer this\" data-id=\"w7.q.1\" id=\"c-w7-q-1\" type=\"checkbox\"/><div class=\"task-body\">How does paging remove KV-cache fragmentation, and what exactly does a block table hold?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.2\"><input aria-label=\"I can answer this\" data-id=\"w7.q.2\" id=\"c-w7-q-2\" type=\"checkbox\"/><div class=\"task-body\">Why is each block's hash chained with its parent's, and what would break if blocks were hashed independently?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.3\"><input aria-label=\"I can answer this\" data-id=\"w7.q.3\" id=\"c-w7-q-3\" type=\"checkbox\"/><div class=\"task-body\">When does nano-vllm preempt a sequence, and what does bringing it back cost?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.4\"><input aria-label=\"I can answer this\" data-id=\"w7.q.4\" id=\"c-w7-q-4\" type=\"checkbox\"/><div class=\"task-body\">Why are CUDA graphs captured for decode but not for prefill?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.5\"><input aria-label=\"I can answer this\" data-id=\"w7.q.5\" id=\"c-w7-q-5\" type=\"checkbox\"/><div class=\"task-body\">Which of nanochat's RL simplifications are safe only because it trains on-policy?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.6\"><input aria-label=\"I can answer this\" data-id=\"w7.q.6\" id=\"c-w7-q-6\" type=\"checkbox\"/><div class=\"task-body\">In rig's environment, what is the reward function, and which of your Week 1 failure categories would RL turn into reward hacking?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w7.q.7\"><input aria-label=\"I can answer this\" data-id=\"w7.q.7\" id=\"c-w7-q-7\" type=\"checkbox\"/><div class=\"task-body\">A failure shows up on 30% of tasks. How do you decide between a harness fix, a prompt fix and post-training?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w7-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w7.exp.1\"><input aria-label=\"Done\" data-id=\"w7.exp.1\" id=\"c-w7-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Throughput against concurrency; find the knee and explain it with the decode-bandwidth argument from Week 6.</div></li>\n<li class=\"task do\" data-id=\"w7.exp.2\"><input aria-label=\"Done\" data-id=\"w7.exp.2\" id=\"c-w7-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Prefill time with 0%, 50% and 100% shared prefix.</div></li>\n<li class=\"task do\" data-id=\"w7.exp.3\"><input aria-label=\"Done\" data-id=\"w7.exp.3\" id=\"c-w7-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Shrink the number of KV blocks until preemption starts; measure the throughput loss.</div></li>\n<li class=\"task do\" data-id=\"w7.exp.4\"><input aria-label=\"Done\" data-id=\"w7.exp.4\" id=\"c-w7-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Reward hacking on purpose: use \"visible tests pass\" as the reward and show a rollout that scores by editing tests; then add your <code>no_test_edits</code> grader and rerun.</div></li>\n</ol>\n<h2 id=\"w7-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Capacity planning is token arithmetic.</strong> Requests per second × (prompt + output tokens) gives KV memory and decode bandwidth, and from those the number of GPUs.</li>\n<li><strong>Prefix caching rewards stable layouts on your own servers too.</strong> Week 3's prompt discipline pays twice.</li>\n<li><strong>Fairness.</strong> Without chunked prefill, one long prompt stalls every short request behind it.</li>\n<li><strong>Self-hosting versus an API</strong> is now a cost, latency and control decision you can put numbers on.</li>\n</ul>\n<h2 id=\"w7-not-yet\">Not yet</h2>\n<p>Tensor and pipeline parallelism, speculative decoding internals, quantized kernels, and large-scale RL infrastructure (asynchronous rollouts, off-policy corrections).</p>\n<h2 id=\"w7-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w7.check.1\"><input aria-label=\"Done\" data-id=\"w7.check.1\" id=\"c-w7-check-1\" type=\"checkbox\"/><div class=\"task-body\">From memory, you can draw nano-vllm's step (schedule, prepare, run, sample, postprocess) and say where a prefix-cache hit comes from.</div></li>\n<li class=\"task do\" data-id=\"w7.check.2\"><input aria-label=\"Done\" data-id=\"w7.check.2\" id=\"c-w7-check-2\" type=\"checkbox\"/><div class=\"task-body\">Your throughput curve and prefix-cache numbers are written up.</div></li>\n<li class=\"task do\" data-id=\"w7.check.3\"><input aria-label=\"Done\" data-id=\"w7.check.3\" id=\"c-w7-check-3\" type=\"checkbox\"/><div class=\"task-body\">rig's eval tasks run as an environment that reports a reward per rollout, and you can list the reward-hacking risks in it.</div></li>\n</ul>\n", "toc": [["w7-concepts", "Concepts", []], ["w7-day-by-day", "Day by day", [["w7-day-by-day-mon", "Monday — paging, prefix caching, and getting the GPU warm."], ["w7-day-by-day-tue", "Tuesday — read the scheduler, then put load through it."], ["w7-day-by-day-wed", "Wednesday — prefix caching, the full trace, and your own simulator."], ["w7-day-by-day-thu", "Thursday — RL by hand, from nanochat's four simplifications."], ["w7-day-by-day-fri", "Friday — rig's eval tasks as an environment, interface first."], ["w7-day-by-day-sat", "Saturday — port it, run rollouts, ship the increment."], ["w7-day-by-day-sun", "Sunday — break the reward on purpose, then the checkpoint."]]], ["w7-build", "Build", []], ["w7-project-increment", "Project increment", []], ["w7-read", "Read", []], ["w7-you-should-be-able-to-answer", "You should be able to answer", []], ["w7-experiments", "Experiments", []], ["w7-production-lens", "Production lens", []], ["w7-not-yet", "Not yet", []], ["w7-checkpoint", "Checkpoint", []]], "text": "A serving engine is a scheduler and a memory allocator around Week 6's forward pass, and post-training an agent is Week 5's eval harness with a gradient attached. This week you read both at line level (nano-vllm's paged KV cache and continuous batching, nanochat's RL loop), then turn rig's eval tasks into a reinforcement-learning environment. Concepts Paged KV cache. Each sequence's cache lives in fixed-size blocks, and a block table maps logical positions to physical blocks, like virtual memory pages. No fragmentation, and blocks can be shared. Prefix caching with chained hashes. Each full block is hashed together with its parent block's hash, so identical prefixes map to the same physical blocks. This is the serving-side half of Week 3. Continuous batching. Every step the scheduler admits new sequences, mixes prefill and decode work, and preempts a sequence when blocks run out (it is recomputed later). CUDA graphs. The decode step is captured once per batch size and replayed, removing per-kernel launch overhead. Throughput against latency. Bigger batches raise tokens per second and slow each token. Every serving decision sits on that curve. Post-training for agents. Supervised fine-tuning on good trajectories, then reinforcement learning with verifiable rewards: sample several completions per prompt, score them, and raise the probability of the above-average ones. An RL environment is your eval harness. Task set-up, a harness that runs tools, and a grader that returns a reward. Reward hacking is the RL name for Week 1's \"edited the tests\" failure. Harness or model? Harness and prompt fixes are instant, cheap and brittle; post-training is slow, expensive and generalizes. A Staff engineer can argue which one a failure needs. Day by day Day Time Do Working by end of day Mon 1-1.5 h Concepts: paged KV cache, prefix caching, continuous batching, CUDA graphs, post-training for agents; provision the GPU and clone nano-vllm A half-page note on paging and continuous batching; nano-vllm cloned at the pinned commit, a toy generate call working on the rented GPU Tue 2.5-3 h Read nano-vllm's engine, scheduler, block manager; Build step 1 (throughput/TTFT sweep) A throughput and p50-TTFT table at 1, 8, 64 and 256 concurrent sequences Wed 2.5-3 h Finish the nano-vllm read; trace the full step; Build steps 2-3 (prefix-cache experiment, sched_sim.py) Cache-hit and prefill-time-saved numbers; sched_sim.py reproducing preemption against a replayed trace Thu 2 h Read nanochat's chat_rl.py; Build step 4 (RL by hand) A toy policy-gradient loop matching nanochat's advantage computation; notes on what each removed GRPO piece would add back Fri 1.5-2 h Read verifiers (decomposition only); start Build step 5 (rig's own reset/step/reward) rig's environment interface working by hand against one eval task Sat 3-4 h Finish Build step 5 (port to verifiers, run rollouts); rig v0.7 project increment; Experiments 1-3 A reward distribution per task from a small open model's rollouts; rig env export working; three experiments written up Sun 2-3 h Experiment 4 (reward hacking); answer the seven questions; checkpoint A rollout caught reward-hacking, and the fix that stops it; checkpoint passed or a redo list Monday — paging, prefix caching, and getting the GPU warm. Today is concepts plus logistics, not code: the paged KV cache and continuous batching ideas in Concepts above are what every file you read Tuesday and Wednesday implements, and nano-vllm needs a real NVIDIA GPU (Triton, flash-attn), so getting that environment working today keeps Tuesday's sweep from being blocked on a driver problem. Read Concepts above; write a half-page note covering paged KV cache, chained-hash prefix caching, continuous batching and CUDA graphs. Provision the GPU you're renting for this week (and any leftover Week 6 training) — path.md notes one rented GPU is enough for both weeks. Clone nano-vllm at the pinned commit and run one LLM.generate c
