s to it.</li>\n<li>Tools are plain functions <code>fn(ws, **args) -&gt; str</code> that raise <code>ToolError</code> for expected failures. <code>ws</code> is the workspace object for this one run, built in <code>workspace.py</code>: it holds the sandboxed checkout's root path (<code>ws.root</code>), a display name (<code>ws.name</code>), and, from Wednesday on, the container handle (<code>ws.exec_prefix</code>) — passed into every tool and into <code>loop.py</code> so neither has to reach for global state. Dispatch converts every exception into an <code>is_error</code> tool result, so a buggy tool cannot kill the run.</li>\n<li>File reads and edits happen on the host, inside a path jail rooted at the worktree. Anything that executes code happens in the container, which sees the same worktree as a bind mount.</li>\n<li>The trace writer appends and flushes one JSON line per event, so a crash leaves a readable prefix.</li>\n<li>At run end, write <code>messages.json</code> (the full transcript) and <code>diff.patch</code>. Those two files let you replay or grade any run later without re-calling the model.</li>\n</ol>\n<h2 id=\"w1-starter-code\">Starter code</h2>\n<p>The code below ran against click <code>8.5.0</code> with a scripted fake model standing in for <code>llm.call</code>: tool pairing, unknown tools, <code>max_tokens</code> truncation, the path jail, ambiguous edits, command timeouts and budget exhaustion all behaved as described. Type it in yourself rather than pasting it; the point is to own every line.</p>\n<p><code>rig/llm.py</code>, a raw client with the retry policy the official SDK uses. Shown against Anthropic's endpoint — on OpenAI, swap <code>API_URL</code> for <code>https://api.openai.com/v1/responses</code> (or <code>/v1/chat/completions</code>) and the header for <code>\"Authorization\": f\"Bearer {os.environ['OPENAI_API_KEY']}\"</code>; the retry/backoff logic below is otherwise identical:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">import os, random, time\nimport httpx\n\nAPI_URL = \"https://api.anthropic.com/v1/messages\"\nRETRYABLE = {408, 409, 429, 500, 502, 503, 504, 529}\n\nclass LLMError(Exception): ...\n\ndef call(body: dict, *, timeout: float = 300.0, max_retries: int = 5) -&gt; tuple[dict, dict]:\n    headers = {\"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"],\n               \"anthropic-version\": \"2023-06-01\", \"content-type\": \"application/json\"}\n    last_error = \"\"\n    for attempt in range(max_retries + 1):\n        started, wait = time.monotonic(), None\n        try:\n            r = httpx.post(API_URL, headers=headers, json=body, timeout=timeout)\n        except httpx.TransportError as e:   # connect errors and timeouts\n            last_error = repr(e)            # safe to retry: a model call has no side effects (you may pay twice)\n        else:\n            if r.status_code == 200:\n                return r.json(), {\"attempts\": attempt + 1,\n                                  \"latency_s\": round(time.monotonic() - started, 3),\n                                  \"request_id\": r.headers.get(\"request-id\")}\n            last_error = f\"HTTP {r.status_code}: {r.text[:300]}\"\n            hint = r.headers.get(\"x-should-retry\")\n            if hint == \"false\" or (r.status_code not in RETRYABLE and hint != \"true\"):\n                raise LLMError(last_error)  # a 400 is your bug; retrying will not fix it\n            try:\n                wait = float(r.headers.get(\"retry-after\", \"\"))\n            except ValueError:\n                pass\n        if attempt &lt; max_retries:\n            time.sleep(wait if wait is not None else min(60.0, 2 ** attempt) * random.uniform(0.5, 1.5))\n    raise LLMError(f\"gave up after {max_retries + 1} attempts: {last_error}\")</code></pre></div>\n<p><code>rig/workspace.py</code>, Tuesday's shape: the object every tool function and <code>loop.py</code> call <code>ws</code>, passed in rather than reached for as global state. Today it's nothing but the checkout — <code>root</code> for the path jail every file tool checks against, <code>name</code> to fill the system prompt's <code>{repo}</code> — with <code>exec_prefix</code> arriving Wednesday once there's a container to exec into:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/workspace.py (Tuesday — step 6)\nfrom pathlib import Path\n\nclass Workspace:\n    def __init__(self, root: Path, name: str):\n        self.root = root   # checkout's root; every file tool is jailed here (see resolve() below)\n        self.name = name   # repo's display name, interpolated into the system prompt as {repo}</code></pre></div>\n<p><code>rig/loop.py</code>, the whole agent. The <code>ws</code> argument <code>run_agent</code> takes, and forwards into every tool call via <code>run_tool</code>, is the <code>Workspace</code> built just above:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">import time\nfrom pathlib import Path\nfrom rig import llm\nfrom rig.budget import Budget, BudgetExceeded\nfrom rig.tools import TOOLS, run_tool\nimport rig.tools.fs, rig.tools.search, rig.tools.shell  # noqa: F401  (registers the tools)\n\nSYSTEM = (Path(__file__).parent / \"prompts\" / \"system.md\").read_text()\nTRUNCATED = (\"Not executed: your response hit max_tokens, so these arguments may be \"\n             \"truncated. Re-issue the call with complete arguments.\")\n\ndef run_agent(task: str, *, ws, model: str, budget: Budget, trace, max_tokens: int = 8192) -&gt; dict:\n    messages = [{\"role\": \"user\", \"content\": task}]\n    schemas = [t.schema for t in TOOLS.values()]\n    trace.event(\"run.start\", task=task, model=model, tools=list(TOOLS))\n    status = \"unknown\"\n    try:\n        while True:\n            budget.check()  # raises BudgetExceeded(\"steps\" | \"input_tokens\" | \"usd\" | \"wall_clock\")\n            body = {\"model\": model, \"max_tokens\": max_tokens, \"system\": SYSTEM.format(repo=ws.name),\n                    \"messages\": messages, \"tools\": schemas}\n            resp, meta = llm.call(body)\n            budget.charge(model, resp[\"usage\"])\n            trace.event(\"llm.response\", step=budget.steps, stop_reason=resp[\"stop_reason\"],\n                        usage=resp[\"usage\"], content=resp[\"content\"], **meta)\n            messages.append({\"role\": \"assistant\", \"content\": resp[\"content\"]})\n\n            calls = [b for b in resp[\"content\"] if b[\"type\"] == \"tool_use\"]\n            if not calls:\n                status = resp[\"stop_reason\"]  # end_turn, max_tokens, refusal, ...\n                break\n\n            results = []  # one tool_result per tool_use id, or the next request is rejected\n            for c in calls:\n                if resp[\"stop_reason\"] == \"max_tokens\":\n                    out, is_error, took = TRUNCATED, True, 0.0\n                else:\n                    t0 = time.monotonic()\n                    out, is_error = run_tool(ws, c[\"name\"], c[\"input\"])\n                    took = time.monotonic() - t0\n                trace.event(\"tool.result\", step=budget.steps, call_id=c[\"id\"], tool=c[\"name\"],\n                            input=c[\"input\"], is_error=is_error, duration_s=round(took, 3),\n                            output_chars=len(out), output=out)\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": c[\"id\"],\n                                \"content\": out, \"is_error\": is_error})\n            messages.append({\"role\": \"user\", \"content\": results})\n    except BudgetExceeded as e:\n        status = f\"budget:{e}\"\n    except llm.LLMError as e:\n        status = \"llm_error\"\n        trace.event(\"error\", where=\"llm\", message=str(e))\n    last = messages[-1]\n    final = \"\".join(b[\"text\"] for b in last[\"content\"] if b.get(\"type\") == \"text\") \\\n        if last[\"role\"] == \"assistant\" else \"\"\n    trace.event(\"run.end\", status=status, final=final, **budget.totals())\n    return {\"status\": status, \"final\": final, \"messages\": messages, **budget.totals()}</code></pre></div>\n<p>The shapes above (<code>resp[\"stop_reason\"]</code>, <code>body[\"system\"]</code>, a <code>tool_use</code> block's <code>id</code>/<code>name</code>/<code>input</code>, a <code>tool_result</code> keyed by <code>tool_use_id</code>) are Anthropic's field names — use the table in Concepts to translate if you're on OpenAI: read <code>resp[\"choices\"][0][\"finish_reason\"]</code> instead of <code>stop_reason</code>, put system text in a <code>developer</code>-role message instead of a top-level <code>system</code> key, read each tool call from <code>resp[\"choices\"][0][\"message\"][\"tool_calls\"]</code> (<code>id</code>, <code>function.name</code>, <code>function.arguments</code> as a JSON string you parse), and append the result as <code>{\"role\": \"tool\", \"tool_call_id\": c[\"id\"], \"content\": out}</code> instead of a <code>tool_result</code> block. The control flow — collect calls, run them, append results, loop until none remain — is identical either way.</p>\n<p><code>rig/trace.py</code> and <code>rig/budget.py</code>, the two accounting modules <code>loop.py</code> above already calls into. Deliberately simple — no engineering surprises here, just get the shape right so <code>loop.py</code> doesn't change later, then fill in <code>check()</code>'s thresholds and <code>charge()</code>'s price table yourself:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/trace.py\nimport itertools, json, time\n\nclass Trace:\n    def __init__(self, path, run_id):\n        self.f, self.run_id, self.seq = open(path, \"a\"), run_id, itertools.count()\n\n    def event(self, kind, **fields):\n        rec = {\"run_id\": self.run_id, \"seq\": next(self.seq), \"ts\": time.time(), \"event\": kind, **fields}\n        self.f.write(json.dumps(rec) + \"\\n\")\n        self.f.flush()  # one line per event: a crash still leaves a readable prefix\n\n# rig/budget.py\nimport time\nfrom dataclasses import dataclass, field\n\nclass BudgetExceeded(Exception): ...\n\n@dataclass\nclass Budget:\n    max_steps: int\n    max_input_tokens: int\n    max_usd: float\n    max_wall_clock_s: float\n    steps: int = 0\n    input_tokens: int = 0\n    usd: float = 0.0\n    started: float = field(default_factory=time.monotonic)\n\n    def check(self):\n        if self.steps &gt;= self.max_steps: raise BudgetExceeded(\"steps\")\n        if self.input_tokens &gt;= self.max_input_tokens: raise BudgetExceeded(\"input_tokens\")\n        if self.usd &gt;= self.max_usd: raise BudgetExceeded(\"usd\")\n        if time.monotonic() - self.started &gt;= self.max_wall_clock_s: raise BudgetExceeded(\"wall_clock\")\n\n    def charge(self, model, usage):\n        self.steps += 1\n        self.input_tokens += usage[\"input_tokens\"]\n        self.usd += price(model, usage)  # fill in from your provider's current pricing page\n\n    def totals(self):\n        return {\"steps\": self.steps, \"input_tokens\": self.input_tokens, \"usd\": round(self.usd, 4)}</code></pre></div>\n<p>On Tuesday, <code>check()</code> tripping is fine to leave untested (your limits are generous); Thursday is when you set them tight enough to actually trip and confirm <code>status</code> comes back as <code>budget:steps</code> or similar, not an unhandled exception.</p>\n<p><code>rig/tools/__init__.py</code>, registry and dispatch. Every failure becomes an <code>is_error</code> result, never an exception that escapes the loop:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">from dataclasses import dataclass\nfrom typing import Callable\nMAX_OUT = 30_000  # characters returned to the model per call\n\nclass ToolError(Exception): \"\"\"Expected failure; the message goes back to the model.\"\"\"\n\n@dataclass\nclass Tool:\n    schema: dict\n    fn: Callable\n\nTOOLS: dict[str, Tool] = {}\n\ndef tool(name, description, properties, required):\n    def register(fn):\n        TOOLS[name] = Tool({\"name\": name, \"description\": description,\n                            \"input_schema\": {\"type\": \"object\", \"properties\": properties,\n                                             \"required\": required}}, fn)\n        return fn\n    return register\n\ndef run_tool(ws, name, args) -&gt; tuple[str, bool]:\n    t = TOOLS.get(name)\n    if t is None:\n        return f\"Unknown tool {name!r}. Available: {', '.join(TOOLS)}\", True\n    try:\n        out, is_error = t.fn(ws, **args), False\n    except ToolError as e:\n        out, is_error = str(e), True\n    except TypeError as e:                       # missing or unexpected arguments\n        out, is_error = f\"Bad arguments for {name}: {e}\", True\n    except Exception as e:                       # a bug in your tool: loud in the trace, not fatal\n        out, is_error = f\"Internal error in {name} ({type(e).__name__}): {e}\", True\n    return truncate(out), is_error\n\ndef truncate(s: str) -&gt; str:\n    if len(s) &lt;= MAX_OUT:\n        return s\n    head, tail = s[: MAX_OUT * 2 // 3], s[-(MAX_OUT // 3):]   # keep the tail: errors and summaries live there\n    return f\"{head}\\n\\n[... {len(s) - len(head) - len(tail)} characters omitted ...]\\n\\n{tail}\"</code></pre></div>\n<p>*Reader variation:* the raw dicts above are the fastest way to see the wire shape, but if you'd rather have typed, validated tool schemas, defining <code>ToolPropertySchema</code>/<code>ToolInputSchema</code>/<code>Tool</code> as small Pydantic models works just as well — dump one with <code>.model_dump(exclude=[\"func\"])</code> to get the same JSON shape <code>tools</code> expects on the wire. Either representation satisfies the rest of this week's contracts; pick whichever you'll trust yourself to keep correct as the tool count grows.</p>\n<p><code>rig/workspace.py</code>, Wednesday's addition: once the sandbox container exists, <code>exec_prefix</code> is the argv prefix that turns any command into a command run inside this run's container, built once in the constructor from the container's name:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/workspace.py (Wednesday — adds the container)\nclass Workspace:\n    def __init__(self, root: Path, name: str, run_id: str):\n        self.root = root\n        self.name = name\n        self.exec_prefix = [\"docker\", \"exec\", \"-w\", \"/repo\", f\"rig-{run_id}\"]</code></pre></div>\n<p>The snapshot-and-run shell sequence in <strong>Sandbox from Day 1</strong> below (<code>docker run ... rig-$RUN</code>, <code>docker rm -f rig-$RUN</code>) is what this class's own start/stop methods wrap — translate it into methods yourself; the shape above is the only part other code depends on.</p>\n<p>The two tools with real engineering in them. <code>resolve</code> is the path jail: every tool that touches a file calls it first, and it's the one piece of code standing between a model-supplied path and the host filesystem outside <code>ws.root</code> — a relative path with enough <code>../</code>s, or a symlink planted by an earlier edit, must not be able to walk out of the checkout. <code>edit_file</code> builds on it; its uniqueness check (<code>old_text</code> must match exactly once) is the whole point, since a non-unique match means the model's picture of the file is already wrong. <code>bash</code>, in <code>tools/shell.py</code>, is the one tool that runs inside the container rather than on the host — it uses <code>ws.exec_prefix</code> to <code>docker exec</code> into this run's sandbox, with an inner <code>timeout</code> so a hung command can't hang the agent:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># rig/tools/fs.py (excerpt)\ndef resolve(ws, rel: str) -&gt; Path:\n    p = (ws.root / rel).resolve()          # follows symlinks, so a link cannot escape the jail\n    if not p.is_relative_to(ws.root):\n        raise ToolError(f\"{rel}: outside the repository\")\n    return p\n\n@tool(\"edit_file\",\n      \"Replace exactly one occurrence of old_text with new_text. old_text must match the file \"\n      \"exactly, including indentation, and must be unique; include surrounding lines if needed. \"\n      \"To create a new file, pass an empty old_text.\",\n      {\"path\": {\"type\": \"string\"}, \"old_text\": {\"type\": \"string\"}, \"new_text\": {\"type\": \"string\"}},\n      [\"path\", \"old_text\", \"new_text\"])\ndef edit_file(ws, path, old_text, new_text):\n    p = resolve(ws, path)\n    if old_text == \"\":\n        if p.exists():\n            raise ToolError(f\"{path} already exists; pass old_text to edit it\")\n        p.parent.mkdir(parents=True, exist_ok=True)\n        p.write_text(new_text)\n        return f\"Created {path}\"\n    src = p.read_text()\n    n = src.count(old_text)\n    if n != 1:\n        raise ToolError(f\"old_text matched {n} times in {path}; it must match exactly once. \"\n                        \"Re-read the file and copy the exact text, with more context.\")\n    p.write_text(src.replace(old_text, new_text, 1))\n    return f\"Edited {path}\"\n\n# rig/tools/shell.py\n@tool(\"bash\", \"Run a shell command at the repository root inside a sandbox with no network \"\n      \"access. Use it to run tests and small scripts. Output is truncated to about 30k characters.\",\n      {\"command\": {\"type\": \"string\"}, \"timeout_s\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 600}},\n      [\"command\"])\ndef bash(ws, command, timeout_s=120):\n    # `timeout` runs INSIDE the container: killing the host-side `docker exec` client\n    # does not kill the process it started in the container.\n    argv = ws.exec_prefix + [\"timeout\", \"-k\", \"5\", str(timeout_s), \"bash\", \"-c\", command]\n    try:\n        p = subprocess.run(argv, capture_output=True, text=True, errors=\"replace\", timeout=timeout_s + 20)\n    except subprocess.TimeoutExpired:\n        raise ToolError(f\"No return within {timeout_s + 20}s; the sandbox may be wedged.\")\n    out = p.stdout + (f\"\\n[stderr]\\n{p.stderr}\" if p.stderr else \"\")\n    if p.returncode in (124, 137):\n        out += f\"\\n[killed: exceeded {timeout_s}s]\"\n    return f\"{out}\\n[exit code {p.returncode}]\"</code></pre></div>\n<p><code>budget.py</code> keeps running totals from each response's <code>usage</code> (including <code>cache_read_input_tokens</code> and <code>cache_creation_input_tokens</code>) and multiplies by a price table you fill in from the current pricing page.</p>\n<h2 id=\"w1-the-first-five-tools\">The first five tools</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Tool</th>\n<th>Contract</th>\n<th>Why this shape</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>list_files(path=\".\")</code></td>\n<td><code>git ls-files</code> under a directory, capped at 500 lines with a \"narrow the path\" hint</td>\n<td>Tracked files only: no <code>.venv</code>, no build output. Deterministic order makes traces diffable.</td>\n</tr>\n<tr class=\"even\">\n<td><code>read_file(path, offset=1, limit=400)</code></td>\n<td>Numbered lines plus a paging hint</td>\n<td>Line numbers let the model cite locations and target edits; paging keeps one read from flooding context.</td>\n</tr>\n<tr class=\"odd\">\n<td><code>search(pattern, path=\".\", glob=None, fixed=False)</code></td>\n<td>ripgrep, <code>path:line:text</code>, at most 200 matches; a bad regex returns <code>is_error</code></td>\n<td>This agentic grep is the baseline Week 4 retrieval must beat.</td>\n</tr>\n<tr class=\"even\">\n<td><code>edit_file(path, old_text, new_text)</code></td>\n<td>Exact match that must be unique; empty <code>old_text</code> creates a file</td>\n<td>The uniqueness rule is your main defense against silent wrong edits. Week 2 compares it with pi's fuzzy matching.</td>\n</tr>\n<tr class=\"odd\">\n<td><code>bash(command, timeout_s=120)</code></td>\n<td>Runs in the container; exit code always printed; killed at the timeout</td>\n<td>The escape hatch for everything else. Exit codes in the text let the model tell \"tests failed\" from \"command failed\".</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"w1-sandbox-from-day-1\">Sandbox from Day 1</h2>\n<p>The offline install step below was verified against click <code>8.5.0</code>. Without <code>--no-build-isolation</code>, pip tries to download the build backend and fails on a network-less container.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-dockerfile\"># docker/Dockerfile.sandbox\nFROM python:3.13-slim\nRUN apt-get update &amp;&amp; apt-get install -y --no-install-recommends git ripgrep \\\n    &amp;&amp; rm -rf /var/lib/apt/lists/*\nRUN python -m venv /opt/venv \\\n    &amp;&amp; /opt/venv/bin/pip install --no-cache-dir \"pytest&gt;=8\" \"flit_core&gt;=3.11,&lt;4\" \\\n    &amp;&amp; chmod -R a+rwX /opt/venv\nENV PATH=/opt/venv/bin:$PATH PYTHONDONTWRITEBYTECODE=1 PIP_NO_INDEX=1 PIP_NO_CACHE_DIR=1\nWORKDIR /repo</code></pre></div>\n<div class=\"code-wrap\"><pre><code class=\"language-bash\"># per run: a history-free snapshot, so `git log -p` cannot reveal the seeded bug\nmkdir -p \"$SNAP\" &amp;&amp; git -C reading/click archive 8.5.0 | tar -x -C \"$SNAP\"\n(cd \"$SNAP\" &amp;&amp; git apply \"$RIG/evals/seeds/T05.patch\")      # only if the task has a seed\ngit -C \"$SNAP\" init -q &amp;&amp; git -C \"$SNAP\" add -A \\\n  &amp;&amp; git -C \"$SNAP\" -c user.name=rig -c user.email=rig@localhost commit -qm snapshot\n\ndocker run -d --name \"rig-$RUN\" --network none --cpus 2 --memory 2g --pids-limit 256 \\\n  --cap-drop ALL --security-opt no-new-privileges --user \"$(id -u):$(id -g)\" \\\n  -v \"$SNAP:/repo\" rig-sandbox sleep infinity\ndocker exec \"rig-$RUN\" pip install -q --no-deps --no-build-isolation -e /repo\n# ... run the agent ...\ndocker rm -f \"rig-$RUN\"</code></pre></div>\n<p><code>PYTHONDONTWRITEBYTECODE=1</code> is not cosmetic. Python reuses a cached <code>.pyc</code> when the source's modification time and size match. A same-length edit (<code>+</code> to <code>-</code>) made within the same second can therefore run stale bytecode, so a correct fix looks wrong or a broken file looks fine. This happened while these tasks were being verified.</p>\n<h2 id=\"w1-system-prompt\">System prompt (<code>rig/prompts/system.md</code>)</h2>\n<p>It is passed through <code>str.format</code>, so any literal braces must be doubled.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-text\">You are rig, a software engineering agent working in the git repository {repo}.\nYou act only through the tools provided. Commands run in a sandbox with no network access.\n\nHow to work:\n- Locate before you edit: use search and read_file to find the relevant code, and read the whole\n  surrounding function before changing it.\n- Make the smallest change that fixes the problem. Do not reformat or refactor unrelated code.\n- After editing, run the most relevant tests with bash (python -m pytest -q &lt;path&gt;), then the full\n  suite (python -m pytest -q).\n- Never edit or delete tests unless the task asks you to.\n- If a tool returns an error, read it and change your approach; do not repeat an identical call.\n\nWhen you are done, reply without calling any tools. Your final message states what you changed\n(file and function), how you verified it (command and result), and anything you are unsure of.\nIf the task rests on a false premise or cannot be done, say so and make no changes.</code></pre></div>\n<h2 id=\"w1-the-first-prompt-to-give-your-agent\">The first prompt to give your agent (Tuesday)</h2>\n<div class=\"code-wrap\"><pre><code class=\"language-text\">Do not modify any files.\n\nTrace how the value in `mycli --count 5` reaches the command function, for an option declared as:\n\n    @click.option(\"--count\", type=click.IntRange(0, 10))\n\nList, in call order, each function or method that handles the value from the raw argv string to\nthe int passed to the command callback. For each, give file:line and one sentence on what it does\nto the value. Finish by naming the exact line that raises the error when the value is 11.</code></pre></div>\n<p>Answer key at <code>8.5.0</code>, so you can grade it yourself: <code>Command.main</code> (core.py:1465) → <code>Command.make_context</code> (1328) → <code>Command.parse_args</code> (1365) → <code>_OptionParser.parse_args</code> (parser.py:298) and <code>_match_long_opt</code> (363) → <code>Parameter.handle_parse_result</code> (core.py:2730) → <code>consume_value</code> (2481) → <code>Option.process_value</code> (3645) → <code>Parameter.process_value</code> (2603) → <code>type_cast_value</code> (2529) → <code>_NumberRangeBase.convert</code> (types.py:655), whose <code>self.fail(...)</code> at types.py:677 raises for 11.</p>\n<h2 id=\"w1-task-ladder-and-initial-eval-set\">Task ladder and initial eval set</h2>\n<p>The twelve tasks are both the week's difficulty ladder and the regression suite you keep for all eighteen weeks. Each seeded bug below was applied to click <code>8.5.0</code> and confirmed to fail exactly the listed tests, and each hidden test was confirmed to fail before a fix and pass after one. The agent sees only the prompt column; seeds and hidden tests live outside its workspace.</p>\n<p><strong>This is not a separate testing framework — it's <code>pytest</code>, driven by a thin harness you write.</strong> \"Grader\" in the table below means: run the named test file(s) with <code>pytest</code> inside the sandbox after the agent finishes (or, for T01 to T03 and T12, compare the agent's final text answer against the expected one and check <code>git diff</code> is empty) — there's no special eval DSL to learn. <code>evals/tasks/week1.yaml</code> is just a data file holding each task's id, prompt, seed path and pytest selector(s); <code>evals/run_evals.py</code> is the script that reads it and, per task, snapshots click fresh, applies the seed patch if there is one, calls your own <code>run_agent()</code>, runs that grader, and appends one line of JSON to <code>results.jsonl</code>. If you've only used unit tests to check your own code before, the shift here is that the thing under test is the agent's *behavior on a task*, and the test fixture is a disposable git snapshot rather than a function call.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>ID</th>\n<th>Rung</th>\n<th>Prompt the agent sees (symptom only)</th>\n<th>Seed (file: old → new)</th>\n<th>Grader</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>T01</td>\n<td>Locate</td>\n<td>Do not modify files. Which line raises the error a user sees when a value is outside a <code>click.IntRange</code>? Answer with path:line and the enclosing function.</td>\n<td>none</td>\n<td>Answer names <code>src/click/types.py:677</code> (accept 676 to 681) and <code>convert</code>; empty diff</td>\n</tr>\n<tr class=\"even\">\n<td>T02</td>\n<td>Explain</td>\n<td>The first prompt above</td>\n<td>none</td>\n<td>Answer names <code>parse_args</code>, <code>handle_parse_result</code>, <code>process_value</code>, <code>type_cast_value</code>, <code>convert</code> in that order, plus types.py:677; empty diff</td>\n</tr>\n<tr class=\"odd\">\n<td>T03</td>\n<td>Run and report</td>\n<td>Do not modify files. Run the full test suite and report how many tests passed, were skipped and xfailed.</td>\n<td>none</td>\n<td>Counts equal the grader's own run in the same container (1,991 / 24 / 1 on Python 3.13); empty diff</td>\n</tr>\n<tr class=\"even\">\n<td>T04</td>\n<td>Fix, local</td>\n<td>Commands whose help text is exactly at the short-help limit (45 characters by default) appear truncated with \"...\" in the group's command list, though they fit. A first sentence ending inside the limit is cut too.</td>\n<td><code>utils.py</code>: <code>total_length &gt; max_length</code> → <code>&gt;=</code></td>\n<td>4 cases in <code>tests/test_utils/test_make_default_short_help.py</code> pass; full suite passes</td>\n</tr>\n<tr class=\"odd\">\n<td>T05</td>\n<td>Fix, local</td>\n<td><code>click.IntRange(0, 10, min_open=True, clamp=True)</code> turns -5 into -1. Clamping to an open minimum should give 1.</td>\n<td><code>types.py</code> <code>IntRange._clamp</code>: <code>return bound + dir</code> → <code>bound - dir</code></td>\n<td><code>tests/test_types.py::test_range</code> (2 cases); full suite</td>\n</tr>\n<tr class=\"even\">\n<td>T06</td>\n<td>Fix, local</td>\n<td><code>click.IntRange(1, 5)</code> rejects 1 with \"1 is not in the range 1&lt;=x&lt;=5.\" The minimum should be inclusive unless <code>min_open=True</code>.</td>\n<td><code>types.py</code>: <code>operator.le if self.min_open else operator.lt</code> → swap the two</td>\n<td>6 tests across <code>test_types.py</code>, <code>test_options.py::test_counting</code>, <code>test_commands.py</code>; full suite</td>\n</tr>\n<tr class=\"odd\">\n<td>T07</td>\n<td>Fix, cross-module</td>\n<td>With <code>auto_envvar_prefix=\"MY_TOOL\"</code>, an option on a subcommand named <code>sub-cmd</code> ignores <code>MY_TOOL_SUB_CMD_OPT</code>. Dashes in command names should become underscores.</td>\n<td><code>core.py</code>: drop <code>.replace(\"-\", \"_\")</code> on <code>auto_envvar_prefix</code></td>\n<td><code>test_options.py::test_show_envvar_auto_prefix_dash_in_command</code>; full suite</td>\n</tr>\n<tr class=\"even\">\n<td>T08</td>\n<td>Fix, subtle</td>\n<td><code>@click.option(\"--flag\", flag_value=\"on\", default=False, prompt=True, show_default=True)</code> prompts <code>Flag: </code> instead of <code>Flag [False]: </code>. Falsy defaults should still be shown.</td>\n<td><code>termui.py</code> <code>_build_prompt</code>: append <code>if default else \"\"</code> to the default-preview line</td>\n<td><code>test_termui.py::test_flag_value_prompt</code> (3 cases); full suite</td>\n</tr>\n<tr class=\"odd\">\n<td>T09</td>\n<td>Fix, broad symptom</td>\n<td>Long options stopped working: <code>@click.option(\"--s\")</code> invoked as <code>--s x</code> fails with \"No such option '--s'\".</td>\n<td><code>parser.py</code> <code>_split_opt</code>: <code>return opt[:2], opt[2:]</code> → <code>opt[:1], opt[2:]</code></td>\n<td>53 failing tests pass; full suite</td>\n</tr>\n<tr class=\"even\">\n<td>T10</td>\n<td>Fix, no failing test</td>\n<td>When option names in <code>--help</code> contain ANSI colour codes (for example from <code>click.style</code>), the description column is pushed right as if the escape codes took up space.</td>\n<td><code>formatting.py</code> <code>measure_table</code>: <code>term_len(col)</code> → <code>len(col)</code></td>\n<td>Hidden <code>test_hidden_ansi.py</code> passes; full suite passes. The visible suite passes even with the bug.</td>\n</tr>\n<tr class=\"odd\">\n<td>T11</td>\n<td>Behaviour change, no failing test</td>\n<td><code>click.FloatRange(0, 1)</code> accepts <code>nan</code>, so a bounded float option can receive NaN. Bounded ranges should reject it; plain <code>click.FLOAT</code> should keep accepting it.</td>\n<td>none: this is real 8.5.0 behaviour</td>\n<td>Hidden <code>test_hidden_nan.py</code> (5 cases); full suite</td>\n</tr>\n<tr class=\"even\">\n<td>T12</td>\n<td>False premise</td>\n<td><code>click.IntRange(0, 10)</code> rejects 10 because its maximum is exclusive. Make the maximum inclusive.</td>\n<td>none: 10 is already accepted</td>\n<td>Empty diff, and the answer says no change is needed</td>\n</tr>\n</tbody>\n</table></div>\n<p>Every fix task also fails if <code>git diff HEAD -- tests/</code> is non-empty. That single check catches the most common reward hack: editing tests until they pass.</p>\n<p>The two hidden tests, kept in <code>evals/hidden/</code> and copied to <code>/tmp/hidden</code> in the container only after the agent finishes:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\"># test_hidden_ansi.py\nimport click\nfrom click.formatting import measure_table\n\ndef test_measure_table_ignores_ansi():\n    assert measure_table([(click.style(\"--x\", fg=\"red\"), \"help\")])[0] == 3\n\n# test_hidden_nan.py\nimport math, click, pytest\n\n@pytest.mark.parametrize(\"kw\", [{\"min\": 0, \"max\": 1}, {\"min\": 0}, {\"max\": 1},\n                                {\"min\": 0, \"max\": 1, \"clamp\": True}])\ndef test_float_range_rejects_nan(kw):\n    with pytest.raises(click.BadParameter):\n        click.FloatRange(**kw).convert(\"nan\", None, None)\n\ndef test_unbounded_float_still_accepts_nan():\n    assert math.isnan(click.FLOAT.convert(\"nan\", None, None))</code></pre></div>\n<p>Run each task 3 times. Report pass@1 (mean over runs) and pass^3 (all three passed); the gap between them is your reliability problem, and it usually matters more than the mean.</p>\n<h2 id=\"w1-metrics-to-record-from-the-start\">Metrics to record from the start</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Metrics</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Per model call</td>\n<td>Input, output, cache-read and cache-write tokens; latency; attempts; stop reason; request id; message count</td>\n</tr>\n<tr class=\"even\">\n<td>Per tool call</td>\n<td>Tool name; argument size; output characters before and after truncation; duration; <code>is_error</code>; exit code for <code>bash</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Per run</td>\n<td>Status; steps; total tokens by kind; dollars; wall time; peak input tokens in a single request (your context high-water mark); tool calls by name; tool error count; edit failures; repeated identical calls; files changed; diff lines; test commands run</td>\n</tr>\n<tr class=\"even\">\n<td>Per eval batch</td>\n<td>pass@1, pass^3, dollars per solved task, median and p90 steps, failure-category counts, mean peak input tokens</td>\n</tr>\n</tbody>\n</table></div>\n<p>The peak-input-tokens metric predicts Week 3. The repeated-identical-calls count is your cheapest loop detector.</p>\n<h2 id=\"w1-trace-structure\">Trace structure</h2>\n<p>One JSONL file per run, one event per line, never rewritten. Name fields after the OpenTelemetry GenAI conventions now, so Week 5 is a mapping rather than a rewrite.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Event</th>\n<th>Required fields</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>run.start</code></td>\n<td><code>run_id</code>, <code>task_id</code>, <code>model</code>, <code>tools</code>, <code>repo_sha</code>, <code>seed</code>, <code>budget</code>, <code>rig_git_sha</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>llm.response</code></td>\n<td><code>step</code>, <code>stop_reason</code>, <code>usage</code> (input, output, cache read, cache write), <code>latency_s</code>, <code>attempts</code>, <code>request_id</code>, <code>content</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>tool.result</code></td>\n<td><code>step</code>, <code>call_id</code> (the <code>tool_use</code> id), <code>tool</code>, <code>input</code>, <code>is_error</code>, <code>duration_s</code>, <code>output_chars</code>, <code>output</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>error</code></td>\n<td><code>where</code> (<code>llm</code>, <code>tool</code>, <code>sandbox</code>, <code>harness</code>), <code>message</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>run.end</code></td>\n<td><code>status</code>, <code>final</code>, and the budget totals</td>\n</tr>\n</tbody>\n</table></div>\n<p>Every event also carries <code>run_id</code>, a monotonic <code>seq</code> and a wall-clock <code>ts</code>. Do not log the whole request body on every step: it repeats the transcript and makes traces quadratic in size. The responses and tool results are enough to rebuild any request exactly, and <code>messages.json</code> at run end is your checksum. Map later: <code>usage.input_tokens</code> → <code>gen_ai.usage.input_tokens</code>, <code>call_id</code> → <code>gen_ai.tool.call.id</code>, <code>tool</code> → <code>gen_ai.tool.name</code>.</p>\n<h2 id=\"w1-read-mini-swe-agent\">Read: mini-swe-agent</h2>\n<p><a href=\"https://github.com/SWE-agent/mini-swe-agent\" rel=\"noopener\" target=\"_blank\">SWE-agent/mini-swe-agent</a> is the best first read because the entire agent fits on two screens and every design choice is a deliberate counterpoint to yours. It has one tool (<code>bash</code>), a linear history that is never trimmed, and completion signalled by a magic string. Its README reports over 74% on SWE-bench Verified with that design, which is the strongest argument you will see that the harness matters less than people think for capable models, and more than people think for weak ones.</p>\n<p>Open these first, in this order:</p>\n<ol type=\"1\">\n<li><code>src/minisweagent/agents/default.py</code>: <code>DefaultAgent.run</code>, <code>step</code>, <code>query</code>, <code>execute_actions</code> (190 lines in total).</li>\n<li><code>src/minisweagent/environments/local.py</code>: <code>LocalEnvironment.execute</code>, <code>_check_finished</code>, and the module-level <code>_run</code> (92 lines).</li>\n<li><code>src/minisweagent/exceptions.py</code>: the control-flow exceptions <code>Submitted</code>, <code>LimitsExceeded</code>, <code>TimeExceeded</code>, <code>FormatError</code>.</li>\n<li><code>src/minisweagent/models/utils/actions_toolcall.py</code>: <code>BASH_TOOL</code> and <code>parse_toolcall_actions</code>.</li>\n<li><code>src/minisweagent/models/utils/retry.py</code> and <code>config/mini.yaml</code>.</li>\n</ol>\n<p><strong>Trace this path:</strong> <code>run/mini.py</code> → <code>DefaultAgent.run</code> (renders the system and instance templates) → loop: <code>step</code> → <code>query</code> (checks step, cost and wall-time limits, then <code>model.query</code>, then adds cost) → <code>execute_actions</code> → <code>env.execute</code> → <code>_run</code> (<code>Popen</code> in a new session; kills the process group on timeout) → <code>_check_finished</code> (raises <code>Submitted</code> if the first output line is <code>COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT</code>) → <code>format_observation_messages</code> → back to <code>run</code>, whose <code>finally</code> calls <code>save()</code> after every step.</p>\n<p><strong>You should be able to answer:</strong></p>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w1.q.1\"><input aria-label=\"I can answer this\" data-id=\"w1.q.1\" id=\"c-w1-q-1\" type=\"checkbox\"/><div class=\"task-body\">Why is <code>save()</code> in a <code>finally</code> that runs after every step, not once at the end?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.2\"><input aria-label=\"I can answer this\" data-id=\"w1.q.2\" id=\"c-w1-q-2\" type=\"checkbox\"/><div class=\"task-body\">How does it detect completion, and what breaks if a legitimate command's output happens to start with the magic string?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.3\"><input aria-label=\"I can answer this\" data-id=\"w1.q.3\" id=\"c-w1-q-3\" type=\"checkbox\"/><div class=\"task-body\">In the <code>FormatError</code> branch, why is cost added from the exception's message rather than in <code>query</code>? What bug would you get without it?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.4\"><input aria-label=\"I can answer this\" data-id=\"w1.q.4\" id=\"c-w1-q-4\" type=\"checkbox\"/><div class=\"task-body\">What happens to grandchild processes on timeout, and why does your Docker version need <code>timeout</code> inside the container?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.5\"><input aria-label=\"I can answer this\" data-id=\"w1.q.5\" id=\"c-w1-q-5\" type=\"checkbox\"/><div class=\"task-body\">Which exceptions are fed back to the model and which end the run?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.6\"><input aria-label=\"I can answer this\" data-id=\"w1.q.6\" id=\"c-w1-q-6\" type=\"checkbox\"/><div class=\"task-body\">It can run without the tool-calling API at all (text-based actions). What does native tool calling buy you: argument validation, parallel calls, or something else?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w1.q.7\"><input aria-label=\"I can answer this\" data-id=\"w1.q.7\" id=\"c-w1-q-7\" type=\"checkbox\"/><div class=\"task-body\">The history is never trimmed. What limit does that impose, and why is it acceptable on SWE-bench?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w1-experiments\">Experiments (Friday)</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w1.exp.1\"><input aria-label=\"Done\" data-id=\"w1.exp.1\" id=\"c-w1-exp-1\" type=\"checkbox\"/><div class=\"task-body\"><strong>Bash only.</strong> Disable every tool except <code>bash</code> and rerun T04 to T09. Compare pass rate, steps and tokens. If bash-only matches you, your four extra tools are costing schema tokens for nothing; if it loses, find the steps where it lost.</div></li>\n<li class=\"task do\" data-id=\"w1.exp.2\"><input aria-label=\"Done\" data-id=\"w1.exp.2\" id=\"c-w1-exp-2\" type=\"checkbox\"/><div class=\"task-body\"><strong>No line numbers.</strong> Strip line numbers from <code>read_file</code>. Count <code>edit_file</code> failures and steps per task.</div></li>\n<li class=\"task do\" data-id=\"w1.exp.3\"><input aria-label=\"Done\" data-id=\"w1.exp.3\" id=\"c-w1-exp-3\" type=\"checkbox\"/><div class=\"task-body\"><strong>Truncation.</strong> Set <code>MAX_OUT</code> to 2,000 and to unlimited, and run T03 and T09 (T09's suite prints 53 failures). Record peak input tokens and outcome.</div></li>\n<li class=\"task do\" data-id=\"w1.exp.4\"><input aria-label=\"Done\" data-id=\"w1.exp.4\" id=\"c-w1-exp-4\" type=\"checkbox\"/><div class=\"task-body\"><strong>Remove <code>is_error</code>.</strong> Send errors as plain results. Does the model retry less intelligently? Look at the traces, not just the pass rate.</div></li>\n</ol>\n<h2 id=\"w1-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Timeouts at two layers:</strong> the HTTP client (300 s) and the tool (inside the container, plus a host-side backstop). A missing inner timeout leaves orphaned processes.</li>\n<li><strong>Retries only where safe.</strong> Model calls are retried because they have no side effects, even though a timed-out request may still be billed. Tool calls are never retried by the harness; the model decides, because the harness cannot know whether <code>bash</code> mutated state.</li>\n<li><strong>Rate limits.</strong> Honour <code>retry-after</code> on 429 and 529. Jittered exponential backoff stops parallel eval runs from retrying in lockstep.</li>\n<li><strong>Budgets as statuses.</strong> <code>budget:usd</code> is a result you count, not a crash.</li>\n<li><strong>Secrets.</strong> The container gets no host environment. The API key never enters the sandbox; Week 9 makes that a tested property.</li>\n<li><strong>Permissions.</strong> The path jail plus <code>--network none</code> are your Week 1 permission model. Write down what they do not cover (CPU time, disk fill, reading other files in the bind mount).</li>\n</ul>\n<h2 id=\"w1-not-yet\">Not yet</h2>\n<p>Streaming, async, parallel tool calls, any SDK, LangChain or LangGraph, MCP, embeddings, multi-agent setups, prompt caching, prompt-optimization frameworks, and any UI beyond <code>print</code>. Each arrives later, once you can measure what it changes.</p>\n<h2 id=\"w1-checkpoint\">Checkpoint</h2>\n<p>You understand Week 1 when all of these are true:</p>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w1.check.1\"><input aria-label=\"Done\" data-id=\"w1.check.1\" id=\"c-w1-check-1\" type=\"checkbox\"/><div class=\"task-body\">From a blank file and without notes, you write <code>run_agent</code> and <code>run_tool</code> in under 45 minutes, and rig's own tests pass.</div></li>\n<li class=\"task do\" data-id=\"w1.check.2\"><input aria-label=\"Done\" data-id=\"w1.check.2\" id=\"c-w1-check-2\" type=\"checkbox\"/><div class=\"task-body\">For each stop/finish reason in the table above (turn finished, tool call requested, output cut off with and without tool calls, declined, context exceeded) you can say what rig does and why, in both the Anthropic and OpenAI names.</div></li>\n<li class=\"task do\" data-id=\"w1.check.3\"><input aria-label=\"Done\" data-id=\"w1.check.3\" id=\"c-w1-check-3\" type=\"checkbox\"/><div class=\"task-body\"><code>python evals/run_evals.py --runs 3</code> runs all 12 tasks from a clean checkout with one command; rerunning only the graders on saved <code>diff.patch</code> files reproduces every verdict.</div></li>\n<li class=\"task do\" data-id=\"w1.check.4\"><input aria-label=\"Done\" data-id=\"w1.check.4\" id=\"c-w1-check-4\" type=\"checkbox\"/><div class=\"task-body\">For every failed run, you can name the step where it went wrong from the trace alone, without rerunning.</div></li>\n<li class=\"task do\" data-id=\"w1.check.5\"><input aria-label=\"Done\" data-id=\"w1.check.5\" id=\"c-w1-check-5\" type=\"checkbox\"/><div class=\"task-body\">You can <code>kill -9</code> rig mid-run and still parse every line of its trace.</div></li>\n</ul>\n", "toc": [["w1-concepts", "Concepts", []], ["w1-day-by-day", "Day by day", [["w1-day-by-day-mon", "Monday — one tool call, by hand, no modules yet."], ["w1-day-by-day-tue", "Tuesday — the real loop, pointed at a read-only question."], ["w1-day-by-day-wed", "Wednesday — the sandbox, and two tools that touch it."], ["w1-day-by-day-thu", "Thursday — editing, real budgets, and mini-swe-agent."], ["w1-day-by-day-fri", "Friday — break your own agent on purpose."], ["w1-day-by-day-sat", "Saturday — the eval harness."], ["w1-day-by-day-sun", "Sunday — read your own failures, then the checkpoint."]]], ["w1-repository-layout", "Repository layout", []], ["w1-minimal-architecture", "Minimal architecture", []], ["w1-starter-code", "Starter code", []], ["w1-the-first-five-tools", "The first five tools", []], ["w1-sandbox-from-day-1", "Sandbox from Day 1", []], ["w1-system-prompt", "System prompt (rig/prompts/system.md)", []], ["w1-the-first-prompt-to-give-your-agent", "The first prompt to give your agent (Tuesday)", []], ["w1-task-ladder-and-initial-eval-set", "Task ladder and initial eval set", []], ["w1-metrics-to-record-from-the-start", "Metrics to record from the start", []], ["w1-trace-structure", "Trace structure", []], ["w1-read-mini-swe-agent", "Read: mini-swe-agent", []], ["w1-experiments", "Experiments (Friday)", []], ["w1-production-lens", "Production lens", []], ["w1-not-yet", "Not yet", []], ["w1-checkpoint", "Checkpoint", []]], "text": "By Sunday you have a roughly 400-line Python agent that fixes seeded bugs in click inside a container, logs every step, and scores itself on 12 tasks. You can also explain every branch of mini-swe-agent's 190-line loop. Concepts New to this provider's API entirely? Everything below assumes you've seen one plain request/response with no tools. If you haven't, spend 15 to 20 minutes first: Get started (one curl call, user message in, assistant text back) and the first two sections of Using the Messages API (multi-turn history, the system field) — skip vision and prefill, not relevant here. A tool call is then just one more kind of thing that can appear in that same response, with one extra round trip to run it and send the result back. None of this week's ideas are specific to one vendor; only the exact field names are. Pick one provider to actually call (these notes default to Anthropic's Messages API, concretely, since that's what the starter code below sends), and use this table to translate as you read docs or other people's code: Idea Anthropic (Messages API) OpenAI (Chat Completions / Responses) System instructions top-level system string a system/developer-role message, or instructions (Responses) Model requests a tool content block {type: \"tool_use\", id, name, input} tool_calls entry on the assistant message: {id, function: {name, arguments}} You return the result tool_result content block, tool_use_id matching the call's id a role: \"tool\" message, tool_call_id matching the call's id Turn finished normally stop reason end_turn finish reason stop Turn paused for a tool call stop reason tool_use finish reason tool_calls Output cut off stop reason max_tokens finish reason length Model declined to answer stop reason refusal finish reason content_filter Context window exceeded model_context_window_exceeded error (Week 3's problem) context_length_exceeded error The wire format, regardless of vendor: a system/developer instruction, alternating user and assistant turns, and content that is either plain text, a tool call, or a tool result. Tool calling as an id-correlated RPC inside the transcript. Every tool-call id in an assistant message needs a matching tool-result message right after it, or the API rejects the next request. Stop/finish reasons and what each means for the loop: turn finished (done), tool call requested (execute and continue), output cut off (so tool arguments may be truncated), declined, and context exceeded (Week 3's problem). See the table above for each provider's exact names. Statelessness: every request resends the whole transcript. Without caching, total input tokens grow roughly with the square of the step count. Budgets are the only termination guarantee you control: steps, tokens, dollars, wall clock. Tool output is untrusted input to the next request. Treat it like user input to a web app. Day by day Day Time Do Working by end of day Mon 1.5 h A throwaway script, one tool, by hand — see the Monday walkthrough just below One full tool round trip over raw httpx; the four JSON bodies saved under notes/wire/ Tue 2 h llm.py, trace.py, budget.py's shape, loop.py, list_files, read_file; clone click; run the first prompt The agent answers the read-only trace task; runs/<id>/trace.jsonl holds one event per model call and tool call Wed 2 h search, bash, the sandbox container The agent runs the test suite in the container and reports counts; sleep 999 is killed at the timeout and the loop carries on Thu 2 h edit_file, budget.py for real, max_tokens handling, tool error paths; read mini-swe-agent The agent fixes task T04 end to end; an artificially tiny budget ends the run with status budget:* Fri 1.5 h The four experiments on T04 to T09 notes/week1-experiments.md comparing variants on the same tasks Sat 3 to 4 h evals/run_evals.py; run all 12 tasks 3 times A baseline table: pass rate, mean steps, tokens and dollars per task Sun 2 to 3 h Read every failed trajectory; label failures; attempt the checkpoint A failure taxonomy with counts; checkpoint passed or a redo list Each day below says exactly what to build and points at the reference material further down the page — schemas, the Dockerfile, the system prompt, the task list — rather than repeating it here. Monday — one tool call, by hand, no modules yet. Today's script is throwaway; you will not reuse it tomorrow. The point is to see the four raw JSON bodies with your own eyes — the request, the tool-call response, the follow-up request, the final answer — before llm.py hides them behind a function call for the rest of the week. Export your provider's API key and pip install httpx. Write a count_lines(path) Python function with no connection to the API at all: open the file at path, return how many lines it has. This is your one tool for today, deliberately trivial, so the only new thing you're learning is the wire format, not the tool's logic. Build one request body: model, max_tokens, a messages list with a single user turn (\"How many lines are in pyproject.toml?\"), and a tools list with one schema describing count_lines (name, description, an input_schema with a path string property — see Define tools on Anthropic, or the schema section of the function-calling guide already linked above on OpenAI, for the exact shape and field names). POST it with httpx.post. Save the request body to notes/wire/01-request.json and the raw response to notes/wire/02-response.json. In that response, find the stop/finish reason and the tool-call content (see the Concepts table above for your provider's exact field names). Print the tool call's name and input — confirm the model actually asked for count_lines with a path argument, not something it invented. \"Run it by hand\" means exactly that: call count_lines(**input) yourself, inline in the same script. There's no registry or dispatch yet — that's tomorrow's tools/__init__.py. Build the second request: the same messages list, with the assistant turn you just received appended, plus a new turn carrying the tool result (same call id, your function's return value as a string — see the Concepts table for the exact shape). POST it. Save the request to notes/wire/03-request.json and the response to notes/wire/04-response.json. Print the assistant's final text from that second response. Break it on purpose, twice, and read what comes back: send the second request with tools omitted; send it with the wrong tool-call id. Note what each failure actually looks like — run_tool on Wednesday has to turn failures just like these into something the model can recover from. Tuesday — the real loop, pointed at a read-only question. Today you build the reusable modules Monday's throwaway script stood in for: a real HTTP client with retries, an event log, and the agent loop itself. You point that loop at a read-only question about click so you can grade it against a known answer key before the agent is allowed to change a single file. By tonight you have a working, if toothless, agent that can read and reason about code but can't yet edit anything. Lay out the repo per Repository layout below. Write rig/llm.py: the raw HTTP client, and the only thing in the codebase that talks to the network. Its whole job is one request in, one parsed response out, retrying only the failures that are safe to retry — it knows nothing about tools, messages history, or the loop. See Starter code below for the exact retry policy — type it in, don't paste. Write rig/trace.py: the append-only event log every later week's metrics (and today's own grading) come from — one JSON line per model call and tool call, flushed immediately so a crash still leaves a readable prefix. Also get rig/budget.py's shape in place: it will be the single place that decides when a run has to stop (steps, tokens, dollars, wall clock), so nothing else in the codebase needs to know the thresholds. Both are sketched in Starter code. You only need trace.py working today; giving Budget its interface now (even with check() never tripping) means loop.py doesn't change shape when you make the limits real on Thursday. Write rig/loop.py: the agent itself. It owns the one messages list nothing else may append to, and on each turn decides whether to call the model again, run the tools it asked for, or stop — see Starter code below. Implement list_files (lets the model see what exists before it goes looking) and read_file (lets it see a file's contents, numbered, so it can cite a location precisely) from the contracts in The first five tools below — both are a few lines each. edit_file and bash (the two tools with real engineering in them) aren't due until Wednesday and Thursday. Write a minimal workspace.py from the Tuesday shape in Starter code below: today it's just a small object holding root (the checkout path) and name, so loop.py and your tools have a ws to call — the container lifecycle in Sandbox from Day 1 doesn't arrive until Wednesday. Then git -C reading/click archive 8.5.0 into workspaces/ and point it at that checkout — a plain checkout, no sandbox yet. Run the first prompt to give your agent below, read-only, and grade yourself against the answer key given there. Confirm runs/<id>/trace.jsonl has one line per model call and tool call, and that every line is valid JSON even if you kill the process mid-run. Wednesday — the sandbox, and two tools that touch it. Today the agent gets permission to actually run things: a disposable, network-isolated Docker container per run, plus the search and bash tools that use it. This is where the sandbox stops being a diagram and becomes a real boundary — you'll deliberately make a command misbehave (sleep 999) and confirm the agent recovers instead of hanging forever. Build the image from the Dockerfile in Sandbox from Day 1 below. Sanity-check it stands alone first — docker run --rm rig-sandbox python -c \"print(1)\" — before wiring it into rig. Implement tools/shell.py's bash: the escape hatch for everything the other tools can't do, chiefly running tests — exactly as given in Starter code. Implement tools/search.py's search: today's grep-based baseline for finding things in the repo, which Week 4's real retrieval has to beat — from the contract in The first five tools. Extend workspace.py to the Wednesday shape in Starter code below, which adds exec_prefix: it owns the sandbox's whole lifecycle — snapshotting the repo fresh per run, starting and stopping the container, and the path jail that keeps host-side file edits inside the worktree. Follow the snapshot-and-run steps in Sandbox from Day 1: fresh snapshot, start the container with --network none, offline pip install. Smoke-test the sandbox by hand before trusting the agent with it: docker exec into a running container and run python -m pytest -q yourself; the counts should match T03's baseline (1,991 passed / 24 skipped / 1 xfailed). Give the agent a prompt that runs sleep 999 and confirm the inner timeout kills it and the loop continues rather than hanging. Thursday — editing, real budgets, and mini-swe-agent. Today the agent can finally fix bugs, not just read about them: edit_file with its uniqueness-matching safety net, and budget.py enforced for real so a runaway agent stops itself instead of burning your API budget unattended. You close the day by reading mini-swe-agent, the smallest possible counterpoint to everything you've built this week — one tool, no permission model, and reportedly comparable results. Implement edit_file exactly as given in Starter code; the uniqueness check is the whole point of it, don't loosen it. Finish budget.py for real: steps, input tokens, dollars and wall clock each raise BudgetExceeded(<reason>) from check(); fill in a price table from your provider's current pricing page for charge(). Add max_tokens handling in loop.py (the TRUNCATED branch, already shown in Starter code) and confirm every tool failure becomes an is_error result rather than an exception that escapes (also shown there). Point the agent at task T04 end to end — fix, run tests, stop — see Task ladder and initial eval set below for the exact bug and grader. Set an artificially tiny budget (for example max_steps=2) and confirm the run ends with status budget:steps, not an exception. Read mini-swe-agent below and trace the path given there; answer its seven questions in your notes. Friday — break your own agent on purpose. No new code today. You spend the day running controlled variants of the agent you already built — fewer tools, no line numbers, different truncation limits, no error signaling — against the same tasks, to start forming opinions backed by numbers about which of this week's design choices actually mattered. Run the four experiments in Experiments (Friday) below against T04 to T09 (each experiment names its own task range). Write up what changed in notes/week1-experiments.md: pass rate, steps, tokens, and the specific step in the trace where behavior diverged. Saturday — the eval harness. Today you build the harness that turns \"it seems to work\" into a number: a script that snapshots click fresh for every task, runs the agent, grades the result in the sandbox, and logs everything to results.jsonl. Then you run the full 12-task ladder three times each to get your first real baseline — pass rate, steps, tokens, dollars — to compare every future week against. Write evals/run_evals.py per Repository layout below: per task, a fresh snapshot, apply the seed if the task has one, run the agent, run the grader inside the container, append one line to results.jsonl. Run it over all 12 tasks in Task ladder and initial eval set below, three times each. Compute pass@1 and pass^3 (see the note under that table) and the per-run and per-batch rows of Metrics to record from the start below. Sunday — read your own failures, then the checkpoint. No new code today either. A pass rate alone tells you something's wrong, not what — so you read every failed run end to end and assign it a cause. Then you attempt the week's checkpoint cold; whether you pass it, not whether you got through the calendar, is the real signal for whether you're ready for Week 2. For every failed run, read the trace end to end and assign it exactly one label: wrong location, bad edit, edited tests, gave up, looped, budget, tool error. Write the counts per label in your weekly note. Attempt Checkpoint below. If you can't pass it cold, that's a real signal, not a formality — redo the relevant day rather than carrying the gap into Week 2. Repository layout rig/\n  pyproject.toml            # deps: httpx, pyyaml, pytest (for rig's own tests)\n  rig/\n    cli.py                  # rig run --repo PATH --task FILE_OR_TEXT --budget-usd 0.50\n    llm.py                  # raw Messages API client: retries, backoff, usage\n    loop.py                 # run_agent(): the loop, stop conditions\n    budget.py               # steps / tokens / dollars / wall clock\n    trace.py                # append-only JSONL writer\n    workspace.py            # snapshot creation, container lifecycle, path jail\n    tools/\n      __init__.py           # registry, dispatch, truncation\n      fs.py                 # list_files, read_file, edit_file\n      search.py             # search (ripgrep)\n      shell.py              # bash\n    prompts/system.md\n  docker/Dockerfile.sandbox\n  evals/\n    tasks/week1.yaml        # id, prompt, seed, grader\n    seeds/                  # one patch per seeded bug (never shown to the agent)\n    hidden/                 # hidden tests (never copied into the agent's workspace)\n    run_evals.py\n    report.py\n  tests/                    # tests for rig itself: tool contracts, truncation, budget\n  runs/                     # gitignored: <run_id>/{trace.jsonl, messages.json, diff.patch, result.json}\n  reading/                  # gitignored pinned clones + SHAS.txt\n  notes/ Minimal architecture One process, one thread, no framework. Five rules: loop.py owns the messages list; nothing else appends to it. Tools are plain functions fn(ws, **args) -> str that raise ToolError for expected failures. ws is the workspace object for this one run, built in workspace.py: it holds the sandboxed checkout's root path (ws.root), a display name (ws.name), and, from Wednesday on, the container handle (ws.exec_prefix) — passed into every tool and into loop.py so neither has to reach for global state. Dispatch converts every exception into an is_error tool result, so a buggy tool cannot kill the run. File reads and edits happen on the host, inside a path jail rooted at the worktree. Anything that executes code happens in the container, which sees the same worktree as a bind mount. The trace writer appends and flushes one JSON line per event, so a crash leaves a readable prefix. At run end, write messages.json (the full transcript) and diff.patch. Those two files let you replay or grade any run later without re-calling the model. Starter code The code below ran against click 8.5.0 with a scripted fake model standing in for llm.call: tool pairing, unknown tools, max_tokens truncation, the path jail, ambiguous edits, command timeouts and budget exhaustion all behaved as described. Type it in yourself rather than pasting it; the point is to own every line. rig/llm.py, a raw client with the retry policy the official SDK uses. Shown against Anthropic's endpoint — on OpenAI, swap API_URL for https://api.openai.com/v1/responses (or /v1/chat/completions) and the header for \"Authorization\": f\"Bearer {os.environ['OPENAI_API_KEY']}\"; the retry/backoff logic below is otherwise identical: import os, random, time\nimport httpx\n\nAPI_URL = \"https://api.anthropic.com/v1/messages\"\nRETRYABLE = {408, 409, 429, 500, 502, 503, 504, 529}\n\nclass LLMError(Exception): ...\n\ndef call(body: dict, *, timeout: float = 300.0, max_retries: int = 5) -> tuple[dict, dict]:\n    headers = {\"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"],\n               \"anthropic-version\": \"2023-06-01\", \"content-type\": \"application/json\"}\n    last_error = \"\"\n    for attempt in range(max_retries + 1):\n        started, wait = time.monotonic(), None\n        try:\n            r = httpx.post(API_URL, headers=headers, json=body, timeout=timeout)\n        except httpx.TransportError as e:   # connect errors and timeouts\n            last_error = repr(e)            # safe to retry: a model call has no side effects (you may pay twice)\n        else:\n            if r.status_code == 200:\n                return r.json(), {\"attempts\": attempt + 1,\n                                  \"latency_s\": round(time.monotonic() - started, 3),\n                                  \"request_id\": r.headers.get(\"request-id\")}\n            last_error = f\"HTTP {r.status_code}: {r.text[:300]}\"\n            hint = r.headers.get(\"x-should-retry\")\n            if hint == \"false\" or (r.status_code not in RETRYABLE and hint != \"true\"):\n                raise LLMError(last_error)  # a 400 is your bug; retrying will not fix it\n            try:\n                wait = float(r.headers.get(\"retry-after\", \"\"))\n            except ValueError:\n                pass\n        if attempt < max_retries:\n            time.sleep(wait if wait is not None else min(60.0, 2 ** attempt) * random.uniform(0.5, 1.5))\n    raise LLMError(f\"gave up after {max_retries + 1} attempts: {last_error}\") rig/workspace.py, Tuesday's shape: the object every tool function and loop.py call ws, passed in rather than reached for as global state. Today it's nothing but the checkout — root for the path jail every file tool checks against, name to fill the system prompt's {repo} — with exec_prefix arriving Wednesday once there's a container to exec into: # rig/workspace.py (Tuesday — step 6)\nfrom pathlib import Path\n\nclass Workspace:\n    def __init__(self, root: Path, name: str):\n        self.root = root   # checkout's root; every file tool is jailed here (see resolve() below)\n        self.name = name   # repo's display name, interpolated into the system prompt as {repo} rig/loop.py, the whole agent. The ws argument run_agent takes, and forwards into every tool call via run_tool, is the Workspace built just above: import time\nfrom pathlib import Path\nfrom rig import llm\nfrom rig.budget import Budget, BudgetExceeded\nfrom rig.tools import TOOLS, run_tool\nimport rig.tools.fs, rig.tools.search, rig.tools.shell  # noqa: F401  (registers the tools)\n\nSYSTEM = (Path(__file__).parent / \"prompts\" / \"system.md\").read_text()\nTRUNCATED = (\"Not executed: your response hit max_tokens, so these arguments may be \"\n             \"truncated. Re-issue the call with complete arguments.\")\n\ndef run_agent(task: str, *, ws, model: str, budget: Budget, trace, max_tokens: int = 8192) -> dict:\n    messages = [{\"role\": \"user\", \"content\": task}]\n    schemas = [t.schema for t in TOOLS.values()]\n    trace.event(\"run.start\", task=task, model=model, tools=list(TOOLS))\n    status = \"unknown\"\n    try:\n        while True:\n            budget.check()  # raises BudgetExceeded(\"steps\" | \"input_tokens\" | \"usd\" | \"wall_clock\")\n            body = {\"model\": model, \"max_tokens\": max_tokens, \"system\": SYSTEM.format(repo=ws.name),\n                    \"messages\": messages, \"tools\": schemas}\n            resp, meta = llm.call(body)\n            budget.charge(model, resp[\"usage\"])\n            trace.event(\"llm.response\", step=budget.steps, stop_reason=resp[\"stop_reason\"],\n                        usage=resp[\"usage\"], content=resp[\"content\"], **meta)\n            messages.append({\"role\": \"assistant\", \"content\": resp[\"content\"]})\n\n            calls = [b for b in resp[\"content\"] if b[\"type\"] == \"tool_use\"]\n            if not calls:\n                status = resp[\"stop_reason\"]  # end_turn, max_tokens, refusal, ...\n                break\n\n            results = []  # one tool_result per tool_use id, or the next request is rejected\n            for c in calls:\n                if resp[\"stop_reason\"] == \"max_tokens\":\n                    out, is_error, took = TRUNCATED, True, 0.0\n                else:\n                    t0 = time.monotonic()\n                    out, is_error = run_tool(ws, c[\"name\"], c[\"input\"])\n                    took = time.monotonic() - t0\n                trace.event(\"tool.result\", step=budget.steps, call_id=c[\"id\"], tool=c[\"name\"],\n                            input=c[\"input\"], is_error=is_error, duration_s=round(took, 3),\n                            output_chars=len(out), output=out)\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": c[\"id\"],\n                                \"content\": out, \"is_error\": is_error})\n            messages.append({\"role\": \"user\", \"content\": results})\n    except BudgetExceeded as e:\n        status = f\"budget:{e}\"\n    except llm.LLMError as e:\n        status = \"llm_error\"\n        trace.event(\"error\", where=\"llm\", message=str(e))\n    last = messages[-1]\n    final = \"\".join(b[\"text\"] for b in last[\"content\"] if b.get(\"type\") == \"text\") \\\n        if last[\"role\"] == \"assistant\" else \"\"\n    trace.event(\"run.end\", status=status, final=final, **budget.totals())\n    return {\"status\": status, \"final\": final, \"messages\": messages, **budget.totals()} The shapes above (resp[\"stop_reason\"], body[\"system\"], a tool_use block's id/name/input, a tool_result keyed by tool_use_id) are Anthropic's field names — use the table in Concepts to translate if you're on OpenAI: read resp[\"choices\"][0][\"finish_reason\"] instead of stop_reason, put system text in a developer-role message instead of a top-level system key, read each tool call from resp[\"choices\"][0][\"message\"][\"tool_calls\"] (id, function.name, function.arguments as a JSON string you parse), and append the result as {\"role\": \"tool\", \"tool_call_id\": c[\"id\"], \"content\": out} instead of a tool_result block. The control flow — collect calls, run them, append results, loop until none remain — is identical either way. rig/trace.py and rig/budget.py, the two accounting modules loop.py above already calls into. Deliberately simple — no engineering surprises here, just get the shape right so loop.py doesn't change later, then fill in check()'s thresholds and charge()'s price table yourself: # rig/trace.py\nimport itertools, json, time\n\nclass Trace:\n    def __init__(self, path, run_id):\n        self.f, self.run_id, self.seq = open(path, \"a\"), run_id, itertools.count()\n\n    def event(self, kind, **fields):\n        rec = {\"run_id\": self.run_id, \"seq\": next(self.seq), \"ts\": time.time(), \"event\": kind, **fields}\n        self.f.write(json.dumps(rec) + \"\\n\")\n        self.f.flush()  # one line per event: a crash still leaves a readable prefix\n\n# rig/budget.py\nimport time\nfrom dataclasses import dataclass, field\n\nclass BudgetExceeded(Exception): ...\n\n@dataclass\nclass Budget:\n    max_steps: int\n    max_input_tokens: int\n    max_usd: float\n    max_wall_clock_s: float\n    steps: int = 0\n    input_tokens: int = 0\n    usd: float = 0.0\n    started: float = field(default_factory=time.monotonic)\n\n    def check(self):\n        if self.steps >= self.max_steps: raise BudgetExceeded(\"steps\")\n        if self.input_tokens >= self.max_input_tokens: raise BudgetExceeded(\"input_tokens\")\n        if self.usd >= self.max_usd: raise BudgetExceeded(\"usd\")\n        if time.monotonic() - self.started >= self.max_wall_clock_s: raise BudgetExceeded(\"wall_clock\")\n\n    def charge(self, model, usage):\n        self.steps += 1\n        self.input_tokens += usage[\"input_tokens\"]\n        self.usd += price(model, usage)  # fill in from your provider's current pricing page\n\n    def totals(self):\n        return {\"steps\": self.steps, \"input_tokens\": self.input_tokens, \"usd\": round(self.usd, 4)} On Tuesday, check() tripping is fine to leave untested (your limits are generous); Thursday is when you set them tight enough to actually trip and confirm status comes back as budget:steps or similar, not an unhandled exception. rig/tools/__init__.py, registry and dispatch. Every failure becomes an is_error result, never an exception that escapes the loop: from dataclasses import dataclass\nfrom typing import Callable\nMAX_OUT = 30_000  # characters returned to the model per call\n\nclass ToolError(Exception): \"\"\"Expected failure; the message goes back to the model.\"\"\"\n\n@dataclass\nclass Tool:\n    schema: dict\n    fn: Callable\n\nTOOLS: dict[str, Tool] = {}\n\ndef tool(name, description, properties, required):\n    def register(fn):\n        TOOLS[name] = Tool({\"name\": name, \"description\": description,\n                            \"input_schema\": {\"type\": \"object\", \"properties\": properties,\n                                             \"required\": required}}, fn)\n        return fn\n    return register\n\ndef run_tool(ws, name, args) -> tuple[str, bool]:\n    t = TOOLS.get(name)\n    if t is None:\n        return f\"Unknown tool {name!r}. Available: {', '.join(TOOLS)}\", True\n    try:\n        out, is_error = t.fn(ws, **args), False\n    except ToolError as e:\n        out, is_error = str(e), True\n    except TypeError as e:                       # missing or unexpected arguments\n        out, is_error = f\"Bad arguments for {name}: {e}\", True\n    except Exception as e:                       # a bug in your tool: loud in the trace, not fatal\n        out, is_error = f\"Internal error in {name} ({type(e).__name__}): {e}\", True\n    return truncate(out), is_error\n\ndef truncate(s: str) -> str:\n    if len(s) <= MAX_OUT:\n        return s\n    head, tail = s[: MAX_OUT * 2 // 3], s[-(MAX_OUT // 3):]   # keep the tail: errors and summaries live there\n    return f\"{head}\\n\\n[... {len(s) - len(head) - len(tail)} characters omitted ...]\\n\\n{tail}\" *Reader variation:* the raw dicts above are the fastest way to see the wire shape, but if you'd rather have typed, validated tool schemas, defining ToolPropertySchema/ToolInputSchema/Tool as small Pydantic models works just as well — dump one with .model_dump(exclude=[\"func\"]) to get the same JSON shape tools expects on the wire. Either representation satisfies the rest of this week's contracts; pick whichever you'll trust yourself to keep correct as the tool count grows. rig/workspace.py, Wednesday's addition: once the sandbox container exists, exec_prefix is the argv prefix that turns any command into a command run inside this run's container, built once in the constructor from the container's name: # rig/workspace.py (Wednesday — adds the container)\nclass Workspace:\n    def __init__(self, root: Path, name: str, run_id: str):\n        self.root = root\n        self.name = name\n        self.exec_prefix = [\"docker\", \"exec\", \"-w\", \"/repo\", f\"rig-{run_id}\"] The snapshot-and-run shell sequence in Sandbox from Day 1 below (docker run ... rig-$RUN, docker rm -f rig-$RUN) is what this class's own start/stop methods wrap — translate it into methods yourself; the shape above is the only part other code depends on. The two tools with real engineering in them. resolve is the path jail: every tool that touches a file calls it first, and it's the one piece of code standing between a model-supplied path and the host filesystem outside ws.root — a relative path with enough ../s, or a symlink planted by an earlier edit, must not be able to walk out of the checkout. edit_file builds on it; its uniqueness check (old_text must match exactly once) is the whole point, since a non-unique match means the model's picture of the file is already wrong. bash, in tools/shell.py, is the one tool that runs inside the container rather than on the host — it uses ws.exec_prefix to docker exec into this run's sandbox, with an inner timeout so a hung command can't hang the agent: # rig/tools/fs.py (excerpt)\ndef resolve(ws, rel: str) -> Path:\n    p = (ws.root / rel).resolve()          # follows symlinks, so a link cannot escape the jail\n    if not p.is_relative_to(ws.root):\n        raise ToolError(f\"{rel}: outside the repository\")\n    return p\n\n@tool(\"edit_file\",\n      \"Replace exactly one occurrence of old_text with new_text. old_text must match the file \"\n      \"exactly, including indentation, and must be unique; include surrounding lines if needed. \"\n      \"To create a new file, pass an empty old_text.\",\n      {\"path\": {\"type\": \"string\"}, \"old_text\": {\"type\": \"string\"}, \"new_text\": {\"type\": \"string\"}},\n      [\"path\", \"old_text\", \"new_text\"])\ndef edit_file(ws, path, old_text, new_text):\n    p = resolve(ws, path)\n    if old_text == \"\":\n        if p.exists():\n            raise ToolError(f\"{path} already exists; pass old_text to edit it\")\n        p.parent.mkdir(parents=True, exist_ok=True)\n        p.write_text(new_text)\n        return f\"Created {path}\"\n    src = p.read_text()\n    n = src.count(old_text)\n    if n != 1:\n        raise ToolError(f\"old_text matched {n} times in {path}; it must match exactly once. \"\n                        \"Re-read the file and copy the exact text, with more context.\")\n    p.write_text(src.replace(old_text, new_text, 1))\n    return f\"Edited {path}\"\n\n# rig/tools/shell.py\n@tool(\"bash\", \"Run a shell command at the repository root inside a sandbox with no network \"\n      \"access. Use it to run tests and small scripts. Output is truncated to about 30k characters.\",\n      {\"command\": {\"type\": \"string\"}, \"timeout_s\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 600}},\n      [\"command\"])\ndef bash(ws, command, timeout_s=120):\n    # `timeout` runs INSIDE the container: killing the host-side `docker exec` client\n    # does not kill the process it started in the container.\n    argv = ws.exec_prefix + [\"timeout\", \"-k\", \"5\", str(timeout_s), \"bash\", \"-c\", command]\n    try:\n        p = subprocess.run(argv, capture_output=True, text=True, errors=\"replace\", timeout=timeout_s + 20)\n    except subprocess.TimeoutExpired:\n        raise ToolError(f\"No return within {timeout_s + 20}s; the sandbox may be wedged.\")\n    out = p.stdout + (f\"\\n[stderr]\\n{p.stderr}\" if p.stderr else \"\")\n    if p.returncode in (124, 137):\n        out += f\"\\n[killed: exceeded {timeout_s}s]\"\n    return f\"{out}\\n[exit code {p.returncode}]\" budget.py keeps running totals from each response's usage (including cache_read_input_tokens and cache_creation_input_tokens) and multiplies by a price table you fill in from the current pricing page. The first five tools Tool Contract Why this shape list_files(path=\".\") git ls-files under a directory, capped at 500 lines with a \"narrow the path\" hint Tracked files only: no .venv, no build output. Deterministic order makes traces diffable. read_file(path, offset=1, limit=400) Numbered lines plus a paging hint Line numbers let the model cite locations and target edits; paging keeps one read from flood
