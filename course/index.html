ing context. search(pattern, path=\".\", glob=None, fixed=False) ripgrep, path:line:text, at most 200 matches; a bad regex returns is_error This agentic grep is the baseline Week 4 retrieval must beat. edit_file(path, old_text, new_text) Exact match that must be unique; empty old_text creates a file The uniqueness rule is your main defense against silent wrong edits. Week 2 compares it with pi's fuzzy matching. bash(command, timeout_s=120) Runs in the container; exit code always printed; killed at the timeout The escape hatch for everything else. Exit codes in the text let the model tell \"tests failed\" from \"command failed\". Sandbox from Day 1 The offline install step below was verified against click 8.5.0. Without --no-build-isolation, pip tries to download the build backend and fails on a network-less container. # docker/Dockerfile.sandbox\nFROM python:3.13-slim\nRUN apt-get update && apt-get install -y --no-install-recommends git ripgrep \\\n    && rm -rf /var/lib/apt/lists/*\nRUN python -m venv /opt/venv \\\n    && /opt/venv/bin/pip install --no-cache-dir \"pytest>=8\" \"flit_core>=3.11,<4\" \\\n    && chmod -R a+rwX /opt/venv\nENV PATH=/opt/venv/bin:$PATH PYTHONDONTWRITEBYTECODE=1 PIP_NO_INDEX=1 PIP_NO_CACHE_DIR=1\nWORKDIR /repo # per run: a history-free snapshot, so `git log -p` cannot reveal the seeded bug\nmkdir -p \"$SNAP\" && git -C reading/click archive 8.5.0 | tar -x -C \"$SNAP\"\n(cd \"$SNAP\" && git apply \"$RIG/evals/seeds/T05.patch\")      # only if the task has a seed\ngit -C \"$SNAP\" init -q && git -C \"$SNAP\" add -A \\\n  && git -C \"$SNAP\" -c user.name=rig -c user.email=rig@localhost commit -qm snapshot\n\ndocker run -d --name \"rig-$RUN\" --network none --cpus 2 --memory 2g --pids-limit 256 \\\n  --cap-drop ALL --security-opt no-new-privileges --user \"$(id -u):$(id -g)\" \\\n  -v \"$SNAP:/repo\" rig-sandbox sleep infinity\ndocker exec \"rig-$RUN\" pip install -q --no-deps --no-build-isolation -e /repo\n# ... run the agent ...\ndocker rm -f \"rig-$RUN\" PYTHONDONTWRITEBYTECODE=1 is not cosmetic. Python reuses a cached .pyc when the source's modification time and size match. A same-length edit (+ to -) made within the same second can therefore run stale bytecode, so a correct fix looks wrong or a broken file looks fine. This happened while these tasks were being verified. System prompt (rig/prompts/system.md) It is passed through str.format, so any literal braces must be doubled. You are rig, a software engineering agent working in the git repository {repo}.\nYou act only through the tools provided. Commands run in a sandbox with no network access.\n\nHow to work:\n- Locate before you edit: use search and read_file to find the relevant code, and read the whole\n  surrounding function before changing it.\n- Make the smallest change that fixes the problem. Do not reformat or refactor unrelated code.\n- After editing, run the most relevant tests with bash (python -m pytest -q <path>), then the full\n  suite (python -m pytest -q).\n- Never edit or delete tests unless the task asks you to.\n- If a tool returns an error, read it and change your approach; do not repeat an identical call.\n\nWhen you are done, reply without calling any tools. Your final message states what you changed\n(file and function), how you verified it (command and result), and anything you are unsure of.\nIf the task rests on a false premise or cannot be done, say so and make no changes. The first prompt to give your agent (Tuesday) Do not modify any files.\n\nTrace how the value in `mycli --count 5` reaches the command function, for an option declared as:\n\n    @click.option(\"--count\", type=click.IntRange(0, 10))\n\nList, in call order, each function or method that handles the value from the raw argv string to\nthe int passed to the command callback. For each, give file:line and one sentence on what it does\nto the value. Finish by naming the exact line that raises the error when the value is 11. Answer key at 8.5.0, so you can grade it yourself: Command.main (core.py:1465) → Command.make_context (1328) → Command.parse_args (1365) → _OptionParser.parse_args (parser.py:298) and _match_long_opt (363) → Parameter.handle_parse_result (core.py:2730) → consume_value (2481) → Option.process_value (3645) → Parameter.process_value (2603) → type_cast_value (2529) → _NumberRangeBase.convert (types.py:655), whose self.fail(...) at types.py:677 raises for 11. Task ladder and initial eval set The twelve tasks are both the week's difficulty ladder and the regression suite you keep for all eighteen weeks. Each seeded bug below was applied to click 8.5.0 and confirmed to fail exactly the listed tests, and each hidden test was confirmed to fail before a fix and pass after one. The agent sees only the prompt column; seeds and hidden tests live outside its workspace. This is not a separate testing framework — it's pytest, driven by a thin harness you write. \"Grader\" in the table below means: run the named test file(s) with pytest inside the sandbox after the agent finishes (or, for T01 to T03 and T12, compare the agent's final text answer against the expected one and check git diff is empty) — there's no special eval DSL to learn. evals/tasks/week1.yaml is just a data file holding each task's id, prompt, seed path and pytest selector(s); evals/run_evals.py is the script that reads it and, per task, snapshots click fresh, applies the seed patch if there is one, calls your own run_agent(), runs that grader, and appends one line of JSON to results.jsonl. If you've only used unit tests to check your own code before, the shift here is that the thing under test is the agent's *behavior on a task*, and the test fixture is a disposable git snapshot rather than a function call. ID Rung Prompt the agent sees (symptom only) Seed (file: old → new) Grader T01 Locate Do not modify files. Which line raises the error a user sees when a value is outside a click.IntRange? Answer with path:line and the enclosing function. none ses); full suite T09 Fix, broad symptom Long options stopped working: @click.option(\"--s\") invoked as --s x fails with \"No such option '--s'\". parser.py_split_opt: return opt[:2], opt[2:] → opt[:1], opt[2:] 53 failing tests pass; full suite T10 Fix, no failing test When option names in --help contain ANSI colour codes (for example from click.style), the description column is pushed right as if the escape codes took up space. formatting.pymeasure_table: term_len(col) → len(col) Hidden test_hidden_ansi.py passes; full suite passes. The visible suite passes even with the bug. T11 Behaviour change, no failing test click.FloatRange(0, 1) accepts nan, so a bounded float option can receive NaN. Bounded ranges should reject it; plain click.FLOAT should keep accepting it. none: this is real 8.5.0 behaviour Hidden test_hidden_nan.py (5 cases); full suite T12 False premise click.IntRange(0, 10) rejects 10 because its maximum is exclusive. Make the maximum inclusive. none: 10 is already accepted Empty diff, and the answer says no change is needed Every fix task also fails if git diff HEAD -- tests/ is non-empty. That single check catches the most common reward hack: editing tests until they pass. The two hidden tests, kept in evals/hidden/ and copied to /tmp/hidden in the container only after the agent finishes: # test_hidden_ansi.py\nimport click\nfrom click.formatting import measure_table\n\ndef test_measure_table_ignores_ansi():\n    assert measure_table([(click.style(\"--x\", fg=\"red\"), \"help\")])[0] == 3\n\n# test_hidden_nan.py\nimport math, click, pytest\n\n@pytest.mark.parametrize(\"kw\", [{\"min\": 0, \"max\": 1}, {\"min\": 0}, {\"max\": 1},\n                                {\"min\": 0, \"max\": 1, \"clamp\": True}])\ndef test_float_range_rejects_nan(kw):\n    with pytest.raises(click.BadParameter):\n        click.FloatRange(**kw).convert(\"nan\", None, None)\n\ndef test_unbounded_float_still_accepts_nan():\n    assert math.isnan(click.FLOAT.convert(\"nan\", None, None)) Run each task 3 times. Report pass@1 (mean over runs) and pass^3 (all three passed); the gap between them is your reliability problem, and it usually matters more than the mean. Metrics to record from the start Level Metrics Per model call Input, output, cache-read and cache-write tokens; latency; attempts; stop reason; request id; message count Per tool call Tool name; argument size; output characters before and after truncation; duration; is_error; exit code for bash Per run Status; steps; total tokens by kind; dollars; wall time; peak input tokens in a single request (your context high-water mark); tool calls by name; tool error count; edit failures; repeated identical calls; files changed; diff lines; test commands run Per eval batch pass@1, pass^3, dollars per solved task, median and p90 steps, failure-category counts, mean peak input tokens The peak-input-tokens metric predicts Week 3. The repeated-identical-calls count is your cheapest loop detector. Trace structure One JSONL file per run, one event per line, never rewritten. Name fields after the OpenTelemetry GenAI conventions now, so Week 5 is a mapping rather than a rewrite. Event Required fields run.start run_id, task_id, model, tools, repo_sha, seed, budget, rig_git_sha llm.response step, stop_reason, usage (input, output, cache read, cache write), latency_s, attempts, request_id, content tool.result step, call_id (the tool_use id), tool, input, is_error, duration_s, output_chars, output error where (llm, tool, sandbox, harness), message run.end status, final, and the budget totals Every event also carries run_id, a monotonic seq and a wall-clock ts. Do not log the whole request body on every step: it repeats the transcript and makes traces quadratic in size. The responses and tool results are enough to rebuild any request exactly, and messages.json at run end is your checksum. Map later: usage.input_tokens → gen_ai.usage.input_tokens, call_id → gen_ai.tool.call.id, tool → gen_ai.tool.name. Read: mini-swe-agent SWE-agent/mini-swe-agent is the best first read because the entire agent fits on two screens and every design choice is a deliberate counterpoint to yours. It has one tool (bash), a linear history that is never trimmed, and completion signalled by a magic string. Its README reports over 74% on SWE-bench Verified with that design, which is the strongest argument you will see that the harness matters less than people think for capable models, and more than people think for weak ones. Open these first, in this order: src/minisweagent/agents/default.py: DefaultAgent.run, step, query, execute_actions (190 lines in total). src/minisweagent/environments/local.py: LocalEnvironment.execute, _check_finished, and the module-level _run (92 lines). src/minisweagent/exceptions.py: the control-flow exceptions Submitted, LimitsExceeded, TimeExceeded, FormatError. src/minisweagent/models/utils/actions_toolcall.py: BASH_TOOL and parse_toolcall_actions. src/minisweagent/models/utils/retry.py and config/mini.yaml. Trace this path:run/mini.py → DefaultAgent.run (renders the system and instance templates) → loop: step → query (checks step, cost and wall-time limits, then model.query, then adds cost) → execute_actions → env.execute → _run (Popen in a new session; kills the process group on timeout) → _check_finished (raises Submitted if the first output line is COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT) → format_observation_messages → back to run, whose finally calls save() after every step. You should be able to answer: Why is save() in a finally that runs after every step, not once at the end? Can answer How does it detect completion, and what breaks if a legitimate command's output happens to start with the magic string? Can answer In the FormatError branch, why is cost added from the exception's message rather than in query? What bug would you get without it? Can answer What happens to grandchild processes on timeout, and why does your Docker version need timeout inside the container? Can answer Which exceptions are fed back to the model and which end the run? Can answer It can run without the tool-calling API at all (text-based actions). What does native tool calling buy you: argument validation, parallel calls, or something else? Can answer The history is never trimmed. What limit does that impose, and why is it acceptable on SWE-bench? Can answer Experiments (Friday) Bash only. Disable every tool except bash and rerun T04 to T09. Compare pass rate, steps and tokens. If bash-only matches you, your four extra tools are costing schema tokens for nothing; if it loses, find the steps where it lost. No line numbers. Strip line numbers from read_file. Count edit_file failures and steps per task. Truncation. Set MAX_OUT to 2,000 and to unlimited, and run T03 and T09 (T09's suite prints 53 failures). Record peak input tokens and outcome. Remove is_error. Send errors as plain results. Does the model retry less intelligently? Look at the traces, not just the pass rate. Production lens Timeouts at two layers: the HTTP client (300 s) and the tool (inside the container, plus a host-side backstop). A missing inner timeout leaves orphaned processes. Retries only where safe. Model calls are retried because they have no side effects, even though a timed-out request may still be billed. Tool calls are never retried by the harness; the model decides, because the harness cannot know whether bash mutated state. Rate limits. Honour retry-after on 429 and 529. Jittered exponential backoff stops parallel eval runs from retrying in lockstep. Budgets as statuses.budget:usd is a result you count, not a crash. Secrets. The container gets no host environment. The API key never enters the sandbox; Week 9 makes that a tested property. Permissions. The path jail plus --network none are your Week 1 permission model. Write down what they do not cover (CPU time, disk fill, reading other files in the bind mount). Not yet Streaming, async, parallel tool calls, any SDK, LangChain or LangGraph, MCP, embeddings, multi-agent setups, prompt caching, prompt-optimization frameworks, and any UI beyond print. Each arrives later, once you can measure what it changes. Checkpoint You understand Week 1 when all of these are true: From a blank file and without notes, you write run_agent and run_tool in under 45 minutes, and rig's own tests pass. For each stop/finish reason in the table above (turn finished, tool call requested, output cut off with and without tool calls, declined, context exceeded) you can say what rig does and why, in both the Anthropic and OpenAI names. python evals/run_evals.py --runs 3 runs all 12 tasks from a clean checkout with one command; rerunning only the graders on saved diff.patch files reproduces every verdict. For every failed run, you can name the step where it went wrong from the trace alone, without rerunning. You can kill -9 rig mid-run and still parse every line of its trace.", "tasks": 16}, {"id": "w2", "group": "Weeks", "title": "Week 2: the coding-agent harness", "short": "Week 2", "html": "<p>This week you split rig into the same three layers pi uses (provider, runtime, harness) and harden the parts users actually feel: streaming, cancellation, steering, parallel tools, edit robustness and resumable sessions. The model and loop barely change; the harness around them changes a lot.</p>\n<h2 id=\"w2-concepts\">Concepts</h2>\n<ul>\n<li><strong>Three layers.</strong> Provider adapter (wire format to a normalized message and event type), runtime (the loop, events, hooks, cancellation), harness (tools, prompt assembly, sessions, UI). Most frameworks blur these; pi keeps them in separate packages.</li>\n<li><strong>Events, not return values.</strong> A loop that yields <code>turn_start</code>, <code>message_delta</code>, <code>tool_start</code>, <code>tool_end</code>, <code>turn_end</code> lets the CLI, the trace writer and a future UI all subscribe without touching the loop.</li>\n<li><strong>Parallel tool calls with ordered results.</strong> Execute concurrently, append results in the order the model issued the calls. Order keeps transcripts deterministic, which matters for replay and for prompt caching next week.</li>\n<li><strong>Same-file writes must serialize</strong> even when everything else runs in parallel.</li>\n<li><strong>Cancellation must leave a valid transcript.</strong> Every <code>tool_use</code> still needs a <code>tool_result</code>, so an aborted call gets a synthetic \"aborted\" result.</li>\n<li><strong>Steering versus follow-up.</strong> A message typed mid-run can be injected after the current tool batch (steering) or held until the agent would otherwise stop (follow-up).</li>\n<li><strong>Edit robustness.</strong> Line endings, trailing whitespace, tabs versus spaces, and the trade-off between exact matching (safe, brittle) and fuzzy matching (forgiving, can edit the wrong place).</li>\n<li><strong>Sessions as append-only logs.</strong> A JSONL of entries with <code>id</code> and <code>parentId</code> gives resume, branching and \"undo\" without ever rewriting history.</li>\n</ul>\n<h2 id=\"w2-day-by-day\">Day by day</h2>\n<p>Seven Build steps this week split into two code-heavy days and a lighter Thursday; the model and loop barely change, so most of the week is harness engineering you can build without the API in front of you.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read <strong>Concepts</strong> above; note the three-layer split and the event model</td>\n<td>Half-page note: provider / runtime / harness, and why events beat return values</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5 to 3 h</td>\n<td>Build steps 1 to 3</td>\n<td>A fake provider streams events through <code>runtime.py</code>; read-only tools run in parallel with ordered results</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2.5 to 3 h</td>\n<td>Build steps 4 to 6</td>\n<td>Ctrl-C mid-run leaves a session that resumes; <code>edit_file</code> v2 reports the closest candidate on a failed match</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Build step 7; read pi and Aider; trace the path</td>\n<td><code>AGENTS.md</code> loads into the system prompt; you can narrate pi's prompt-to-tool-result path from memory</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>Experiments 1 to 3</td>\n<td><code>notes/week2-experiments.md</code>: parallel on/off, Aider-style edits, a reproduced fuzzy-match failure</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td>Experiments 4 to 5; <strong>Project increment</strong>: v0.2 CLI, write T13 to T16</td>\n<td>Kill-and-resume verified; four new hidden-test tasks confirmed failing on a clean tree</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Run T01 to T16 three times; answer remaining questions; attempt <strong>Checkpoint</strong></td>\n<td>v0.2 no worse than v0.1 on pass^3, or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w2-day-by-day-mon\">Monday — read the three-layer split before you build it.</h3>\n<p>Everything you build this week slots into one of three layers: provider, runtime, harness. Spend the short Monday slot fixing that boundary in your head before you start moving code, because the whole point of splitting rig this way is that streaming, cancellation and sessions become local changes instead of rewrites of <code>loop.py</code>.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above twice: once for the three layers, once for why the loop becomes a generator of events.</li>\n<li>Write a half-page note: which of this week's seven Build steps belongs to which layer, before you write any of them.</li>\n</ol>\n<h3 id=\"w2-day-by-day-tue\">Tuesday — provider, runtime, parallel execution.</h3>\n<p>Today you rebuild the bottom two layers: a provider adapter that normalizes the wire format into events, and a runtime loop that yields those events instead of returning a dict. Parallel tool execution rides on top of the same event loop, so it belongs in the same sitting — read-only tools running concurrently is the first payoff of switching to events at all.</p>\n<ol type=\"1\">\n<li>Implement Build steps 1 and 2: <code>rig/providers/base.py</code>'s <code>Provider</code> protocol, <code>anthropic.py</code> via the official SDK (streaming), <code>fake.py</code> for deterministic tests, and <code>rig/runtime.py</code>'s loop as a generator with the three hooks.</li>\n<li>Implement Build step 3: parallel execution for <code>read_only=True</code> tools, mutating tools sequential, a per-path lock around <code>edit_file</code>.</li>\n<li>Confirm ordering: run a prompt that issues three read-only calls at once and check the trace shows results appended in the order the model issued the calls, not completion order.</li>\n</ol>\n<h3 id=\"w2-day-by-day-wed\">Wednesday — interruption and safer edits.</h3>\n<p>Today the agent becomes something you can interrupt without breaking it, and <code>edit_file</code> stops silently doing the wrong thing. Both are harness-layer changes a real user feels immediately: a Ctrl-C that corrupts the transcript, or an edit that lands on the wrong occurrence, is the kind of bug that erodes trust fast.</p>\n<ol type=\"1\">\n<li>Implement Build step 4: Ctrl-C handling (first press aborts and appends synthetic <code>tool_result</code>s, second exits) and the <code>steer</code> queue.</li>\n<li>Implement Build step 5: <code>edit_file</code> v2 — CRLF normalization, atomic multi-edit lists, closest-candidate lines in the error instead of a silent fuzzy match.</li>\n<li>Implement Build step 6: <code>rig/session.py</code>'s append-only JSONL, <code>rig resume</code> and <code>rig fork</code>.</li>\n<li>Test the interaction of the two: abort mid-edit, resume the session, and confirm the transcript is still valid for the API.</li>\n</ol>\n<h3 id=\"w2-day-by-day-thu\">Thursday — AGENTS.md, then read pi and Aider.</h3>\n<p>The last Build step is small, so clear it first and spend the rest of the day on the two reads that justify this week's design: pi, which maps almost exactly onto rig's new three layers, and Aider's edit-block cascade, the clearest contrast to <code>edit_file</code>'s exact-match rule.</p>\n<ol type=\"1\">\n<li>Implement Build step 7: load <code>AGENTS.md</code> from the repo root into the system prompt inside a delimited block.</li>\n<li>Read pi's files listed under <strong>Read: pi (main) and Aider's edit blocks (contrast)</strong> above, in the given order, then <code>aider/coders/editblock_coder.py</code>.</li>\n<li>Trace the path given there, then the failure path (a 529, <code>_isRetryableError</code>, <code>_omitRecoveryAttempt</code>).</li>\n<li>Answer questions 1 to 4 in <strong>You should be able to answer</strong> from the trace alone.</li>\n</ol>\n<h3 id=\"w2-day-by-day-fri\">Friday — break the harness on purpose.</h3>\n<p>No new modules today. You spend the slot running the cheap half of this week's experiments against the agent you already built, to find out which of Tuesday's and Wednesday's changes actually mattered under pressure.</p>\n<p>Run Experiments 1 to 3 above against T04 to T11. Write up pass rate, steps and tokens, and the one trace where fuzzy matching picked the wrong block, in <code>notes/week2-experiments.md</code>.</p>\n<h3 id=\"w2-day-by-day-sat\">Saturday — the rest of the experiments, then the project increment.</h3>\n<p>Today has two jobs: finish the experiments that need a running session to kill (resuming and forking mid-run), and extend the eval set itself, since rig v0.2 is judged against four tasks you have to write yourself, not just tasks handed to you.</p>\n<ol type=\"1\">\n<li>Run Experiments 4 and 5: kill rig mid-tool and resume; point the provider interface at a second provider and list every normalization needed.</li>\n<li>Write T13 to T16 for <strong>Project increment</strong> above — four multi-file tasks, each with a hidden test you confirm fails on the clean tree before you call it done.</li>\n<li>Run the CLI end to end on all four: streaming output, a steer message injected mid-run, a resumed session.</li>\n</ol>\n<h3 id=\"w2-day-by-day-sun\">Sunday — the full regression, then the checkpoint.</h3>\n<p>No new code today. A new harness is worthless if it quietly regresses the twelve tasks you already trust, so you rerun everything before trusting v0.2 at all.</p>\n<ol type=\"1\">\n<li>Run T01 to T16 three times each through <code>evals/run_evals.py</code>.</li>\n<li>Confirm pass^3 on T01 to T12 is no worse than your Week 1 baseline; if it is, find the trace event where behavior diverged before moving on.</li>\n<li>Answer the remaining questions in <strong>You should be able to answer</strong>, then attempt <strong>Checkpoint</strong> above. If any item fails, redo that day rather than carrying the gap into Week 3.</li>\n</ol>\n<h2 id=\"w2-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w2.build.1\"><input aria-label=\"Done\" data-id=\"w2.build.1\" id=\"c-w2-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/providers/base.py</code>: a <code>Provider</code> protocol with <code>stream(request) -&gt; Iterator[Event]</code>. Implement <code>anthropic.py</code> (now via the official SDK, streaming) and <code>fake.py</code>, a scripted provider for deterministic tests. Optional third: any OpenAI-compatible endpoint, to feel the normalization pain.</div></li>\n<li class=\"task do\" data-id=\"w2.build.2\"><input aria-label=\"Done\" data-id=\"w2.build.2\" id=\"c-w2-build-2\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/runtime.py</code>: the loop as a generator of events. Hooks: <code>before_tool(call) -&gt; allow | deny(reason)</code>, <code>after_tool(call, result) -&gt; result</code>, <code>prepare_request(messages) -&gt; messages</code>.</div></li>\n<li class=\"task do\" data-id=\"w2.build.3\"><input aria-label=\"Done\" data-id=\"w2.build.3\" id=\"c-w2-build-3\" type=\"checkbox\"/><div class=\"task-body\">Parallel execution with <code>concurrent.futures</code> for tools marked <code>read_only=True</code>; mutating tools run sequentially, and a per-path lock guards <code>edit_file</code>.</div></li>\n<li class=\"task do\" data-id=\"w2.build.4\"><input aria-label=\"Done\" data-id=\"w2.build.4\" id=\"c-w2-build-4\" type=\"checkbox\"/><div class=\"task-body\">Ctrl-C handling: the first press aborts the current model stream or tool and appends synthetic results; the second exits. Add a <code>steer</code> queue the CLI fills while the agent runs.</div></li>\n<li class=\"task do\" data-id=\"w2.build.5\"><input aria-label=\"Done\" data-id=\"w2.build.5\" id=\"c-w2-build-5\" type=\"checkbox\"/><div class=\"task-body\"><code>edit_file</code> v2: normalize CRLF to LF for matching and restore on write; accept a list of edits applied atomically (all or nothing); if an exact match fails, report the closest candidate lines in the error instead of silently applying a fuzzy match.</div></li>\n<li class=\"task do\" data-id=\"w2.build.6\"><input aria-label=\"Done\" data-id=\"w2.build.6\" id=\"c-w2-build-6\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/session.py</code>: append-only JSONL entries <code>{id, parent_id, type, payload}</code>; <code>rig resume &lt;session&gt;</code> and <code>rig fork &lt;session&gt; &lt;entry_id&gt;</code>.</div></li>\n<li class=\"task do\" data-id=\"w2.build.7\"><input aria-label=\"Done\" data-id=\"w2.build.7\" id=\"c-w2-build-7\" type=\"checkbox\"/><div class=\"task-body\">Load <code>AGENTS.md</code> from the repo root into the system prompt inside a clearly delimited block.</div></li>\n</ol>\n<h2 id=\"w2-project-increment\">Project increment</h2>\n<p>rig v0.2: a streaming CLI with interruptible runs and resumable sessions. Write four multi-file tasks of your own for the eval set (T13 to T16). One example: \"Add a <code>click.Port</code> parameter type that accepts integers 1 to 65535, is exported from <code>click/__init__.py</code>, and describes its range in <code>--help</code>\", graded by a hidden test you write first and confirm fails on the clean tree.</p>\n<h2 id=\"w2-read-pi\">Read: pi (main) and Aider's edit blocks (contrast)</h2>\n<p><strong><a href=\"https://github.com/earendil-works/pi\" rel=\"noopener\" target=\"_blank\">earendil-works/pi</a></strong> (formerly <code>badlogic/pi-mono</code>; the old URL redirects) is worth your Thursday because it maps one-to-one onto the vocabulary: <code>packages/ai</code> is the provider layer (one normalized message and event model across dozens of providers), <code>packages/agent</code> is the runtime (about 2,100 lines across five files), and <code>packages/coding-agent</code> is the harness. Its tool set is small (read, bash, edit, write, plus grep, find and ls) and its loop exposes every hook as a plain function. The repo has grown since its \"minimal\" reputation: it now also contains an experimental durable harness, an MCP client, a server and code mode, and its npm scope is <code>@earendil-works</code>. Stay inside the three packages this week.</p>\n<p>Open these first:</p>\n<ol type=\"1\">\n<li><code>packages/agent/src/agent-loop.ts</code>: <code>runLoop</code> (line 163), <code>streamAssistantResponse</code> (381), <code>failToolCallsFromTruncatedMessage</code> (478), <code>executeToolCalls</code> (508), <code>executeToolCallsParallel</code> (586), <code>prepareToolCall</code> (708).</li>\n<li><code>packages/agent/src/types.ts</code>: <code>AgentLoopConfig</code>, especially <code>convertToLlm</code>, <code>transformContext</code>, <code>prepareRequest</code>, <code>prepareNextTurn</code>, <code>finishTurn</code>, <code>getSteeringMessages</code>, <code>getFollowUpMessages</code>, <code>beforeToolCall</code>, <code>afterToolCall</code>.</li>\n<li><code>packages/ai/src/api/transform-messages.ts</code>: <code>transformMessages</code>, the cross-provider normalization step.</li>\n<li><code>packages/coding-agent/src/core/tools/</code>: <code>edit.ts</code> with <code>edit-diff.ts</code> (<code>normalizeToLF</code>, <code>detectLineEnding</code>, <code>fuzzyFindText</code>), <code>truncate.ts</code> (<code>truncateHead</code>, <code>truncateTail</code>; defaults of 2,000 lines and 50 KB), <code>file-mutation-queue.ts</code> (<code>withFileMutationQueue</code>, 61 lines), <code>bash.ts</code>.</li>\n<li><code>packages/coding-agent/src/core/system-prompt.ts</code> (<code>buildSystemPrompt</code>, <code>renderProjectContext</code>) and the context-file candidates in <code>resource-loader.ts</code> (<code>AGENTS.md</code>, <code>CLAUDE.md</code> and variants).</li>\n<li><code>packages/coding-agent/src/core/session-manager.ts</code>: the entry types near the top, then <code>appendMessage</code>, <code>getBranch</code>, <code>buildSessionContext</code>, <code>branch</code>.</li>\n<li><code>packages/coding-agent/src/core/agent-session.ts</code> is 4,398 lines; read only <code>prompt</code> (1968), <code>_runAgentPrompt</code> (1822), <code>_handlePostAgentRun</code> (1853), <code>_queueSteer</code> (2238), <code>abort</code> (2434), <code>_isRetryableError</code> (3709), <code>_prepareRetry</code> (3762) and <code>_omitRecoveryAttempt</code> (1237).</li>\n</ol>\n<p><strong><a href=\"https://github.com/Aider-AI/aider\" rel=\"noopener\" target=\"_blank\">Aider-AI/aider</a></strong>, one file only: <code>aider/coders/editblock_coder.py</code>. Aider asks the model for SEARCH/REPLACE blocks in plain text, then applies them through a cascade: <code>perfect_replace</code> → <code>replace_part_with_missing_leading_whitespace</code> → <code>try_dotdotdots</code> → <code>replace_closest_edit_distance</code>. Reading it next to pi's <code>edit-diff.ts</code> shows the whole design space of edit formats in 30 minutes.</p>\n<p><strong>Trace this path in pi:</strong> a user prompt enters <code>AgentSession.prompt</code> → <code>_runAgentPrompt</code> → <code>agentLoop</code> → <code>runLoop</code> → <code>prepareRequest</code> hook → <code>streamAssistantResponse</code> (provider stream, events re-emitted) → stop reason check → <code>executeToolCalls</code> → <code>prepareToolCall</code> (argument validation, <code>beforeToolCall</code>) → tool <code>execute</code> (for edits, inside <code>withFileMutationQueue</code>) → <code>finalizeExecutedToolCall</code> (<code>afterToolCall</code>) → ordered tool-result messages → <code>finishTurn</code> → steering poll → next iteration. Then trace one failure: a provider 529 surfacing as an error message, <code>_isRetryableError</code>, backoff in <code>_prepareRetry</code>, and <code>_omitRecoveryAttempt</code> hiding the failed attempt from future context without deleting it from the log.</p>\n<p>If you want a third data point, open a few of your own Claude Code transcripts (JSONL files under <code>~/.claude/projects/</code> on your machine) and map their entry types onto pi's session entries. You already know what those sessions felt like; now you can see what they stored.</p>\n<h2 id=\"w2-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w2.q.1\"><input aria-label=\"I can answer this\" data-id=\"w2.q.1\" id=\"c-w2-q-1\" type=\"checkbox\"/><div class=\"task-body\">Where exactly are steering messages injected versus follow-up messages, and why are both needed?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.2\"><input aria-label=\"I can answer this\" data-id=\"w2.q.2\" id=\"c-w2-q-2\" type=\"checkbox\"/><div class=\"task-body\">Why does pi refuse to execute any tool call from a response that stopped on the length limit, even ones that look complete?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.3\"><input aria-label=\"I can answer this\" data-id=\"w2.q.3\" id=\"c-w2-q-3\" type=\"checkbox\"/><div class=\"task-body\">Tools run concurrently in <code>executeToolCallsParallel</code>; in what order are results appended, and why does that order matter?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.4\"><input aria-label=\"I can answer this\" data-id=\"w2.q.4\" id=\"c-w2-q-4\" type=\"checkbox\"/><div class=\"task-body\">What guarantee does <code>withFileMutationQueue</code> give, why is it keyed by <code>realpath</code>, and what does it not protect against?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.5\"><input aria-label=\"I can answer this\" data-id=\"w2.q.5\" id=\"c-w2-q-5\" type=\"checkbox\"/><div class=\"task-body\">Which tools truncate from the head and which keep the tail, and why is that the right split?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.6\"><input aria-label=\"I can answer this\" data-id=\"w2.q.6\" id=\"c-w2-q-6\" type=\"checkbox\"/><div class=\"task-body\">How does a CRLF file survive an edit, and what is the risk in <code>fuzzyFindText</code>?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.7\"><input aria-label=\"I can answer this\" data-id=\"w2.q.7\" id=\"c-w2-q-7\" type=\"checkbox\"/><div class=\"task-body\">Why is the agent's message type different from the provider's message type, and where does <code>convertToLlm</code> run?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.8\"><input aria-label=\"I can answer this\" data-id=\"w2.q.8\" id=\"c-w2-q-8\" type=\"checkbox\"/><div class=\"task-body\">How does a branched session rebuild the model's context from a leaf entry?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w2.q.9\"><input aria-label=\"I can answer this\" data-id=\"w2.q.9\" id=\"c-w2-q-9\" type=\"checkbox\"/><div class=\"task-body\">Why does <code>_omitRecoveryAttempt</code> append a context-edit entry instead of deleting the failed message?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w2-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w2.exp.1\"><input aria-label=\"Done\" data-id=\"w2.exp.1\" id=\"c-w2-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Run rig's eval set with parallel read-only tools on and off. Record wall time and whether results change.</div></li>\n<li class=\"task do\" data-id=\"w2.exp.2\"><input aria-label=\"Done\" data-id=\"w2.exp.2\" id=\"c-w2-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Swap rig's <code>edit_file</code> for an Aider-style SEARCH/REPLACE text format (no tool call) on T04 to T11. Compare edit failures and wrong-location edits.</div></li>\n<li class=\"task do\" data-id=\"w2.exp.3\"><input aria-label=\"Done\" data-id=\"w2.exp.3\" id=\"c-w2-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Add a fuzzy-match fallback to <code>edit_file</code>, then seed a file with two near-identical blocks. Find a prompt that makes it edit the wrong one.</div></li>\n<li class=\"task do\" data-id=\"w2.exp.4\"><input aria-label=\"Done\" data-id=\"w2.exp.4\" id=\"c-w2-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Kill rig mid-tool, resume the session, and check the transcript is still valid for the API. Then fork from step 3 and rerun.</div></li>\n<li class=\"task do\" data-id=\"w2.exp.5\"><input aria-label=\"Done\" data-id=\"w2.exp.5\" id=\"c-w2-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Point the provider interface at a second provider and list every normalization you needed (tool-call id formats, system prompt placement, stop reasons, usage fields).</div></li>\n</ol>\n<h2 id=\"w2-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Duplicate tool execution</strong> first appears here: a retry after a provider error must not re-run tools whose results are already in the log. Make \"results already recorded for this call id\" a hard check.</li>\n<li><strong>Cancellation semantics</strong> are an API contract: every abort path has a test that the next request is valid.</li>\n<li><strong>Provider failures</strong> become a typed error enum (retryable overload, rate limit, invalid request, context overflow, auth) instead of string matching.</li>\n<li><strong>Rate limits</strong> under parallel evals: a shared token bucket across runs, not per-run backoff alone.</li>\n</ul>\n<h2 id=\"w2-not-yet\">Not yet</h2>\n<p>Other harnesses (OpenCode, Codex CLI, OpenHands) beyond the files named here; pi's <code>packages/durable</code>, <code>mcp</code>, <code>server</code> and <code>codemode</code>; TUI rendering code; provider-specific features such as server-side tools.</p>\n<h2 id=\"w2-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w2.check.1\"><input aria-label=\"Done\" data-id=\"w2.check.1\" id=\"c-w2-check-1\" type=\"checkbox\"/><div class=\"task-body\">You can draw pi's three layers and place every file you read in one of them.</div></li>\n<li class=\"task do\" data-id=\"w2.check.2\"><input aria-label=\"Done\" data-id=\"w2.check.2\" id=\"c-w2-check-2\" type=\"checkbox\"/><div class=\"task-body\">Ctrl-C at any moment (during streaming, during a parallel batch, during an edit) leaves a session that resumes and passes API validation. You have a test for each case.</div></li>\n<li class=\"task do\" data-id=\"w2.check.3\"><input aria-label=\"Done\" data-id=\"w2.check.3\" id=\"c-w2-check-3\" type=\"checkbox\"/><div class=\"task-body\">On T01 to T16, rig v0.2 is no worse than v0.1 on pass^3, and you can explain any task whose result changed by pointing at trace events.</div></li>\n</ul>\n", "toc": [["w2-concepts", "Concepts", []], ["w2-day-by-day", "Day by day", [["w2-day-by-day-mon", "Monday — read the three-layer split before you build it."], ["w2-day-by-day-tue", "Tuesday — provider, runtime, parallel execution."], ["w2-day-by-day-wed", "Wednesday — interruption and safer edits."], ["w2-day-by-day-thu", "Thursday — AGENTS.md, then read pi and Aider."], ["w2-day-by-day-fri", "Friday — break the harness on purpose."], ["w2-day-by-day-sat", "Saturday — the rest of the experiments, then the project increment."], ["w2-day-by-day-sun", "Sunday — the full regression, then the checkpoint."]]], ["w2-build", "Build", []], ["w2-project-increment", "Project increment", []], ["w2-read-pi", "Read: pi (main) and Aider's edit blocks (contrast)", []], ["w2-you-should-be-able-to-answer", "You should be able to answer", []], ["w2-experiments", "Experiments", []], ["w2-production-lens", "Production lens", []], ["w2-not-yet", "Not yet", []], ["w2-checkpoint", "Checkpoint", []]], "text": "This week you split rig into the same three layers pi uses (provider, runtime, harness) and harden the parts users actually feel: streaming, cancellation, steering, parallel tools, edit robustness and resumable sessions. The model and loop barely change; the harness around them changes a lot. Concepts Three layers. Provider adapter (wire format to a normalized message and event type), runtime (the loop, events, hooks, cancellation), harness (tools, prompt assembly, sessions, UI). Most frameworks blur these; pi keeps them in separate packages. Events, not return values. A loop that yields turn_start, message_delta, tool_start, tool_end, turn_end lets the CLI, the trace writer and a future UI all subscribe without touching the loop. Parallel tool calls with ordered results. Execute concurrently, append results in the order the model issued the calls. Order keeps transcripts deterministic, which matters for replay and for prompt caching next week. Same-file writes must serialize even when everything else runs in parallel. Cancellation must leave a valid transcript. Every tool_use still needs a tool_result, so an aborted call gets a synthetic \"aborted\" result. Steering versus follow-up. A message typed mid-run can be injected after the current tool batch (steering) or held until the agent would otherwise stop (follow-up). Edit robustness. Line endings, trailing whitespace, tabs versus spaces, and the trade-off between exact matching (safe, brittle) and fuzzy matching (forgiving, can edit the wrong place). Sessions as append-only logs. A JSONL of entries with id and parentId gives resume, branching and \"undo\" without ever rewriting history. Day by day Seven Build steps this week split into two code-heavy days and a lighter Thursday; the model and loop barely change, so most of the week is harness engineering you can build without the API in front of you. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts above; note the three-layer split and the event model Half-page note: provider / runtime / harness, and why events beat return values Tue 2.5 to 3 h Build steps 1 to 3 A fake provider streams events through runtime.py; read-only tools run in parallel with ordered results Wed 2.5 to 3 h Build steps 4 to 6 Ctrl-C mid-run leaves a session that resumes; edit_file v2 reports the closest candidate on a failed match Thu 1.5 to 2 h Build step 7; read pi and Aider; trace the path AGENTS.md loads into the system prompt; you can narrate pi's prompt-to-tool-result path from memory Fri 1 to 1.5 h Experiments 1 to 3 notes/week2-experiments.md: parallel on/off, Aider-style edits, a reproduced fuzzy-match failure Sat 3 to 4 h Experiments 4 to 5; Project increment: v0.2 CLI, write T13 to T16 Kill-and-resume verified; four new hidden-test tasks confirmed failing on a clean tree Sun 2 to 3 h Run T01 to T16 three times; answer remaining questions; attempt Checkpoint v0.2 no worse than v0.1 on pass^3, or a redo list Monday — read the three-layer split before you build it. Everything you build this week slots into one of three layers: provider, runtime, harness. Spend the short Monday slot fixing that boundary in your head before you start moving code, because the whole point of splitting rig this way is that streaming, cancellation and sessions become local changes instead of rewrites of loop.py. Read Concepts above twice: once for the three layers, once for why the loop becomes a generator of events. Write a half-page note: which of this week's seven Build steps belongs to which layer, before you write any of them. Tuesday — provider, runtime, parallel execution. Today you rebuild the bottom two layers: a provider adapter that normalizes the wire format into events, and a runtime loop that yields those events instead of returning a dict. Parallel tool execution rides on top of the same event loop, so it belongs in the same sitting — read-only tools running concurrently is the first payoff of switching to events at all. Implement Build steps 1 and 2: rig/providers/base.py's Provider protocol, anthropic.py via the official SDK (streaming), fake.py for deterministic tests, and rig/runtime.py's loop as a generator with the three hooks. Implement Build step 3: parallel execution for read_only=True tools, mutating tools sequential, a per-path lock around edit_file. Confirm ordering: run a prompt that issues three read-only calls at once and check the trace shows results appended in the order the model issued the calls, not completion order. Wednesday — interruption and safer edits. Today the agent becomes something you can interrupt without breaking it, and edit_file stops silently doing the wrong thing. Both are harness-layer changes a real user feels immediately: a Ctrl-C that corrupts the transcript, or an edit that lands on the wrong occurrence, is the kind of bug that erodes trust fast. Implement Build step 4: Ctrl-C handling (first press aborts and appends synthetic tool_results, second exits) and the steer queue. Implement Build step 5: edit_file v2 — CRLF normalization, atomic multi-edit lists, closest-candidate lines in the error instead of a silent fuzzy match. Implement Build step 6: rig/session.py's append-only JSONL, rig resume and rig fork. Test the interaction of the two: abort mid-edit, resume the session, and confirm the transcript is still valid for the API. Thursday — AGENTS.md, then read pi and Aider. The last Build step is small, so clear it first and spend the rest of the day on the two reads that justify this week's design: pi, which maps almost exactly onto rig's new three layers, and Aider's edit-block cascade, the clearest contrast to edit_file's exact-match rule. Implement Build step 7: load AGENTS.md from the repo root into the system prompt inside a delimited block. Read pi's files listed under Read: pi (main) and Aider's edit blocks (contrast) above, in the given order, then aider/coders/editblock_coder.py. Trace the path given there, then the failure path (a 529, _isRetryableError, _omitRecoveryAttempt). Answer questions 1 to 4 in You should be able to answer from the trace alone. Friday — break the harness on purpose. No new modules today. You spend the slot running the cheap half of this week's experiments against the agent you already built, to find out which of Tuesday's and Wednesday's changes actually mattered under pressure. Run Experiments 1 to 3 above against T04 to T11. Write up pass rate, steps and tokens, and the one trace where fuzzy matching picked the wrong block, in notes/week2-experiments.md. Saturday — the rest of the experiments, then the project increment. Today has two jobs: finish the experiments that need a running session to kill (resuming and forking mid-run), and extend the eval set itself, since rig v0.2 is judged against four tasks you have to write yourself, not just tasks handed to you. Run Experiments 4 and 5: kill rig mid-tool and resume; point the provider interface at a second provider and list every normalization needed. Write T13 to T16 for Project increment above — four multi-file tasks, each with a hidden test you confirm fails on the clean tree before you call it done. Run the CLI end to end on all four: streaming output, a steer message injected mid-run, a resumed session. Sunday — the full regression, then the checkpoint. No new code today. A new harness is worthless if it quietly regresses the twelve tasks you already trust, so you rerun everything before trusting v0.2 at all. Run T01 to T16 three times each through evals/run_evals.py. Confirm pass^3 on T01 to T12 is no worse than your Week 1 baseline; if it is, find the trace event where behavior diverged before moving on. Answer the remaining questions in You should be able to answer, then attempt Checkpoint above. If any item fails, redo that day rather than carrying the gap into Week 3. Build rig/providers/base.py: a Provider protocol with stream(request) -> Iterator[Event]. Implement anthropic.py (now via the official SDK, streaming) and fake.py, a scripted provider for deterministic tests. Optional third: any OpenAI-compatible endpoint, to feel the normalization pain. rig/runtime.py: the loop as a generator of events. Hooks: before_tool(call) -> allow | deny(reason), after_tool(call, result) -> result, prepare_request(messages) -> messages. Parallel execution with concurrent.futures for tools marked read_only=True; mutating tools run sequentially, and a per-path lock guards edit_file. Ctrl-C handling: the first press aborts the current model stream or tool and appends synthetic results; the second exits. Add a steer queue the CLI fills while the agent runs. edit_file v2: normalize CRLF to LF for matching and restore on write; accept a list of edits applied atomically (all or nothing); if an exact match fails, report the closest candidate lines in the error instead of silently applying a fuzzy match. rig/session.py: append-only JSONL entries {id, parent_id, type, payload}; rig resume <session> and rig fork <session> <entry_id>. Load AGENTS.md from the repo root into the system prompt inside a clearly delimited block. Project increment rig v0.2: a streaming CLI with interruptible runs and resumable sessions. Write four multi-file tasks of your own for the eval set (T13 to T16). One example: \"Add a click.Port parameter type that accepts integers 1 to 65535, is exported from click/__init__.py, and describes its range in --help\", graded by a hidden test you write first and confirm fails on the clean tree. Read: pi (main) and Aider's edit blocks (contrast) earendil-works/pi (formerly badlogic/pi-mono; the old URL redirects) is worth your Thursday because it maps one-to-one onto the vocabulary: packages/ai is the provider layer (one normalized message and event model across dozens of providers), packages/agent is the runtime (about 2,100 lines across five files), and packages/coding-agent is the harness. Its tool set is small (read, bash, edit, write, plus grep, find and ls) and its loop exposes every hook as a plain function. The repo has grown since its \"minimal\" reputation: it now also contains an experimental durable harness, an MCP client, a server and code mode, and its npm scope is @earendil-works. Stay inside the three packages this week. Open these first: packages/agent/src/agent-loop.ts: runLoop (line 163), streamAssistantResponse (381), failToolCallsFromTruncatedMessage (478), executeToolCalls (508), executeToolCallsParallel (586), prepareToolCall (708). packages/agent/src/types.ts: AgentLoopConfig, especially convertToLlm, transformContext, prepareRequest, prepareNextTurn, finishTurn, getSteeringMessages, getFollowUpMessages, beforeToolCall, afterToolCall. packages/ai/src/api/transform-messages.ts: transformMessages, the cross-provider normalization step. packages/coding-agent/src/core/tools/: edit.ts with edit-diff.ts (normalizeToLF, detectLineEnding, fuzzyFindText), truncate.ts (truncateHead, truncateTail; defaults of 2,000 lines and 50 KB), file-mutation-queue.ts (withFileMutationQueue, 61 lines), bash.ts. packages/coding-agent/src/core/system-prompt.ts (buildSystemPrompt, renderProjectContext) and the context-file candidates in resource-loader.ts (AGENTS.md, CLAUDE.md and variants). packages/coding-agent/src/core/session-manager.ts: the entry types near the top, then appendMessage, getBranch, buildSessionContext, branch. packages/coding-agent/src/core/agent-session.ts is 4,398 lines; read only prompt (1968), _runAgentPrompt (1822), _handlePostAgentRun (1853), _queueSteer (2238), abort (2434), _isRetryableError (3709), _prepareRetry (3762) and _omitRecoveryAttempt (1237). Aider-AI/aider, one file only: aider/coders/editblock_coder.py. Aider asks the model for SEARCH/REPLACE blocks in plain text, then applies them through a cascade: perfect_replace → replace_part_with_missing_leading_whitespace → try_dotdotdots → replace_closest_edit_distance. Reading it next to pi's edit-diff.ts shows the whole design space of edit formats in 30 minutes. Trace this path in pi: a user prompt enters AgentSession.prompt → _runAgentPrompt → agentLoop → runLoop → prepareRequest hook → streamAssistantResponse (provider stream, events re-emitted) → stop reason check → executeToolCalls → prepareToolCall (argument validation, beforeToolCall) → tool execute (for edits, inside withFileMutationQueue) → finalizeExecutedToolCall (afterToolCall) → ordered tool-result messages → finishTurn → steering poll → next iteration. Then trace one failure: a provider 529 surfacing as an error message, _isRetryableError, backoff in _prepareRetry, and _omitRecoveryAttempt hiding the failed attempt from future context without deleting it from the log. If you want a third data point, open a few of your own Claude Code transcripts (JSONL files under ~/.claude/projects/ on your machine) and map their entry types onto pi's session entries. You already know what those sessions felt like; now you can see what they stored. You should be able to answer Where exactly are steering messages injected versus follow-up messages, and why are both needed? Can answer Why does pi refuse to execute any tool call from a response that stopped on the length limit, even ones that look complete? Can answer Tools run concurrently in executeToolCallsParallel; in what order are results appended, and why does that order matter? Can answer What guarantee does withFileMutationQueue give, why is it keyed by realpath, and what does it not protect against? Can answer Which tools truncate from the head and which keep the tail, and why is that the right split? Can answer How does a CRLF file survive an edit, and what is the risk in fuzzyFindText? Can answer Why is the agent's message type different from the provider's message type, and where does convertToLlm run? Can answer How does a branched session rebuild the model's context from a leaf entry? Can answer Why does _omitRecoveryAttempt append a context-edit entry instead of deleting the failed message? Can answer Experiments Run rig's eval set with parallel read-only tools on and off. Record wall time and whether results change. Swap rig's edit_file for an Aider-style SEARCH/REPLACE text format (no tool call) on T04 to T11. Compare edit failures and wrong-location edits. Add a fuzzy-match fallback to edit_file, then seed a file with two near-identical blocks. Find a prompt that makes it edit the wrong one. Kill rig mid-tool, resume the session, and check the transcript is still valid for the API. Then fork from step 3 and rerun. Point the provider interface at a second provider and list every normalization you needed (tool-call id formats, system prompt placement, stop reasons, usage fields). Production lens Duplicate tool execution first appears here: a retry after a provider error must not re-run tools whose results are already in the log. Make \"results already recorded for this call id\" a hard check. Cancellation semantics are an API contract: every abort path has a test that the next request is valid. Provider failures become a typed error enum (retryable overload, rate limit, invalid request, context overflow, auth) instead of string matching. Rate limits under parallel evals: a shared token bucket across runs, not per-run backoff alone. Not yet Other harnesses (OpenCode, Codex CLI, OpenHands) beyond the files named here; pi's packages/durable, mcp, server and codemode; TUI rendering code; provider-specific features such as server-side tools. Checkpoint You can draw pi's three layers and place every file you read in one of them. Ctrl-C at any moment (during streaming, during a parallel batch, during an edit) leaves a session that resumes and passes API validation. You have a test for each case. On T01 to T16, rig v0.2 is no worse than v0.1 on pass^3, and you can explain any task whose result changed by pointing at trace events.", "tasks": 24}, {"id": "w3", "group": "Weeks", "title": "Week 3: context engineering, compaction, memory and caching", "short": "Week 3", "html": "<p>Context engineering is one decision made before every request: which bytes go in, in what order. This week you make that decision explicit and measured, and you learn that prompt caching is the transformer's key/value cache exposed as a billing feature.</p>\n<h2 id=\"w3-concepts\">Concepts</h2>\n<ul>\n<li><strong>Token accounting by segment.</strong> Tools, system prompt, project memory, history, latest turn. The provider's <code>usage</code> is ground truth; character-based estimates are for planning ahead of a request.</li>\n<li><strong>The KV cache.</strong> Each token's attention keys and values, per layer, are computed once. A new request can reuse them only for an exactly identical token prefix. Serving engines store them in a radix tree (SGLang) or as hash-chained blocks (vLLM).</li>\n<li><strong>Prompt caching as an API.</strong> Cache breakpoints mark how far a prefix may be reused; cached reads are billed far below fresh input; entries expire after a short TTL. Layout rule: stable things first (tools, system, memory), append-only history after, nothing earlier ever edited.</li>\n<li><strong>Cache economics.</strong> On the Anthropic API a 5-minute cache write costs 1.25 times the base input price, a 1-hour write 2 times, and a read 0.1 times (less on some current models). A request can carry at most 4 breakpoints, and a lookup walks back at most 20 blocks from each one. A 5-minute entry pays for itself on its first reuse; a 1-hour entry needs two. OpenAI caches prefixes automatically (1,024 tokens minimum on current models) and lets you group requests with <code>prompt_cache_key</code>. Either way, the TTL is a bet on how soon the next request arrives.</li>\n<li><strong>What invalidates a cache</strong> follows the prefix order tools → system → messages. Changing tool definitions invalidates everything; changing <code>tool_choice</code> or images invalidates the system and message levels, and on some models so do thinking and effort settings. Caches are per model, so a model switch starts from zero (Week 8 builds on this).</li>\n<li><strong>Providers can shrink history for you.</strong> Anthropic's tool-result clearing (<code>clear_tool_uses_20250919</code>, tuned with <code>trigger</code>, <code>keep</code>, <code>clear_at_least</code> and <code>exclude_tools</code>) replaces old tool results with placeholders on the server, and server-side compaction summarizes on demand or at a token threshold. Build the client-side versions first so you can judge theirs.</li>\n<li><strong>Prompt churn</strong> is anything that changes early bytes: a timestamp in the system prompt, a re-sorted tool list, non-deterministic JSON key order, rewriting an old message.</li>\n<li><strong>Three ways to shrink history</strong>, cheapest first: truncate at the tool (Week 1), mask old observations with placeholders, and summarize a prefix (compaction). Each costs something: re-reads, lost detail, a cache miss.</li>\n<li><strong>Safe cut points.</strong> A cut must not separate a <code>tool_use</code> from its <code>tool_result</code>, and should land on a turn boundary.</li>\n<li><strong>Trigger policy.</strong> Proactive (crossing a fraction of the window) versus reactive (the provider rejects the request as too long). You need both.</li>\n<li><strong>Memory is prompt assembly with persistence.</strong> Short-term memory is the transcript; working memory is a file the agent edits (a plan or todo list); long-term memory is text written at the end of one session and loaded at the start of another. Every \"memory system\" is a policy for who writes that text and when it is loaded.</li>\n</ul>\n<h2 id=\"w3-day-by-day\">Day by day</h2>\n<p>Nine Build steps this week split into two code-heavy days; don't shortchange Thursday's read, it's the one that turns \"prompt caching\" from a billing line item into a tree lookup you actually understand.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read <strong>Concepts</strong> above; note the cache economics</td>\n<td>Half-page note: the KV cache, 5-minute vs 1-hour breakpoints, what invalidates a cache</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>3 to 4 h</td>\n<td>Build steps 1 to 4</td>\n<td>Per-segment token accounting in the trace; deliberate breakpoints; observation masking; compaction firing past 70% of the window</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>3 to 4 h</td>\n<td>Build steps 5 to 9</td>\n<td>A radix-tree toy with a measured hit rate; a TTL policy with pre-warm; a cache-miss ledger; three shrinkers behind one interface; <code>AGENTS.md</code> plus the <code>note</code> tool</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Read pi's compaction and cache accounting, and SGLang's radix cache; trace both paths</td>\n<td>You can narrate the proactive and reactive compaction paths from memory</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>Experiments 1, 2 and 4</td>\n<td>Cache-read ratio with caching on and off; the timestamp-churn demo and its fix; free-form vs templated summaries</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td><strong>Project increment</strong>: T17 under a 40,000-token limit; Experiments 3, 5 and 6</td>\n<td>T17 passes without overflow; the TTL bet computed in dollars; compaction vs clearing vs server compaction compared</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Experiment 7; answer remaining questions; attempt <strong>Checkpoint</strong></td>\n<td>Your radix toy's hit rate reconciled against the provider's reported cache reads; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w3-day-by-day-mon\">Monday — the KV cache, before the billing feature.</h3>\n<p>Prompt caching only makes sense once you've seen what it's exposing: per-layer attention keys and values computed once and reused for an identical prefix. Spend today's slot on Concepts and leave with the mental model you'll need to place breakpoints deliberately tomorrow, not guess at them.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above, twice through the caching bullets.</li>\n<li>Write a half-page note: the 5-minute vs 1-hour cache economics, and the exact prefix order (tools, then system, then messages) that determines what a changed byte invalidates.</li>\n</ol>\n<h3 id=\"w3-day-by-day-tue\">Tuesday — the context pipeline every request runs through.</h3>\n<p>Today's four Build steps are the path every request takes, in order: measure what you're sending, decide what's cacheable, and start shrinking history before it overflows anything. Get these four right and Wednesday's measurement tools have real data to work with.</p>\n<ol type=\"1\">\n<li>Build step 1: <code>rig/context.py</code>'s per-segment token accounting, before and after each request.</li>\n<li>Build step 2: caching — breakpoints after tools and the system prompt, and on the newest message; make history append-only and serialization deterministic.</li>\n<li>Build step 3: observation masking for tool outputs older than K turns.</li>\n<li>Build step 4: compaction past 70% of the window (or on overflow plus one retry) — summarize with the cheap model, keep the last few turns verbatim, log the result as a <code>compaction</code> entry and never delete the originals.</li>\n</ol>\n<h3 id=\"w3-day-by-day-wed\">Wednesday — measuring what Tuesday's pipeline actually does.</h3>\n<p>Today's five Build steps are about proof, not plumbing: a toy radix tree so the data structure behind a real server stops being a black box, a deliberate TTL policy, a ledger that prices every cache miss, a single interface over three ways to shrink history, and the first piece of rig's memory system.</p>\n<ol type=\"1\">\n<li>Build step 5: <code>rig/kvtoy.py</code>, the radix tree over token-id lists; replay Week 1 and 2 traces through it and compute the hit rate a server would have seen.</li>\n<li>Build step 6: <code>rig/cache_policy.py</code> — a 1-hour breakpoint after tools and system, a 5-minute one on the newest message, the TTL chosen from expected idle time, write counts recorded per TTL.</li>\n<li>Build step 7: the cost ledger with a cache-miss detector, after pi's <code>cache-stats.ts</code> — tokens that should have been cached, their cost, and the likely cause.</li>\n<li>Build step 8: one interface over your compaction, your tool-result clearing, and the provider's server-side compaction.</li>\n<li>Build step 9: an <code>AGENTS.md</code> for click, plus a <code>note</code> tool capped at 2 KB and loaded at session start.</li>\n</ol>\n<h3 id=\"w3-day-by-day-thu\">Thursday — read pi's compactor and SGLang's radix cache.</h3>\n<p>Pi's compactor handles every edge case you just built against (cut points, idempotency, cache-warming economics) in a file small enough to read in one sitting. SGLang's radix cache is the thing your Wednesday toy was a toy version of — read it today while the comparison is fresh.</p>\n<ol type=\"1\">\n<li>Read pi's files listed under <strong>Read</strong> above, through <code>cache-warmer.ts</code>.</li>\n<li>Read SGLang's <code>radix_cache.py</code>: <code>match_prefix</code>, <code>insert</code>, <code>evict</code>, <code>_match_prefix_helper</code>, <code>_split_node</code>; skim vLLM's hash-chained alternative.</li>\n<li>Trace both paths given under <strong>Read</strong>: the proactive compaction path and the reactive overflow path.</li>\n<li>Answer questions 1, 2, 5 and 6 in <strong>You should be able to answer</strong> from the reading alone.</li>\n</ol>\n<h3 id=\"w3-day-by-day-fri\">Friday — cheap experiments only.</h3>\n<p>No heavy runs today. Three quick, visible experiments show you the shape of caching before the weekend asks you to put dollar figures on it.</p>\n<p>Run Experiments 1, 2 and 4 above: caching on vs off across the eval set, the timestamp-at-top-of-prompt demo (and its fix), and free-form vs templated summaries on T17.</p>\n<h3 id=\"w3-day-by-day-sat\">Saturday — T17, and the expensive experiments.</h3>\n<p>Today you build the task this whole week was for: T17 forces all four Week 1 bugs into one session under an artificial 40,000-token limit, so compaction has to fire for real. While you're paying for runs anyway, stack the experiments that need many of them onto the same day.</p>\n<ol type=\"1\">\n<li>Add T17 to the eval set per <strong>Project increment</strong> above and confirm it overflows with no history management at all.</li>\n<li>Run Experiment 3: masking only, compaction only, both — count how often the agent re-reads a file it already read before compaction.</li>\n<li>Run Experiment 5, the TTL bet: replay one long session at 2, 8 and 40-minute idle gaps under both TTLs, with and without pre-warming; compute dollars per session.</li>\n<li>Run Experiment 6: your compaction vs tool-result clearing (two <code>clear_at_least</code> settings) vs the provider's server-side compaction — pass rate, cache misses caused, dollars.</li>\n</ol>\n<h3 id=\"w3-day-by-day-sun\">Sunday — the last experiment, then the checkpoint.</h3>\n<p>No new code today. Close the week by reconciling your own radix-tree toy against what the real provider reports, then prove you can do the SWE-bench-style accounting this plan will keep demanding of you.</p>\n<ol type=\"1\">\n<li>Run Experiment 7: compare your radix toy's hit rate with the provider's reported cache reads on the same traces, and write down why they differ.</li>\n<li>Answer the remaining questions in <strong>You should be able to answer</strong>.</li>\n<li>Attempt <strong>Checkpoint</strong> above. If you can't explain prompt caching in terms of per-layer key/value tensors cold, redo Monday before starting Week 4.</li>\n</ol>\n<h2 id=\"w3-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w3.build.1\"><input aria-label=\"Done\" data-id=\"w3.build.1\" id=\"c-w3-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/context.py</code>: before each request, compute an estimate per segment; after it, record <code>usage</code> per segment in the trace. Add <code>peak_input_tokens</code> and <code>cache_read_ratio</code> to the eval report.</div></li>\n<li class=\"task do\" data-id=\"w3.build.2\"><input aria-label=\"Done\" data-id=\"w3.build.2\" id=\"c-w3-build-2\" type=\"checkbox\"/><div class=\"task-body\">Caching: place breakpoints after the tool definitions and system prompt, and on the newest message. Make history strictly append-only and serialization deterministic.</div></li>\n<li class=\"task do\" data-id=\"w3.build.3\"><input aria-label=\"Done\" data-id=\"w3.build.3\" id=\"c-w3-build-3\" type=\"checkbox\"/><div class=\"task-body\">Observation masking: replace tool outputs older than K turns with <code>[elided: 4,812 chars from read_file src/click/core.py; call again if needed]</code>.</div></li>\n<li class=\"task do\" data-id=\"w3.build.4\"><input aria-label=\"Done\" data-id=\"w3.build.4\" id=\"c-w3-build-4\" type=\"checkbox\"/><div class=\"task-body\">Compaction: past 70% of the window (or on a context-overflow error, followed by one retry), summarize everything before the latest safe cut point with the cheap model and a fixed template (task, decisions, files touched with what changed, current state, next step), and keep the last few turns verbatim. Store it as a <code>compaction</code> entry in the session log; never delete the originals.</div></li>\n<li class=\"task do\" data-id=\"w3.build.5\"><input aria-label=\"Done\" data-id=\"w3.build.5\" id=\"c-w3-build-5\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/kvtoy.py</code>: a radix tree over token-id lists with <code>match_prefix</code>, <code>insert</code> (splitting nodes on partial matches), reference counts, and LRU <code>evict</code>. Replay the requests from your Week 1 and 2 traces through it (any tokenizer will do) and compute the hit rate a server would have seen.</div></li>\n<li class=\"task do\" data-id=\"w3.build.6\"><input aria-label=\"Done\" data-id=\"w3.build.6\" id=\"c-w3-build-6\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/cache_policy.py</code>: place breakpoints deliberately (a 1-hour breakpoint after the tools and system prompt, a 5-minute one on the newest message; 1-hour entries must come before 5-minute ones), choose the TTL from the expected idle time, and record the per-TTL write counts (<code>cache_creation.ephemeral_5m_input_tokens</code> and <code>ephemeral_1h_input_tokens</code>). Add an optional pre-warm before a known idle gap.</div></li>\n<li class=\"task do\" data-id=\"w3.build.7\"><input aria-label=\"Done\" data-id=\"w3.build.7\" id=\"c-w3-build-7\" type=\"checkbox\"/><div class=\"task-body\">A cost ledger with a cache-miss detector, after pi's <code>cache-stats.ts</code>: for each request, the tokens that should have come from cache but didn't, what that cost, and the likely cause (idle past the TTL, a model switch, an edited prefix). Every later week reads this ledger.</div></li>\n<li class=\"task do\" data-id=\"w3.build.8\"><input aria-label=\"Done\" data-id=\"w3.build.8\" id=\"c-w3-build-8\" type=\"checkbox\"/><div class=\"task-body\">Three history shrinkers behind one interface: your compaction, tool-result clearing (yours first, then the provider's), and the provider's server-side compaction.</div></li>\n<li class=\"task do\" data-id=\"w3.build.9\"><input aria-label=\"Done\" data-id=\"w3.build.9\" id=\"c-w3-build-9\" type=\"checkbox\"/><div class=\"task-body\">Memory: an <code>AGENTS.md</code> for click written by you, plus a <code>note</code> tool that appends to <code>.rig/notes.md</code> (capped at 2 KB) and is loaded at session start.</div></li>\n</ol>\n<h2 id=\"w3-project-increment\">Project increment</h2>\n<p>rig v0.3 handles long tasks. Add T17: apply the T04, T05, T07 and T09 seeds at once and ask for all four symptoms to be fixed in one session. Run it with an artificial context limit of 40,000 tokens so compaction must fire. rig v0.3 also places cache breakpoints deliberately and reports the dollars lost to cache misses.</p>\n<h2 id=\"w3-read\">Read</h2>\n<p><strong>pi's compaction (main).</strong> It is a production compactor small enough to read in one sitting, and it handles exactly the edge cases above. In <code>packages/coding-agent/src/core/compaction/compaction.ts</code>: <code>DEFAULT_COMPACTION_SETTINGS</code> (line 126), <code>shouldCompact</code> (267), <code>estimateTokens</code> (298), <code>isCutPointMessage</code> (351), <code>findValidCutPoints</code> (394), <code>findCutPoint</code> (446), <code>generateSummary</code> (645), <code>prepareCompaction</code> (872), <code>compact</code> (965). Then, in <code>agent-session.ts</code>, <code>_compactBeforeNextAssistantResponse</code> (776) and <code>_runAutoCompaction</code> (3097, which takes <code>\"overflow\" | \"threshold\"</code>). Finish with <code>cache-warmer.ts</code> (<code>getPromptCacheTtlMs</code>, <code>getCacheWarmingDelayMs</code>), which reasons about whether paying to keep a cache warm is cheaper than letting it expire.</p>\n<p><strong>pi's cache accounting.</strong> <code>packages/coding-agent/src/core/cache-stats.ts</code> (174 lines): <code>detectMiss</code> (56) prices each miss from the message's own cost breakdown, and <code>computeCacheWaste</code> (148) totals the misses for a session. In <code>cache-warmer.ts</code>, <code>CacheWarmer</code> (162) and its <code>evaluate</code> method (378) decide whether keeping a cache warm is worth paying for. In <code>packages/ai/src/api/anthropic-messages.ts</code>, <code>getCacheControl</code> (79) maps a short or long retention setting to a 5-minute or 1-hour breakpoint, and the code at line 1483 puts the history breakpoint on the last message.</p>\n<p><strong><a href=\"https://github.com/sgl-project/sglang\" rel=\"noopener\" target=\"_blank\">sgl-project/sglang</a>, one file:</strong> <code>python/sglang/srt/mem_cache/radix_cache.py</code> (818 lines). Read <code>match_prefix</code> (355), <code>insert</code> (415), <code>evict</code> (551), <code>_match_prefix_helper</code> (637) and <code>_split_node</code> (663). This is the data structure behind prefix reuse; once you have read it, \"prompt caching\" stops being a product feature and becomes a tree lookup. For the alternative design, skim vLLM's <code>hash_block_tokens</code> in <code>vllm/v1/core/kv_cache_utils.py</code> (684) and <code>KVCacheManager.get_computed_blocks</code> in <code>kv_cache_manager.py</code> (264).</p>\n<p><strong><a href=\"https://github.com/openai/codex\" rel=\"noopener\" target=\"_blank\">openai/codex</a>, prompts and memory only:</strong> <code>codex-rs/prompts/templates/compact/prompt.md</code> (a 9-line compaction prompt to compare with pi's), then <code>codex-rs/memories/README.md</code> and <code>write/templates/memories/stage_one_system.md</code>. Codex's long-term memory is a background pipeline: per-session extraction (phase 1), then consolidation into memory files (phase 2), with job leases so concurrent workers do not duplicate work, and secret redaction before anything is stored. Then compare <code>codex-rs/core/src/compact.rs</code>, which summarizes locally, with <code>compact_remote_v2.rs</code>, which asks the server to compact.</p>\n<p><strong>Trace this path in pi:</strong> a turn finishes → the <code>prepareNextTurn</code> hook calls <code>_compactBeforeNextAssistantResponse</code> → <code>_exceedsCompactionThreshold</code> → <code>prepareCompaction</code> → <code>findCutPoint</code> → <code>generateSummary</code> (a model call) → a <code>CompactionEntry</code> is appended → <code>buildSessionContext</code> rebuilds the context as summary plus kept entries → the next request. Then trace the reactive path: an overflow error → <code>_runAutoCompaction(\"overflow\", willRetry)</code> → retry.</p>\n<h2 id=\"w3-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w3.q.1\"><input aria-label=\"I can answer this\" data-id=\"w3.q.1\" id=\"c-w3-q-1\" type=\"checkbox\"/><div class=\"task-body\">What makes a valid cut point in pi, and what exactly breaks if you cut between a tool call and its result?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.2\"><input aria-label=\"I can answer this\" data-id=\"w3.q.2\" id=\"c-w3-q-2\" type=\"checkbox\"/><div class=\"task-body\">Why keep a verbatim tail instead of summarizing everything?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.3\"><input aria-label=\"I can answer this\" data-id=\"w3.q.3\" id=\"c-w3-q-3\" type=\"checkbox\"/><div class=\"task-body\">How does pi estimate tokens before a request, and when does it switch to the provider's reported usage?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.4\"><input aria-label=\"I can answer this\" data-id=\"w3.q.4\" id=\"c-w3-q-4\" type=\"checkbox\"/><div class=\"task-body\">What happens to the prompt cache right after a compaction, and what did one compaction cost in your own traces?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.5\"><input aria-label=\"I can answer this\" data-id=\"w3.q.5\" id=\"c-w3-q-5\" type=\"checkbox\"/><div class=\"task-body\">In SGLang, why does <code>insert</code> need <code>_split_node</code>, and what stops <code>evict</code> from freeing a prefix an in-flight request is using?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.6\"><input aria-label=\"I can answer this\" data-id=\"w3.q.6\" id=\"c-w3-q-6\" type=\"checkbox\"/><div class=\"task-body\">Why does vLLM chain each block's hash with its parent's hash instead of hashing blocks independently?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.7\"><input aria-label=\"I can answer this\" data-id=\"w3.q.7\" id=\"c-w3-q-7\" type=\"checkbox\"/><div class=\"task-body\">List four ways your request can miss the cache although \"nothing changed\".</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w3.q.8\"><input aria-label=\"I can answer this\" data-id=\"w3.q.8\" id=\"c-w3-q-8\" type=\"checkbox\"/><div class=\"task-body\">Why does Codex split memory into extraction and consolidation phases, and why does it need leases at all?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w3-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w3.exp.1\"><input aria-label=\"Done\" data-id=\"w3.exp.1\" id=\"c-w3-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Caching on versus off across the eval set: cache-read ratio, dollars per task, latency.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.2\"><input aria-label=\"Done\" data-id=\"w3.exp.2\" id=\"c-w3-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Add a ti
