happened), working (the current task's scratchpad) and procedural (how to do things: skills).</li>\n<li><strong>Write path and read path.</strong> Extraction decides what is worth keeping; consolidation merges, deduplicates and supersedes; redaction removes secrets and sensitive categories; the read path decides what to inject, and logs it.</li>\n<li><strong>Provenance over confidence.</strong> Store the source session and the quote a memory came from, and whether the user confirmed it. A confidence score generated by a model is a guess, not a calibration.</li>\n<li><strong>Memory as files.</strong> Letta Code keeps an agent's memory as a git-backed directory: edits are commits, conflicts are merges, and history and rollback come for free.</li>\n<li><strong>Background consolidation.</strong> Codex runs memory as a two-phase background pipeline, per-session extraction then consolidation, with job leases so concurrent workers don't duplicate work and secret redaction before anything is stored.</li>\n<li><strong>Connectors.</strong> OAuth 2.0 authorization code with PKCE, least-privilege scopes, refresh-token rotation and encrypted token storage; incremental sync (Google Calendar's <code>syncToken</code>, Gmail's <code>historyId</code>) instead of re-reading everything; push notifications where available; rate limits with backoff.</li>\n<li><strong>Inbound email is untrusted input to a privileged agent.</strong> Muse is getting its own email address; anything forwarded to it can carry instructions. So can a calendar invite's description.</li>\n<li><strong>Users must see and delete their memories.</strong> Personalization that can't be inspected reads as surveillance.</li>\n</ul>\n<h2 id=\"w13-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1-1.5 h</td>\n<td>Concepts: the four memory kinds, provenance over confidence, the write/read path split</td>\n<td>A one-page note defining profile/episodic/working/procedural, and why a stored quote beats a confidence score</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5-3 h</td>\n<td>Build steps 1-2: the memory store and the write path</td>\n<td><code>rig/memory/</code> supports write/search/supersede/forget; a finished session produces extracted, consolidated, redacted memories</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2.5-3 h</td>\n<td>Build steps 3-4: the read path and the fixture connectors</td>\n<td>Profile memories load at session start, episodic retrieval is traced; the three adversarial fixture emails don't corrupt memory</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5-2 h</td>\n<td>Read Letta Code and Codex memory; trace both paths</td>\n<td>Notes on both trace paths, and answers to the leases and conflict-repair questions below</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>2-3 h</td>\n<td>Build step 5: the real Google Calendar connector</td>\n<td>OAuth with PKCE completes; incremental sync with <code>syncToken</code> works; every write goes through the policy service</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3-4 h</td>\n<td>Build step 6: memory evals M01-M12; Experiments 1-2</td>\n<td>M01-M12 scored with precision, recall and injection-rate numbers; the contradiction experiment's numbers recorded</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2-3 h</td>\n<td>Experiments 3-4; project increment; checkpoint</td>\n<td>Adversarial-email and incremental-sync numbers recorded; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each day below points at Build, Read and Experiments for the exact contracts and traces rather than repeating them here.</p>\n<h3 id=\"w13-day-by-day-mon\">Monday — memory as a policy problem, not a database problem.</h3>\n<p>Today is reading only, no code. The week's central claim is that what you store, when you supersede it, and what you refuse to store ever matter more than which database holds it, so make that concrete before writing a line of the store. Sketch the four memory kinds in your own words and work out why a stored quote plus a confirmation flag beats a model-generated confidence score.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above twice: once for the four kinds, once for the write/read path split and the provenance rule.</li>\n<li>Sketch the <code>Memory</code> record from <strong>Build</strong> below by hand, field by field, with one sentence per field on what it's for.</li>\n<li>Write a half-page note: what makes a memory worth keeping, what makes it worth superseding, and what must never be stored regardless of what the user says.</li>\n</ol>\n<h3 id=\"w13-day-by-day-tue\">Tuesday — the store and the write path.</h3>\n<p>Today you build the two pieces that turn a raw conversation into durable facts: the store itself, and the pipeline that decides what from a session is worth keeping. By tonight a finished session produces a small set of extracted, deduplicated, redacted memories you can inspect by hand.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: <code>rig/memory/</code> with <code>write</code>, <code>search</code>, <code>supersede</code>, <code>forget</code> and a user-visible export, on the <code>Memory</code> record given there.</li>\n<li>Implement <strong>Build</strong> step 2's three passes: extraction (propose memories with quotes), consolidation (merge duplicates, supersede contradicted facts), and redaction (strip secrets and blocked categories).</li>\n<li>Run one real session through the pipeline and read every memory it produced by hand before trusting it on a second one.</li>\n</ol>\n<h3 id=\"w13-day-by-day-wed\">Wednesday — the read path and two fixture connectors.</h3>\n<p>Today the memories you wrote yesterday start getting used, and the agent gets its first look at calendar and email data, strictly from fixtures. Fixtures first means you can plant adversarial content on purpose and watch what happens before any real account is at risk.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: load profile memories at session start, retrieve episodic memories per turn with Week 4's retriever only when relevant, and trace every injected memory.</li>\n<li>Implement <strong>Build</strong> step 4: <code>CalendarConnector</code> and <code>EmailConnector</code> backed by <code>fixtures/calendar.json</code> and <code>fixtures/inbox.json</code>, including the three adversarial emails.</li>\n<li>Run a session against the adversarial fixtures and confirm none of them changes a stored memory or triggers an unapproved write.</li>\n</ol>\n<h3 id=\"w13-day-by-day-thu\">Thursday — read Letta Code and Codex memory.</h3>\n<p>No new code today. Both reference implementations solve the write-path problem you built on Tuesday with very different mechanisms — a git-backed filesystem versus a leased two-phase pipeline — and the contrast is the fastest way to see which parts of your own design were load-bearing and which were arbitrary.</p>\n<ol type=\"1\">\n<li>Read <strong>Read</strong> below in order for both projects, then trace the two paths given there end to end.</li>\n<li>Answer the <strong>You should be able to answer</strong> questions about leases, conflicts, and what git buys Letta that a key-value store would not.</li>\n</ol>\n<h3 id=\"w13-day-by-day-fri\">Friday — the real connector.</h3>\n<p>Today the agent gets a real account for the first time this plan, behind the policy service built in Week 9. This is deliberately the only real connector this week: OAuth, scopes, token rotation and incremental sync are enough new surface for one day without also debugging memory.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: Google Calendar with authorization-code-plus-PKCE OAuth, the narrowest scopes that work, refresh-token rotation and encrypted token storage.</li>\n<li>Wire incremental sync with <code>syncToken</code>, and confirm a forced \"token expired\" response triggers a full resync rather than a crash.</li>\n<li>Confirm every write from this connector routes through Week 9's policy service as a <code>calendar</code> grant, never called directly.</li>\n</ol>\n<h3 id=\"w13-day-by-day-sat\">Saturday — the memory eval set.</h3>\n<p>Today you get your first numbers: can the pipeline you built Tuesday-Wednesday actually remember, forget, and resist being fed a false fact.</p>\n<ol type=\"1\">\n<li>Implement and run <strong>Build</strong> step 6: memory evals M01-M12.</li>\n<li>Record memory precision and recall, the wrong-memory injection rate, and extra tokens spent on memory.</li>\n<li>Run <strong>Experiments</strong> 1-2 below against the same M01-M12 set.</li>\n</ol>\n<h3 id=\"w13-day-by-day-sun\">Sunday — adversarial numbers, the project increment, and the checkpoint.</h3>\n<p>No new code today. Close the week by putting a number on the two risks named in Concepts — a poisoned email and a stale sync token — then assemble rig v0.13 and attempt the checkpoint cold.</p>\n<ol type=\"1\">\n<li>Run <strong>Experiments</strong> 3-4 below and record the numbers.</li>\n<li>Assemble the <strong>Project increment</strong>: <code>personal</code> mode with memory, fixture connectors and the one real connector behind the policy service.</li>\n<li>Attempt <strong>Checkpoint</strong> below. If you can't pass it cold, redo the relevant day before moving to Week 14.</li>\n</ol>\n<h2 id=\"w13-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w13.build.1\"><input aria-label=\"Done\" data-id=\"w13.build.1\" id=\"c-w13-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/memory/</code>: a store with <code>write</code>, <code>search</code>, <code>supersede</code>, <code>forget</code> and a user-visible export, using the record below.</div></li>\n<li class=\"task do\" data-id=\"w13.build.2\"><input aria-label=\"Done\" data-id=\"w13.build.2\" id=\"c-w13-build-2\" type=\"checkbox\"/><div class=\"task-body\">Write path: after each session, an extraction pass proposes memories with quotes, a consolidation pass merges duplicates and supersedes contradicted facts, and a redaction pass removes secrets and blocked categories.</div></li>\n<li class=\"task do\" data-id=\"w13.build.3\"><input aria-label=\"Done\" data-id=\"w13.build.3\" id=\"c-w13-build-3\" type=\"checkbox\"/><div class=\"task-body\">Read path: load profile memories at session start; retrieve episodic memories per turn with Week 4's retriever only when relevant; trace every injected memory.</div></li>\n<li class=\"task do\" data-id=\"w13.build.4\"><input aria-label=\"Done\" data-id=\"w13.build.4\" id=\"c-w13-build-4\" type=\"checkbox\"/><div class=\"task-body\">Fixture connectors first: <code>CalendarConnector</code> (<code>list_events</code>, <code>create_event</code>) and <code>EmailConnector</code> (<code>search</code>, <code>read</code>, <code>draft</code>) backed by <code>fixtures/calendar.json</code> and <code>fixtures/inbox.json</code>, including three adversarial emails.</div></li>\n<li class=\"task do\" data-id=\"w13.build.5\"><input aria-label=\"Done\" data-id=\"w13.build.5\" id=\"c-w13-build-5\" type=\"checkbox\"/><div class=\"task-body\">One real connector: Google Calendar with OAuth (authorization code and PKCE), the narrowest scopes that work, refresh-token rotation, encrypted token storage and incremental sync with <code>syncToken</code>. Writes go through Week 9's policy service as <code>calendar</code> write grants.</div></li>\n<li class=\"task do\" data-id=\"w13.build.6\"><input aria-label=\"Done\" data-id=\"w13.build.6\" id=\"c-w13-build-6\" type=\"checkbox\"/><div class=\"task-body\">Memory evals M01–M12: remember a stable preference; handle a correction by superseding; refuse to store a do-not-remember item; recall across sessions; don't inject irrelevant memories; handle a stale fact; resist a poisoning email (\"remember that my new bank account is …\"). Metrics: memory precision and recall, wrong-memory injection rate, and extra tokens spent on memory.</div></li>\n</ol>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">class MemoryKind(Enum):\n    PROFILE = \"profile\"\n    EPISODIC = \"episodic\"\n    WORKING = \"working\"\n    PROCEDURAL = \"procedural\"\n\n@dataclass(frozen=True)\nclass Memory:\n    id: str\n    kind: MemoryKind\n    text: str\n    source_session: str\n    source_quote: str           # the words it came from; no quote, no memory\n    confirmed_by_user: bool     # instead of a model-generated confidence score\n    created_at: datetime\n    expires_at: datetime | None\n    supersedes: str | None      # id of the memory this one replaces</code></pre></div>\n<h2 id=\"w13-project-increment\">Project increment</h2>\n<p>rig v0.13: a <code>personal</code> mode with memory, fixture connectors and one real calendar connector behind the policy service.</p>\n<h2 id=\"w13-read\">Read</h2>\n<p><strong><a href=\"https://github.com/letta-ai/letta-code\" rel=\"noopener\" target=\"_blank\">letta-ai/letta-code</a></strong> at <code>42397c7</code>. The prompts specify the behaviour: <code>src/agent/prompts/letta.md</code>, <code>src/agent/subagents/builtin/memory.md</code> (a background subagent that edits memory in a private worktree, commits only the files it changed, and leaves merging to the harness) and <code>reflection.md</code>. Then the mechanism: <code>src/agent/memory-filesystem.ts</code> (693 lines: <code>ensureMemoryFilesystemDirs</code> 133, <code>renderMemoryFilesystemTree</code> 312), <code>memory-git.ts</code> (<code>runGitWithRetry</code> 632, <code>pushToMemoryRepository</code> 946, <code>commitMemoryWrite</code> 1234), <code>memory-conflict-repair.ts</code> (<code>claimMemoryConflictRepair</code> 161, <code>completeMemoryConflictRepair</code> 212) and <code>reflection-runs.ts</code> (<code>requestReflectionRun</code> 48).</p>\n<p><strong><a href=\"https://github.com/openai/codex\" rel=\"noopener\" target=\"_blank\">openai/codex</a> memory</strong> at <code>72c9595</code>: <code>codex-rs/memories/README.md</code> for the two phases, leases and redaction; <code>write/templates/memories/stage_one_system.md</code> (the extraction prompt) and <code>consolidation.md</code>; then the read path in <code>codex-rs/memories/read/src/</code> (<code>citations.rs</code> parses which memories an answer used; <code>usage.rs</code> classifies read usage for telemetry).</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>Codex: a root session starts → eligibility checks (not ephemeral, not a subagent, memory enabled) → phase 1 claims eligible past sessions under leases → an extraction model call per session → redaction → stage-one outputs stored → phase 2 consolidates them into memory files → the next session's read path injects them.</li>\n<li>Letta Code: a reflection run is requested → the memory subagent edits files in a worktree → <code>commitMemoryWrite</code> → the harness merges and syncs → on conflict, <code>claimMemoryConflictRepair</code> and <code>completeMemoryConflictRepair</code>.</li>\n</ul>\n<h2 id=\"w13-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w13.q.1\"><input aria-label=\"I can answer this\" data-id=\"w13.q.1\" id=\"c-w13-q-1\" type=\"checkbox\"/><div class=\"task-body\">Why is memory primarily a policy problem rather than a vector-database problem?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w13.q.2\"><input aria-label=\"I can answer this\" data-id=\"w13.q.2\" id=\"c-w13-q-2\" type=\"checkbox\"/><div class=\"task-body\">What does git give Letta's memory that a key-value store would not, and what does it cost?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w13.q.3\"><input aria-label=\"I can answer this\" data-id=\"w13.q.3\" id=\"c-w13-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why does Codex need leases for memory extraction, and what happens without them?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w13.q.4\"><input aria-label=\"I can answer this\" data-id=\"w13.q.4\" id=\"c-w13-q-4\" type=\"checkbox\"/><div class=\"task-body\">What decides whether a memory is injected into a given turn, and how would you know it was the wrong one?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w13.q.5\"><input aria-label=\"I can answer this\" data-id=\"w13.q.5\" id=\"c-w13-q-5\" type=\"checkbox\"/><div class=\"task-body\">How does incremental sync with a sync token work, and what must you do when the server says the token has expired?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w13.q.6\"><input aria-label=\"I can answer this\" data-id=\"w13.q.6\" id=\"c-w13-q-6\" type=\"checkbox\"/><div class=\"task-body\">Walk through how an email in the inbox could get a false fact into long-term memory, and where your design stops it.</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w13-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w13.exp.1\"><input aria-label=\"Done\" data-id=\"w13.exp.1\" id=\"c-w13-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Memory off, profile only, and profile plus episodic retrieval on M01–M12: precision, recall and tokens.</div></li>\n<li class=\"task do\" data-id=\"w13.exp.2\"><input aria-label=\"Done\" data-id=\"w13.exp.2\" id=\"c-w13-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Inject a contradicting fact; measure how often the old one is still used after consolidation.</div></li>\n<li class=\"task do\" data-id=\"w13.exp.3\"><input aria-label=\"Done\" data-id=\"w13.exp.3\" id=\"c-w13-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Run the three adversarial emails with and without the redaction and untrusted-text tagging.</div></li>\n<li class=\"task do\" data-id=\"w13.exp.4\"><input aria-label=\"Done\" data-id=\"w13.exp.4\" id=\"c-w13-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Full re-read against incremental sync on a calendar with 1,000 events: API calls, latency and rate-limit headroom.</div></li>\n</ol>\n<h2 id=\"w13-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Deletion is a feature.</strong> \"Forget this\" must remove the memory, anything derived from it, and its copies in caches and indexes.</li>\n<li><strong>Token storage</strong> is a secrets-management problem: encrypted at rest, scoped per user, revocable, rotated.</li>\n<li><strong>Rate limits are per user and per app.</strong> One noisy user must not exhaust the app's quota.</li>\n<li><strong>Privacy classes.</strong> Some categories are never stored at all, whatever the user says in passing.</li>\n</ul>\n<h2 id=\"w13-not-yet\">Not yet</h2>\n<p>Knowledge-graph memory, learned retrieval policies and enterprise directory connectors. The policy and lifecycle questions come first.</p>\n<h2 id=\"w13-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w13.check.1\"><input aria-label=\"Done\" data-id=\"w13.check.1\" id=\"c-w13-check-1\" type=\"checkbox\"/><div class=\"task-body\">You can explain why memory is a policy problem with your own M01–M12 numbers.</div></li>\n<li class=\"task do\" data-id=\"w13.check.2\"><input aria-label=\"Done\" data-id=\"w13.check.2\" id=\"c-w13-check-2\" type=\"checkbox\"/><div class=\"task-body\">The real calendar connector syncs incrementally, survives an expired sync token and token refresh, and every write passes through the policy service.</div></li>\n<li class=\"task do\" data-id=\"w13.check.3\"><input aria-label=\"Done\" data-id=\"w13.check.3\" id=\"c-w13-check-3\" type=\"checkbox\"/><div class=\"task-body\">None of the adversarial emails changes a stored memory or triggers a write without approval.</div></li>\n</ul>\n", "toc": [["w13-concepts", "Concepts", []], ["w13-day-by-day", "Day by day", [["w13-day-by-day-mon", "Monday — memory as a policy problem, not a database problem."], ["w13-day-by-day-tue", "Tuesday — the store and the write path."], ["w13-day-by-day-wed", "Wednesday — the read path and two fixture connectors."], ["w13-day-by-day-thu", "Thursday — read Letta Code and Codex memory."], ["w13-day-by-day-fri", "Friday — the real connector."], ["w13-day-by-day-sat", "Saturday — the memory eval set."], ["w13-day-by-day-sun", "Sunday — adversarial numbers, the project increment, and the checkpoint."]]], ["w13-build", "Build", []], ["w13-project-increment", "Project increment", []], ["w13-read", "Read", []], ["w13-you-should-be-able-to-answer", "You should be able to answer", []], ["w13-experiments", "Experiments", []], ["w13-production-lens", "Production lens", []], ["w13-not-yet", "Not yet", []], ["w13-checkpoint", "Checkpoint", []]], "text": "Memory is a policy problem (what to store, retrieve, supersede, expire and redact) far more than a storage problem. Connectors are OAuth, incremental sync and rate limits. Together they make an agent personal, and they bring the two biggest new risks: wrong memories, and untrusted text arriving through your own inbox. Concepts Four kinds of memory. Profile (stable facts and preferences), episodic (what happened), working (the current task's scratchpad) and procedural (how to do things: skills). Write path and read path. Extraction decides what is worth keeping; consolidation merges, deduplicates and supersedes; redaction removes secrets and sensitive categories; the read path decides what to inject, and logs it. Provenance over confidence. Store the source session and the quote a memory came from, and whether the user confirmed it. A confidence score generated by a model is a guess, not a calibration. Memory as files. Letta Code keeps an agent's memory as a git-backed directory: edits are commits, conflicts are merges, and history and rollback come for free. Background consolidation. Codex runs memory as a two-phase background pipeline, per-session extraction then consolidation, with job leases so concurrent workers don't duplicate work and secret redaction before anything is stored. Connectors. OAuth 2.0 authorization code with PKCE, least-privilege scopes, refresh-token rotation and encrypted token storage; incremental sync (Google Calendar's syncToken, Gmail's historyId) instead of re-reading everything; push notifications where available; rate limits with backoff. Inbound email is untrusted input to a privileged agent. Muse is getting its own email address; anything forwarded to it can carry instructions. So can a calendar invite's description. Users must see and delete their memories. Personalization that can't be inspected reads as surveillance. Day by day Day Time Do Working by end of day Mon 1-1.5 h Concepts: the four memory kinds, provenance over confidence, the write/read path split A one-page note defining profile/episodic/working/procedural, and why a stored quote beats a confidence score Tue 2.5-3 h Build steps 1-2: the memory store and the write path rig/memory/ supports write/search/supersede/forget; a finished session produces extracted, consolidated, redacted memories Wed 2.5-3 h Build steps 3-4: the read path and the fixture connectors Profile memories load at session start, episodic retrieval is traced; the three adversarial fixture emails don't corrupt memory Thu 1.5-2 h Read Letta Code and Codex memory; trace both paths Notes on both trace paths, and answers to the leases and conflict-repair questions below Fri 2-3 h Build step 5: the real Google Calendar connector OAuth with PKCE completes; incremental sync with syncToken works; every write goes through the policy service Sat 3-4 h Build step 6: memory evals M01-M12; Experiments 1-2 M01-M12 scored with precision, recall and injection-rate numbers; the contradiction experiment's numbers recorded Sun 2-3 h Experiments 3-4; project increment; checkpoint Adversarial-email and incremental-sync numbers recorded; checkpoint passed or a redo list Each day below points at Build, Read and Experiments for the exact contracts and traces rather than repeating them here. Monday — memory as a policy problem, not a database problem. Today is reading only, no code. The week's central claim is that what you store, when you supersede it, and what you refuse to store ever matter more than which database holds it, so make that concrete before writing a line of the store. Sketch the four memory kinds in your own words and work out why a stored quote plus a confirmation flag beats a model-generated confidence score. Read Concepts above twice: once for the four kinds, once for the write/read path split and the provenance rule. Sketch the Memory record from Build below by hand, field by field, with one sentence per field on what it's for. Write a half-page note: what makes a memory worth keeping, what makes it worth superseding, and what must never be stored regardless of what the user says. Tuesday — the store and the write path. Today you build the two pieces that turn a raw conversation into durable facts: the store itself, and the pipeline that decides what from a session is worth keeping. By tonight a finished session produces a small set of extracted, deduplicated, redacted memories you can inspect by hand. Implement Build step 1: rig/memory/ with write, search, supersede, forget and a user-visible export, on the Memory record given there. Implement Build step 2's three passes: extraction (propose memories with quotes), consolidation (merge duplicates, supersede contradicted facts), and redaction (strip secrets and blocked categories). Run one real session through the pipeline and read every memory it produced by hand before trusting it on a second one. Wednesday — the read path and two fixture connectors. Today the memories you wrote yesterday start getting used, and the agent gets its first look at calendar and email data, strictly from fixtures. Fixtures first means you can plant adversarial content on purpose and watch what happens before any real account is at risk. Implement Build step 3: load profile memories at session start, retrieve episodic memories per turn with Week 4's retriever only when relevant, and trace every injected memory. Implement Build step 4: CalendarConnector and EmailConnector backed by fixtures/calendar.json and fixtures/inbox.json, including the three adversarial emails. Run a session against the adversarial fixtures and confirm none of them changes a stored memory or triggers an unapproved write. Thursday — read Letta Code and Codex memory. No new code today. Both reference implementations solve the write-path problem you built on Tuesday with very different mechanisms — a git-backed filesystem versus a leased two-phase pipeline — and the contrast is the fastest way to see which parts of your own design were load-bearing and which were arbitrary. Read Read below in order for both projects, then trace the two paths given there end to end. Answer the You should be able to answer questions about leases, conflicts, and what git buys Letta that a key-value store would not. Friday — the real connector. Today the agent gets a real account for the first time this plan, behind the policy service built in Week 9. This is deliberately the only real connector this week: OAuth, scopes, token rotation and incremental sync are enough new surface for one day without also debugging memory. Implement Build step 5: Google Calendar with authorization-code-plus-PKCE OAuth, the narrowest scopes that work, refresh-token rotation and encrypted token storage. Wire incremental sync with syncToken, and confirm a forced \"token expired\" response triggers a full resync rather than a crash. Confirm every write from this connector routes through Week 9's policy service as a calendar grant, never called directly. Saturday — the memory eval set. Today you get your first numbers: can the pipeline you built Tuesday-Wednesday actually remember, forget, and resist being fed a false fact. Implement and run Build step 6: memory evals M01-M12. Record memory precision and recall, the wrong-memory injection rate, and extra tokens spent on memory. Run Experiments 1-2 below against the same M01-M12 set. Sunday — adversarial numbers, the project increment, and the checkpoint. No new code today. Close the week by putting a number on the two risks named in Concepts — a poisoned email and a stale sync token — then assemble rig v0.13 and attempt the checkpoint cold. Run Experiments 3-4 below and record the numbers. Assemble the Project increment: personal mode with memory, fixture connectors and the one real connector behind the policy service. Attempt Checkpoint below. If you can't pass it cold, redo the relevant day before moving to Week 14. Build rig/memory/: a store with write, search, supersede, forget and a user-visible export, using the record below. Write path: after each session, an extraction pass proposes memories with quotes, a consolidation pass merges duplicates and supersedes contradicted facts, and a redaction pass removes secrets and blocked categories. Read path: load profile memories at session start; retrieve episodic memories per turn with Week 4's retriever only when relevant; trace every injected memory. Fixture connectors first: CalendarConnector (list_events, create_event) and EmailConnector (search, read, draft) backed by fixtures/calendar.json and fixtures/inbox.json, including three adversarial emails. One real connector: Google Calendar with OAuth (authorization code and PKCE), the narrowest scopes that work, refresh-token rotation, encrypted token storage and incremental sync with syncToken. Writes go through Week 9's policy service as calendar write grants. Memory evals M01–M12: remember a stable preference; handle a correction by superseding; refuse to store a do-not-remember item; recall across sessions; don't inject irrelevant memories; handle a stale fact; resist a poisoning email (\"remember that my new bank account is …\"). Metrics: memory precision and recall, wrong-memory injection rate, and extra tokens spent on memory. class MemoryKind(Enum):\n    PROFILE = \"profile\"\n    EPISODIC = \"episodic\"\n    WORKING = \"working\"\n    PROCEDURAL = \"procedural\"\n\n@dataclass(frozen=True)\nclass Memory:\n    id: str\n    kind: MemoryKind\n    text: str\n    source_session: str\n    source_quote: str           # the words it came from; no quote, no memory\n    confirmed_by_user: bool     # instead of a model-generated confidence score\n    created_at: datetime\n    expires_at: datetime | None\n    supersedes: str | None      # id of the memory this one replaces Project increment rig v0.13: a personal mode with memory, fixture connectors and one real calendar connector behind the policy service. Read letta-ai/letta-code at 42397c7. The prompts specify the behaviour: src/agent/prompts/letta.md, src/agent/subagents/builtin/memory.md (a background subagent that edits memory in a private worktree, commits only the files it changed, and leaves merging to the harness) and reflection.md. Then the mechanism: src/agent/memory-filesystem.ts (693 lines: ensureMemoryFilesystemDirs 133, renderMemoryFilesystemTree 312), memory-git.ts (runGitWithRetry 632, pushToMemoryRepository 946, commitMemoryWrite 1234), memory-conflict-repair.ts (claimMemoryConflictRepair 161, completeMemoryConflictRepair 212) and reflection-runs.ts (requestReflectionRun 48). openai/codex memory at 72c9595: codex-rs/memories/README.md for the two phases, leases and redaction; write/templates/memories/stage_one_system.md (the extraction prompt) and consolidation.md; then the read path in codex-rs/memories/read/src/ (citations.rs parses which memories an answer used; usage.rs classifies read usage for telemetry). Trace these paths: Codex: a root session starts → eligibility checks (not ephemeral, not a subagent, memory enabled) → phase 1 claims eligible past sessions under leases → an extraction model call per session → redaction → stage-one outputs stored → phase 2 consolidates them into memory files → the next session's read path injects them. Letta Code: a reflection run is requested → the memory subagent edits files in a worktree → commitMemoryWrite → the harness merges and syncs → on conflict, claimMemoryConflictRepair and completeMemoryConflictRepair. You should be able to answer Why is memory primarily a policy problem rather than a vector-database problem? Can answer What does git give Letta's memory that a key-value store would not, and what does it cost? Can answer Why does Codex need leases for memory extraction, and what happens without them? Can answer What decides whether a memory is injected into a given turn, and how would you know it was the wrong one? Can answer How does incremental sync with a sync token work, and what must you do when the server says the token has expired? Can answer Walk through how an email in the inbox could get a false fact into long-term memory, and where your design stops it. Can answer Experiments Memory off, profile only, and profile plus episodic retrieval on M01–M12: precision, recall and tokens. Inject a contradicting fact; measure how often the old one is still used after consolidation. Run the three adversarial emails with and without the redaction and untrusted-text tagging. Full re-read against incremental sync on a calendar with 1,000 events: API calls, latency and rate-limit headroom. Production lens Deletion is a feature. \"Forget this\" must remove the memory, anything derived from it, and its copies in caches and indexes. Token storage is a secrets-management problem: encrypted at rest, scoped per user, revocable, rotated. Rate limits are per user and per app. One noisy user must not exhaust the app's quota. Privacy classes. Some categories are never stored at all, whatever the user says in passing. Not yet Knowledge-graph memory, learned retrieval policies and enterprise directory connectors. The policy and lifecycle questions come first. Checkpoint You can explain why memory is a policy problem with your own M01–M12 numbers. The real calendar connector syncs incrementally, survives an expired sync token and token refresh, and every write passes through the policy service. None of the adversarial emails changes a stored memory or triggers a write without approval.", "tasks": 19}, {"id": "w14", "group": "Weeks", "title": "Week 14: a multi-user service", "short": "Week 14", "html": "<p>Until now rig has served one person on one machine. Perplexity and Muse serve millions of people from shared servers: many users, many conversations each, several open tabs per user, and workers that come and go. This week rig becomes a service. Users sign in. Every conversation and message lives in Postgres, every row and every vector belongs to exactly one user, and the database enforces it. A job queue spreads runs across workers, and a test suite proves no user can read another's data. By now rig holds every kind of per-user state (conversations, memory, files, grants, retrieved chunks and caches), so isolation can be designed once, across all of it.</p>\n<h2 id=\"w14-concepts\">Concepts</h2>\n<ul>\n<li><strong>The data model.</strong> Users own conversations; conversations hold messages; a message starts a run; a run has steps. Messages form a tree through <code>parent_id</code>, so an edit or a regenerate branches instead of overwriting. The messages are the source of truth: on every turn, the context sent to the model is rebuilt from them (plus Week 3's compaction summaries) on whichever worker picks the run up. Workers keep no conversation state in memory.</li>\n<li><strong>Identity comes from the session, never from the request body or the model.</strong> The user id is read from an authenticated session; the conversation id is checked against it; the context builder then loads only that conversation's messages and that user's memory, files and grants. Tool calls, retrieval and the policy service all receive the same identity.</li>\n<li><strong>Tenancy models.</strong> Shared tables with a <code>user_id</code> (or <code>tenant_id</code>) column, a partition or schema per tenant, or a database per tenant. Shared tables are the cheapest and the easiest to leak from. Most products start there and add enforcement in the database.</li>\n<li><strong>Row-level security.</strong> A Postgres policy on a table (<code>USING (user_id = current_setting('app.user_id', true)::uuid)</code>) filters every query, and <code>WITH CHECK</code> refuses writes for anyone else. The app sets the user id inside each transaction with <code>set_config('app.user_id', …, true)</code>, the bind-parameter form of <code>SET LOCAL</code>. Table owners skip policies unless the table has <code>FORCE ROW LEVEL SECURITY</code>, and superusers and roles with <code>BYPASSRLS</code> always skip them, so the app connects as a plain role. A query that forgets <code>WHERE user_id = …</code> then returns that user's rows only, and a query outside any user scope fails instead of returning everything.</li>\n<li><strong>Vectors are tenant data too.</strong> In a shared HNSW index, a filter is applied after the index scan. With 100 users and pgvector's default <code>hnsw.ef_search</code> of 40, a per-user query that goes through the HNSW index returns about half a row instead of 10 (measured below). pgvector 0.8's iterative scans keep scanning until there are enough rows. Partitioning by tenant also stops one tenant's vectors from changing another's recall. Open WebUI ships both designs: one collection per user, or one shared collection with a tenant filter.</li>\n<li><strong>Caches are the classic leak.</strong> Week 10's response and semantic caches, retrieval caches and any memoized tool result are keyed by user unless they are provably public (a fetched public web page). A semantic cache shared across users answers one person's question with another person's private answer.</li>\n<li><strong>One active run per conversation.</strong> Two tabs, a double click or a client retry can start two runs on one conversation that interleave messages and repeat tool calls. Serialize runs per conversation with a queue lock keyed on the conversation id, and make message submission idempotent with a client-generated id.</li>\n<li><strong>Stateless servers, a shared queue.</strong> API servers authenticate, enqueue and stream; workers claim runs from a queue. Postgres can be the queue: <code>FOR UPDATE SKIP LOCKED</code> hands each job to exactly one worker, <code>LISTEN</code> and <code>NOTIFY</code> wake idle workers, and heartbeats expose dead ones. The worker running a job is rarely the server holding the user's connection, so events travel through pub/sub (Postgres <code>NOTIFY</code> or Redis) to the right tab.</li>\n<li><strong>Fairness.</strong> Per-user request rates, per-user concurrent runs and per-user daily spend are checked before work is queued. A global token bucket protects the provider; it does not stop one heavy user from starving the rest.</li>\n<li><strong>Authentication is a library, not a project.</strong> Use an existing library or identity provider for sign-in, sessions, expiry and revocation. Your job is to carry the identity through every layer, including traces and the cost ledger.</li>\n<li><strong>Deleting a user is a workflow.</strong> Rows, vectors, uploaded files, workspace snapshots, caches, traces, and backups that expire on a stated schedule. A foreign-key cascade covers only the first of these.</li>\n</ul>\n<h2 id=\"w14-day-by-day\">Day by day</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1-1.5 h</td>\n<td>Concepts: the data model, identity source, tenancy models, row-level security</td>\n<td>A one-page note on why identity must come from the session, and what RLS adds over <code>WHERE user_id = …</code></td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2.5-3 h</td>\n<td>Build steps 1-2: the Postgres schema and row-level security</td>\n<td>Every per-user table has <code>FORCE ROW LEVEL SECURITY</code>; a forgotten <code>WHERE</code> still returns only the scoped user's rows</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>3-4 h</td>\n<td>Build steps 3-4: the HTTP API and the Postgres job queue</td>\n<td><code>rig serve</code> accepts a message over HTTP, enqueues it with the conversation as lock, and a worker claims and runs it</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5-2 h</td>\n<td>Read Open WebUI (identity, conversations, vectors/tenants) and procrastinate; trace both paths</td>\n<td>Notes on where Open WebUI enforces isolation in code versus where Build 2 puts it in the database</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>2-3 h</td>\n<td>Build steps 5-6: per-user limits and tenant-scoped retrieval/caches</td>\n<td>A flooding user gets 429s; a filtered HNSW query keeps full recall with <code>hnsw.iterative_scan</code> on</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3-4 h</td>\n<td>Build steps 7-8: the isolation suite and <code>rig admin delete-user</code></td>\n<td>U01-U12 report zero cross-user reads; the delete-user checker finds no trace of a deleted user</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>3-4 h</td>\n<td>Build step 9 load test; remaining experiments; project increment; checkpoint</td>\n<td>p50/p95 time to first token recorded at 50 users; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each day below points at Build, Read and Experiments for the exact schemas, queries and traces rather than repeating them here.</p>\n<h3 id=\"w14-day-by-day-mon\">Monday — identity and the shape of a multi-tenant table.</h3>\n<p>Reading only. The whole week rests on one rule: identity comes from the authenticated session, never from the request body or the model, and the database — not application code — is what actually enforces it. Work through why shared tables with <code>user_id</code> are the cheapest tenancy model and the easiest to leak from, and what row-level security adds on top of a <code>WHERE</code> clause you could still forget to write.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above in full, twice through the row-level-security bullet.</li>\n<li>Sketch the data model (<code>users</code> → <code>conversations</code> → <code>messages</code> → <code>runs</code>) and mark, for each table, which columns scope it to one user.</li>\n<li>Write a half-page note: what a <code>FORCE ROW LEVEL SECURITY</code> policy does that a careful <code>WHERE</code> clause doesn't, and which Postgres roles skip it silently.</li>\n</ol>\n<h3 id=\"w14-day-by-day-tue\">Tuesday — schema and row-level security.</h3>\n<p>Today the database itself becomes the enforcement boundary. By tonight every per-user table rejects a cross-user read or write even if the application code forgets to filter — the property the rest of the week is tested against.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: the Postgres schema, plus <code>user_id</code> added to Week 4's <code>chunks</code>, Week 13's memories, Week 12's artifacts and Week 9's grants.</li>\n<li>Implement <strong>Build</strong> step 2: <code>ENABLE</code>/<code>FORCE ROW LEVEL SECURITY</code> and a policy on every per-user table, the <code>user_scope</code> helper, and an app role without <code>BYPASSRLS</code>.</li>\n<li>Deliberately drop a <code>WHERE user_id = …</code> from one repository query and confirm the database, not the code, is what stops the leak.</li>\n</ol>\n<h3 id=\"w14-day-by-day-wed\">Wednesday — the service and the queue.</h3>\n<p>Today rig stops being a CLI that happens to talk to Postgres and becomes an actual service: an HTTP API in front of the runtime, and a job queue that lets more than one worker process runs at once without two workers ever touching the same conversation concurrently.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: <code>rig/server/</code>, sign-in through an existing library, the idempotent message endpoint, the server-sent-events run stream, and cancel.</li>\n<li>Implement <strong>Build</strong> step 4: the <code>jobs</code> table and claim query given there, worker heartbeats, and requeue on a dead worker.</li>\n<li>Run two workers against one conversation and confirm the claim query's <code>o.id &lt; j.id</code> clause does its job: never two running jobs for the same lock.</li>\n</ol>\n<h3 id=\"w14-day-by-day-thu\">Thursday — read Open WebUI and procrastinate.</h3>\n<p>No new code today. Open WebUI is the production version of everything built Tuesday-Wednesday, done in application code rather than the database; procrastinate is the Postgres-only queue whose claim query you copied. Reading both tells you exactly where your database-level enforcement is stronger, and where it still depends on code you wrote correctly.</p>\n<ol type=\"1\">\n<li>Read <strong>Read</strong> below in the order given — identity, conversations, vectors and tenants, many workers, limits and deletion — then procrastinate's schema.</li>\n<li>Trace both paths given there end to end.</li>\n<li>Answer the <strong>You should be able to answer</strong> questions on where Open WebUI gets its user id and what <code>delete_user_by_id</code> does and doesn't touch.</li>\n</ol>\n<h3 id=\"w14-day-by-day-fri\">Friday — limits and tenant-scoped retrieval.</h3>\n<p>Today you close the two remaining ways one user can hurt another: a noisy user exhausting shared capacity, and a shared vector index quietly returning another tenant's near-neighbors into \"yours.\" Neither failure is loud — the first looks like ordinary slowness, the second looks like below-average recall — which is why both need numbers, not a glance.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: the sliding-window request limiter, the two-active-runs cap, and the daily dollar budget read from Week 3's cost ledger.</li>\n<li>Implement <strong>Build</strong> step 6: <code>user_id</code> filtering on every vector and full-text query with <code>hnsw.iterative_scan</code> on, and user-keyed response and semantic caches with an allowlisted public-web exception.</li>\n<li>Confirm a flooding user gets 429 with <code>Retry-After</code> and that other users' latency doesn't move.</li>\n</ol>\n<h3 id=\"w14-day-by-day-sat\">Saturday — prove isolation, then prove deletion.</h3>\n<p>Today you stop asserting isolation and start attacking it: two users with planted secrets, then every route, query, cache and stream in the system asked for the other user's data. Then the mirror problem — proving a deleted user is actually gone everywhere, not just from the obvious table.</p>\n<ol type=\"1\">\n<li>Implement and run <strong>Build</strong> step 7: the isolation suite U01-U12, including the forged-id and shared-document-injection cases.</li>\n<li>Implement <strong>Build</strong> step 8: <code>rig admin delete-user</code> and its cross-store checker.</li>\n<li>Run <strong>Experiments</strong> 1 and 3 below against the suite you just built.</li>\n</ol>\n<h3 id=\"w14-day-by-day-sun\">Sunday — load, the rest of the experiments, and the checkpoint.</h3>\n<p>Today you find out what happens under real concurrency: 50 simulated users, three tabs each, and one user deliberately flooding the rest. Then you assemble rig v0.14 and attempt the checkpoint cold.</p>\n<ol type=\"1\">\n<li>Implement and run <strong>Build</strong> step 9: the load test, recording p50/p95 time to first token, queue wait and runs per worker per minute.</li>\n<li>Run <strong>Experiments</strong> 2, 4, 5 and 6 below.</li>\n<li>Assemble the <strong>Project increment</strong>: <code>rig serve</code> running the API and N workers against Postgres, with the isolation suite in CI.</li>\n<li>Attempt <strong>Checkpoint</strong> below. If you can't pass it cold, redo the relevant day before Week 15.</li>\n</ol>\n<h2 id=\"w14-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w14.build.1\"><input aria-label=\"Done\" data-id=\"w14.build.1\" id=\"c-w14-build-1\" type=\"checkbox\"/><div class=\"task-body\">Postgres for rig's own state: <code>users</code>, <code>conversations</code>, <code>messages</code> (with <code>parent_id</code> and a unique <code>(user_id, client_id)</code> for idempotent submits), <code>runs</code>, plus <code>user_id</code> on Week 4's <code>chunks</code>, Week 13's memories, Week 12's artifacts and Week 9's grants. Keep SQLite for a local single-user mode behind the same repository interface.</div></li>\n<li class=\"task do\" data-id=\"w14.build.2\"><input aria-label=\"Done\" data-id=\"w14.build.2\" id=\"c-w14-build-2\" type=\"checkbox\"/><div class=\"task-body\">Row-level security on every per-user table, with <code>FORCE ROW LEVEL SECURITY</code>, an app role without <code>BYPASSRLS</code>, and a <code>user_scope</code> helper that opens a transaction and sets the user id (below). Every repository function takes a scoped connection; nothing else can reach the tables.</div></li>\n<li class=\"task do\" data-id=\"w14.build.3\"><input aria-label=\"Done\" data-id=\"w14.build.3\" id=\"c-w14-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/server/</code>: an HTTP API in front of the runtime. Sign-in through an existing library; <code>POST /conversations/{id}/messages</code> (idempotent on the client message id, returns a run id); <code>GET /runs/{id}/events</code> as server-sent events; <code>POST /runs/{id}/cancel</code>. The CLI becomes one client of this API.</div></li>\n<li class=\"task do\" data-id=\"w14.build.4\"><input aria-label=\"Done\" data-id=\"w14.build.4\" id=\"c-w14-build-4\" type=\"checkbox\"/><div class=\"task-body\">A Postgres job queue: a <code>jobs</code> table whose <code>lock</code> is the conversation id, a claim query that never runs two jobs with the same lock (below), worker heartbeats, and requeue when a worker stops heartbeating. Run events reach the API process holding the stream through <code>NOTIFY</code> or Redis pub/sub.</div></li>\n<li class=\"task do\" data-id=\"w14.build.5\"><input aria-label=\"Done\" data-id=\"w14.build.5\" id=\"c-w14-build-5\" type=\"checkbox\"/><div class=\"task-body\">Per-user limits, checked before enqueueing: a sliding-window request limiter, at most two active runs per user, and a daily dollar budget read from Week 3's cost ledger. Refusals return 429 with <code>Retry-After</code>.</div></li>\n<li class=\"task do\" data-id=\"w14.build.6\"><input aria-label=\"Done\" data-id=\"w14.build.6\" id=\"c-w14-build-6\" type=\"checkbox\"/><div class=\"task-body\">Tenant-scoped retrieval and caches: every vector and full-text query filters by <code>user_id</code> with <code>hnsw.iterative_scan</code> on; Week 10's response and semantic caches are keyed by user, except an allowlisted public-web layer.</div></li>\n<li class=\"task do\" data-id=\"w14.build.7\"><input aria-label=\"Done\" data-id=\"w14.build.7\" id=\"c-w14-build-7\" type=\"checkbox\"/><div class=\"task-body\">Isolation suite U01–U12. Two users with planted secrets. Every API route, retrieval query, memory lookup, cache, artifact download and event stream is asked for the other user's data: forged ids in URLs, user A's conversation id in user B's request, a reused event-stream URL, and a shared document carrying a prompt injection that asks the agent for another user's memory. Target: zero cross-user reads.</div></li>\n<li class=\"task do\" data-id=\"w14.build.8\"><input aria-label=\"Done\" data-id=\"w14.build.8\" id=\"c-w14-build-8\" type=\"checkbox\"/><div class=\"task-body\"><code>rig admin delete-user</code>: a workflow over every store, then a checker that searches all of them for the user's id and planted strings.</div></li>\n<li class=\"task do\" data-id=\"w14.build.9\"><input aria-label=\"Done\" data-id=\"w14.build.9\" id=\"c-w14-build-9\" type=\"checkbox\"/><div class=\"task-body\">A load test: 50 simulated users with 3 tabs each, mixed research and work turns. Measure time to first token (p50 and p95), queue wait, runs per worker per minute, and what happens to everyone else when one user floods.</div></li>\n</ol>\n<p>These were tested on Postgres 16 with pgvector 0.8.7. A forgotten <code>WHERE</code> returns only the scoped user's rows, a forged insert is refused, and a query outside any scope errors. The claim query ran 200 jobs across 20 conversations on 8 concurrent workers with no double claims and never two running jobs for one conversation.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">@contextmanager\ndef user_scope(conn, user_id: UUID):\n    with conn.transaction():\n        # set_config(..., true) is SET LOCAL that accepts a bind parameter; it ends with the transaction\n        conn.execute(\"SELECT set_config('app.user_id', %s, true)\", (str(user_id),))\n        yield conn</code></pre></div>\n<div class=\"code-wrap\"><pre><code class=\"language-sql\">-- every per-user table: enable, force, one policy\nALTER TABLE messages ENABLE ROW LEVEL SECURITY;\nALTER TABLE messages FORCE ROW LEVEL SECURITY;          -- the table owner is checked too\nCREATE POLICY own_rows ON messages\n  USING      (user_id = current_setting('app.user_id', true)::uuid)\n  WITH CHECK (user_id = current_setting('app.user_id', true)::uuid);\n\n-- claim the next job: at most one running job per conversation, earliest first\nUPDATE jobs SET status = 'running', worker_id = %(worker)s, heartbeat_at = now()\nWHERE id = (\n  SELECT j.id FROM jobs j\n  WHERE j.status = 'queued'\n    AND NOT EXISTS (SELECT 1 FROM jobs o\n                    WHERE o.lock = j.lock\n                      AND (o.status = 'running' OR (o.status = 'queued' AND o.id &lt; j.id)))\n  ORDER BY j.id\n  LIMIT 1\n  FOR UPDATE SKIP LOCKED)\nRETURNING id, lock;</code></pre></div>\n<p>The <code>o.id &lt; j.id</code> clause matters. Without it, two workers can each claim a different queued job for the same conversation in the same instant, because neither sees the other's uncommitted claim. With it, only the earliest queued job of a conversation is ever eligible, and <code>SKIP LOCKED</code> lets just one worker take it.</p>\n<h2 id=\"w14-project-increment\">Project increment</h2>\n<p>rig v0.14 is a multi-user service: <code>rig serve</code> runs the API and N workers against Postgres, and the isolation suite runs in CI on every change.</p>\n<h2 id=\"w14-read\">Read</h2>\n<p><strong><a href=\"https://github.com/open-webui/open-webui\" rel=\"noopener\" target=\"_blank\">open-webui/open-webui</a></strong> at <code>v0.11.4</code>, a self-hosted, multi-user chat assistant with retrieval, memory and pluggable vector stores. The backend is Python. Read it as the production version of this week, and note where it enforces isolation in application code, where Build 2 puts it in the database. All paths are under <code>backend/open_webui/</code>.</p>\n<ol type=\"1\">\n<li>Identity: <code>utils/auth.py</code> (665 lines): <code>create_token</code> (232), <code>decode_token</code> (246), <code>is_valid_token</code> (276, revocation), <code>revoke_user_tokens</code> (349) and <code>get_current_user</code> (393).</li>\n<li>Conversations: <code>models/chats.py</code>: the <code>Chat</code> table (129) and its composite indexes on <code>user_id</code>; <code>get_chat_by_id_and_user_id</code> (1732), the ownership check used throughout <code>routers/chats.py</code>. <code>models/chat_messages.py</code>: <code>ChatMessage</code> (127, a tree through <code>parent_id</code>) and <code>has_unfinished_assistant_by_chat_id</code> (327), which tells the UI a run is still going.</li>\n<li>Vectors and tenants: <code>retrieval/vector/dbs/pgvector.py</code> (792 lines): <code>DocumentChunk</code> (73), <code>_iterative_scan_setting</code> (263), <code>_ensure_text_search_index</code> (277) and <code>hybrid_search</code> (579). Then compare <code>qdrant.py</code>, which creates one collection per name, with <code>qdrant_multitenancy.py</code> (362 lines), which maps every name onto a few shared collections with a tenant filter: <code>_tenant_filter</code> (39), <code>_get_collection_and_tenant_id</code> (100) and <code>search</code> (246). <code>routers/memories.py</code> shows the naming that ties it together: each user's memories live in <code>user-memory-{user_id}</code> (134).</li>\n<li>Many workers: <code>socket/main.py</code>: the Redis client manager (89) that lets any worker emit to any connection, <code>SESSION_POOL</code> (150), <code>get_session_ids_by_user_id</code> (344) and <code>emit_to_users</code> (356, one room per user).</li>\n<li>Limits and deletion: <code>utils/rate_limit.py</code> (114 lines): <code>RateLimiter</code> (8) and <code>_is_limited_redis</code> (79), a rolling window built from per-minute buckets. <code>models/users.py</code>: <code>delete_user_by_id</code> (847), and the route that calls it in <code>routers/users.py</code> (1043).</li>\n</ol>\n<p><strong><a href=\"https://github.com/procrastinate-org/procrastinate\" rel=\"noopener\" target=\"_blank\">procrastinate-org/procrastinate</a></strong> at <code>3.10.0</code>, a Postgres-only job queue. <code>procrastinate/sql/schema.sql</code> (599 lines): <code>procrastinate_fetch_job_v2</code> (210), whose <code>lock</code> rule is the one-run-per-conversation guarantee above; <code>procrastinate_defer_jobs_v1</code> (118) and the partial unique index on <code>queueing_lock</code> (100), which drops duplicate enqueues; the <code>pg_notify</code> triggers (around 412); <code>procrastinate_update_heartbeat_v1</code> (542) and <code>procrastinate_prune_stalled_workers_v1</code> (553).</p>\n<p><strong>pgvector's README</strong> at <code>v0.8.7</code> (pinned in Appendix A): the \"Filtering\", \"Multitenancy\" and \"Iterative Index Scans\" sections.</p>\n<p><strong>Docs:</strong> PostgreSQL's <a href=\"https://www.postgresql.org/docs/current/ddl-rowsecurity.html\" rel=\"noopener\" target=\"_blank\">Row Security Policies</a> chapter, start to finish.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>Open WebUI: a chat request → <code>get_verified_user</code>, through <code>get_current_user</code>, decodes the token and loads the user → <code>chat_completion</code> in <code>main.py</code> (1110) → retrieval queries generated from the last messages (Week 10) → vector search in the user's collection → model stream → events to the user's room through the Redis manager → <code>ChatMessage</code> rows upserted.</li>\n<li>rig: <code>POST /conversations/{id}/messages</code> → session → <code>user_scope</code> → insert the message (idempotent) → enqueue with <code>lock</code> = conversation id → a worker claims it → rebuilds context under the same user scope → model and tools → events via <code>NOTIFY</code> → server-sent events to every open tab.</li>\n</ul>\n<h2 id=\"w14-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w14.q.1\"><input aria-label=\"I can answer this\" data-id=\"w14.q.1\" id=\"c-w14-q-1\" type=\"checkbox\"/><div class=\"task-body\">Where does Open WebUI get the user id for a request, and what stops a client from sending another user's chat id?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.2\"><input aria-label=\"I can answer this\" data-id=\"w14.q.2\" id=\"c-w14-q-2\" type=\"checkbox\"/><div class=\"task-body\">What does row-level security add over a <code>WHERE user_id = …</code> in every query, and which roles skip it without warning?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.3\"><input aria-label=\"I can answer this\" data-id=\"w14.q.3\" id=\"c-w14-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why does a filtered HNSW query return fewer than k rows, and what do iterative scans and partitioning each change?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.4\"><input aria-label=\"I can answer this\" data-id=\"w14.q.4\" id=\"c-w14-q-4\" type=\"checkbox\"/><div class=\"task-body\">Open WebUI's pgvector <code>hybrid_search</code> returns <code>None</code> when a metadata filter is set. Write the filtered hybrid query in one SQL statement instead.</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.5\"><input aria-label=\"I can answer this\" data-id=\"w14.q.5\" id=\"c-w14-q-5\" type=\"checkbox\"/><div class=\"task-body\">How does procrastinate guarantee one running job per lock, and why must an earlier queued job with the same lock block later ones?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.6\"><input aria-label=\"I can answer this\" data-id=\"w14.q.6\" id=\"c-w14-q-6\" type=\"checkbox\"/><div class=\"task-body\">Which of rig's caches may be shared across users, and what exactly would a shared semantic cache leak?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.7\"><input aria-label=\"I can answer this\" data-id=\"w14.q.7\" id=\"c-w14-q-7\" type=\"checkbox\"/><div class=\"task-body\">List every store Open WebUI's <code>delete_user_by_id</code> touches, and every per-user store it doesn't. How would you find out whether something else cleans those up?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w14.q.8\"><input aria-label=\"I can answer this\" data-id=\"w14.q.8\" id=\"c-w14-q-8\" type=\"checkbox\"/><div class=\"task-body\">Why do streamed events need a pub/sub hop between the worker and the API server?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w14-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w14.exp.1\"><input aria-label=\"Done\" data-id=\"w14.exp.1\" id=\"c-w14-exp-1\" type=\"checkbox\"/><div class=\"task-body\">The isolation suite with row-level security off, on, and on with one repository query deliberately missing its <code>user_id</code> filter.</div></li>\n<li class=\"task do\" data-id=\"w14.exp.2\"><input aria-label=\"Done\" data-id=\"w14.exp.2\" id=\"c-w14-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Filtered recall: 100 users sharing one HNSW index. Rows returned and recall@10 per user with <code>hnsw.iterative_scan</code> off, <code>relaxed_order</code> and <code>strict_order</code>, then with a partition per user; latency for each. On 20,000 random 32-dimensional vectors, with the planner kept on the HNSW index (<code>enable_seqscan</code> and <code>enable_bitmapscan</code> off), the off setting returned 0.5 rows out of 10 per query; <code>relaxed_order</code> returned all 10 at recall 1.00 and <code>strict_order</code> all 10 at 0.98.</div></li>\n<li class=\"task do\" data-id=\"w14.exp.3\"><input aria-label=\"Done\" data-id=\"w14.exp.3\" id=\"c-w14-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Double submit: the same message from two tabs, 100 times. Count duplicate runs and repeated tool calls with and without the conversation lock and the idempotency key.</div></li>\n<li class=\"task do\" data-id=\"w14.exp.4\"><input aria-label=\"Done\" data-id=\"w14.exp.4\" id=\"c-w14-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Load: time to first token (p50 and p95) and queue wait at 10, 50 and 100 simulated users. Then one user floods, with and without per-user concurrency limits.</div></li>\n<li class=\"task do\" data-id=\"w14.exp.5\"><input aria-label=\"Done\" data-id=\"w14.exp.5\" id=\"c-w14-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Kill a worker mid-run: time until another worker claims the job (Week 15 makes the resume exact).</div></li>\n<li class=\"task do\" data-id=\"w14.exp.6\"><input aria-label=\"Done\" data-id=\"w14.exp.6\" id=\"c-w14-exp-6\" type=\"checkbox\"/><div class=\"task-body\">A semantic cache shared across users against one keyed by user: plant private answers and count cross-user hits.</div></li>\n</ol>\n<h2 id=\"w14-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Identity is threaded through everything:</strong> logs, traces, the policy service, sandbox labels and the cost ledger. Traces hold user content, so access to traces is itself controlled, audited and time-limited.</li>\n<li><strong>Noisy neighbours:</strong> per-user and per-organization quotas, and separate queues so interactive turns never wait behind background jobs.</li>\n<li><strong>Connection pools:</strong> <code>SET LOCAL</code> and <code>set_config(…, true)</code> are safe behind a transaction-mode pooler such as PgBouncer; a session-level <code>SET</code> leaks one user's id into the next user's transaction.</li>\n<li><strong>Schema changes without downtime:</strong> expand, migrate, contract. Workers on the old and new versions run side by side during a deploy.</li>\n<li><strong>Data residency:</strong> some customers require their data to stay in one region, which decides where Postgres, the vector index and the caches live.</li>\n<li><strong>Admin access is a privilege:</strong> any path that bypasses row-level security (migrations, support tools) uses a separate role, and every use is logged.</li>\n</ul>\n<h2 id=\"w14-not-yet\">Not yet</h2>\n<p>Organizations and sharing between users, SSO and SCIM provisioning, sharding Postgres, multi-region active-active, and end-to-end encryption.</p>\n<h2 id=\"w14-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w14.check.1\"><input aria-label=\"Done\" data-id=\"w14.check.1\" id=\"c-w14-check-1\" type=\"checkbox\"/><div class=\"task-body\">With two users and planted secrets, U01–U12 report zero cross-user reads, and removing one <code>WHERE</code> clause still leaks nothing.</div></li>\n<li class=\"task do\" data-id=\"w14.check.2\"><input aria-label=\"Done\" data-id=\"w14.check.2\" id=\"c-w14-check-2\" type=\"checkbox\"/><div class=\"task-body\">Two tabs on one conversation never produce two concurrent runs, and a killed worker's job is picked up by another worker.</div></li>\n<li class=\"task do\" data-id=\"w14.check.3\"><input aria-label=\"Done\" data-id=\"w14.check.3\" id=\"c-w14-check-3\" type=\"checkbox\"/><div class=\"task-body\">You can state rig's p95 time to first token at 50 users and what fails first as load grows.</div></li>\n<li class=\"task do\" data-id=\"w14.check.4\"><input aria-label=\"Done\" data-id=\"w14.check.4\" id=\"c-w14-check-4\" type=\"checkbox\"/><div class=\"task-body\"><code>rig admin delete-user</code> leaves no trace of the user's id or planted strings in any store you control, and you can say when backups forget them.</div></li>\n</ul>\n", "toc": [["w14-concepts", "Concepts", []], ["w14-day-by-day", "Day by day", [["w14-day-by-day-mon", "Monday — identity and the shape of a multi-tenant table."], ["w14-day-by-day-tue", "Tuesday — schema and row-level security."], ["w14-day-by-day-wed", "Wednesday — the service and the queue."], ["w14-day-by-day-thu", "Thursday — read Open WebUI and procrastinate."], ["w14-day-by-day-fri", "Friday — limits and tenant-scoped retrieval."], ["w14-day-by-day-sat", "Saturday — prove isolation, then prove deletion."], ["w14-day-by-day-sun", "Sunday — load, the rest of the experiments, and the checkpoint."]]], ["w14-build", "Build", []], ["w14-project-increment", "Project increment", []], ["w14-read", "Read", []], ["w14-you-should-be-able-to-answer", "You should be able to answer", []], ["w14-experiments", "Experiments", []], ["w14-production-lens", "Production lens", []], ["w14-not-yet", "Not yet", []], ["w14-checkpoint", "Checkpoint", []]], "text": "Until now rig has served one person on one machine. Perplexity and Muse serve millions of people from shared servers: many users, many conversations each, several open tabs per user, and workers that come and go. This week rig becomes a service. Users sign in. Every conversation and message lives in Postgres, every row and every vector belongs to exactly one user, and the database enforces it. A job queue spreads runs across workers, and a test suite proves no user can read another's data. By now rig holds every kind of per-user state (conversations, memory, files, grants, retrieved chunks and caches), so isolation can be designed once, across all of it. Concepts The data model. Users own conversations; conversations hold messages; a message starts a run; a run has steps. Messages form a tree through parent_id, so an edit or a regenerate branches instead of overwriting. The messages are the source of truth: on every turn, the context sent to the model is rebuilt from them (plus Week 3's compaction summaries) on whichever worker picks the run up. Workers keep no conversation state in memory. Identity comes from the session, never from the request body or the model. The user id is read from an authenticated session; the conversation id is checked against it; the context builder then loads only that conversation's messages and that user's memory, files and grants. Tool calls, retrieval and the policy service all receive the same identity. Tenancy models. Shared tables with a user_id (or tenant_id) column, a partition or schema per tenant, or a database per tenant. Shared tables are the cheapest and the easiest to leak from. Most products start there and add enforcement in the database. Row-level security. A Postgres policy on a table (USING (user_id = current_setting('app.user_id', true)::uuid)) filters every query, and WITH CHECK refuses writes for anyone else. The app sets the user id inside each transaction with set_config('app.user_id', …, true), the bind-parameter form of SET LOCAL. Table owners skip policies unless the table has FORCE ROW LEVEL SECURITY, and superusers and roles with BYPASSRLS always skip them, so the app connects as a plain role. A query that forgets WHERE user_id = … then returns that user's rows only, and a query outside any user scope fails instead of returning everything. Vectors are tenant data too. In a shared HNSW index, a filter is applied after the index scan. With 100 users and pgvector's default hnsw.ef_search of 40, a per-user query that goes through the HNSW index returns about half a row instead of 10 (measured below). pgvector 0.8's iterative scans keep scanning until there are enough rows. Partitioning by tenant also stops one tenant's vectors from changing another's recall. Open WebUI ships both designs: one collection per user, or one shared collection with a tenant filter. Caches are the classic leak. Week 10's response and semantic caches, retrieval caches and any memoized tool result are keyed by user unless they are provably public (a fetched public web page). A semantic cache shared across users answers one person's question with another person's private answer. One active run per conversation. Two tabs, a double click or a client retry can start two runs on one conversation that interleave messages and repeat tool calls. Serialize runs per conversation with a queue lock keyed on the conversation id, and make message submission idempotent with a client-generated id. Stateless servers, a shared queue. API servers authenticate, enqueue and stream; workers claim runs from a queue. Postgres can be the queue: FOR UPDATE SKIP LOCKED hands each job to exactly one worker, LISTEN and NOTIFY wake idle workers, and heartbeats expose dead ones. The worker running a job is rarely the server holding the user's connection, so events travel through pub/sub (Postgres NOTIFY or Redis) to the right tab. Fairness. Per-user request rates, per-user concurrent runs and per-user daily spend are checked before work is queued. A global token bucket protects the provider; it does not stop one heavy user from starving the rest. Authentication is a library, not a project. Use an existing library or identity provider for sign-in, sessions, expiry and revocation. Your job is to carry the identity through every layer, including traces and the cost ledger. Deleting a user is a workflow. Rows, vectors, uploaded files, workspace snapshots, caches, traces, and backups that expire on a stated schedule. A foreign-key cascade covers only the first of these. Day by day Day Time Do Working by end of day Mon 1-1.5 h Concepts: the data model, identity source, tenancy models, row-level security A one-page note on why identity must come from the session, and what RLS adds over WHERE user_id = … Tue 2.5-3 h Build steps 1-2: the Postgres schema and row-level security Every per-user table has FORCE ROW LEVEL SECURITY; a forgotten WHERE still returns only the scoped user's rows Wed 3-4 h Build steps 3-4: the HTTP API and the Postgres job queue rig serve accepts a message over HTTP, enqueues it with the conversation as lock, and a worker claims and runs it Thu 1.5-2 h Read Open WebUI (identity, conversations, vectors/tenants) and procrastinate; trace both paths Notes on where Open WebUI enforces isolation in code versus where Build 2 puts it in the database Fri 2-3 h Build steps 5-6: per-user limits and tenant-scoped retrieval/caches A flooding user gets 429s; a filtered HNSW query keeps full recall with hnsw.iterative_scan on Sat 3-4 h Build steps 7-8: the isolation suite and rig admin delete-user U01-U12 report zero cross-user reads; the delete-user checker finds no trace of a deleted user Sun 3-4 h Build step 9 load test; remaining experiments; project increment; checkpoint p50/p95 time to first token recorded at 50 users; checkpoint passed or a redo list Each day below points at Build, Read and Experiments for the exact schemas, queries and traces rather than repeating them here. Monday — identity and the shape of a multi-tenant table. Reading only. The whole week rests on one rule: identity comes from the authenticated session, never from the request body or the model, and the database — not application code — is what actually enforces it. Work through why shared tables with user_id are the cheapest tenancy model and the easiest to leak from, and what row-level security adds on top of a WHERE clause you could still forget to write. Read Concepts above in full, twice through the row-level-security bullet. Sketch the data model (users → conversations → messages → runs) and mark, for each table, which columns scope it to one user. Write a half-page note: what a FORCE ROW LEVEL SECURITY policy does that a careful WHERE clause doesn't, and which Postgres roles skip it silently. Tuesday — schema and row-level security. Today the database itself becomes the enforcement boundary. By tonight every per-user table rejects a cross-user read or write even if the application code forgets to filter — the property the rest of the week is tested against. Implement Build step 1: the Postgres schema, plus user_id added to Week 4's chunks, Week 13's memories, Week 12's artifacts and Week 9's grants. Implement Build step 2: ENABLE/FORCE ROW LEVEL SECURITY and a policy on every per-user table, the user_scope helper, and an app role without BYPASSRLS. Deliberately drop a WHERE user_id = … from one repository query and confirm the database, not the code, is what stops the leak. Wednesday — the service and the queue. Today rig stops being a CLI that happens to talk to Postgres and becomes an actual service: an HTTP API in front of the runtime, and a job queue that lets more than one worker process runs at once without two workers ever touching the same conversation concurrently. Implement Build step 3: rig/server/, sign-in through an existing library, the idempotent message endpoint, the server-sent-events run stream, and cancel. Implement Build step 4: the jobs table and claim query given there, worker heartbeats, and requeue on a dead worker. Run two workers against one conversation and confirm the claim query's o.id < j.id clause does its job: never two running jobs for the same lock. Thursday — read Open WebUI and procrastinate. No new code today. Open WebUI is the production version of everything built Tuesday-Wednesday, done in application code rather than the database; procrastinate is the Postgres-only queue whose claim query you copied. Reading both tells you exactly where your database-level enforcement is stronger, and where it still depends on code you wrote correctly. Read Read below in the order given — identity, conversations, vectors and tenants, many workers, limits and deletion — then procrastinate's schema. Trace both paths given there end to end. Answer the You should be able to answer questions on where Open WebUI gets its user id and what delete_user_by_id does and doesn't touch. Friday — limits and tenant-scoped retrieval. Today you close the two remaining ways one user can hurt another: a noisy user exhausting shared capacity, and a shared vector index quietly returning another tenant's near-neighbors into \"yours.\" Neither failure is loud — the first looks like ordinary slowness, the second looks like below-average recall — which is why both need numbers, not a glance. Implement Build step 5: the sliding-window request limiter, the two-active-runs cap, and the daily dollar budget read from Week 3's cost ledger. Implement Build step 6: user_id filtering on every vector and full-text query with hnsw.iterative_scan on, and user-keyed response and semantic caches with an allowlisted public-web exception. Confirm a flooding user gets 429 with Retry-After and that other users' latency doesn't move. Saturday — prove isolation, then prove deletion. Today you stop asserting isolation and start attacking it: two users with planted secrets, then every route, query, cache and stream in the system asked for the other user's data. Then the mirror problem — proving a deleted user is actually gone everywhere, not just from the obvious table. Implement and run Build step 7: the isolation suite U01-U12, including the forged-id and shared-document-injection cases. Implement Build step 8: rig admin delete-user and its cross-store checker. Run Experiments 1 and 3 below against the suite you just built. Sunday — load, the rest of the experiments, and the checkpoint. Today you find out what happens under real concurrency: 50 simulated users, three tabs each, and one user deliberately flooding the rest. Then you assemble rig v0.14 and attempt the checkpoint cold. Implement and run Build step 9: the load test, recording p50/p95 time to first token, queue wait and runs per worker per minute. Run Experiments 2, 4, 5 and 6 below. Assemble the Project increment: rig serve running the API and N workers against Postgres, with the isolation suite in CI. Attempt Checkpoint below. If you can't pass it cold, redo the relevant day before Week 15. Build Postgres for rig's own state: users, conversations, messages (with parent_id and a unique (user_id, client_id) for idempotent submits), runs, plus user_id on Week 4's chunks, Week 13's memories, Week 12's artifacts and Week 9's grants. Keep SQLite for a local single-user mode behind the same repository interface. Row-level security on every per-user table, with FORCE ROW LEVEL SECURITY, an app role without BYPASSRLS, and a user_scope helper that opens a transaction and sets the user id (below). Every repository function takes a scoped connection; nothing else can reach the tables. rig/server/: an HTTP API in front of the runtime. Sign-in through an existing library; POST /conversations/{id}/messages (idempotent on the client message id, returns a run id); GET /runs/{id}/events as server-sent events; POST /runs/{id}/cancel. The CLI becomes one client of this API. A Postgres job queue: a jobs table whose lock is the conversation id, a claim query that never runs two jobs with the same lock (below), worker heartbeats, and
