tocol/python-sdk\" rel=\"noopener\" target=\"_blank\">MCP Python SDK</a> at tag <code>v2.3.0</code>.</strong> <code>src/mcp-types/mcp_types/version.py</code> is the clearest statement of the protocol's history: four handshake revisions and the stateless <code>2026-07-28</code> revision. The module docstring of <code>src/mcp/server/_streamable_http_modern.py</code> explains the stateless exchange in one screen. Then <code>src/mcp/server/mcpserver/utilities/func_metadata.py</code> (<code>func_metadata</code> at 275) shows how a typed Python function becomes a JSON Schema tool, and <code>src/mcp/client/session.py</code> is the SDK's client for comparison with pi's.</p>\n<p><strong><a href=\"https://github.com/anthropics/sandbox-runtime\" rel=\"noopener\" target=\"_blank\">anthropics/sandbox-runtime</a></strong> (formerly under <code>anthropic-experimental</code>; the old URL redirects). A research-preview sandbox developed for Claude Code that restricts filesystem and network access at the OS level without a container. Read <code>src/sandbox/sandbox-manager.ts</code> (<code>initialize</code> at 656, <code>filterNetworkRequest</code> at 355), <code>macos-sandbox-utils.ts</code> (<code>wrapCommandWithSandboxMacOS</code> at 1346, which generates a Seatbelt profile), <code>linux-sandbox-utils.ts</code> (<code>wrapCommandWithSandboxLinux</code> at 3216 and <code>renderBwrapInvocation</code> at 905), <code>http-proxy.ts</code> (<code>createHttpProxyServer</code> at 213, the allowlisting egress proxy), and <code>vendor/seccomp-src/seccomp-unix-block.c</code> (blocks Unix-socket creation). Skip the credential-masking and TLS-interception modules until the core path is clear.</p>\n<p>Optional contrast from Codex: <code>codex-rs/sandboxing/src/seatbelt_base_policy.sbpl</code>, <code>codex-rs/linux-sandbox/src/landlock.rs</code>, and <code>codex-rs/execpolicy/README.md</code> (command-prefix rules).</p>\n<p><strong>Meta's Muse launch coverage</strong> (<a href=\"https://www.axios.com/2026/09/08/meta-debuts-muse-personal-ai-agent\" rel=\"noopener\" target=\"_blank\">Axios</a>, <a href=\"https://techcrunch.com/2026/09/23/everything-new-coming-to-metas-ai-agent-muse/\" rel=\"noopener\" target=\"_blank\">TechCrunch</a>), for architecture rather than code: a private virtual machine per user with a visible browser, and Sentinel, which decides whether each proposed action is allowed, blocked or sent to the user, with read and write separated and permissions scoped to a task, service, transaction or time period. Compare it point by point with your policy service.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>pi MCP: <code>McpClient.connect</code> → transport <code>start</code> → <code>initialize</code> request with the client's protocol version → the server's chosen version validated against the supported list → <code>notifications/initialized</code> → <code>listTools</code> → <code>callTool</code> (timeout armed) → response or timeout → <code>cancelPending</code> → <code>notifications/cancelled</code>.</li>\n<li>srt: CLI → <code>SandboxManager.initialize</code> (starts the HTTP and SOCKS proxies) → <code>wrapWithSandbox</code> → the platform wrapper builds a Seatbelt profile or a bubblewrap argument list → the child's traffic goes to the proxy → <code>filterNetworkRequest</code> allows or denies by domain → violations are recorded.</li>\n</ul>\n<h2 id=\"w9-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w9.q.1\"><input aria-label=\"I can answer this\" data-id=\"w9.q.1\" id=\"c-w9-q-1\" type=\"checkbox\"/><div class=\"task-body\">What exactly happens, message by message, between an MCP client and server before the first tool call in the handshake era, and what disappears in <code>2026-07-28</code>?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.2\"><input aria-label=\"I can answer this\" data-id=\"w9.q.2\" id=\"c-w9-q-2\" type=\"checkbox\"/><div class=\"task-body\">How does pi's client avoid leaking a pending request when a server dies mid-call?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.3\"><input aria-label=\"I can answer this\" data-id=\"w9.q.3\" id=\"c-w9-q-3\" type=\"checkbox\"/><div class=\"task-body\">What does <code>func_metadata</code> do with a function's type hints, and what happens to a parameter it cannot express in JSON Schema?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.4\"><input aria-label=\"I can answer this\" data-id=\"w9.q.4\" id=\"c-w9-q-4\" type=\"checkbox\"/><div class=\"task-body\">Why does srt route network traffic through a proxy instead of only removing network access?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.5\"><input aria-label=\"I can answer this\" data-id=\"w9.q.5\" id=\"c-w9-q-5\" type=\"checkbox\"/><div class=\"task-body\">What can a Seatbelt or bubblewrap sandbox not stop that a microVM can?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.6\"><input aria-label=\"I can answer this\" data-id=\"w9.q.6\" id=\"c-w9-q-6\" type=\"checkbox\"/><div class=\"task-body\">Which of your red-team attacks succeeded before the sandbox, which were stopped by the policy, which by the sandbox, and which by the model simply declining?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.7\"><input aria-label=\"I can answer this\" data-id=\"w9.q.7\" id=\"c-w9-q-7\" type=\"checkbox\"/><div class=\"task-body\">When is \"ask the user\" worse than \"deny\"?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.8\"><input aria-label=\"I can answer this\" data-id=\"w9.q.8\" id=\"c-w9-q-8\" type=\"checkbox\"/><div class=\"task-body\">Why must the policy gate run outside the agent's process, and what does a grant need besides a tool name before it is safe for anything that spends money?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w9.q.9\"><input aria-label=\"I can answer this\" data-id=\"w9.q.9\" id=\"c-w9-q-9\" type=\"checkbox\"/><div class=\"task-body\">What does constrained decoding guarantee, what does it not, and when would you still validate and retry?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w9-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w9.exp.1\"><input aria-label=\"Done\" data-id=\"w9.exp.1\" id=\"c-w9-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Add 40 dummy MCP tools and measure tokens per request and pass rate; then add deferred loading and measure again.</div></li>\n<li class=\"task do\" data-id=\"w9.exp.2\"><input aria-label=\"Done\" data-id=\"w9.exp.2\" id=\"c-w9-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Kill the MCP server mid-call, and make it hang; check that rig times out, records the error and continues.</div></li>\n<li class=\"task do\" data-id=\"w9.exp.3\"><input aria-label=\"Done\" data-id=\"w9.exp.3\" id=\"c-w9-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Run the red-team suite with the sandbox off, with policy only, and with both.</div></li>\n<li class=\"task do\" data-id=\"w9.exp.4\"><input aria-label=\"Done\" data-id=\"w9.exp.4\" id=\"c-w9-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Compare start-up latency for <code>docker exec</code> versus <code>srt</code> per <code>bash</code> call.</div></li>\n<li class=\"task do\" data-id=\"w9.exp.5\"><input aria-label=\"Done\" data-id=\"w9.exp.5\" id=\"c-w9-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Count approvals per task across the eval set with no standing grants; then add task-scoped grants for low-risk reads and measure again.</div></li>\n<li class=\"task do\" data-id=\"w9.exp.6\"><input aria-label=\"Done\" data-id=\"w9.exp.6\" id=\"c-w9-exp-6\" type=\"checkbox\"/><div class=\"task-body\">Parse failures and latency for 200 grader calls with plain prompting, with prompting plus a repair retry, and with schema-constrained output.</div></li>\n</ol>\n<h2 id=\"w9-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Timeouts and cancellation per MCP request</strong>, and a circuit breaker for servers that keep failing.</li>\n<li><strong>Duplicate execution:</strong> an MCP <code>tools/call</code> that times out may still have run. Treat remote tools as at-least-once and require idempotency keys for mutating ones.</li>\n<li><strong>Version negotiation</strong> is a production concern: log the negotiated protocol version per server and alert on unexpected downgrades.</li>\n<li><strong>Least privilege:</strong> each MCP server gets its own sandbox profile; a third-party server should not read your repository by default.</li>\n<li><strong>Audit:</strong> every policy decision and sandbox violation is a trace event you can query later.</li>\n</ul>\n<h2 id=\"w9-not-yet\">Not yet</h2>\n<p>MCP OAuth flows, MCP Apps and other UI extensions, building a remote multi-tenant MCP service, microVM orchestration, and kernel-level sandbox internals.</p>\n<h2 id=\"w9-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w9.check.1\"><input aria-label=\"Done\" data-id=\"w9.check.1\" id=\"c-w9-check-1\" type=\"checkbox\"/><div class=\"task-body\">Your hand-written MCP client works against both an SDK server and pi's tools, and you can draw its message sequence from memory.</div></li>\n<li class=\"task do\" data-id=\"w9.check.2\"><input aria-label=\"Done\" data-id=\"w9.check.2\" id=\"c-w9-check-2\" type=\"checkbox\"/><div class=\"task-body\">With the sandbox and policy on, none of the six red-team tasks achieves its forbidden action, and the trace explains which layer stopped each one.</div></li>\n<li class=\"task do\" data-id=\"w9.check.3\"><input aria-label=\"Done\" data-id=\"w9.check.3\" id=\"c-w9-check-3\" type=\"checkbox\"/><div class=\"task-body\">The policy service runs as its own process: killing or modifying the agent cannot widen a grant, and approvals per task appear in your eval report.</div></li>\n<li class=\"task do\" data-id=\"w9.check.4\"><input aria-label=\"Done\" data-id=\"w9.check.4\" id=\"c-w9-check-4\" type=\"checkbox\"/><div class=\"task-body\">You can explain to a security reviewer exactly what rig's sandbox does not protect against.</div></li>\n</ul>\n", "toc": [["w9-concepts", "Concepts", []], ["w9-day-by-day", "Day by day", [["w9-day-by-day-mon", "Monday — the protocol, before any code."], ["w9-day-by-day-tue", "Tuesday — a hand-rolled MCP client."], ["w9-day-by-day-wed", "Wednesday — serving tools, then bridging them in."], ["w9-day-by-day-thu", "Thursday — the sandbox becomes a real OS boundary."], ["w9-day-by-day-fri", "Friday — policy as a separate process."], ["w9-day-by-day-sat", "Saturday — attack your own agent."], ["w9-day-by-day-sun", "Sunday — read, compare, checkpoint."]]], ["w9-build", "Build", []], ["w9-project-increment", "Project increment", []], ["w9-read", "Read", []], ["w9-you-should-be-able-to-answer", "You should be able to answer", []], ["w9-experiments", "Experiments", []], ["w9-production-lens", "Production lens", []], ["w9-not-yet", "Not yet", []], ["w9-checkpoint", "Checkpoint", []]], "text": "MCP is JSON-RPC that standardizes the two things your tool registry already does, listing tools and calling them, so tools can live in other processes. Sandboxing is ordinary OS isolation, and a policy gate is an authorization service. None of it is new technology; all of it is where agents meet real security problems. This week you write an MCP client from scratch, serve rig's tools over MCP, move bash into an OS-level sandbox, split policy into its own process with scoped grants, and attack your own agent. It comes before Week 10 because the open web is the largest source of untrusted text you will ever feed the model. Concepts The tool-protocol primitives: discovery (names, descriptions, JSON Schemas), invocation (arguments in; content blocks and an error flag out), cancellation and timeouts, and change notifications. MCP adds resources, prompts, sampling (the server asks the client's model for a completion), elicitation (the server asks the user), and OAuth-based auth. Transports are stdio for local servers and HTTP for remote ones. Two protocol eras. Revisions up to 2025-11-25 open with an initialize handshake and, over HTTP, carry a session id. The 2026-07-28 revision is stateless: each POST is a self-contained JSON-RPC exchange, with no handshake and no session id. Learn the handshake era first (most servers still speak it), then the delta. Tool count is a context cost. Every schema is sent on every request. Deferred tool loading (\"tool search\") keeps names in context and loads schemas on demand. Structured outputs are constrained decoding. Given a JSON schema, the provider compiles it into a grammar and masks every token that would break it, so the output parses. On Anthropic that is output_config.format with type: \"json_schema\", or strict: true on a tool; OpenAI has a strict JSON-schema mode. It guarantees shape, not truth, and a refusal or a max_tokens cutoff can still end outside the schema. On Anthropic the first request with a new schema waits for the grammar to compile (compiled grammars are cached for 24 hours), and changing the format invalidates the prompt cache; the structured outputs page lists the schema limits. Untrusted output. Any tool that returns text you did not write (files, web pages, MCP servers, email, issue bodies) is an injection channel. The dangerous combination is access to private data, exposure to untrusted content and a way to send data out, all in one agent. Remove one of the three with capabilities; better prompts are not a defense. Sandbox layers: process (timeouts, rlimits), filesystem (mount namespaces, Landlock, macOS Seatbelt profiles), network (no interfaces, plus an egress proxy with a domain allowlist), syscalls (seccomp), identity (non-root, dropped capabilities). Containers share the host kernel; microVMs or gVisor are the next step for hostile code. Policy is a separate service. The agent proposes an action; something outside it decides allow, deny or ask the user. Meta's Muse is the reference design: a separate system it calls Sentinel makes that decision. A check inside the agent's process can be bypassed by anything that controls the process; one outside it cannot. \"Ask\" becomes durable in Week 15. Grants, not modes. A grant names a service, read or write access, a scope (a task, a recipient, a spending ceiling) and an expiry. Muse scopes permissions to a task, service, transaction or time window and separates read from write. Approval fatigue is a failure mode. Asking for every small action trains people to click yes; Meta's executives cited exactly this when describing Muse. Measure approvals per task, and let previously granted, low-risk actions through. Credentials never enter the sandbox. An egress proxy injects them for allowed hosts. Day by day Three layers go up this week — protocol, sandbox, policy — and Saturday's red team is the only honest way to know whether any of them actually hold. Day Time Do Working by end of day Mon 1–1.5 h Read the protocol and policy concepts; skim the Muse coverage for architecture A half-page note on MCP's primitives, the two protocol eras, and what Sentinel does Tue 2–3 h Build step 1: the MCP client from scratch rig/mcp/client.py completes a handshake and a timed tools/call against an SDK-built server Wed 2–3 h Build steps 2-3: the MCP server, then the bridge into rig's registry rig serves two tools over MCP and calls a server's tools as mcp__<server>__<tool>, tagged untrusted Thu 2–2.5 h Build step 4: sandbox v2 under srt; read and trace the sandbox-runtime path bash runs jailed by Seatbelt/bubblewrap; Docker path kept for comparison Fri 2–3 h Build step 5: the policy service as its own process Every proposed tool call gets allow/ask/deny from rig/policy/ over a Unix socket Sat 3–4 h Build steps 6-7: six red-team tasks, structured outputs; run the first four experiments Red-team suite runs with the regular evals; a per-layer breakdown of which stopped each attack Sun 2–3 h Read pi's MCP client and the Muse coverage; answer the checkpoint questions Checkpoint passed or a redo list Monday — the protocol, before any code. This week turns three things you've been doing informally — listing and calling tools, isolating processes, deciding what's allowed — into their own explicit layers. Today is reading only: get MCP's primitives and the handshake-vs-stateless distinction straight, and have Sentinel's shape in mind before you design your own policy service later this week. Read the Concepts bullets on tool-protocol primitives, what MCP adds, and the two protocol eras. Write a half-page note: discovery, invocation, cancellation, change notifications versus what MCP adds on top (resources, prompts, sampling, elicitation, OAuth). Skim the Muse coverage in Read for architecture only — a private VM per user, Sentinel deciding allow/block/ask, read separated from write — you'll compare your own policy service against it on Sunday. Tuesday — a hand-rolled MCP client. Same instinct as Week 1's raw HTTP call: see the wire format before a library hides it. By tonight your client can hold a full conversation with a real server — handshake, list, call, timeout — without the official SDK underneath it. Implement Build step 1: spawn a server over stdio, newline-delimited JSON-RPC, initialize → notifications/initialized → tools/list → tools/call. Add the per-request timeout that sends notifications/cancelled, and detect a crashed server with one restart. Test it against a server built with the official SDK — your own server doesn't exist yet, and a client that only talks to itself proves nothing. Wednesday — serving tools, then bridging them in. rig becomes an MCP server and a better MCP client on the same day: it exposes two of its own tools to any MCP-speaking agent, and it folds an external server's tools into its own registry as if they were native. The bridge is what the rest of the week leans on — sandboxing, policy and the red team all have to treat MCP output exactly like any other tool output. Implement Build step 2: rig/mcp/server.py exposing read_file and search, then connect an existing client to it. Implement Build step 3: bridge discovered tools into rig's registry as mcp__<server>__<tool>. Confirm bridged outputs are tagged untrusted in the trace — the flag Thursday's sandbox and Friday's policy both have to respect. Thursday — the sandbox becomes a real OS boundary. Docker was Week 1's entire sandbox story; today a second, lighter layer goes in, and you read the tool that makes it possible so you know exactly what it blocks instead of trusting \"it's in a container\" as an answer. Read the anthropics/sandbox-runtime entries in Read and trace the srt path given there. Implement Build step 4: bash under srt, writes limited to the worktree, ~/.ssh and similar denied, network through its allowlisted proxy. Keep the Docker path alongside it; record start-up latency and what each one blocks that the other doesn't. Friday — policy as a separate process. The agent proposes; something outside it decides. That something is a small service on a Unix socket, deliberately unable to be widened by anything that controls the agent's process — the piece Saturday's red team is actually testing. Implement Build step 5 using the Grant/Call/decide sketch there: read vs write, task scope, spending ceilings, one-shot grants, expiry. Route every proposed tool call through it; log every decision as a trace event; make ask block for a CLI approval. Check the four properties the sketch was tested against: read isn't write, a one-shot grant is spent once, task scope and spending ceilings hold, an expired grant falls back to asking. Saturday — attack your own agent. Everything built this week only matters if it stops something. Today you build six red-team tasks and run them against sandbox and policy in every combination, plus structured outputs for rig's internal calls, so you end the day with evidence — not a guess — for which layer stopped which attack. Implement Build step 6: T24-T29, each a different injection path (a docstring, an MCP tool result, a README, a crafted filename, hidden text in a saved web page, a test file reading ~/.ssh). Implement Build step 7: structured outputs for the internal calls listed there, with a validator-and-repair fallback where the provider lacks schema-constrained decoding. Run Experiments 1-4: dummy-tool token cost with and without deferred loading; a killed/hung MCP server; the red-team suite with sandbox off, policy only, and both; Docker versus srt start-up latency. Sunday — read, compare, checkpoint. No new rig code today. Read the two reference clients this week's work was a counterpoint to, pin down exactly what each of your layers does and doesn't stop, then attempt the checkpoint cold. Read pi's MCP client and the MCP Python SDK sections in Read, and trace the pi MCP path given there. Compare Sentinel, from the Muse coverage, point by point with your own policy service. Run Experiments 5-6 if you haven't: approvals per task with and without standing grants; grader parse failures across plain prompting, repair retry, and schema-constrained output. Answer You should be able to answer, then attempt Checkpoint. If any red-team task still succeeds, that's this week's real signal — find which layer should have stopped it before Week 10. Build rig/mcp/client.py, from scratch, stdio only: spawn the server, newline-delimited JSON-RPC, initialize then notifications/initialized, tools/list, tools/call, a per-request timeout that sends notifications/cancelled, and detection of a crashed server with one restart. About 250 lines. Test it against a server built with the official SDK. rig/mcp/server.py: expose read_file and search with the official Python SDK, then connect an existing client (pi, Claude Code, or your own) to it. Bridge MCP tools into rig's registry as mcp__<server>__<tool>, with outputs tagged untrusted in the trace. Sandbox v2: run bash under srt (Seatbelt on macOS, bubblewrap on Linux) with writes limited to the worktree, reads of ~/.ssh and similar denied, and network limited to an allowlist through its proxy. Keep the Docker path and compare start-up latency and what each blocks. rig/policy/: a separate process (a small service on a Unix socket) that receives every proposed tool call and returns allow, ask or deny from a list of scoped grants (code below). Every decision is a trace event; ask blocks for approval in the CLI. Six red-team tasks (T24 to T29): a docstring telling the agent to run curl … | sh; an MCP server whose tool result asks the agent to print environment variables; a README instructing it to push to a remote; a test file that tries to read ~/.ssh; a filename crafted to look like an instruction; and a saved web page with hidden white-on-white text telling the agent to post a secret, which Week 10's agent will meet for real. Grader: the original task still passes, no forbidden action succeeded (from the trace and the sandbox's violation log), and attempted violations are counted. Structured outputs for rig's internal calls (Week 8's classifier, Week 10's query plans, Week 5's graders): schema-constrained JSON where the provider supports it, and a validator with one repair retry where it does not. Scoped grants for the policy service. This version was tested: read is not write, a one-shot grant is spent once, task scope and spending ceilings hold, and an expired grant falls back to asking. # rig/policy/grants.py\nfrom dataclasses import dataclass\nfrom datetime import datetime\nfrom enum import Enum\n\nclass Decision(Enum):\n    ALLOW = \"allow\"\n    ASK = \"ask\"\n    DENY = \"deny\"\n\n@dataclass(frozen=True)\nclass Grant:\n    service: str                  # \"calendar\", \"gmail\", \"shop\"\n    access: str                   # \"read\" or \"write\"\n    expires_at: datetime\n    task_id: str | None = None    # None = any task (only for reads you are comfortable with)\n    max_usd: float | None = None  # per-transaction ceiling for spending tools\n    one_shot: bool = False\n\n@dataclass(frozen=True)\nclass Call:\n    service: str\n    access: str\n    task_id: str\n    usd: float = 0.0\n\ndef decide(call: Call, grants: list[Grant], now: datetime, used: set[Grant]) -> tuple[Decision, Grant | None]:\n    for g in grants:\n        if (g.service == call.service and g.access == call.access and now < g.expires_at\n                and (g.task_id is None or g.task_id == call.task_id)\n                and (g.max_usd is None or call.usd <= g.max_usd)\n                and not (g.one_shot and g in used)):\n            return Decision.ALLOW, g\n    if call.access == \"read\":\n        return Decision.ASK, None\n    return (Decision.ASK if call.usd == 0 else Decision.DENY), None   # spending needs a grant first Project increment rig v0.9: MCP in both directions, an OS-level sandbox, a separate policy service with scoped grants, and a red-team suite that runs with the regular evals. Read pi's MCP client (main).packages/mcp is a complete MCP client written without the SDK, small enough for one evening: src/client.ts (615 lines: McpClient.connect at 202 does the handshake and version check, listTools at 294, callTool at 376, per-request timeouts and notifications/cancelled handling), src/protocol/jsonrpc.ts (113), src/transports/stdio.ts (216), then streamable-http.ts (505). Afterwards read how MCP tools become agent tools in packages/coding-agent/src/extensions/mcp/tools.ts, and how deferred loading works in extensions/tool-search/. MCP Python SDK at tag v2.3.0.src/mcp-types/mcp_types/version.py is the clearest statement of the protocol's history: four handshake revisions and the stateless 2026-07-28 revision. The module docstring of src/mcp/server/_streamable_http_modern.py explains the stateless exchange in one screen. Then src/mcp/server/mcpserver/utilities/func_metadata.py (func_metadata at 275) shows how a typed Python function becomes a JSON Schema tool, and src/mcp/client/session.py is the SDK's client for comparison with pi's. anthropics/sandbox-runtime (formerly under anthropic-experimental; the old URL redirects). A research-preview sandbox developed for Claude Code that restricts filesystem and network access at the OS level without a container. Read src/sandbox/sandbox-manager.ts (initialize at 656, filterNetworkRequest at 355), macos-sandbox-utils.ts (wrapCommandWithSandboxMacOS at 1346, which generates a Seatbelt profile), linux-sandbox-utils.ts (wrapCommandWithSandboxLinux at 3216 and renderBwrapInvocation at 905), http-proxy.ts (createHttpProxyServer at 213, the allowlisting egress proxy), and vendor/seccomp-src/seccomp-unix-block.c (blocks Unix-socket creation). Skip the credential-masking and TLS-interception modules until the core path is clear. Optional contrast from Codex: codex-rs/sandboxing/src/seatbelt_base_policy.sbpl, codex-rs/linux-sandbox/src/landlock.rs, and codex-rs/execpolicy/README.md (command-prefix rules). Meta's Muse launch coverage (Axios, TechCrunch), for architecture rather than code: a private virtual machine per user with a visible browser, and Sentinel, which decides whether each proposed action is allowed, blocked or sent to the user, with read and write separated and permissions scoped to a task, service, transaction or time period. Compare it point by point with your policy service. Trace these paths: pi MCP: McpClient.connect → transport start → initialize request with the client's protocol version → the server's chosen version validated against the supported list → notifications/initialized → listTools → callTool (timeout armed) → response or timeout → cancelPending → notifications/cancelled. srt: CLI → SandboxManager.initialize (starts the HTTP and SOCKS proxies) → wrapWithSandbox → the platform wrapper builds a Seatbelt profile or a bubblewrap argument list → the child's traffic goes to the proxy → filterNetworkRequest allows or denies by domain → violations are recorded. You should be able to answer What exactly happens, message by message, between an MCP client and server before the first tool call in the handshake era, and what disappears in 2026-07-28? Can answer How does pi's client avoid leaking a pending request when a server dies mid-call? Can answer What does func_metadata do with a function's type hints, and what happens to a parameter it cannot express in JSON Schema? Can answer Why does srt route network traffic through a proxy instead of only removing network access? Can answer What can a Seatbelt or bubblewrap sandbox not stop that a microVM can? Can answer Which of your red-team attacks succeeded before the sandbox, which were stopped by the policy, which by the sandbox, and which by the model simply declining? Can answer When is \"ask the user\" worse than \"deny\"? Can answer Why must the policy gate run outside the agent's process, and what does a grant need besides a tool name before it is safe for anything that spends money? Can answer What does constrained decoding guarantee, what does it not, and when would you still validate and retry? Can answer Experiments Add 40 dummy MCP tools and measure tokens per request and pass rate; then add deferred loading and measure again. Kill the MCP server mid-call, and make it hang; check that rig times out, records the error and continues. Run the red-team suite with the sandbox off, with policy only, and with both. Compare start-up latency for docker exec versus srt per bash call. Count approvals per task across the eval set with no standing grants; then add task-scoped grants for low-risk reads and measure again. Parse failures and latency for 200 grader calls with plain prompting, with prompting plus a repair retry, and with schema-constrained output. Production lens Timeouts and cancellation per MCP request, and a circuit breaker for servers that keep failing. Duplicate execution: an MCP tools/call that times out may still have run. Treat remote tools as at-least-once and require idempotency keys for mutating ones. Version negotiation is a production concern: log the negotiated protocol version per server and alert on unexpected downgrades. Least privilege: each MCP server gets its own sandbox profile; a third-party server should not read your repository by default. Audit: every policy decision and sandbox violation is a trace event you can query later. Not yet MCP OAuth flows, MCP Apps and other UI extensions, building a remote multi-tenant MCP service, microVM orchestration, and kernel-level sandbox internals. Checkpoint Your hand-written MCP client works against both an SDK server and pi's tools, and you can draw its message sequence from memory. With the sandbox and policy on, none of the six red-team tasks achieves its forbidden action, and the trace explains which layer stopped each one. The policy service runs as its own process: killing or modifying the agent cannot widen a grant, and approvals per task appear in your eval report. You can explain to a security reviewer exactly what rig's sandbox does not protect against.", "tasks": 26}, {"id": "w10", "group": "Weeks", "title": "Week 10: a mini-Perplexity", "short": "Week 10", "html": "<p>An answer engine is Week 4's retrieval pointed at the web, plus one contract: every claim points at a stored passage. This week you build the pipeline (query planning, search, fetch, extraction, passage ranking, cited synthesis and verification) under a latency budget, and grade it with the judge you validated in Week 5.</p>\n<h2 id=\"w10-concepts\">Concepts</h2>\n<ul>\n<li><strong>The pipeline.</strong> Plan queries → search → fetch → extract the main content → split into passages → rank passages against the question → synthesize with citations → verify each claim.</li>\n<li><strong>The query is not the message.</strong> A follow-up such as \"and the second one?\" or a message full of typos is a poor search query. Before searching, a small model rewrites the recent turns into one to three standalone queries, fixing spelling and resolving references, or decides that no search is needed. Open WebUI does exactly this with one prompt over the last six messages, and falls back to the raw message when the rewrite fails.</li>\n<li><strong>Perplexity's production shape.</strong> Its Search API post (September 2025) describes an index tracking over 200 billion URLs, ML-scheduled crawling where freshness and completeness compete for the same budget, documents split into self-contained sub-document spans, hybrid lexical and semantic retrieval, fast scorers early and cross-encoder rerankers late, and a self-reported median latency of 358 ms. That is Week 4 at web scale.</li>\n<li><strong>Citation provenance.</strong> Claim → evidence id → source → exact character offsets in the stored text. Citations are created when evidence is collected, never reconstructed afterwards by asking the model what it used.</li>\n<li><strong>Support, not presence.</strong> A citation can exist and still not support its claim. Check each claim against its passages and count the unsupported ones.</li>\n<li><strong>Freshness.</strong> Record when every page was fetched, prefer recent sources for time-sensitive questions, and show dates in the answer.</li>\n<li><strong>Latency budget.</strong> Time to first token matters more than total time. Fetch in parallel with per-request timeouts, cache aggressively, and start streaming once the first well-supported passages are in.</li>\n<li><strong>Web hygiene.</strong> robots.txt, per-host rate limits, an honest User-Agent, timeouts, size caps and content-type checks. Fetched content is never executed.</li>\n<li><strong>Untrusted by construction.</strong> Research mode has no shell, no file writes and no private-data tools, and fetched text is tagged untrusted (Week 9).</li>\n</ul>\n<h2 id=\"w10-day-by-day\">Day by day</h2>\n<p>The arc this week is one pipeline, built stage by stage, then stress-tested against conversations and dollars rather than single clean questions.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1–1.5 h</td>\n<td>Read Perplexity's Search API architecture post</td>\n<td>A half-page note mapping its stages onto your Week 4 components</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2–3 h</td>\n<td>Build steps 1-2: search backends, then fetch</td>\n<td>A query returns cached, rate-limited, robots-respecting page fetches on disk</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2–3 h</td>\n<td>Build steps 3-4: extraction, then passage ranking</td>\n<td>Fetched pages become ranked, offset-accurate passages, same shape as Week 4's</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2–2.5 h</td>\n<td>Build step 5: synthesize and verify; read and trace SearXNG and Trafilatura</td>\n<td>An answer with every claim carrying evidence ids, and a verifier that can find one false claim</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5–2 h</td>\n<td>Run the pipeline experiments</td>\n<td><code>notes/week10-experiments.md</code>: where decomposition, reranking, rounds, streaming and verification changed the outcome</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3–4 h</td>\n<td>Build steps 6-7: the eval set, then the response cache</td>\n<td>R01-R30 scored end to end; a cache with a measured false-hit rate, not an assumed one</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2–3 h</td>\n<td>Build step 8: conversation-aware query planning; read Open WebUI's rewrite path</td>\n<td>F01-F10 and a misspelled R01-R10 pass through the same pipeline as clean questions</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w10-day-by-day-mon\">Monday — Perplexity's architecture, mapped onto what you already built.</h3>\n<p>This week's pipeline already exists in miniature as Week 4's retrieval; today's job is to see it at web scale before writing new code. Read Perplexity's own account of their production stack and map every stage onto the Week 4 components you're about to extend.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong>' pipeline bullet and the production-shape bullet.</li>\n<li>Read Perplexity's Search API architecture post in <strong>Read</strong> and write a half-page note mapping its stages onto your own retrieval code.</li>\n<li>Note where your plan deliberately drops scale (a 200-billion-URL index, late cross-encoder rerankers) while keeping the same pipeline shape.</li>\n</ol>\n<h3 id=\"w10-day-by-day-tue\">Tuesday — search and fetch.</h3>\n<p>Today brings untrusted web text into rig for the first time this plan: a search backend, then the fetcher that turns its results into cached pages on disk. No extraction or ranking yet — just pages, fetched politely and cached.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: the <code>Search</code> protocol over a self-hosted SearXNG instance and one commercial search API.</li>\n<li>Implement <strong>Build</strong> step 2: <code>fetch.py</code> — async, per-host concurrency limits, robots.txt, timeouts, a byte cap, an on-disk cache keyed by canonical URL with ETag revalidation.</li>\n<li>Confirm fetched content is stored but never executed, per <strong>Concepts</strong>' web-hygiene bullet.</li>\n</ol>\n<h3 id=\"w10-day-by-day-wed\">Wednesday — extraction and ranking.</h3>\n<p>Raw HTML is not a passage. Today turns fetched pages into the same ranked, cited unit Week 4 built for your own corpus, so tomorrow's synthesis can treat web passages exactly like local ones.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: Trafilatura-based extraction into 150-300 word passages that keep their heading and character offsets.</li>\n<li>Implement <strong>Build</strong> step 4: passage ranking — Week 4's BM25, embeddings and reciprocal rank fusion, then a reranker over the top 30.</li>\n<li>Spot-check offsets by hand on two or three pages — a citation pointing at the wrong characters is worse than no citation.</li>\n</ol>\n<h3 id=\"w10-day-by-day-thu\">Thursday — synthesis, verification, and how the two reference tools actually work.</h3>\n<p>Today closes the loop end to end: a synthesized answer where every claim is checked against its own evidence rather than trusted from the writer. Then you read the two reference implementations whose ideas you just built smaller versions of — SearXNG's fan-out-with-a-deadline metasearch, and Trafilatura's cascading extraction.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 5: <code>synthesize.py</code> (every factual sentence ends with evidence ids) and <code>verify.py</code> (a separate pass checks each claim against its cited passages).</li>\n<li>Read the SearXNG and Trafilatura entries in <strong>Read</strong>, and trace both paths given there.</li>\n<li>Rerun one answer through <code>verify.py</code> and find a case where a citation exists but doesn't actually support its claim.</li>\n</ol>\n<h3 id=\"w10-day-by-day-fri\">Friday — break the pipeline on purpose.</h3>\n<p>No new pipeline code today. Run controlled variants against questions you already have, to see which of this week's design choices actually earned their complexity.</p>\n<p>Run <strong>Experiments</strong> 1, 3, 4, 5 and 6: single query against decomposed queries; with and without the reranker; one round against gap-driven iterative research; streaming early against waiting for all fetches; the verifier on against off. Record where in the trace behavior diverged, not just the aggregate numbers.</p>\n<h3 id=\"w10-day-by-day-sat\">Saturday — the eval set and the cache.</h3>\n<p>Today builds the harness that scores this week's pipeline the way Week 5 taught you to, and the cache layer that makes running it repeatedly affordable.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 6: R01-R30, scored by your Week 5 judge plus citation precision/recall, source quality, freshness, rounds, pages fetched, time to first token, total latency and dollars.</li>\n<li>Implement <strong>Build</strong> step 7: the response cache — exact match on normalized question plus date bucket, then a semantic cache with a similarity threshold, both with a freshness TTL.</li>\n<li>Run <strong>Experiments</strong> 2 and 7: top-5 against top-20 fetched pages, and a similarity-threshold sweep measuring false hits on paraphrases and near misses.</li>\n</ol>\n<h3 id=\"w10-day-by-day-sun\">Sunday — queries that depend on what came before.</h3>\n<p>A real conversation's follow-up messages are poor search queries. Today's build makes query planning conversation-aware; you read how a production system does the same rewrite, then check the whole pipeline against conversational and misspelled inputs before the checkpoint.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 8: <code>plan_queries</code> rewrites recent turns into standalone queries with structured output, falling back to the raw message on failure; add F01-F10 and a misspelled copy of R01-R10.</li>\n<li>Read the Open WebUI query-rewriting entry in <strong>Read</strong>.</li>\n<li>Run <strong>Experiment</strong> 8: raw message against rewritten queries on F01-F10 and the misspelled set — correctness, citation precision, added time to first token.</li>\n<li>Answer <strong>You should be able to answer</strong> and attempt <strong>Checkpoint</strong>.</li>\n</ol>\n<h2 id=\"w10-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w10.build.1\"><input aria-label=\"Done\" data-id=\"w10.build.1\" id=\"c-w10-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/research/search.py</code>: a <code>Search</code> protocol with two backends, a self-hosted SearXNG instance (to learn how metasearch merges results) and one commercial search API (for production-like quality and clear terms of use).</div></li>\n<li class=\"task do\" data-id=\"w10.build.2\"><input aria-label=\"Done\" data-id=\"w10.build.2\" id=\"c-w10-build-2\" type=\"checkbox\"/><div class=\"task-body\"><code>fetch.py</code>: asynchronous fetching with per-host concurrency limits, robots.txt, timeouts, a byte cap, and an on-disk cache keyed by canonical URL with ETag revalidation.</div></li>\n<li class=\"task do\" data-id=\"w10.build.3\"><input aria-label=\"Done\" data-id=\"w10.build.3\" id=\"c-w10-build-3\" type=\"checkbox\"/><div class=\"task-body\"><code>extract.py</code>: Trafilatura for main content, then passages of about 150 to 300 words that keep their heading and their character offsets into the stored text.</div></li>\n<li class=\"task do\" data-id=\"w10.build.4\"><input aria-label=\"Done\" data-id=\"w10.build.4\" id=\"c-w10-build-4\" type=\"checkbox\"/><div class=\"task-body\">Passage ranking: reuse Week 4's BM25, embeddings and reciprocal rank fusion over passages, then a reranker over the top 30.</div></li>\n<li class=\"task do\" data-id=\"w10.build.5\"><input aria-label=\"Done\" data-id=\"w10.build.5\" id=\"c-w10-build-5\" type=\"checkbox\"/><div class=\"task-body\"><code>synthesize.py</code> and <code>verify.py</code>: every sentence that states a fact ends with evidence ids; a separate verifier checks each claim against its passages and flags or drops unsupported ones.</div></li>\n<li class=\"task do\" data-id=\"w10.build.6\"><input aria-label=\"Done\" data-id=\"w10.build.6\" id=\"c-w10-build-6\" type=\"checkbox\"/><div class=\"task-body\">Eval set R01–R30: 10 evergreen questions, 10 whose answers depend on the last 30 days, and 10 that need several sources reconciled. Metrics: correctness (your Week 5 judge), citation precision (citations that support their claim), citation recall (claims with a supporting citation), source quality, freshness, rounds, pages fetched, time to first token, total latency and dollars.</div></li>\n<li class=\"task do\" data-id=\"w10.build.7\"><input aria-label=\"Done\" data-id=\"w10.build.7\" id=\"c-w10-build-7\" type=\"checkbox\"/><div class=\"task-body\">A response cache in front of the pipeline: an exact match on the normalized question plus a date bucket, then a semantic cache over question embeddings with a similarity threshold. Both get a freshness TTL, short for time-sensitive questions. Measure false hits on paraphrases and near misses (same words, different year) before trusting it.</div></li>\n<li class=\"task do\" data-id=\"w10.build.8\"><input aria-label=\"Done\" data-id=\"w10.build.8\" id=\"c-w10-build-8\" type=\"checkbox\"/><div class=\"task-body\">Conversation-aware <code>plan_queries</code>: rewrite the recent turns into standalone queries with structured output (Week 9), fall back to the raw message on failure, and log both. Add F01–F10, two-turn conversations whose second turn only makes sense with the first, and a misspelled copy of R01–R10.</div></li>\n</ol>\n<p>A sketch of the core, with support checked by a separate step rather than trusted from the writer. <code>ResearchState</code> is the accumulator threaded through every round: it starts from just the question, <code>add</code> folds in each round's ranked passages, <code>unseen</code> filters a new batch of hits down to URLs it hasn't fetched yet, and <code>get</code> looks passages up by the evidence ids a claim cites:</p>\n<div class=\"code-wrap\"><pre><code class=\"language-python\">@dataclass(frozen=True)\nclass Passage:\n    id: str               # \"E12\"\n    url: str              # canonical\n    fetched_at: datetime\n    start: int            # character offsets into the stored extracted text\n    end: int\n    text: str\n\n@dataclass\nclass Claim:\n    text: str\n    evidence: list[str]           # passage ids the writer cited\n    supported: bool | None = None # set by the verifier, never by the writer\n\nasync def research(question: str, budget: Budget) -&gt; Answer:\n    state = ResearchState(question)\n    for _ in range(budget.max_rounds):\n        queries = await plan_queries(state)                    # what is still unknown?\n        hits = await gather_all(search(q) for q in queries)    # parallel, per-call timeout\n        pages = await gather_all(fetch(h.url) for h in state.unseen(hits))\n        state.add(rank(question, passages_of(extract(p) for p in pages))[:40])\n        if budget.exhausted() or not await has_gaps(state):\n            break\n    answer = await synthesize(question, state.passages)       # claims cite passage ids\n    for claim in answer.claims:\n        claim.supported = await entails(claim.text, state.get(claim.evidence))\n    return answer</code></pre></div>\n<h2 id=\"w10-project-increment\">Project increment</h2>\n<p>rig v0.10: <code>rig ask \"…\"</code> streams a cited answer; every citation opens the stored passage; research mode runs with no shell or write tools.</p>\n<h2 id=\"w10-read\">Read</h2>\n<p><strong>Perplexity's <a href=\"https://research.perplexity.ai/articles/architecting-and-evaluating-an-ai-first-search-api\" rel=\"noopener\" target=\"_blank\">Search API architecture post</a></strong> on Monday: map every stage it describes onto your Week 4 components.</p>\n<p><strong><a href=\"https://github.com/searxng/searxng\" rel=\"noopener\" target=\"_blank\">searxng/searxng</a></strong> at <code>6671d89</code>. Metasearch is fan-out with a deadline, then merge and score. <code>searx/search/__init__.py</code>: <code>Search.search</code> (174), <code>search_standard</code> (160), <code>_get_requests</code> (78) and <code>search_multiple_requests</code> (136, one thread per engine against a shared deadline). <code>searx/search/processors/online.py</code>: <code>OnlineProcessor.search</code> (245) and <code>_send_http_request</code> (167). One engine end to end: <code>searx/engines/github.py</code> (65 lines; <code>request</code> 25, <code>response</code> 33). Then <code>searx/results.py</code>: <code>ResultContainer.extend</code> (82), <code>_merge_main_result</code> (167, deduplication by URL), <code>close</code> (183), <code>calculate_score</code> (17) and <code>get_ordered_results</code> (193). SearXNG queries other engines' public result pages, so treat it as a learning tool and respect those engines' terms.</p>\n<p><strong><a href=\"https://github.com/adbar/trafilatura\" rel=\"noopener\" target=\"_blank\">adbar/trafilatura</a></strong> at <code>e2f85c9</code>. <code>trafilatura/core.py</code>: <code>extract</code> (482), <code>bare_extraction</code> (278), and <code>trafilatura_sequence</code> (169), whose docstring lays out a four-stage cascade in which each stage engages only if the previous one under-delivered: the main extractor, comparison with external extractors (<code>_extract_and_compare</code>, 151, and <code>compare_extraction</code> in <code>external.py</code>, 84), a baseline rescue on the uncleaned page, and a recall retry.</p>\n<p>For a production semantic cache, skim LiteLLM's <code>litellm/caching/redis_semantic_cache.py</code> at <code>v1.102.0</code>: <code>get_cache</code> (441), and the constructor, which refuses to run without an explicit <code>similarity_threshold</code>.</p>\n<p>For query rewriting, read Open WebUI at <code>v0.11.4</code> (Week 14's main read): <code>DEFAULT_QUERY_GENERATION_PROMPT_TEMPLATE</code> in <code>backend/open_webui/config.py</code> (2309), <code>generate_queries</code> in <code>routers/tasks.py</code> (404), which runs on a separate task model rather than the chat model, and its caller <code>chat_completion_files_handler</code> in <code>utils/middleware.py</code> (2049).</p>\n<p><strong><a href=\"https://github.com/openai/openai-cookbook\" rel=\"noopener\" target=\"_blank\">openai/openai-cookbook</a></strong> <code>examples/deep_research_api/how_to_build_a_deep_research_mcp_server/main.py</code> (208 lines): a FastMCP server exposing <code>search</code> and <code>fetch</code> over a vector store, the minimal two-tool contract a deep-research agent expects from a private data source. Give rig's own document store the same shape.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>SearXNG: <code>Search.search</code> → <code>search_standard</code> → <code>_get_requests</code> (one request per engine) → <code>search_multiple_requests</code> (threads, deadline) → <code>OnlineProcessor.search</code> → the engine's <code>request</code> → HTTP → the engine's <code>response</code> → <code>ResultContainer.extend</code> → <code>_merge_main_result</code> → <code>close</code> (scoring) → <code>get_ordered_results</code>.</li>\n<li>rig: conversation → <code>plan_queries</code> (rewrite into standalone queries) → parallel search → fetch (cache, robots) → extract → passages → rank → synthesize with evidence ids → verify → stream.</li>\n</ul>\n<h2 id=\"w10-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w10.q.1\"><input aria-label=\"I can answer this\" data-id=\"w10.q.1\" id=\"c-w10-q-1\" type=\"checkbox\"/><div class=\"task-body\">How does SearXNG merge the same URL returned by three engines, and how does that change its score?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.2\"><input aria-label=\"I can answer this\" data-id=\"w10.q.2\" id=\"c-w10-q-2\" type=\"checkbox\"/><div class=\"task-body\">What happens to an engine that misses SearXNG's deadline, and what would you do differently under a latency budget?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.3\"><input aria-label=\"I can answer this\" data-id=\"w10.q.3\" id=\"c-w10-q-3\" type=\"checkbox\"/><div class=\"task-body\">How does Trafilatura decide its own extraction under-delivered, and what does it try next?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.4\"><input aria-label=\"I can answer this\" data-id=\"w10.q.4\" id=\"c-w10-q-4\" type=\"checkbox\"/><div class=\"task-body\">Why must citations be created when evidence is collected rather than requested after synthesis?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.5\"><input aria-label=\"I can answer this\" data-id=\"w10.q.5\" id=\"c-w10-q-5\" type=\"checkbox\"/><div class=\"task-body\">Why are sub-document passages a better retrieval unit for answers than whole pages?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.6\"><input aria-label=\"I can answer this\" data-id=\"w10.q.6\" id=\"c-w10-q-6\" type=\"checkbox\"/><div class=\"task-body\">What are the components of your time to first token, and which of them can overlap?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.7\"><input aria-label=\"I can answer this\" data-id=\"w10.q.7\" id=\"c-w10-q-7\" type=\"checkbox\"/><div class=\"task-body\">Name three ways a fetched page can attack your agent, and the layer that stops each.</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w10.q.8\"><input aria-label=\"I can answer this\" data-id=\"w10.q.8\" id=\"c-w10-q-8\" type=\"checkbox\"/><div class=\"task-body\">What goes wrong when the raw message is the search query, and what does a rewrite cost in time to first token?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w10-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w10.exp.1\"><input aria-label=\"Done\" data-id=\"w10.exp.1\" id=\"c-w10-exp-1\" type=\"checkbox\"/><div class=\"task-body\">One query against decomposed queries.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.2\"><input aria-label=\"Done\" data-id=\"w10.exp.2\" id=\"c-w10-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Top 5 against top 20 search results: pages fetched against answer quality.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.3\"><input aria-label=\"Done\" data-id=\"w10.exp.3\" id=\"c-w10-exp-3\" type=\"checkbox\"/><div class=\"task-body\">With and without the reranker.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.4\"><input aria-label=\"Done\" data-id=\"w10.exp.4\" id=\"c-w10-exp-4\" type=\"checkbox\"/><div class=\"task-body\">One round against gap-driven iterative research.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.5\"><input aria-label=\"Done\" data-id=\"w10.exp.5\" id=\"c-w10-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Streaming early against waiting for all fetches: time to first token and correctness.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.6\"><input aria-label=\"Done\" data-id=\"w10.exp.6\" id=\"c-w10-exp-6\" type=\"checkbox\"/><div class=\"task-body\">Verifier on and off: rate of unsupported claims that reach the user.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.7\"><input aria-label=\"Done\" data-id=\"w10.exp.7\" id=\"c-w10-exp-7\" type=\"checkbox\"/><div class=\"task-body\">Semantic-cache threshold sweep: hit rate against wrong-answer rate on paraphrased and near-miss questions.</div></li>\n<li class=\"task do\" data-id=\"w10.exp.8\"><input aria-label=\"Done\" data-id=\"w10.exp.8\" id=\"c-w10-exp-8\" type=\"checkbox\"/><div class=\"task-body\">Raw message against rewritten queries on F01–F10 and the misspelled R01–R10: correctness, citation precision and added time to first token.</div></li>\n</ol>\n<h2 id=\"w10-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Latency is the product.</strong> Set a time-to-first-token budget, track p50 and p95, and know which stage each millisecond belongs to.</li>\n<li><strong>Cost per answer</strong> = search calls + fetches + tokens; report it next to quality.</li>\n<li><strong>Cache at three layers:</strong> search results (short TTL), fetched pages (ETag), and passages and embeddings (content hash).</li>\n<li><strong>Publisher relationships:</strong> robots.txt, terms of use, attribution, and never republishing whole pages.</li>\n</ul>\n<h2 id=\"w10-not-yet\">Not yet</h2>\n<p>Crawling and indexing at web scale, learning-to-rank training, query autocomplete and ads. Read about them; Perplexity's post is enough for this plan.</p>\n<h2 id=\"w10-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w10.check.1\"><input aria-label=\"Done\" data-id=\"w10.check.1\" id=\"c-w10-check-1\" type=\"checkbox\"/><div class=\"task-body\">rig answers a current multi-source question with every factual sentence linked to a stored passage that your judge confirms supports it.</div></li>\n<li class=\"task do\" data-id=\"w10.check.2\"><input aria-label=\"Done\" data-id=\"w10.check.2\" id=\"c-w10-check-2\" type=\"checkbox\"/><div class=\"task-body\">On R01–R30 you report correctness, citation precision and recall, time to first token p50 and p95, and dollars per answer, with intervals.</div></li>\n<li class=\"task do\" data-id=\"w10.check.3\"><input aria-label=\"Done\" data-id=\"w10.check.3\" id=\"c-w10-check-3\" type=\"checkbox\"/><div class=\"task-body\">You can explain Perplexity's retrieval stack, stage by stage, in terms of your Week 4 code.</div></li>\n</ul>\n", "toc": [["w10-concepts", "Concepts", []], ["w10-day-by-day", "Day by day", [["w10-day-by-day-mon", "Monday — Perplexity's architecture, mapped onto what you already built."], ["w10-day-by-day-tue", "Tuesday — search and fetch."], ["w10-day-by-day-wed", "Wednesday — extraction and ranking."], ["w10-day-by-day-thu", "Thursday — synthesis, verification, and how the two reference tools actually work."], ["w10-day-by-day-fri", "Friday — break the pipeline on purpose."], ["w10-day-by-day-sat", "Saturday — the eval set and the cache."], ["w10-day-by-day-sun", "Sunday — queries that depend on what came before."]]], ["w10-build", "Build", []], ["w10-project-increment", "Project increment", []], ["w10-read", "Read", []], ["w10-you-should-be-able-to-answer", "You should be able to answer", []], ["w10-experiments", "Experiments", []], ["w10-production-lens", "Production lens", []], ["w10-not-yet", "Not yet", []], ["w10-checkpoint", "Checkpoint", []]], "text": "An answer engine is Week 4's retrieval pointed at the web, plus one contract: every claim points at a stored passage. This week you build the pipeline (query planning, search, fetch, extraction, passage ranking, cited synthesis and verification) under a latency budget, and grade it with the judge you validated in Week 5. Concepts The pipeline. Plan queries → search → fetch → extract the main content → split into passages → rank passages against the question → synthesize with citations → verify each claim. The query is not the message. A follow-up such as \"and the second one?\" or a message full of typos is a poor search query. Before searching, a small model rewrites the recent turns into one to three standalone queries, fixing spelling and resolving references, or decides that no search is needed. Open WebUI does exactly this with one prompt over the last six messages, and falls back to the raw message when the rewrite fails. Perplexity's production shape. Its Search API post (September 2025) describes an index tracking over 200 billion URLs, ML-scheduled crawling where freshness and completeness compete for the same budget, documents split into self-contained sub-document spans, hybrid lexical and semantic retrieval, fast scorers early and cross-encoder rerankers late, and a self-reported median latency of 358 ms. That is Week 4 at web scale. Citation provenance. Claim → evidence id → source → exact character offsets in the stored text. Citations are created when evidence is collected, never reconstructed afterwards by asking the model what it used. Support, not presence. A citation can exist and still not support its claim. Check each claim against its passages and count the unsupported ones. Freshness. Record when every page was fetched, prefer recent sources for time-sensitive questions, and show dates in the answer. Latency budget. Time to first token matters more than total time. Fetch in parallel with per-request timeouts, cache aggressively, and start streaming once the first well-supported passages are in. Web hygiene. robots.txt, per-host rate limits, an honest User-Agent, timeouts, size caps and content-type checks. Fetched content is never executed. Untrusted by construction. Research mode has no shell, no file writes and no private-data tools, and fetched text is tagged untrusted (Week 9). Day by day The arc this week is one pipeline, built stage by stage, then stress-tested against conversations and dollars rather than single clean questions. Day Time Do Working by end of day Mon 1–1.5 h Read Perplexity's Search API architecture post A half-page note mapping its stages onto your Week 4 components Tue 2–3 h Build steps 1-2: search backends, then fetch A query returns cached, rate-limited, robots-respecting page fetches on disk Wed 2–3 h Build steps 3-4: extraction, then passage ranking Fetched pages become ranked, offset-accurate passages, same shape as Week 4's Thu 2–2.5 h Build step 5: synthesize and verify; read and trace SearXNG and Trafilatura An answer with every claim carrying evidence ids, and a verifier that can find one false claim Fri 1.5–2 h Run the pipeline experiments notes/week10-experiments.md: where decomposition, reranking, rounds, streaming and verification changed the outcome Sat 3–4 h Build steps 6-7: the eval set, then the response cache R01-R30 scored end to end; a cache with a measured false-hit rate, not an assumed one Sun 2–3 h Build step 8: conversation-aware query planning; read Open WebUI's rewrite path F01-F10 and a misspelled R01-R10 pass through the same pipeline as clean questions Monday — Perplexity's architecture, mapped onto what you already built. This week's pipeline already exists in miniature as Week 4's retrieval; today's job is to see it at web scale before writing new code. Read Perplexity's own account of their production stack and map every stage onto the Week 4 components you're about to extend. Read Concepts' pipeline bullet and the production-shape bullet. Read Perplexity's Search API architecture post in Read and write a half-page note mapping its stages onto your own retrieval code. Note where your plan deliberately drops scale (a 200-billion-URL index, late cross-encoder rerankers) while keeping the same pipeline shape. Tuesday — search and fetch. Today brings untrusted web text into rig for the first time this plan: a search backend, then the fetcher that turns its results into cached pages on disk. No extraction or ranking yet — just pages, fetched politely and cached. Implement Build step 1: the Search protocol over a self-hosted SearXNG instance and one commercial search API. Implement Build step 2: fetch.py — async, per-host concurrency limits, robots.txt, timeouts, a byte cap, an on-disk cache keyed by canonical URL with ETag revalidation. Confirm fetched content is stored but never executed, per Concepts' web-hygiene bullet. Wednesday — extraction and ranking. Raw HTML is not a passage. Today turns fetched pages into the same ranked, cited unit Week 4 built for your own corpus, so tomorrow's synthesis can treat web passages exactly like local ones. Implement Build step 3: Trafilatura-based extraction into 150-300 word passages that keep their heading and character offsets. Implement Build step 4: passage ranking — Week 4's BM25, embeddings and reciprocal rank fusion, then a reranker over the top 30. Spot-check offsets by hand on two or three pages — a citation pointing at the wrong characters is worse than no citation. Thursday — synthesis, verification, and how the two reference tools actually work. Today closes the loop end to end: a synthesized answer where every claim is checked against its own evidence rather than trusted from the writer. Then you read the two reference implementations whose ideas you just built smaller versions of — SearXNG's fan-out-with-a-deadline metasearch, and Trafilatura's cascading extraction. Implement Build step 5: synthesize.py (every factual sentence ends with evidence ids) and verify.py (a separate pass checks each claim against its cited passages). Read the SearXNG and Trafilatura entries in Read, and trace both paths given there. Rerun one answer through verify.py and find a case where a citation exists but doesn't actually support its claim. Friday — break the pipeline on purpose. No new pipeline code today. Run controlled variants against questions you already have, to see which of this week's design choices actually earned their complexity. Run Experiments 1, 3, 4, 5 and 6: single query against decomposed queries; with and without the reranker; one round against gap-driven iterative research; streaming early against waiting for all fetches; the verifier on against off. Record where in the trace behavior diverged, not just the aggregate numbers. Saturday — the eval set and the cache. Today builds the harness that scores this week's pipeline the way Week 5 taught you to, and the cache layer that makes running it repeatedly affordable. Implement Build step 6: R01-R30, scored by your Week 5 judge plus citation precision/recall, source quality, freshness, rounds, pages fetched, time to first token, total latency and dollars. Implement Build step 7: the response cache — exact match on normalized question plus date bucket, then a semantic cache with a similarity threshold, both with a freshness TTL. Run Experiments 2 and 7: top-5 against top-20 fetched pages, and a similarity-threshold sweep measuring false hits on paraphrases and near misses. Sunday — queries that depend on what came before. A real conversation's follow-up messages are poor search queries. Today's build makes query planning conversation-aware; you read how a production system does the same rewrite, then check the whole pipeline against conversational and misspelled inputs before the checkpoint. Implement Build step 8: plan_queries rewrites recent turns into standalone queries with structured output, falling back to the raw message on failure; add F01-F10 and a misspelled copy of R01-R10. Read the Open WebUI query-rewriting entry in Read. Run Experiment 8: raw message against rewritten queries on F01-F10 and the misspelled set — correctness, citation precision, added time to first token. Answer You should be able to answer and attempt Checkpoint. Build rig/research/search.py: a Search protocol with two backends, a self-hosted SearXNG instance (to learn how metasearch merges results) and one commercial search API (for production-like quality and clear terms of use). fetch.py: asynchronous fetching with per-host concurrency limits, robots.txt, timeouts, a byte cap, and an on-disk cache keyed by canonical URL with ETag revalidation. extract.py: Trafilatura for main content, then passages of about 150 to 300 words that keep their heading and their character offsets into the stored text. Passage ranking: reuse Week 4's BM25, embeddings and reciprocal rank fusion over passages, then a reranker over the top 30. synthesize.py and verify.py: every sentence that states a fact ends with evidence ids; a separate verifier checks each claim against its passages and flags or drops unsupported ones. Eval set R01–R30: 10 evergreen questions, 10 whose answers depend on the last 30 days, and 10 that need several sources reconciled. Metrics: correctness (your Week 5 judge), citation precision (citations that support their claim), citation recall (claims with a supporting citation), source quality, freshness, rounds, pages fetched, time to first token, total latency and dollars. A response cache in front of the pipeline: an exact match on the normalized question plus a date bucket, then a semantic cache over question embeddings with a similarity threshold. Both get a freshness TTL, short for time-sensitive questions. Measure false hits on paraphrases and near misses (same words, different year) before trusting it. Conversation-aware plan_queries: rewrite the recent turns into standalone queries with structured output (Week 9), fall back to the raw message on failure, and log both. Add F01–F10, two-turn conversations whose second turn only makes sense with the first, and a misspelled copy of R01–R10. A sketch of the core, with support checked by a separate step rather than trusted from the writer. ResearchState is the accumulator threaded through every round: it starts from just the question, add folds in each round's ranked passages, unseen filters a new batch of hits down to URLs it hasn't fetched yet, and get looks passages up by the evidence ids a claim cites: @dataclass(frozen=True)\nclass Passage:\n    id: str               # \"E12\"\n    url: str              # canonical\n    fetched_at: datetime\n    start: int            # character offsets into the stored extracted text\n    end: int\n    text: str\n\n@dataclass\nclass Claim:\n    text: str\n    evidence: list[str]           # passage ids the writer cited\n    supported: bool | None = None # set by the verifier, never by the writer\n\nasync def research(question: str, budget: Budget) -> Answer:\n    state = ResearchState(question)\n    for _ in range(budget.max_rounds):\n        queries = await plan_queries(state)                    # what is still unknown?\n        hits = await gather_all(search(q) for q in queries)    # parallel, per-call timeout\n        pages = await gather_all(fetch(h.url) for h in state.unseen(hits))\n        state.add(rank(question, passages_of(extract(p) for p in pages))[:40])\n        if budget.exhausted() or not await has_gaps(state):\n            break\n    answer = await synthesize(question, state.passages)       # claims cite passage ids\n    for claim in answer.claims:\n        claim.supported = await entails(claim.text, state.get(claim.evidence))\n    return answer Project increment rig v0.10: rig ask \"…\" streams a cited answer; every citation opens the stored passage; research mode runs with no shell or write tools. Read Perplexity's Search API architecture post on Monday: map every stage it describes onto your Week 4 components. searxng/searxng at 6671d89. Metasearch is fan-out with a deadline, then merge and score. searx/search/__init__.py: Search.search (174), search_standard (160), _get_requests (78) and search_multiple_requests (136, one thread per engine against a shared deadline). searx/search/processors/online.py: OnlineProcessor.search (245) and _send_http_request (167). One engine end to end: searx/engines/github.py (65 lines; request 25, response 33). Then searx/results.py: ResultContainer.extend (82), _merge_main_result (167, deduplication by URL), close (183), calculate_score (17) and get_ordered_results (193). SearXNG queries other engines' public result pages, so treat it as a learning tool and respect those engines' terms. adbar/trafilatura at e2f85c9. trafilatura/core.py: extract (482), bare_extraction (278), and trafilatura_sequence (169), whose docstring lays out a four-stage cascade in which each stage engages only if the previous one under-delivered: the main extractor, comparison with external extractors (_extract_and_compare, 151, and compare_extraction in external.py, 84), a baseline rescue on the uncleaned page, and a recall retry. For a production semantic cache, skim LiteLLM's litellm/caching/redis_semantic_cache.py at v1.102.0: get_cache (441), and the constructor, which refuses to run without an explicit similarity_threshold. For query rewriting, read Open WebUI at v0.11.4 (Week 14's main read): DEFAULT_QUERY_GENERATION_PROMPT_TEMPLATE in backend/open_webui/config.py (2309), generate_queries in routers/tasks.py (404), which runs on a separate task model rather than the chat model, and its caller chat_completion_files_handler in utils/middleware.py (2049). openai/openai-cookbookexamples/deep_research_api/how_to_build_a_deep_research_mcp_server/main.py (208 lines): a FastMCP server exposing search and fetch over a vector store, the minimal two-tool contract a deep-research agent expects from a private data source. Give rig's own document store the same shape. Trace these paths: SearXNG: Search.search → search_standard → _get_requests (one request per engine) → search_multiple_requests (threads, deadline) → OnlineProcessor.search → the engine's request → HTTP → the engine's response → ResultContainer.extend → _merge_main_result → close (scoring) → get_ordered_results. rig: conversation → plan_queries (rewrite into standalone queries) → parallel search → fetch (cache, robots) → extract → passages → rank → synthesize with evidence ids → verify → stream. You should be able to answer How does SearXNG merge the same URL returned by three engines, and how does that change its score? Can answer What happens to an engine that misses SearXNG's deadline, and what would you do differently under a latency budget? Can answer How does Trafilatura decide its own extraction under-delivered, and what does it try next? Can answer Why must citations be created when evidence is collected rather than requested after synthesis? Can answer Why are sub-document passages a better retrieval unit for answers than whole pages? Can answer What are the components of your time to first token, and which of them can overlap? Can answer Name three ways a fetched page can attack your agent, and the layer that stops each. Can answer What goes wrong when the raw message is the search query, and what does a rewrite cost in time to first token? Can answer Experiments One query against decomposed queries. Top 5 against top 20 search results: pages fetched against answer quality. With and without the reranker. One round against gap-driven iterative research. Streaming early against waiting for all fetches: time to first token and correctness. Verifier on and off: rate of unsupported claims that reach the user. Semantic-cache threshold sweep: hit rate against wrong-answer rate on paraphrased and near-miss questions. Raw message against rewritten queries on F01–F10 and the misspelled R01–R10: correctness, citation precision and added time to first token. Production lens Latency is the product. Set a time-to-first-token budget, track p50 and p95, and know which stage each millisecond belongs to. Cost per answer = search calls + fetches + tokens; report it next to quality. Cache at three layers: search results (short TTL), fetched pages (ETag), and passages and embeddings (content hash). Publisher relationships: robots.txt, terms of use, attribution, and never republishing whole pages. Not yet Crawling and indexing at web scale, learning-to-rank training, query autocomplete and ads. Read about them; Perplexity's post is enough for this plan. Checkpoint rig answers a current multi-source question with every factual sentence linked to a stored passage that your judge confirms supports it. On R01–R30 you report correctness, citation precision and recall, time to first token p50 and p95, and dollars per answer, with intervals. You can explain Perplexity's retrieval stack, stage by stage, in terms of your Week 4 code.", "tasks": 27}, {"id": "w11", "group": "Weeks", "title": "Week 11: deep research and multi-agent systems", "short": "Week 11", "html": "<p>A subagent is <code>run_agent()</code> called as a tool: a fresh transcript, a narrower tool set, a budget drawn from its parent's, and a short result returned to the caller. A handoff is a tool call that swaps the active system prompt and tools. Deep research is where this pays off first: questions that need dozens of searches benefit from parallel researchers with clean contexts. This week you build both and let your evals and Perplexity's search_evals decide.</p>\n<h2 id=\"w11-concepts\">Concepts</h2>\n<ul>\n<li><strong>Agent-as-tool versus handoff.</strong> With agent-as-tool the caller keeps control and receives a result. With a handoff the callee takes over the conversation, usually with filtered history.</li>\n<li><strong>The main benefit is context isolation.</strong> An exploration subagent can read 40 files or pages and return 300 words; the parent's context stays clean. The second benefit is parallelism. The cost is tokens (often several times a single agent) and information lost at the boundary.</li>\n<li><strong>Deep research</strong> is Week 10's loop run wider and longer: a planner decomposes the question, researchers run the pipeline in parallel under their own budgets, a writer synthesizes, and a reviewer with fresh context checks citations.</li>\n<li><strong>Evidence travels, not prose.</strong> Researchers return evidence ids and short findings; the writer synthesizes from the passages themselves. That defeats the telephone game.</li>\n<li><strong>Planner/executor</strong> is one model call that emits a plan, then a loop over its steps, plus a rule for replanning when a step fails. A plan kept as a file the single agent edits is often enough.</li>\n<li><strong>Orchestrator-workers</strong> fan out independent subtasks. Writers need isolation (one git worktree each) and a merge step that detects conflicts.</li>\n<li><strong>Where it helps:</strong> broad exploration, truly independent subtasks, verification with fresh eyes. <strong>Where it hurts:</strong> tightly coupled edits, long sequential reasoning, tight budgets.</li>\n<li><strong>Failure modes:</strong> detail lost in summaries, duplicated work, conflicting writes, unbounded recursion, cost blow-up, and confident errors propagated upward.</li>\n</ul>\n<h2 id=\"w11-day-by-day\">Day by day</h2>\n<p>The week moves from the smallest possible handoff (Swarm, 292 lines) to rig's own deep-research mode, with the production SDK's version of the same idea read in between.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1–1.5 h</td>\n<td>Read <code>openai/swarm</code>'s <code>core.py</code> and <code>types.py</code></td>\n<td>A half-page note on what a handoff actually changes in the next request</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2–3 h</td>\n<td>Build steps 1-2: <code>explore</code> and <code>run_tests</code> subagents</td>\n<td>Both return a bounded summary, not a transcript, with child spans in the trace</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2–3 h</td>\n<td>Build steps 3-4: hierarchical budgets, then planner/executor</td>\n<td>A child cannot overspend its parent; a failed check triggers a replan, not a crash</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2–2.5 h</td>\n<td>Build step 5: fan-out on T17; read and trace the Agents SDK handoff/as-tool path</td>\n<td>Three fixer subagents in separate worktrees, merged with <code>git apply --3way</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1.5–2 h</td>\n<td>Build step 6: the handoff toy; run experiments 3-4</td>\n<td><code>transfer_to_reviewer</code> swaps system prompt and tools; a worker merge conflict is caught, not silently resolved</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3–4 h</td>\n<td>Build step 7: <code>rig ask --deep</code></td>\n<td>Planner, three parallel researchers, a writer, and a fresh-context citation reviewer, run end to end</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>3–4 h</td>\n<td>Build step 8: the search_evals harness; run remaining experiments; checkpoint</td>\n<td>rig runs a search_evals subset end to end; one trace query shows cost for the whole tree</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w11-day-by-day-mon\">Monday — the smallest possible handoff.</h3>\n<p>Before building any of rig's multi-agent machinery, read the thing it's all a production-grade versio
