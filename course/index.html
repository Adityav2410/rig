or each, including a tool call cut off by the output limit.</li>\n<li>Explain tool calling from the token level up: what the model emits, what the inference engine does, and what the API shows you.</li>\n<li>\"The agent got slower and more expensive as the session went on.\" Explain why with token arithmetic, then give three mitigations and what each costs in cache hits, summary calls and quality.</li>\n<li>Why does a timestamp at the top of a system prompt cost money? Start from per-layer key and value tensors and end at a serving engine's block table.</li>\n<li>A serving engine is at 40% of its target throughput. What do you measure first, and what are the likely causes?</li>\n<li>When should retrieval be a tool rather than automatic context, and how would you prove the choice for a specific codebase?</li>\n<li>Design the edit tool for a coding agent. Defend exact versus fuzzy matching with failure modes you have measured.</li>\n<li>How does your research mode make every claim traceable, and how do you measure that the citations actually support the claims?</li>\n<li>Your bill doubled and quality held. Walk through how you would find out whether routing, effort, cache misses or traffic caused it, using only your traces.</li>\n<li>A tool call timed out. Did it run? Explain how you design the system so the answer does not matter, and why the model's tool-call id can't be the key.</li>\n<li>Design the permission system for a personal agent that can spend money and send email for its user. Where does policy run, what is a grant, and how do you avoid approval fatigue?</li>\n<li>What does your sandbox not protect against, and what changes once the agent reads untrusted web pages, documents and email?</li>\n<li>A user reports seeing another user's document in an answer. Which layers could have leaked it (a retrieval filter, a cache key, memory, a role that skips row-level security, an event stream), and how do your traces tell you which?</li>\n<li>How do you know a prompt change improved the agent? Describe the eval, the statistics and the confounds.</li>\n<li>When does a multi-agent design beat a single agent, and what would you measure before shipping one?</li>\n<li>The agent is waiting six hours for a human approval and you deploy a new version meanwhile. What happens, step by step, from the approval click to the next model call?</li>\n<li>Where do the milliseconds go in a voice turn, and what happens to the transcript, the model call and any tool calls when the user interrupts?</li>\n</ol>\n", "toc": [], "text": "Answer each aloud, with numbers from your own rig runs where they apply. If an answer needs a framework's name to make sense, it is not finished. Walk through one turn at the wire level: the bytes sent, every stop reason that can come back, and what the loop does for each, including a tool call cut off by the output limit. Explain tool calling from the token level up: what the model emits, what the inference engine does, and what the API shows you. \"The agent got slower and more expensive as the session went on.\" Explain why with token arithmetic, then give three mitigations and what each costs in cache hits, summary calls and quality. Why does a timestamp at the top of a system prompt cost money? Start from per-layer key and value tensors and end at a serving engine's block table. A serving engine is at 40% of its target throughput. What do you measure first, and what are the likely causes? When should retrieval be a tool rather than automatic context, and how would you prove the choice for a specific codebase? Design the edit tool for a coding agent. Defend exact versus fuzzy matching with failure modes you have measured. How does your research mode make every claim traceable, and how do you measure that the citations actually support the claims? Your bill doubled and quality held. Walk through how you would find out whether routing, effort, cache misses or traffic caused it, using only your traces. A tool call timed out. Did it run? Explain how you design the system so the answer does not matter, and why the model's tool-call id can't be the key. Design the permission system for a personal agent that can spend money and send email for its user. Where does policy run, what is a grant, and how do you avoid approval fatigue? What does your sandbox not protect against, and what changes once the agent reads untrusted web pages, documents and email? A user reports seeing another user's document in an answer. Which layers could have leaked it (a retrieval filter, a cache key, memory, a role that skips row-level security, an event stream), and how do your traces tell you which? How do you know a prompt change improved the agent? Describe the eval, the statistics and the confounds. When does a multi-agent design beat a single agent, and what would you measure before shipping one? The agent is waiting six hours for a human approval and you deploy a new version meanwhile. What happens, step by step, from the approval click to the next model call? Where do the milliseconds go in a voice turn, and what happens to the transcript, the model call and any tool calls when the user interrupts?", "tasks": 0}, {"id": "app-d", "group": "Appendices", "title": "Appendix D: misconceptions and hype traps", "short": "Appendix D: misconceptions and hype traps", "html": "<p>Each trap below is something you will have disproved, or at least measured, in rig by Week 18.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Trap</th>\n<th>What is actually true</th>\n<th>Where rig shows it</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>\"You need a framework to build an agent.\"</td>\n<td>The loop is about 40 lines. Frameworks earn their keep in runtime, durability and observability, not in the loop.</td>\n<td>Week 1 <code>loop.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>\"Tool calling is an API feature.\"</td>\n<td>It is special tokens the model was trained to emit and an engine that intercepts them. A model uses badly a tool it was never trained on.</td>\n<td>Week 6 <code>Engine.generate</code></td>\n</tr>\n<tr class=\"odd\">\n<td>\"More tools make a more capable agent.\"</td>\n<td>Every schema costs tokens on every request and adds selection errors. One shell plus a few well-shaped tools is a strong baseline.</td>\n<td>Week 1 bash-only experiment; Week 9 tool-count experiment</td>\n</tr>\n<tr class=\"even\">\n<td>\"Bigger context windows end context engineering.\"</td>\n<td>Cost scales with tokens per request times steps, distractors hurt quality, and caching constrains layout.</td>\n<td>Week 3 peak-token and cache metrics</td>\n</tr>\n<tr class=\"odd\">\n<td>\"RAG means a vector database.\"</td>\n<td>Retrieval is ranking. BM25 and the agent's own grep are strong baselines, especially for code.</td>\n<td>Week 4 recall table</td>\n</tr>\n<tr class=\"even\">\n<td>\"A citation means the claim is supported.\"</td>\n<td>Presence is not support. Each claim has to be checked against its passage.</td>\n<td>Week 10 citation precision</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Memory is a product you buy.\"</td>\n<td>It is prompt assembly with persistence. The hard parts are what to write, when to load it, and what to redact.</td>\n<td>Week 13 memory evals</td>\n</tr>\n<tr class=\"even\">\n<td>\"Multi-agent is the next level of capability.\"</td>\n<td>It mainly buys context isolation and parallelism at a multiple of the token cost, and many tasks get worse.</td>\n<td>Week 11 pass-rate-versus-cost plot</td>\n</tr>\n<tr class=\"odd\">\n<td>\"MCP makes tools safe.\"</td>\n<td>It standardizes discovery and invocation. Trust, scoping and injection are still yours. A server is untrusted code with untrusted output.</td>\n<td>Week 9 red-team suite</td>\n</tr>\n<tr class=\"even\">\n<td>\"Prompt injection is fixed with better prompts.\"</td>\n<td>The defense is capability restriction: sandboxing, a policy service outside the agent, egress control, and keeping untrusted content away from privileged actions.</td>\n<td>Weeks 9 and 16</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Navigation is read-only.\"</td>\n<td>A GET can carry a secret to an attacker, and links can confirm, unsubscribe or log in.</td>\n<td>Week 16 gate and the Comet replay</td>\n</tr>\n<tr class=\"even\">\n<td>\"The biggest model at maximum effort is the safe default.\"</td>\n<td>It is the expensive default. Most agent steps pass on a smaller model or lower effort; the safe default is the cheapest setting your evals approve per role, with escalation.</td>\n<td>Week 8 effort and model sweeps</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Caching is free money.\"</td>\n<td>Writes cost more than plain input, entries expire, and a model or effort switch can throw them away. The TTL and breakpoints are choices to measure.</td>\n<td>Week 3 TTL bet; Week 8 switch cost</td>\n</tr>\n<tr class=\"even\">\n<td>\"You need a dedicated vector database.\"</td>\n<td>Postgres with pgvector keeps vectors beside the rows they belong to, with transactions, filters and row-level security. A dedicated engine earns its place at a scale, or for a feature, you have measured you need.</td>\n<td>Week 4 pgvector comparison; Week 14 filtered recall</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Filtering by user id in the app is enough.\"</td>\n<td>One forgotten clause, cache key or background job leaks data. Enforce isolation in the database and prove it with planted secrets.</td>\n<td>Week 14 isolation suite</td>\n</tr>\n<tr class=\"even\">\n<td>\"It worked in the demo.\"</td>\n<td>Run-to-run variance is large. Report pass^k and intervals, never a single run.</td>\n<td>Week 5 noise-floor experiment</td>\n</tr>\n<tr class=\"odd\">\n<td>\"An LLM judge is objective.\"</td>\n<td>It is an unvalidated classifier until measured against labels, and the transcript it grades can inject it.</td>\n<td>Week 5 judge calibration</td>\n</tr>\n<tr class=\"even\">\n<td>\"Temperature zero makes runs reproducible.\"</td>\n<td>It does not guarantee identical outputs. Reproducibility comes from recording outputs.</td>\n<td><code>messages.json</code> and saved diffs</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Retries are free.\"</td>\n<td>Retrying a tool repeats its side effects; retrying a model call costs money and changes the output.</td>\n<td>Week 1 retry policy; Week 15 ledger</td>\n</tr>\n<tr class=\"even\">\n<td>\"Durable execution means exactly-once.\"</td>\n<td>It means recorded replay. Side effects still need idempotency or reconciliation, keyed on something the model cannot change.</td>\n<td>Week 15 crash fuzzer</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Voice is chat with speech bolted on.\"</td>\n<td>It is a real-time system; end-of-turn detection, barge-in and a millisecond budget decide the experience.</td>\n<td>Week 17 latency breakdown</td>\n</tr>\n<tr class=\"even\">\n<td>\"Benchmark scores transfer to my product.\"</td>\n<td>A score measures one model in one harness on specific tasks. Your eval set on your data is the number that matters.</td>\n<td>Weeks 1 to 18 eval suites</td>\n</tr>\n<tr class=\"odd\">\n<td>\"Agents are autonomous.\"</td>\n<td>Production agents are bounded loops inside workflows, with budgets, permissions and humans at the irreversible steps.</td>\n<td>rig v1.0</td>\n</tr>\n</tbody>\n</table></div>\n", "toc": [], "text": "Each trap below is something you will have disproved, or at least measured, in rig by Week 18. Trap What is actually true Where rig shows it \"You need a framework to build an agent.\" The loop is about 40 lines. Frameworks earn their keep in runtime, durability and observability, not in the loop. Week 1 loop.py \"Tool calling is an API feature.\" It is special tokens the model was trained to emit and an engine that intercepts them. A model uses badly a tool it was never trained on. Week 6 Engine.generate \"More tools make a more capable agent.\" Every schema costs tokens on every request and adds selection errors. One shell plus a few well-shaped tools is a strong baseline. Week 1 bash-only experiment; Week 9 tool-count experiment \"Bigger context windows end context engineering.\" Cost scales with tokens per request times steps, distractors hurt quality, and caching constrains layout. Week 3 peak-token and cache metrics \"RAG means a vector database.\" Retrieval is ranking. BM25 and the agent's own grep are strong baselines, especially for code. Week 4 recall table \"A citation means the claim is supported.\" Presence is not support. Each claim has to be checked against its passage. Week 10 citation precision \"Memory is a product you buy.\" It is prompt assembly with persistence. The hard parts are what to write, when to load it, and what to redact. Week 13 memory evals \"Multi-agent is the next level of capability.\" It mainly buys context isolation and parallelism at a multiple of the token cost, and many tasks get worse. Week 11 pass-rate-versus-cost plot \"MCP makes tools safe.\" It standardizes discovery and invocation. Trust, scoping and injection are still yours. A server is untrusted code with untrusted output. Week 9 red-team suite \"Prompt injection is fixed with better prompts.\" The defense is capability restriction: sandboxing, a policy service outside the agent, egress control, and keeping untrusted content away from privileged actions. Weeks 9 and 16 \"Navigation is read-only.\" A GET can carry a secret to an attacker, and links can confirm, unsubscribe or log in. Week 16 gate and the Comet replay \"The biggest model at maximum effort is the safe default.\" It is the expensive default. Most agent steps pass on a smaller model or lower effort; the safe default is the cheapest setting your evals approve per role, with escalation. Week 8 effort and model sweeps \"Caching is free money.\" Writes cost more than plain input, entries expire, and a model or effort switch can throw them away. The TTL and breakpoints are choices to measure. Week 3 TTL bet; Week 8 switch cost \"You need a dedicated vector database.\" Postgres with pgvector keeps vectors beside the rows they belong to, with transactions, filters and row-level security. A dedicated engine earns its place at a scale, or for a feature, you have measured you need. Week 4 pgvector comparison; Week 14 filtered recall \"Filtering by user id in the app is enough.\" One forgotten clause, cache key or background job leaks data. Enforce isolation in the database and prove it with planted secrets. Week 14 isolation suite \"It worked in the demo.\" Run-to-run variance is large. Report pass^k and intervals, never a single run. Week 5 noise-floor experiment \"An LLM judge is objective.\" It is an unvalidated classifier until measured against labels, and the transcript it grades can inject it. Week 5 judge calibration \"Temperature zero makes runs reproducible.\" It does not guarantee identical outputs. Reproducibility comes from recording outputs. messages.json and saved diffs \"Retries are free.\" Retrying a tool repeats its side effects; retrying a model call costs money and changes the output. Week 1 retry policy; Week 15 ledger \"Durable execution means exactly-once.\" It means recorded replay. Side effects still need idempotency or reconciliation, keyed on something the model cannot change. Week 15 crash fuzzer \"Voice is chat with speech bolted on.\" It is a real-time system; end-of-turn detection, barge-in and a millisecond budget decide the experience. Week 17 latency breakdown \"Benchmark scores transfer to my product.\" A score measures one model in one harness on specific tasks. Your eval set on your data is the number that matters. Weeks 1 to 18 eval suites \"Agents are autonomous.\" Production agents are bounded loops inside workflows, with budgets, permissions and humans at the irreversible steps. rig v1.0", "tasks": 0}, {"id": "app-e", "group": "Appendices", "title": "Appendix E: staying current and showing the work", "short": "Appendix E: staying current and showing the work", "html": "<p>Reading code makes you deep, but it doesn't keep you current and it doesn't show anyone what you know. Spend about an hour a week on each.</p>\n<p><strong>The frontier log.</strong> Read primary sources only: model and system cards, protocol changelogs, engineering posts from labs and product teams, and papers that ship code. For each item, write three lines in <code>notes/frontier.md</code>: what changed, which primitive in Appendix B it reduces to, and whether it changes anything in rig. An item you can't reduce to a primitive is the one to read in depth. Some examples, already reduced:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>What changed</th>\n<th>Reduces to</th>\n<th>Where it lands</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>MCP's <code>2026-07-28</code> revision dropped the <code>initialize</code> handshake and session ids; each request is self-contained</td>\n<td>Stateless RPC over HTTP</td>\n<td>Week 9</td>\n</tr>\n<tr class=\"even\">\n<td>OpenTelemetry's GenAI conventions moved to their own repository, with agent, workflow, plan and tool spans</td>\n<td>A trace schema</td>\n<td>Week 5</td>\n</tr>\n<tr class=\"odd\">\n<td>Meta launched Muse in September 2026: a private VM per user with a visible browser, and Sentinel deciding allow, block or ask for each action</td>\n<td>Workspace, policy service, grants</td>\n<td>Weeks 9, 12 and 16</td>\n</tr>\n<tr class=\"even\">\n<td>Perplexity open-sourced search_evals, scoring deep-research systems on BrowseComp, DeepSearchQA, HLE and WideSearch</td>\n<td>An eval harness</td>\n<td>Week 11</td>\n</tr>\n<tr class=\"odd\">\n<td>Effort became a first-class request parameter (Anthropic <code>output_config.effort</code>, OpenAI <code>reasoning.effort</code>), with mid-conversation changes that keep the cache</td>\n<td>A request parameter that scales output tokens</td>\n<td>Week 8</td>\n</tr>\n<tr class=\"even\">\n<td>nanochat trains a GPT-2-level model in about two hours on one 8×H100 node</td>\n<td>The whole model pipeline</td>\n<td>Week 6</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>What 2026's launches point to.</strong> This is my reading of what shipped, not a forecast. Agents are becoming long-running background workers with their own machines (Muse's per-user VM). Policy is moving out of the agent into separate services with scoped grants, because approval fatigue is real. Agents are starting to act in email and commerce, which makes idempotency and spending limits product requirements. Voice and wearables add a hard latency budget. Model choice and reasoning effort are moving from settings people pick to decisions made per call. Protocols are going stateless so they can scale. And agentic skill is increasingly trained in environments that look exactly like your eval harness. Weeks 7, 8, 9, 12, 15, 16 and 17 exist because of these trends.</p>\n<p><strong>Proof of work.</strong></p>\n<ul>\n<li>Keep rig in a public repository from Week 1, with its eval sets (minus anything you can't redistribute).</li>\n<li>Publish a write-up after Weeks 5, 7, 13 and 18, each built around one measured result. For example: \"BM25 against grep on a real codebase\" (Week 4), \"What a KV cache saves, measured\" (Weeks 6 and 7), \"A tool ledger that survives 50 <code>kill -9</code>s\" (Week 15), \"Replaying the Comet attack against my own agent\" (Week 16).</li>\n<li>Contribute upstream to what you read: a rig harness for search_evals, fixes or docs in pi, mini-swe-agent or pipecat, an environment for verifiers.</li>\n<li>For a company rather than a job: the three graduation projects copy incumbents, and a copy is not a company. A company needs a specific user, a workflow they repeat, and data or distribution others lack. Use the specialty you picked in Week 9 to find one, and talk to ten prospective users before Week 18.</li>\n</ul>\n", "toc": [], "text": "Reading code makes you deep, but it doesn't keep you current and it doesn't show anyone what you know. Spend about an hour a week on each. The frontier log. Read primary sources only: model and system cards, protocol changelogs, engineering posts from labs and product teams, and papers that ship code. For each item, write three lines in notes/frontier.md: what changed, which primitive in Appendix B it reduces to, and whether it changes anything in rig. An item you can't reduce to a primitive is the one to read in depth. Some examples, already reduced: What changed Reduces to Where it lands MCP's 2026-07-28 revision dropped the initialize handshake and session ids; each request is self-contained Stateless RPC over HTTP Week 9 OpenTelemetry's GenAI conventions moved to their own repository, with agent, workflow, plan and tool spans A trace schema Week 5 Meta launched Muse in September 2026: a private VM per user with a visible browser, and Sentinel deciding allow, block or ask for each action Workspace, policy service, grants Weeks 9, 12 and 16 Perplexity open-sourced search_evals, scoring deep-research systems on BrowseComp, DeepSearchQA, HLE and WideSearch An eval harness Week 11 Effort became a first-class request parameter (Anthropic output_config.effort, OpenAI reasoning.effort), with mid-conversation changes that keep the cache A request parameter that scales output tokens Week 8 nanochat trains a GPT-2-level model in about two hours on one 8×H100 node The whole model pipeline Week 6 What 2026's launches point to. This is my reading of what shipped, not a forecast. Agents are becoming long-running background workers with their own machines (Muse's per-user VM). Policy is moving out of the agent into separate services with scoped grants, because approval fatigue is real. Agents are starting to act in email and commerce, which makes idempotency and spending limits product requirements. Voice and wearables add a hard latency budget. Model choice and reasoning effort are moving from settings people pick to decisions made per call. Protocols are going stateless so they can scale. And agentic skill is increasingly trained in environments that look exactly like your eval harness. Weeks 7, 8, 9, 12, 15, 16 and 17 exist because of these trends. Proof of work. Keep rig in a public repository from Week 1, with its eval sets (minus anything you can't redistribute). Publish a write-up after Weeks 5, 7, 13 and 18, each built around one measured result. For example: \"BM25 against grep on a real codebase\" (Week 4), \"What a KV cache saves, measured\" (Weeks 6 and 7), \"A tool ledger that survives 50 kill -9s\" (Week 15), \"Replaying the Comet attack against my own agent\" (Week 16). Contribute upstream to what you read: a rig harness for search_evals, fixes or docs in pi, mini-swe-agent or pipecat, an environment for verifiers. For a company rather than a job: the three graduation projects copy incumbents, and a copy is not a company. A company needs a specific user, a workflow they repeat, and data or distribution others lack. Use the specialty you picked in Week 9 to find one, and talk to ten prospective users before Week 18.", "tasks": 0}], "meta": {"w1": {"n": 1, "focus": "The single-agent loop", "code": "mini-swe-agent", "phase": "The machine"}, "w2": {"n": 2, "focus": "The coding-agent harness", "code": "pi, Aider's edit blocks", "phase": "The machine"}, "w3": {"n": 3, "focus": "Context, compaction, memory and caching", "code": "pi compaction, SGLang radix cache", "phase": "The machine"}, "w4": {"n": 4, "focus": "Retrieval", "code": "rank_bm25, hnswlib, pgvector, Aider repo map", "phase": "The machine"}, "w5": {"n": 5, "focus": "Tracing, evals and trajectory evaluation", "code": "SWE-bench, inspect_ai, OTel GenAI", "phase": "The machine"}, "w6": {"n": 6, "focus": "The model, from tokenizer to KV cache", "code": "nanochat", "phase": "The model"}, "w7": {"n": 7, "focus": "Serving and post-training", "code": "nano-vllm, nanochat RL, verifiers", "phase": "The model"}, "w8": {"n": 8, "focus": "Model routing, reasoning effort and cost", "code": "pi virtual models, RouteLLM, LiteLLM router", "phase": "The model"}, "w9": {"n": 9, "focus": "Tools, MCP, sandboxing and policy", "code": "pi MCP client, MCP SDK, sandbox-runtime", "phase": "The assistant"}, "w10": {"n": 10, "focus": "A mini-Perplexity", "code": "SearXNG, Trafilatura, cookbook search server", "phase": "The assistant"}, "w11": {"n": 11, "focus": "Deep research and multi-agent systems", "code": "Swarm, Agents SDK, search_evals", "phase": "The assistant"}, "w12": {"n": 12, "focus": "A Claude-style workbench", "code": "OpenHands Software Agent SDK, docling-core", "phase": "The assistant"}, "w13": {"n": 13, "focus": "Memory, personalization and connectors", "code": "Letta Code, Codex memory", "phase": "The assistant"}, "w14": {"n": 14, "focus": "A multi-user service", "code": "Open WebUI, pgvector filtering, procrastinate", "phase": "The assistant"}, "w15": {"n": 15, "focus": "Durable workflows, scheduling and approvals", "code": "DBOS, LangGraph, OpenHands automation", "phase": "Autonomy"}, "w16": {"n": 16, "focus": "Browser and computer use", "code": "browser-use", "phase": "Autonomy"}, "w17": {"n": 17, "focus": "Voice and realtime", "code": "pipecat", "phase": "Autonomy"}, "w18": {"n": 18, "focus": "Production architecture and graduation", "code": "Your own traces", "phase": "Autonomy"}}, "phases": [["The machine", 1, 5], ["The model", 6, 8], ["The assistant", 9, 14], ["Autonomy", 15, 18]]};
const pages = DATA.pages, byId = Object.fromEntries(pages.map(p => [p.id, p]));
const order = ['home', ...pages.map(p => p.id)];
const LS = 'rig-plan-progress-v1';
let state = { done: {}, notes: {}, last: null, version: 3 };
// v1 had 16 weeks; v2 inserted Week 8 (routing), so v1 weeks 8-16 moved up by one.
// v3 inserted Week 14 (multi-user service), so v2 weeks 14-17 move up by one; new build steps
// were also inserted in Week 5 (step 6) and the last week (steps 3 and 4), so later steps shift.
function migrate(s){
  if (!s || s.version === 3) return s;
  const remap = (s, f) => {
    const done = {}, notes = {};
    for (const k in (s.done || {})) done[f(k)] = s.done[k];
    for (const k in (s.notes || {})) notes[f(k)] = s.notes[k];
    return { done, notes, last: s.last ? f(s.last) : null };
  };
  if (s.version !== 2) s = remap(s, k => k.replace(/^w(\d+)(?=\.|$)/, (m, n) => 'w' + (+n >= 8 ? +n + 1 : +n)));
  s = remap(s, k => {
    const m = k.match(/^w(\d+)(.*)$/); if (!m) return k;
    const n = +m[1] >= 14 ? +m[1] + 1 : +m[1];
    let rest = m[2];
    const b = rest.match(/^\.build\.(\d+)$/);
    if (b) { let i = +b[1]; if (n === 5 && i >= 6) i += 1; if (n === 18 && i >= 3) i += 2; rest = '.build.' + i; }
    return 'w' + n + rest;
  });
  s.version = 3; return s;
}
let remote = null, saveTimer = null;

function loadLocal(){ try{ const s = migrate(JSON.parse(localStorage.getItem(LS) || 'null')); if (s) state = Object.assign(state, s); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function scheduleSave(){
  saveLocal(); clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (localApi){ try{ const r = await fetch('api/progress', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)}); if (!r.ok) throw 0; setSave('Progress is saved to progress.json on your computer.'); }catch(e){ setSave('Could not reach the local server; kept in this browser.'); } return; }
    if (!remote) return;
    try{ await remote.set({ done: state.done, notes: state.notes, last: state.last, version: 3, updatedAt: Date.now() }); setSave('Progress is saved to your account.'); }
    catch(e){ setSave('Could not save to your account; kept in this browser.'); }
  }, 700);
}
function setSave(t){ document.getElementById('save-state').textContent = t; }
let localApi = false;
async function connectLocal(){
  if (!/^https?:$/.test(location.protocol)) return false;
  try{
    const r = await fetch('api/progress', {cache:'no-store'});
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return false;
    const s = migrate(await r.json()); localApi = true;
    if (s && s.done){ state.done = Object.assign({}, state.done, s.done); state.notes = Object.assign({}, state.notes, s.notes || {}); state.last = s.last || state.last; }
    setSave('Progress is saved to progress.json on your computer.');
    saveLocal(); refreshProgress(); route(); return true;
  }catch(e){ return false; }
}
async function connectStore(){
  if (await connectLocal()) return;
  if (!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    remote = db.doc('data/users/' + id + '/progress');
    const snap = await remote.get();
    if (snap.exists){
      const r = migrate(snap.data() || {}) || {};
      state.done = Object.assign({}, state.done, r.done || {});
      for (const k in (r.notes || {})) if (r.notes[k] && !state.notes[k]) state.notes[k] = r.notes[k];
      state.last = r.last || state.last;
      for (const k in state.done) if (r.done && k in r.done) state.done[k] = r.done[k];
    }
    setSave('Progress is saved to your account.');
    saveLocal(); refreshProgress(); route();
  }catch(e){ /* stay on browser storage */ }
}

function pageTasks(id){ const p = byId[id]; if (!p) return [0,0]; const ids = [...p.html.matchAll(/data-id="([^"]+)"/g)].map(m => m[1]); const u = [...new Set(ids)]; return [u.filter(k => state.done[k]).length, u.length]; }
function status(id){ const [d,t] = pageTasks(id); return !t ? '' : d === t ? 'done' : d ? 'prog' : ''; }
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildNav(){
  const nav = document.getElementById('nav'); let h = '';
  h += `<div class="grp">Start here</div>`;
  h += item('home','·','Plan at a glance');
  ['path','primitives','rig'].forEach((id,i) => h += item(id, String(i+1).padStart(2,'0'), byId[id].short));
  for (const [name,a,b] of DATA.phases){
    h += `<div class="grp">${name}<em>Weeks ${a}–${b}</em></div>`;
    for (let n=a;n<=b;n++) h += item('w'+n, 'W'+String(n).padStart(2,'0'), DATA.meta['w'+n].focus);
  }
  h += `<div class="grp">Appendices</div>`;
  pages.filter(p => p.group === 'Appendices').forEach(p => h += item(p.id, p.id.slice(-1).toUpperCase(), p.short.split(': ')[1]));
  nav.innerHTML = h;
  nav.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
}
function item(id, num, label){ return `<button class="nav-item" type="button" data-go="${id}"><span class="num">${num}</span><span>${esc(label)}</span><span class="dot" data-dot="${id}"></span></button>`; }

function refreshProgress(){
  let D=0,T=0;
  for (const p of pages){ const [d,t] = pageTasks(p.id); D+=d; T+=t; }
  document.getElementById('ov-label').textContent = `${D} of ${T} items done`;
  document.getElementById('ov-bar').style.width = (T ? 100*D/T : 0) + '%';
  document.querySelectorAll('[data-dot]').forEach(el => { const s = status(el.dataset.dot); el.className = 'dot' + (s ? ' '+s : ''); });
  document.querySelectorAll('[data-pbar]').forEach(el => { const [d,t] = pageTasks(el.dataset.pbar); el.style.width = (t ? 100*d/t : 0) + '%'; });
  document.querySelectorAll('[data-pcount]').forEach(el => { const [d,t] = pageTasks(el.dataset.pcount); el.textContent = `${d}/${t}`; });
  document.querySelectorAll('[data-pchip]').forEach(el => { const s = status(el.dataset.pchip); el.className = 'chip ' + (s==='done'?'s-done':s==='prog'?'s-prog':''); el.textContent = s==='done'?'Complete':s==='prog'?'In progress':'Not started'; });
  const ovh = document.getElementById('home-ov'); if (ovh){ ovh.querySelector('strong').textContent = `${D} / ${T}`; ovh.querySelector('i').style.width = (T?100*D/T:0)+'%'; }
}

function go(id){ if (location.hash.slice(1) !== id) location.hash = id; else route(); document.getElementById('app').classList.remove('open'); }
function nextWeek(){ for (let n=1;n<=18;n++) if (status('w'+n) !== 'done') return 'w'+n; return 'w18'; }

function renderHome(){
  const main = document.getElementById('main');
  const cont = state.last && byId[state.last] ? state.last : nextWeek();
  const roadmap = DATA.phases.map(([name,a,b]) => {
    let ticks = '';
    for (let n=a;n<=b;n++) ticks += `<button class="rm-tick" type="button" data-go="w${n}" title="Week ${n}: ${esc(DATA.meta['w'+n].focus)}"><span class="dot" data-dot="w${n}"></span></button>`;
    return `<div class="rm-phase" style="flex:${b-a+1} 1 0"><div class="rm-ticks">${ticks}</div><div class="rm-label">${esc(name)}<span>weeks ${a}–${b}</span></div></div>`;
  }).join('');
  let h = `<div class="page"><article>
  <div class="crumb">study-plan · rev 2026-10</div>
  <h1>Agents from First Principles</h1>
  <p class="lede">Eighteen weeks, one evolving project. Each week: learn the primitive, build it in rig, read one small real implementation line by line, trace it, change it, measure it. Tick off build steps, experiments, checkpoint items and the questions you can answer as you go.</p>
  <div class="roadmap" aria-label="18-week roadmap"><div class="roadmap-row">${roadmap}</div></div>
  <div class="overall" id="home-ov"><span>Overall</span><div class="bar"><i></i></div><strong>0 / 0</strong><button class="btn" type="button" data-go="${cont}">${cont.startsWith('w') ? 'Continue: Week ' + cont.slice(1) : 'Continue: ' + esc(byId[cont].short)}</button></div>
  <div class="phase"><h2>Start here</h2><span>read once before Week 1</span></div>
  <div class="starters">${['path','primitives','rig'].map(id => `<button class="card" type="button" data-go="${id}"><span class="wk"><span>${id==='path'?'Why this order':id==='primitives'?'Vocabulary':'The project'}</span></span><b>${esc(byId[id].title)}</b></button>`).join('')}</div>`;
  for (const [name,a,b] of DATA.phases){
    h += `<div class="phase"><h2>${name}</h2><span>weeks ${a}–${b}</span></div><div class="cards">`;
    for (let n=a;n<=b;n++){ const m = DATA.meta['w'+n];
      h += `<button class="card" type="button" data-go="w${n}"><span class="wk"><span>week ${String(n).padStart(2,'0')}</span><span data-pcount="w${n}"></span></span><b>${esc(m.focus)}</b><small>Reads: ${esc(m.code)}</small><div class="bar"><i data-pbar="w${n}"></i></div></button>`; }
    h += `</div>`;
  }
  h += `<div class="phase"><h2>Appendices</h2><span>reference</span></div><div class="starters">${pages.filter(p=>p.group==='Appendices').map(p=>`<button class="card" type="button" data-go="${p.id}"><span class="wk"><span>appendix ${p.id.slice(-1).toLowerCase()}</span></span><b>${esc(p.title.split(': ')[1])}</b></button>`).join('')}</div>`;
  h += `</article><aside class="outline"></aside></div>`;
  main.innerHTML = h;
  main.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

function renderPage(id){
  const p = byId[id], main = document.getElementById('main');
  const m = DATA.meta[id], idx = order.indexOf(id);
  const prev = order[idx-1], next = order[idx+1];
  const label = x => x==='home' ? 'Plan at a glance' : x.startsWith('w') ? 'Week ' + x.slice(1) + ': ' + DATA.meta[x].focus : byId[x].short;
  const [d,t] = pageTasks(id);
  let crumb = m ? `${m.phase.toLowerCase()} / week ${m.n} of 18` : p.group.toLowerCase();
  let title = m ? p.title.replace(/^Week \d+: /,'') : p.title.replace(/^Appendix [A-E]: /,'');
  title = title.charAt(0).toUpperCase() + title.slice(1);
  let h = `<div class="page"><article><div class="crumb">${esc(crumb)}${!m && p.group==='Appendices' ? ' / ' + p.id.slice(-1).toLowerCase() : ''}</div><h1>${esc(title)}</h1>`;
  if (m) h += `<div class="chips"><span class="chip" data-pchip="${id}"></span><span class="chip">Reads: ${esc(m.code)}</span></div>`;
  if (t) h += `<div class="pagebar"><span data-pcount="${id}"></span><span>items</span><div class="bar"><i data-pbar="${id}"></i></div></div>`;
  h += p.html;
  if (m) h += `<div class="notes"><label for="notes-${id}">Your notes for Week ${m.n}</label><textarea id="notes-${id}" placeholder="What surprised you, numbers from your runs, questions to chase…"></textarea><small>Saved as you type.</small></div>`;
  h += `<div class="pager">${prev ? `<button type="button" data-go="${prev}"><small>Previous</small>${esc(label(prev))}</button>` : '<span></span>'}${next ? `<button class="next" type="button" data-go="${next}"><small>Next</small>${esc(label(next))}</button>` : ''}</div>`;
  const tocLink = (hid, txt, sub) => `<a href="#${id}" data-to="${hid}"${sub ? ' class="sub"' : ''}>${esc(txt)}</a>`;
  const tocHtml = p.toc.map(([hid, txt, subs]) => tocLink(hid, txt, false) + (subs || []).map(([shid, stxt]) => tocLink(shid, stxt, true)).join('')).join('');
  h += `</article><aside class="outline" aria-label="On this page">${p.toc.length ? '<p>On this page</p>' + tocHtml : ''}</aside></div>`;
  main.innerHTML = h;
  // tasks
  main.querySelectorAll('li.task').forEach(li => {
    const cb = li.querySelector('input'); cb.checked = !!state.done[li.dataset.id]; li.classList.toggle('checked', cb.checked);
    cb.addEventListener('change', () => { if (cb.checked) state.done[li.dataset.id] = true; else delete state.done[li.dataset.id]; li.classList.toggle('checked', cb.checked); refreshProgress(); scheduleSave(); });
  });
  const ta = main.querySelector('textarea');
  if (ta){ ta.value = state.notes[id] || ''; ta.addEventListener('input', () => { state.notes[id] = ta.value; scheduleSave(); }); }
  main.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  main.querySelectorAll('[data-to]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.to)?.scrollIntoView({behavior:'smooth', block:'start'}); }));
  // code: highlight + copy
  main.querySelectorAll('.code-wrap').forEach(w => {
    const code = w.querySelector('code'); if (window.hljs && code && /language-/.test(code.className)) { try{ hljs.highlightElement(code); }catch(e){} }
    const b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.addEventListener('click', async () => { try{ await navigator.clipboard.writeText(code.innerText); b.textContent = 'Copied'; }catch(e){ const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected'; } setTimeout(() => b.textContent = 'Copy', 1500); });
    w.appendChild(b);
  });
  // glossary filter
  if (id === 'app-b'){
    const tw = main.querySelector('.table-wrap');
    if (tw){ const inp = document.createElement('input'); inp.className = 'filter'; inp.id = 'gloss-filter'; inp.type = 'search'; inp.placeholder = 'Filter terms, e.g. cache, MCP, memory'; inp.setAttribute('aria-label','Filter glossary');
      tw.before(inp); inp.addEventListener('input', () => { const q = inp.value.toLowerCase(); tw.querySelectorAll('tbody tr').forEach(r => r.hidden = q && !r.textContent.toLowerCase().includes(q)); }); }
  }
  // outline tracking
  const links = [...main.querySelectorAll('.outline a')];
  if (links.length && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting){ links.forEach(l => l.classList.toggle('on', l.dataset.to === e.target.id)); } }); }, { rootMargin: '0px 0px -70% 0px' });
    p.toc.forEach(([hid,,subs]) => { const el = document.getElementById(hid); if (el) io.observe(el); (subs || []).forEach(([shid]) => { const se = document.getElementById(shid); if (se) io.observe(se); }); });
  }
}

function route(){
  let id = location.hash.slice(1); if (!byId[id] && id !== 'home') id = 'home';
  if (id === 'home') renderHome(); else { renderPage(id); if (id !== state.last){ state.last = id; scheduleSave(); } }
  document.querySelectorAll('.nav-item').forEach(b => { if (b.dataset.go === id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.getElementById('top-title').textContent = id === 'home' ? 'Plan at a glance' : (DATA.meta[id] ? 'Week ' + DATA.meta[id].n + ' · ' + DATA.meta[id].focus : byId[id].short);
  refreshProgress();
  if (!pendingFind) window.scrollTo(0,0);
  else { findInMain(pendingFind); pendingFind = null; }
}

// search
let pendingFind = null;
function findInMain(q){
  const walker = document.createTreeWalker(document.querySelector('#main article'), NodeFilter.SHOW_TEXT);
  const ql = q.toLowerCase(); let n;
  while ((n = walker.nextNode())) if (n.nodeValue.toLowerCase().includes(ql)){ const el = n.parentElement.closest('li,p,td,pre,h2,h3') || n.parentElement; el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); return; }
}
const qi = document.getElementById('q'), res = document.getElementById('results');
qi.addEventListener('input', () => {
  const q = qi.value.trim(); if (q.length < 2){ res.hidden = true; return; }
  const ql = q.toLowerCase(), out = [];
  for (const p of pages){ const i = p.text.toLowerCase().indexOf(ql); if (i < 0) continue;
    const s = Math.max(0, i-50), snip = p.text.slice(s, i+q.length+70);
    const k = snip.toLowerCase().indexOf(ql);
    out.push(`<button type="button" data-id="${p.id}"><b>${esc(p.id.startsWith('w') ? 'Week ' + p.id.slice(1) + ': ' + DATA.meta[p.id].focus : p.title)}</b><small>${s?'…':''}${esc(snip.slice(0,k))}<mark>${esc(snip.slice(k,k+q.length))}</mark>${esc(snip.slice(k+q.length))}…</small></button>`);
  }
  res.innerHTML = out.length ? out.join('') : '<button type="button" disabled><small>No matches</small></button>'; res.hidden = false;
});
res.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (!b) return; pendingFind = qi.value.trim(); res.hidden = true; go(b.dataset.id); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
qi.addEventListener('keydown', e => { if (e.key === 'Escape'){ res.hidden = true; qi.blur(); } if (e.key === 'Enter'){ res.querySelector('button[data-id]')?.click(); } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === '/'){ e.preventDefault(); qi.focus(); }
  const id = location.hash.slice(1) || 'home', i = order.indexOf(id);
  if (e.key === 'ArrowRight' && order[i+1]) go(order[i+1]);
  if (e.key === 'ArrowLeft' && i > 0) go(order[i-1]);
});

// theme + drawer
let theme = null;
try{ theme = localStorage.getItem('rig-plan-theme'); }catch(e){}
let themeExplicit = theme === 'light' || theme === 'dark';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
if (!themeExplicit) theme = darkQuery.matches ? 'dark' : 'light';
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); const b = document.getElementById('theme'); b.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); }
document.getElementById('theme').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; themeExplicit = true; try{ localStorage.setItem('rig-plan-theme', theme); }catch(e){} applyTheme(); });
darkQuery.addEventListener('change', (e) => { if (themeExplicit) return; theme = e.matches ? 'dark' : 'light'; applyTheme(); });
document.getElementById('menu').addEventListener('click', () => document.getElementById('app').classList.add('open'));
document.getElementById('scrim').addEventListener('click', () => document.getElementById('app').classList.remove('open'));

let railCollapsed = false;
try{ railCollapsed = localStorage.getItem('rig-plan-rail') === 'collapsed'; }catch(e){}
function applyRail(){
  document.getElementById('app').classList.toggle('collapsed', railCollapsed);
  document.getElementById('rail-toggle').setAttribute('aria-label', railCollapsed ? 'Show sidebar' : 'Hide sidebar');
}
document.getElementById('rail-toggle').addEventListener('click', () => {
  railCollapsed = !railCollapsed;
  try{ localStorage.setItem('rig-plan-rail', railCollapsed ? 'collapsed' : 'open'); }catch(e){}
  applyRail();
});

loadLocal(); applyTheme(); applyRail(); buildNav();
window.addEventListener('hashchange', route);
route();
connectStore();
</script>
</body></html>
