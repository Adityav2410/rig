mestamp at the top of the system prompt and watch cache reads collapse. Move it to the end of the latest message and watch them recover.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.3\"><input aria-label=\"Done\" data-id=\"w3.exp.3\" id=\"c-w3-exp-3\" type=\"checkbox\"/><div class=\"task-body\">T17 under the 40,000-token limit: no management (expect overflow), masking only, compaction only, both. Count how often the agent re-reads a file it already read before compaction; that is your forgetting metric.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.4\"><input aria-label=\"Done\" data-id=\"w3.exp.4\" id=\"c-w3-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Free-form versus templated summaries on T17.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.5\"><input aria-label=\"Done\" data-id=\"w3.exp.5\" id=\"c-w3-exp-5\" type=\"checkbox\"/><div class=\"task-body\"><strong>The TTL bet.</strong> Replay one long session with idle gaps of 2, 8 and 40 minutes under 5-minute and 1-hour TTLs, with and without pre-warming. Compute dollars per session from the per-TTL usage fields.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.6\"><input aria-label=\"Done\" data-id=\"w3.exp.6\" id=\"c-w3-exp-6\" type=\"checkbox\"/><div class=\"task-body\">T17 with your compaction, with tool-result clearing (<code>clear_at_least</code> at 0 and at 5,000 tokens), and with the provider's server-side compaction: pass rate, cache misses caused, dollars.</div></li>\n<li class=\"task do\" data-id=\"w3.exp.7\"><input aria-label=\"Done\" data-id=\"w3.exp.7\" id=\"c-w3-exp-7\" type=\"checkbox\"/><div class=\"task-body\">Compare your radix toy's hit rate with the provider's reported cache reads on the same traces. Explain the gap.</div></li>\n</ol>\n<h2 id=\"w3-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Context overflow is a typed, recoverable error</strong> with exactly one retry after compaction, never a loop.</li>\n<li><strong>Compaction is a step that can fail.</strong> If the summary call errors, fall back to masking; never leave the session half-compacted.</li>\n<li><strong>Idempotency:</strong> a retried turn must not compact twice. Key compaction entries by the cut-point entry id.</li>\n<li><strong>Cost:</strong> compaction spend counts against the run's budget and appears as its own line in the report.</li>\n<li><strong>Cache waste is a cost metric.</strong> Alert on dollars lost to cache misses per day, broken down by cause; a deploy that reorders tool definitions shows up here first.</li>\n<li><strong>Memory files are an exfiltration surface.</strong> Anything the agent writes to long-term memory is later loaded into other sessions; redact secrets before writing.</li>\n</ul>\n<h2 id=\"w3-not-yet\">Not yet</h2>\n<p>Vector-store memory products, knowledge-graph memory, \"infinite context\" claims, building your own serving engine, and fine-tuning for memory. Each is easier to judge once you can measure what a simple file and a summary already give you.</p>\n<h2 id=\"w3-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w3.check.1\"><input aria-label=\"Done\" data-id=\"w3.check.1\" id=\"c-w3-check-1\" type=\"checkbox\"/><div class=\"task-body\">From any trace you can say which part of each request was served from cache and why each miss happened.</div></li>\n<li class=\"task do\" data-id=\"w3.check.2\"><input aria-label=\"Done\" data-id=\"w3.check.2\" id=\"c-w3-check-2\" type=\"checkbox\"/><div class=\"task-body\">rig completes T17 under the 40,000-token limit without an overflow error, and the report shows what compaction cost and what it did to pass rate.</div></li>\n<li class=\"task do\" data-id=\"w3.check.3\"><input aria-label=\"Done\" data-id=\"w3.check.3\" id=\"c-w3-check-3\" type=\"checkbox\"/><div class=\"task-body\">Your radix toy passes property tests: matching returns the longest stored prefix, and eviction never frees a referenced node.</div></li>\n<li class=\"task do\" data-id=\"w3.check.4\"><input aria-label=\"Done\" data-id=\"w3.check.4\" id=\"c-w3-check-4\" type=\"checkbox\"/><div class=\"task-body\">Your ledger attributes every cache miss in a session to a cause, and you can say when a 1-hour TTL beats a 5-minute one for your traffic.</div></li>\n<li class=\"task do\" data-id=\"w3.check.5\"><input aria-label=\"Done\" data-id=\"w3.check.5\" id=\"c-w3-check-5\" type=\"checkbox\"/><div class=\"task-body\">You can explain prompt caching to a colleague in terms of per-layer key and value tensors.</div></li>\n</ul>\n", "toc": [["w3-concepts", "Concepts", []], ["w3-day-by-day", "Day by day", [["w3-day-by-day-mon", "Monday — the KV cache, before the billing feature."], ["w3-day-by-day-tue", "Tuesday — the context pipeline every request runs through."], ["w3-day-by-day-wed", "Wednesday — measuring what Tuesday's pipeline actually does."], ["w3-day-by-day-thu", "Thursday — read pi's compactor and SGLang's radix cache."], ["w3-day-by-day-fri", "Friday — cheap experiments only."], ["w3-day-by-day-sat", "Saturday — T17, and the expensive experiments."], ["w3-day-by-day-sun", "Sunday — the last experiment, then the checkpoint."]]], ["w3-build", "Build", []], ["w3-project-increment", "Project increment", []], ["w3-read", "Read", []], ["w3-you-should-be-able-to-answer", "You should be able to answer", []], ["w3-experiments", "Experiments", []], ["w3-production-lens", "Production lens", []], ["w3-not-yet", "Not yet", []], ["w3-checkpoint", "Checkpoint", []]], "text": "Context engineering is one decision made before every request: which bytes go in, in what order. This week you make that decision explicit and measured, and you learn that prompt caching is the transformer's key/value cache exposed as a billing feature. Concepts Token accounting by segment. Tools, system prompt, project memory, history, latest turn. The provider's usage is ground truth; character-based estimates are for planning ahead of a request. The KV cache. Each token's attention keys and values, per layer, are computed once. A new request can reuse them only for an exactly identical token prefix. Serving engines store them in a radix tree (SGLang) or as hash-chained blocks (vLLM). Prompt caching as an API. Cache breakpoints mark how far a prefix may be reused; cached reads are billed far below fresh input; entries expire after a short TTL. Layout rule: stable things first (tools, system, memory), append-only history after, nothing earlier ever edited. Cache economics. On the Anthropic API a 5-minute cache write costs 1.25 times the base input price, a 1-hour write 2 times, and a read 0.1 times (less on some current models). A request can carry at most 4 breakpoints, and a lookup walks back at most 20 blocks from each one. A 5-minute entry pays for itself on its first reuse; a 1-hour entry needs two. OpenAI caches prefixes automatically (1,024 tokens minimum on current models) and lets you group requests with prompt_cache_key. Either way, the TTL is a bet on how soon the next request arrives. What invalidates a cache follows the prefix order tools → system → messages. Changing tool definitions invalidates everything; changing tool_choice or images invalidates the system and message levels, and on some models so do thinking and effort settings. Caches are per model, so a model switch starts from zero (Week 8 builds on this). Providers can shrink history for you. Anthropic's tool-result clearing (clear_tool_uses_20250919, tuned with trigger, keep, clear_at_least and exclude_tools) replaces old tool results with placeholders on the server, and server-side compaction summarizes on demand or at a token threshold. Build the client-side versions first so you can judge theirs. Prompt churn is anything that changes early bytes: a timestamp in the system prompt, a re-sorted tool list, non-deterministic JSON key order, rewriting an old message. Three ways to shrink history, cheapest first: truncate at the tool (Week 1), mask old observations with placeholders, and summarize a prefix (compaction). Each costs something: re-reads, lost detail, a cache miss. Safe cut points. A cut must not separate a tool_use from its tool_result, and should land on a turn boundary. Trigger policy. Proactive (crossing a fraction of the window) versus reactive (the provider rejects the request as too long). You need both. Memory is prompt assembly with persistence. Short-term memory is the transcript; working memory is a file the agent edits (a plan or todo list); long-term memory is text written at the end of one session and loaded at the start of another. Every \"memory system\" is a policy for who writes that text and when it is loaded. Day by day Nine Build steps this week split into two code-heavy days; don't shortchange Thursday's read, it's the one that turns \"prompt caching\" from a billing line item into a tree lookup you actually understand. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts above; note the cache economics Half-page note: the KV cache, 5-minute vs 1-hour breakpoints, what invalidates a cache Tue 3 to 4 h Build steps 1 to 4 Per-segment token accounting in the trace; deliberate breakpoints; observation masking; compaction firing past 70% of the window Wed 3 to 4 h Build steps 5 to 9 A radix-tree toy with a measured hit rate; a TTL policy with pre-warm; a cache-miss ledger; three shrinkers behind one interface; AGENTS.md plus the note tool Thu 1.5 to 2 h Read pi's compaction and cache accounting, and SGLang's radix cache; trace both paths You can narrate the proactive and reactive compaction paths from memory Fri 1 to 1.5 h Experiments 1, 2 and 4 Cache-read ratio with caching on and off; the timestamp-churn demo and its fix; free-form vs templated summaries Sat 3 to 4 h Project increment: T17 under a 40,000-token limit; Experiments 3, 5 and 6 T17 passes without overflow; the TTL bet computed in dollars; compaction vs clearing vs server compaction compared Sun 2 to 3 h Experiment 7; answer remaining questions; attempt Checkpoint Your radix toy's hit rate reconciled against the provider's reported cache reads; checkpoint passed or a redo list Monday — the KV cache, before the billing feature. Prompt caching only makes sense once you've seen what it's exposing: per-layer attention keys and values computed once and reused for an identical prefix. Spend today's slot on Concepts and leave with the mental model you'll need to place breakpoints deliberately tomorrow, not guess at them. Read Concepts above, twice through the caching bullets. Write a half-page note: the 5-minute vs 1-hour cache economics, and the exact prefix order (tools, then system, then messages) that determines what a changed byte invalidates. Tuesday — the context pipeline every request runs through. Today's four Build steps are the path every request takes, in order: measure what you're sending, decide what's cacheable, and start shrinking history before it overflows anything. Get these four right and Wednesday's measurement tools have real data to work with. Build step 1: rig/context.py's per-segment token accounting, before and after each request. Build step 2: caching — breakpoints after tools and the system prompt, and on the newest message; make history append-only and serialization deterministic. Build step 3: observation masking for tool outputs older than K turns. Build step 4: compaction past 70% of the window (or on overflow plus one retry) — summarize with the cheap model, keep the last few turns verbatim, log the result as a compaction entry and never delete the originals. Wednesday — measuring what Tuesday's pipeline actually does. Today's five Build steps are about proof, not plumbing: a toy radix tree so the data structure behind a real server stops being a black box, a deliberate TTL policy, a ledger that prices every cache miss, a single interface over three ways to shrink history, and the first piece of rig's memory system. Build step 5: rig/kvtoy.py, the radix tree over token-id lists; replay Week 1 and 2 traces through it and compute the hit rate a server would have seen. Build step 6: rig/cache_policy.py — a 1-hour breakpoint after tools and system, a 5-minute one on the newest message, the TTL chosen from expected idle time, write counts recorded per TTL. Build step 7: the cost ledger with a cache-miss detector, after pi's cache-stats.ts — tokens that should have been cached, their cost, and the likely cause. Build step 8: one interface over your compaction, your tool-result clearing, and the provider's server-side compaction. Build step 9: an AGENTS.md for click, plus a note tool capped at 2 KB and loaded at session start. Thursday — read pi's compactor and SGLang's radix cache. Pi's compactor handles every edge case you just built against (cut points, idempotency, cache-warming economics) in a file small enough to read in one sitting. SGLang's radix cache is the thing your Wednesday toy was a toy version of — read it today while the comparison is fresh. Read pi's files listed under Read above, through cache-warmer.ts. Read SGLang's radix_cache.py: match_prefix, insert, evict, _match_prefix_helper, _split_node; skim vLLM's hash-chained alternative. Trace both paths given under Read: the proactive compaction path and the reactive overflow path. Answer questions 1, 2, 5 and 6 in You should be able to answer from the reading alone. Friday — cheap experiments only. No heavy runs today. Three quick, visible experiments show you the shape of caching before the weekend asks you to put dollar figures on it. Run Experiments 1, 2 and 4 above: caching on vs off across the eval set, the timestamp-at-top-of-prompt demo (and its fix), and free-form vs templated summaries on T17. Saturday — T17, and the expensive experiments. Today you build the task this whole week was for: T17 forces all four Week 1 bugs into one session under an artificial 40,000-token limit, so compaction has to fire for real. While you're paying for runs anyway, stack the experiments that need many of them onto the same day. Add T17 to the eval set per Project increment above and confirm it overflows with no history management at all. Run Experiment 3: masking only, compaction only, both — count how often the agent re-reads a file it already read before compaction. Run Experiment 5, the TTL bet: replay one long session at 2, 8 and 40-minute idle gaps under both TTLs, with and without pre-warming; compute dollars per session. Run Experiment 6: your compaction vs tool-result clearing (two clear_at_least settings) vs the provider's server-side compaction — pass rate, cache misses caused, dollars. Sunday — the last experiment, then the checkpoint. No new code today. Close the week by reconciling your own radix-tree toy against what the real provider reports, then prove you can do the SWE-bench-style accounting this plan will keep demanding of you. Run Experiment 7: compare your radix toy's hit rate with the provider's reported cache reads on the same traces, and write down why they differ. Answer the remaining questions in You should be able to answer. Attempt Checkpoint above. If you can't explain prompt caching in terms of per-layer key/value tensors cold, redo Monday before starting Week 4. Build rig/context.py: before each request, compute an estimate per segment; after it, record usage per segment in the trace. Add peak_input_tokens and cache_read_ratio to the eval report. Caching: place breakpoints after the tool definitions and system prompt, and on the newest message. Make history strictly append-only and serialization deterministic. Observation masking: replace tool outputs older than K turns with [elided: 4,812 chars from read_file src/click/core.py; call again if needed]. Compaction: past 70% of the window (or on a context-overflow error, followed by one retry), summarize everything before the latest safe cut point with the cheap model and a fixed template (task, decisions, files touched with what changed, current state, next step), and keep the last few turns verbatim. Store it as a compaction entry in the session log; never delete the originals. rig/kvtoy.py: a radix tree over token-id lists with match_prefix, insert (splitting nodes on partial matches), reference counts, and LRU evict. Replay the requests from your Week 1 and 2 traces through it (any tokenizer will do) and compute the hit rate a server would have seen. rig/cache_policy.py: place breakpoints deliberately (a 1-hour breakpoint after the tools and system prompt, a 5-minute one on the newest message; 1-hour entries must come before 5-minute ones), choose the TTL from the expected idle time, and record the per-TTL write counts (cache_creation.ephemeral_5m_input_tokens and ephemeral_1h_input_tokens). Add an optional pre-warm before a known idle gap. A cost ledger with a cache-miss detector, after pi's cache-stats.ts: for each request, the tokens that should have come from cache but didn't, what that cost, and the likely cause (idle past the TTL, a model switch, an edited prefix). Every later week reads this ledger. Three history shrinkers behind one interface: your compaction, tool-result clearing (yours first, then the provider's), and the provider's server-side compaction. Memory: an AGENTS.md for click written by you, plus a note tool that appends to .rig/notes.md (capped at 2 KB) and is loaded at session start. Project increment rig v0.3 handles long tasks. Add T17: apply the T04, T05, T07 and T09 seeds at once and ask for all four symptoms to be fixed in one session. Run it with an artificial context limit of 40,000 tokens so compaction must fire. rig v0.3 also places cache breakpoints deliberately and reports the dollars lost to cache misses. Read pi's compaction (main). It is a production compactor small enough to read in one sitting, and it handles exactly the edge cases above. In packages/coding-agent/src/core/compaction/compaction.ts: DEFAULT_COMPACTION_SETTINGS (line 126), shouldCompact (267), estimateTokens (298), isCutPointMessage (351), findValidCutPoints (394), findCutPoint (446), generateSummary (645), prepareCompaction (872), compact (965). Then, in agent-session.ts, _compactBeforeNextAssistantResponse (776) and _runAutoCompaction (3097, which takes \"overflow\" | \"threshold\"). Finish with cache-warmer.ts (getPromptCacheTtlMs, getCacheWarmingDelayMs), which reasons about whether paying to keep a cache warm is cheaper than letting it expire. pi's cache accounting.packages/coding-agent/src/core/cache-stats.ts (174 lines): detectMiss (56) prices each miss from the message's own cost breakdown, and computeCacheWaste (148) totals the misses for a session. In cache-warmer.ts, CacheWarmer (162) and its evaluate method (378) decide whether keeping a cache warm is worth paying for. In packages/ai/src/api/anthropic-messages.ts, getCacheControl (79) maps a short or long retention setting to a 5-minute or 1-hour breakpoint, and the code at line 1483 puts the history breakpoint on the last message. sgl-project/sglang, one file:python/sglang/srt/mem_cache/radix_cache.py (818 lines). Read match_prefix (355), insert (415), evict (551), _match_prefix_helper (637) and _split_node (663). This is the data structure behind prefix reuse; once you have read it, \"prompt caching\" stops being a product feature and becomes a tree lookup. For the alternative design, skim vLLM's hash_block_tokens in vllm/v1/core/kv_cache_utils.py (684) and KVCacheManager.get_computed_blocks in kv_cache_manager.py (264). openai/codex, prompts and memory only:codex-rs/prompts/templates/compact/prompt.md (a 9-line compaction prompt to compare with pi's), then codex-rs/memories/README.md and write/templates/memories/stage_one_system.md. Codex's long-term memory is a background pipeline: per-session extraction (phase 1), then consolidation into memory files (phase 2), with job leases so concurrent workers do not duplicate work, and secret redaction before anything is stored. Then compare codex-rs/core/src/compact.rs, which summarizes locally, with compact_remote_v2.rs, which asks the server to compact. Trace this path in pi: a turn finishes → the prepareNextTurn hook calls _compactBeforeNextAssistantResponse → _exceedsCompactionThreshold → prepareCompaction → findCutPoint → generateSummary (a model call) → a CompactionEntry is appended → buildSessionContext rebuilds the context as summary plus kept entries → the next request. Then trace the reactive path: an overflow error → _runAutoCompaction(\"overflow\", willRetry) → retry. You should be able to answer What makes a valid cut point in pi, and what exactly breaks if you cut between a tool call and its result? Can answer Why keep a verbatim tail instead of summarizing everything? Can answer How does pi estimate tokens before a request, and when does it switch to the provider's reported usage? Can answer What happens to the prompt cache right after a compaction, and what did one compaction cost in your own traces? Can answer In SGLang, why does insert need _split_node, and what stops evict from freeing a prefix an in-flight request is using? Can answer Why does vLLM chain each block's hash with its parent's hash instead of hashing blocks independently? Can answer List four ways your request can miss the cache although \"nothing changed\". Can answer Why does Codex split memory into extraction and consolidation phases, and why does it need leases at all? Can answer Experiments Caching on versus off across the eval set: cache-read ratio, dollars per task, latency. Add a timestamp at the top of the system prompt and watch cache reads collapse. Move it to the end of the latest message and watch them recover. T17 under the 40,000-token limit: no management (expect overflow), masking only, compaction only, both. Count how often the agent re-reads a file it already read before compaction; that is your forgetting metric. Free-form versus templated summaries on T17. The TTL bet. Replay one long session with idle gaps of 2, 8 and 40 minutes under 5-minute and 1-hour TTLs, with and without pre-warming. Compute dollars per session from the per-TTL usage fields. T17 with your compaction, with tool-result clearing (clear_at_least at 0 and at 5,000 tokens), and with the provider's server-side compaction: pass rate, cache misses caused, dollars. Compare your radix toy's hit rate with the provider's reported cache reads on the same traces. Explain the gap. Production lens Context overflow is a typed, recoverable error with exactly one retry after compaction, never a loop. Compaction is a step that can fail. If the summary call errors, fall back to masking; never leave the session half-compacted. Idempotency: a retried turn must not compact twice. Key compaction entries by the cut-point entry id. Cost: compaction spend counts against the run's budget and appears as its own line in the report. Cache waste is a cost metric. Alert on dollars lost to cache misses per day, broken down by cause; a deploy that reorders tool definitions shows up here first. Memory files are an exfiltration surface. Anything the agent writes to long-term memory is later loaded into other sessions; redact secrets before writing. Not yet Vector-store memory products, knowledge-graph memory, \"infinite context\" claims, building your own serving engine, and fine-tuning for memory. Each is easier to judge once you can measure what a simple file and a summary already give you. Checkpoint From any trace you can say which part of each request was served from cache and why each miss happened. rig completes T17 under the 40,000-token limit without an overflow error, and the report shows what compaction cost and what it did to pass rate. Your radix toy passes property tests: matching returns the longest stored prefix, and eviction never frees a referenced node. Your ledger attributes every cache miss in a session to a cause, and you can say when a 1-hour TTL beats a 5-minute one for your traffic. You can explain prompt caching to a colleague in terms of per-layer key and value tensors.", "tasks": 29}, {"id": "w4", "group": "Weeks", "title": "Week 4: retrieval", "short": "Week 4", "html": "<p>Retrieval is ranking: score every candidate against a query and keep the top k. Everything else (BM25, embeddings, HNSW, vector databases, hybrid fusion, rerankers) either improves the score or makes ranking fast. This week you build each piece, then make it beat rig's own grep on a labeled set, or decide honestly that it does not.</p>\n<h2 id=\"w4-concepts\">Concepts</h2>\n<ul>\n<li><strong>Lexical scoring (BM25):</strong> inverse document frequency, times a saturating term-frequency curve (<code>k1</code>), times document-length normalization (<code>b</code>). For code, tokenization decides everything: split <code>camelCase</code> and <code>snake_case</code>, keep identifiers whole as well.</li>\n<li><strong>Dense scoring:</strong> an embedding model maps text to a vector; similarity is a dot product. Quality depends on the model and on chunking (whole files, functions, fixed windows).</li>\n<li><strong>Exact versus approximate search.</strong> Brute-force cosine over 100,000 vectors is one matrix multiply. HNSW trades recall for speed with a layered proximity graph searched greedily; <code>ef</code> sets the trade-off at query time.</li>\n<li><strong>A vector database</strong> is an ANN index plus storage, metadata filtering, updates and deletes. The filtering and update semantics are the hard part, not the index.</li>\n<li><strong>Postgres as the vector store.</strong> pgvector keeps vectors in ordinary tables beside the rows they describe, with transactions, joins, filters and Postgres full-text search in the same query. Most products need nothing more until they have measured otherwise.</li>\n<li><strong>Hybrid fusion.</strong> Reciprocal Rank Fusion sums <code>1 / (60 + rank)</code> across rankers, which needs no score calibration.</li>\n<li><strong>Reranking.</strong> A cross-encoder or an LLM scores (query, candidate) pairs jointly. It is accurate and expensive, so it runs only on the top 30 to 100.</li>\n<li><strong>Typos and vocabulary mismatch.</strong> BM25 and full-text search match tokens exactly, so <code>retreive</code> finds nothing; embeddings tolerate small typos but drift on rare identifiers. Trigram similarity (Postgres <code>pg_trgm</code>) still matches a misspelled identifier: <code>retreive_chunks</code> scores 0.6 against <code>retrieve_chunks</code>, above the default threshold of 0.3. A cheap model can also rewrite a question into several queries (multi-query) or into a hypothetical answer to embed (HyDE); each adds a model call before retrieval.</li>\n<li><strong>Code-specific retrieval without embeddings.</strong> A symbol graph (definitions and references) ranked with PageRank, which is Aider's repo map.</li>\n<li><strong>RAG versus agentic search.</strong> RAG retrieves once and prepends; agentic search lets the model issue many cheap queries. For code the agent's own grep is a strong baseline, so retrieval enters rig as a tool, not as automatic context.</li>\n<li><strong>Retrieval metrics:</strong> recall@k and MRR on labeled query-to-file pairs first; end-to-end task impact second.</li>\n</ul>\n<h2 id=\"w4-day-by-day\">Day by day</h2>\n<p>Nine Build steps this week follow one build order: ground truth, then lexical, then dense and approximate, then the tool, then polish. The schedule below follows that same order so each day's work is usable by the next.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read <strong>Concepts</strong> above; note the ranking framing</td>\n<td>Half-page note: BM25's three factors, dense vs lexical, what HNSW trades for speed</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>3 to 4 h</td>\n<td>Build steps 1 to 3</td>\n<td>40 labeled questions on openai-agents-python; BM25 from scratch matching <code>rank_bm25</code>; an ast-based chunker</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>3 to 4 h</td>\n<td>Build steps 4 to 7</td>\n<td>Chunks embedded and in pgvector with an HNSW index; an HNSW toy with a measured recall@10 curve; hybrid RRF plus a reranker; <code>retrieve(query, k=10)</code> wired in</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Build steps 8 to 9; read BM25, hnswlib, pgvector and Aider; trace three paths</td>\n<td>A repo map rendered into the system prompt; typo tolerance working; you can narrate hnswlib's insert and Aider's PageRank from memory</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>Experiments 2, 5 and 6</td>\n<td>Chunking, staleness and typo results written down</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td><strong>Project increment</strong>: v0.4, T18 to T23; Experiments 1, 3 and 7</td>\n<td>Six new tasks graded against file:line keys; the full recall@10/MRR matrix and the HNSW-vs-hnswlib-vs-pgvector comparison</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Experiment 4; answer remaining questions; attempt <strong>Checkpoint</strong></td>\n<td>Pass rate, steps and tokens with and without <code>retrieve</code>; a documented ship/no-ship call</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w4-day-by-day-mon\">Monday — ranking, before the algorithms.</h3>\n<p>Every technique this week is either a way to score a candidate or a way to make scoring fast at scale. Fix that framing before you write a line of BM25, or HNSW will look like a separate subject instead of \"approximate scoring, fast.\"</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above.</li>\n<li>Write a half-page note: what <code>k1</code> and <code>b</code> control in BM25, what dense scoring depends on, and what HNSW trades for speed.</li>\n</ol>\n<h3 id=\"w4-day-by-day-tue\">Tuesday — the labeled set and lexical scoring.</h3>\n<p>You can't tell if retrieval helps without ground truth, so today starts there: 40 real questions against a real repo, with answers you wrote by reading the code yourself. Then build the lexical baseline every later method gets compared against.</p>\n<ol type=\"1\">\n<li>Build step 1: write the 40 labeled questions against openai-agents-python <code>v0.23.1</code> by reading the code, not guessing.</li>\n<li>Build step 2: BM25 from scratch, about 80 lines, with a code-aware tokenizer; check your scores against <code>rank_bm25</code> on the same corpus.</li>\n<li>Build step 3: a chunker using <code>ast</code>, one chunk per function or class, prefixed with path and qualified name.</li>\n</ol>\n<h3 id=\"w4-day-by-day-wed\">Wednesday — dense scoring, approximate search, and the first real tool.</h3>\n<p>Today you build everything between \"a chunk\" and \"an answer the agent can act on\": embeddings in Postgres with an HNSW index, your own HNSW toy so the index stops being a black box, hybrid fusion with a reranker on top, and the tool that exposes all of it to the agent.</p>\n<ol type=\"1\">\n<li>Build step 4: embed every chunk, exact cosine in NumPy first, then into Postgres with pgvector — a <code>chunks</code> table with model name, content hash, a <code>tsvector</code> column and an HNSW index.</li>\n<li>Build step 5: an HNSW toy of about 200 lines; plot recall@10 against brute force for <code>ef</code> of 10, 50 and 200.</li>\n<li>Build step 6: hybrid retrieval with RRF, first in Python then as one SQL query fusing pgvector and full-text, then an LLM reranker over the top 30.</li>\n<li>Build step 7: <code>retrieve(query, k=10)</code> returning <code>path:start-end</code> plus the symbol name and a two-line preview.</li>\n</ol>\n<h3 id=\"w4-day-by-day-thu\">Thursday — polish the tool, then read four reference implementations.</h3>\n<p>Two small Build steps left, both easiest to understand right after reading their reference: the repo map next to Aider's <code>repomap.py</code>, typo tolerance next to pgvector's trigram docs. Spend the rest of the day on the reads themselves — this is the day the mystery comes out of vector databases.</p>\n<ol type=\"1\">\n<li>Build step 8: a Python-only repo map — definitions and references from <code>ast</code>, PageRank over files, rendered into about 1,000 tokens.</li>\n<li>Build step 9: a <code>pg_trgm</code> index on symbol names for fuzzy identifier lookup, plus an optional multi-query/HyDE rewrite step behind a flag.</li>\n<li>Read the files listed under <strong>Read</strong> above: <code>rank_bm25</code> (and <code>bm25s</code> for contrast), hnswlib's <code>hnswalg.h</code>, pgvector's C source, and Aider's <code>repomap.py</code>.</li>\n<li>Trace the three paths given there: hnswlib insert, hnswlib query, and Aider's <code>get_repo_map</code>.</li>\n</ol>\n<h3 id=\"w4-day-by-day-fri\">Friday — cheap experiments only.</h3>\n<p>No new modules today. Three quick comparisons on the harness you already built, before the weekend's full metrics run.</p>\n<p>Run Experiments 2, 5 and 6 above: whole-file vs function vs window chunking; an unreindexed edit misleading retrieval; and the misspelled-questions test with and without trigram matching and a rewrite step.</p>\n<h3 id=\"w4-day-by-day-sat\">Saturday — the full comparison, then the project increment.</h3>\n<p>This is the day the week pays off: the complete recall@10/MRR matrix across every method you built, your HNSW toy benchmarked against the real thing, and <code>retrieve</code> wired into rig as v0.4 against a second target repo.</p>\n<ol type=\"1\">\n<li>Run Experiment 1: recall@10 and MRR on the 40 questions for BM25 (plain and code-aware tokenizer), dense, hybrid, hybrid plus rerank, the repo map, and agentic grep.</li>\n<li>Run Experiment 3 and Experiment 7: your HNSW toy's recall/latency curve against hnswlib's, then the four-way comparison (NumPy brute force, your toy, hnswlib, pgvector) on the same vectors.</li>\n<li>Ship <strong>Project increment</strong> above: rig v0.4 with <code>retrieve</code> backed by Postgres, and T18 to T23 graded against file:line answer keys.</li>\n</ol>\n<h3 id=\"w4-day-by-day-sun\">Sunday — does retrieval earn its keep, then the checkpoint.</h3>\n<p>No new code today. The only question that matters is whether <code>retrieve</code> actually helps rig's agent, not whether the benchmarks look good in isolation.</p>\n<ol type=\"1\">\n<li>Run Experiment 4: T18 to T23 with and without <code>retrieve</code> — pass rate, steps to first relevant file, tokens.</li>\n<li>Answer the remaining questions in <strong>You should be able to answer</strong>.</li>\n<li>Attempt <strong>Checkpoint</strong> above. With numbers in hand, write down, honestly, whether rig should ship <code>retrieve</code> and for which kinds of question.</li>\n</ol>\n<h2 id=\"w4-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w4.build.1\"><input aria-label=\"Done\" data-id=\"w4.build.1\" id=\"c-w4-build-1\" type=\"checkbox\"/><div class=\"task-body\">A labeled set: 40 natural-language questions about <a href=\"https://github.com/openai/openai-agents-python\" rel=\"noopener\" target=\"_blank\">openai-agents-python</a> <code>v0.23.1</code>, each with its relevant files and functions. Write them by reading the code (\"where is the max-turns limit enforced?\", \"where are handoff input filters applied?\"). This doubles as Week 11 preparation.</div></li>\n<li class=\"task do\" data-id=\"w4.build.2\"><input aria-label=\"Done\" data-id=\"w4.build.2\" id=\"c-w4-build-2\" type=\"checkbox\"/><div class=\"task-body\">BM25 from scratch (about 80 lines) with a code-aware tokenizer. Check your scores against <code>rank_bm25</code> on the same corpus.</div></li>\n<li class=\"task do\" data-id=\"w4.build.3\"><input aria-label=\"Done\" data-id=\"w4.build.3\" id=\"c-w4-build-3\" type=\"checkbox\"/><div class=\"task-body\">A chunker using Python's <code>ast</code>: one chunk per function or class, prefixed with path and qualified name.</div></li>\n<li class=\"task do\" data-id=\"w4.build.4\"><input aria-label=\"Done\" data-id=\"w4.build.4\" id=\"c-w4-build-4\" type=\"checkbox\"/><div class=\"task-body\">Embeddings for every chunk from one embedding model, and exact cosine search in NumPy. Then move the vectors into Postgres with pgvector: a <code>chunks</code> table with the model name, the content hash, a generated <code>tsvector</code> column and an HNSW index. <code>docker compose</code> with the <code>pgvector/pgvector</code> image is enough.</div></li>\n<li class=\"task do\" data-id=\"w4.build.5\"><input aria-label=\"Done\" data-id=\"w4.build.5\" id=\"c-w4-build-5\" type=\"checkbox\"/><div class=\"task-body\">An HNSW toy of about 200 lines: random levels, greedy descent through upper layers, beam search with <code>ef</code> on layer 0, the neighbor-selection heuristic. Plot recall@10 against brute force for <code>ef</code> of 10, 50 and 200.</div></li>\n<li class=\"task do\" data-id=\"w4.build.6\"><input aria-label=\"Done\" data-id=\"w4.build.6\" id=\"c-w4-build-6\" type=\"checkbox\"/><div class=\"task-body\">Hybrid retrieval with RRF, first in Python, then as one SQL query that fuses the pgvector and full-text rankings; then an LLM reranker (the cheap model) over the top 30.</div></li>\n<li class=\"task do\" data-id=\"w4.build.7\"><input aria-label=\"Done\" data-id=\"w4.build.7\" id=\"c-w4-build-7\" type=\"checkbox\"/><div class=\"task-body\">A <code>retrieve(query, k=10)</code> tool that returns <code>path:start-end</code> plus the symbol name and a two-line preview, so the agent decides what to read.</div></li>\n<li class=\"task do\" data-id=\"w4.build.8\"><input aria-label=\"Done\" data-id=\"w4.build.8\" id=\"c-w4-build-8\" type=\"checkbox\"/><div class=\"task-body\">A repo map in the Aider style for Python only: definitions and references from <code>ast</code>, PageRank over files, rendered into about 1,000 tokens of the system prompt.</div></li>\n<li class=\"task do\" data-id=\"w4.build.9\"><input aria-label=\"Done\" data-id=\"w4.build.9\" id=\"c-w4-build-9\" type=\"checkbox\"/><div class=\"task-body\">Typo tolerance and rewriting, each behind a flag: a <code>pg_trgm</code> index on symbol names for fuzzy identifier lookup, and an optional rewrite step with the cheap model (multi-query and HyDE).</div></li>\n</ol>\n<h2 id=\"w4-project-increment\">Project increment</h2>\n<p>rig v0.4 gains <code>retrieve</code>, backed by Postgres with pgvector, and works on the second target. Add six question-answering tasks on openai-agents-python (T18 to T23), graded against answer keys of file:line ranges.</p>\n<h2 id=\"w4-read\">Read</h2>\n<p><strong><a href=\"https://github.com/dorianbrown/rank_bm25\" rel=\"noopener\" target=\"_blank\">dorianbrown/rank_bm25</a></strong>, <code>rank_bm25.py</code> (257 lines): <code>BM25.__init__</code> and <code>_initialize</code>, then <code>BM25Okapi._calc_idf</code> (85) and <code>get_scores</code> (107). The whole BM25 family fits in one file, and the <code>epsilon</code> floor for negative IDF is a real-world detail most write-ups skip. For contrast, <a href=\"https://github.com/xhluca/bm25s\" rel=\"noopener\" target=\"_blank\">xhluca/bm25s</a> precomputes every term-document score into a sparse matrix at index time (<code>BM25.index</code> and <code>retrieve</code> in <code>bm25s/__init__.py</code>), so a query is a sparse-row sum.</p>\n<p><strong><a href=\"https://github.com/nmslib/hnswlib\" rel=\"noopener\" target=\"_blank\">nmslib/hnswlib</a></strong>, <code>hnswlib/hnswalg.h</code>: <code>getRandomLevel</code> (227), <code>searchBaseLayer</code> (246), <code>searchBaseLayerST</code> (337), <code>getNeighborsByHeuristic2</code> (475), <code>mutuallyConnectNewElement</code> (538), <code>addPoint</code> (1100 and the overload after it), and <code>searchKnn</code>. Then <code>bruteforce.h</code> (193 lines) as the baseline. This is the reference HNSW, and most vector databases embed it or a close descendant, so reading it removes most of the mystery from vendor comparisons.</p>\n<p><strong><a href=\"https://github.com/pgvector/pgvector\" rel=\"noopener\" target=\"_blank\">pgvector/pgvector</a></strong> (second read, C). The same algorithm inside a database, where updates, deletes and filters are the hard part. In <code>src/hnswinsert.c</code> read <code>HnswInsertTupleOnDisk</code> (696), <code>UpdateGraphOnDisk</code> (669) and <code>HnswUpdateNeighborsOnDisk</code> (546). In <code>src/hnswscan.c</code> read <code>hnswgettuple</code> (195), <code>GetScanItems</code> (26) and <code>ResumeScanItems</code> (67). In <code>src/hnswvacuum.c</code> read <code>RepairGraph</code> (379) and <code>MarkDeleted</code> (595), which answer the deletion question below. Then read the README's \"Iterative Index Scans\" section: with a <code>WHERE</code> filter, approximate search filters after the index scan and can return fewer than k rows, so pgvector keeps scanning until it has enough. Filtered nearest-neighbour search is where vector databases actually differ. Finish with the README's \"Hybrid Search\" section, then the PostgreSQL documentation for <a href=\"https://www.postgresql.org/docs/current/pgtrgm.html\" rel=\"noopener\" target=\"_blank\"><code>pg_trgm</code></a>: <code>similarity</code>, the <code>%</code> operator and its threshold, and trigram GIN indexes.</p>\n<p><strong><a href=\"https://github.com/Aider-AI/aider\" rel=\"noopener\" target=\"_blank\">Aider-AI/aider</a></strong>, <code>aider/repomap.py</code> (867 lines): <code>get_tags_raw</code> (279, tree-sitter queries), <code>get_ranked_tags</code> (365, the reference graph and personalized PageRank), <code>get_ranked_tags_map_uncached</code> (629, a binary search on how many tags fit the token budget), <code>to_tree</code> (748). It is retrieval for code with no embeddings at all.</p>\n<p><strong>Trace these paths:</strong></p>\n<ul>\n<li>hnswlib insert: <code>addPoint</code> → <code>getRandomLevel</code> → greedy descent from the entry point through layers above the new level → for each lower layer, <code>searchBaseLayer</code> with <code>ef_construction</code> → <code>getNeighborsByHeuristic2</code> → <code>mutuallyConnectNewElement</code> (shrinking neighbors' lists past <code>M</code>) → update the entry point if the new level is the highest.</li>\n<li>hnswlib query: <code>searchKnn</code> → greedy descent → <code>searchBaseLayerST</code> on layer 0 with <code>ef</code> → top k.</li>\n<li>Aider: <code>get_repo_map</code> → <code>get_ranked_tags_map</code> → <code>get_ranked_tags</code> (definitions, references, PageRank personalized toward files in the chat and identifiers mentioned) → <code>to_tree</code> → token-budget fit.</li>\n</ul>\n<h2 id=\"w4-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w4.q.1\"><input aria-label=\"I can answer this\" data-id=\"w4.q.1\" id=\"c-w4-q-1\" type=\"checkbox\"/><div class=\"task-body\">What do <code>k1</code> and <code>b</code> control, and why does Okapi BM25 need an IDF floor?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.2\"><input aria-label=\"I can answer this\" data-id=\"w4.q.2\" id=\"c-w4-q-2\" type=\"checkbox\"/><div class=\"task-body\">What does bm25s gain by scoring at index time, and what does it lose?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.3\"><input aria-label=\"I can answer this\" data-id=\"w4.q.3\" id=\"c-w4-q-3\" type=\"checkbox\"/><div class=\"task-body\">Why do HNSW levels follow an exponentially decaying distribution, and what does <code>ef</code> change at construction versus query time?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.4\"><input aria-label=\"I can answer this\" data-id=\"w4.q.4\" id=\"c-w4-q-4\" type=\"checkbox\"/><div class=\"task-body\">Why choose neighbors with a heuristic instead of the M nearest?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.5\"><input aria-label=\"I can answer this\" data-id=\"w4.q.5\" id=\"c-w4-q-5\" type=\"checkbox\"/><div class=\"task-body\">How does hnswlib delete, and why is true deletion hard in a graph index?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.6\"><input aria-label=\"I can answer this\" data-id=\"w4.q.6\" id=\"c-w4-q-6\" type=\"checkbox\"/><div class=\"task-body\">When does brute force beat HNSW outright?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.7\"><input aria-label=\"I can answer this\" data-id=\"w4.q.7\" id=\"c-w4-q-7\" type=\"checkbox\"/><div class=\"task-body\">Why does RRF work without calibrating scores across rankers?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.8\"><input aria-label=\"I can answer this\" data-id=\"w4.q.8\" id=\"c-w4-q-8\" type=\"checkbox\"/><div class=\"task-body\">How does Aider personalize PageRank, and how does it fit the map into a token budget?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.9\"><input aria-label=\"I can answer this\" data-id=\"w4.q.9\" id=\"c-w4-q-9\" type=\"checkbox\"/><div class=\"task-body\">On your own eval, which query types did retrieval win and which did grep win?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.10\"><input aria-label=\"I can answer this\" data-id=\"w4.q.10\" id=\"c-w4-q-10\" type=\"checkbox\"/><div class=\"task-body\">When does a rewrite step help retrieval, and what does it cost in latency and in queries that drift from what was asked?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w4.q.11\"><input aria-label=\"I can answer this\" data-id=\"w4.q.11\" id=\"c-w4-q-11\" type=\"checkbox\"/><div class=\"task-body\">Why does trigram similarity catch <code>retreive</code> when BM25 and full-text search do not, and where does it produce false matches?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w4-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w4.exp.1\"><input aria-label=\"Done\" data-id=\"w4.exp.1\" id=\"c-w4-exp-1\" type=\"checkbox\"/><div class=\"task-body\">Recall@10 and MRR on the 40 questions for: BM25 with a plain tokenizer, BM25 with the code-aware tokenizer, dense, hybrid, hybrid plus rerank, the repo map, and agentic grep (the files rig opens in its first five steps).</div></li>\n<li class=\"task do\" data-id=\"w4.exp.2\"><input aria-label=\"Done\" data-id=\"w4.exp.2\" id=\"c-w4-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Chunking: whole file versus function chunks versus 50-line windows.</div></li>\n<li class=\"task do\" data-id=\"w4.exp.3\"><input aria-label=\"Done\" data-id=\"w4.exp.3\" id=\"c-w4-exp-3\" type=\"checkbox\"/><div class=\"task-body\">Your HNSW recall and latency curve against hnswlib's on the same vectors.</div></li>\n<li class=\"task do\" data-id=\"w4.exp.4\"><input aria-label=\"Done\" data-id=\"w4.exp.4\" id=\"c-w4-exp-4\" type=\"checkbox\"/><div class=\"task-body\">T18 to T23 with and without <code>retrieve</code>: pass rate, steps to first relevant file, tokens.</div></li>\n<li class=\"task do\" data-id=\"w4.exp.5\"><input aria-label=\"Done\" data-id=\"w4.exp.5\" id=\"c-w4-exp-5\" type=\"checkbox\"/><div class=\"task-body\">Stale index: let the agent edit a file without reindexing, and watch retrieval mislead it. Then reindex by content hash after every edit.</div></li>\n<li class=\"task do\" data-id=\"w4.exp.6\"><input aria-label=\"Done\" data-id=\"w4.exp.6\" id=\"c-w4-exp-6\" type=\"checkbox\"/><div class=\"task-body\">Typos: a misspelled copy of the 40 questions (one or two edits in each identifier). Recall@10 for BM25, dense and hybrid, then with trigram identifier matching and with a rewrite step.</div></li>\n<li class=\"task do\" data-id=\"w4.exp.7\"><input aria-label=\"Done\" data-id=\"w4.exp.7\" id=\"c-w4-exp-7\" type=\"checkbox\"/><div class=\"task-body\">NumPy brute force, your HNSW toy, hnswlib and pgvector's HNSW on the same vectors: recall@10, p95 latency, build time and memory.</div></li>\n</ol>\n<h2 id=\"w4-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Freshness.</strong> The agent's own edits make the index stale mid-run. Key chunks by content hash and reindex changed files after each mutating tool call.</li>\n<li><strong>Model versioning.</strong> Vectors from different embedding models are not comparable; store the model id beside every vector and refuse mixed queries.</li>\n<li><strong>Access control.</strong> In multi-tenant systems, filter by permission before ranking, not after, or top-k quietly returns fewer results. Week 14 measures how few.</li>\n<li><strong>Retrieved text is untrusted.</strong> Comments and docs can carry prompt injections; Week 9 tests this.</li>\n<li><strong>Cost and latency:</strong> embedding is a batch job with retries and rate limits; reranking adds a model call to every query.</li>\n</ul>\n<h2 id=\"w4-not-yet\">Not yet</h2>\n<p>Hosted vector-database comparisons, GraphRAG, late-interaction models, fine-tuned embeddings, trained query rewriters, and RAG frameworks.</p>\n<h2 id=\"w4-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w4.check.1\"><input aria-label=\"Done\" data-id=\"w4.check.1\" id=\"c-w4-check-1\" type=\"checkbox\"/><div class=\"task-body\">You can write BM25 from memory and explain each factor.</div></li>\n<li class=\"task do\" data-id=\"w4.check.2\"><input aria-label=\"Done\" data-id=\"w4.check.2\" id=\"c-w4-check-2\" type=\"checkbox\"/><div class=\"task-body\">Your HNSW toy reaches recall@10 of at least 0.95 against brute force at some <code>ef</code> on 50,000 vectors, and you can explain the shape of the curve.</div></li>\n<li class=\"task do\" data-id=\"w4.check.3\"><input aria-label=\"Done\" data-id=\"w4.check.3\" id=\"c-w4-check-3\" type=\"checkbox\"/><div class=\"task-body\">With numbers from your own eval, you can say whether rig should ship <code>retrieve</code>, and for which kinds of question.</div></li>\n</ul>\n", "toc": [["w4-concepts", "Concepts", []], ["w4-day-by-day", "Day by day", [["w4-day-by-day-mon", "Monday — ranking, before the algorithms."], ["w4-day-by-day-tue", "Tuesday — the labeled set and lexical scoring."], ["w4-day-by-day-wed", "Wednesday — dense scoring, approximate search, and the first real tool."], ["w4-day-by-day-thu", "Thursday — polish the tool, then read four reference implementations."], ["w4-day-by-day-fri", "Friday — cheap experiments only."], ["w4-day-by-day-sat", "Saturday — the full comparison, then the project increment."], ["w4-day-by-day-sun", "Sunday — does retrieval earn its keep, then the checkpoint."]]], ["w4-build", "Build", []], ["w4-project-increment", "Project increment", []], ["w4-read", "Read", []], ["w4-you-should-be-able-to-answer", "You should be able to answer", []], ["w4-experiments", "Experiments", []], ["w4-production-lens", "Production lens", []], ["w4-not-yet", "Not yet", []], ["w4-checkpoint", "Checkpoint", []]], "text": "Retrieval is ranking: score every candidate against a query and keep the top k. Everything else (BM25, embeddings, HNSW, vector databases, hybrid fusion, rerankers) either improves the score or makes ranking fast. This week you build each piece, then make it beat rig's own grep on a labeled set, or decide honestly that it does not. Concepts Lexical scoring (BM25): inverse document frequency, times a saturating term-frequency curve (k1), times document-length normalization (b). For code, tokenization decides everything: split camelCase and snake_case, keep identifiers whole as well. Dense scoring: an embedding model maps text to a vector; similarity is a dot product. Quality depends on the model and on chunking (whole files, functions, fixed windows). Exact versus approximate search. Brute-force cosine over 100,000 vectors is one matrix multiply. HNSW trades recall for speed with a layered proximity graph searched greedily; ef sets the trade-off at query time. A vector database is an ANN index plus storage, metadata filtering, updates and deletes. The filtering and update semantics are the hard part, not the index. Postgres as the vector store. pgvector keeps vectors in ordinary tables beside the rows they describe, with transactions, joins, filters and Postgres full-text search in the same query. Most products need nothing more until they have measured otherwise. Hybrid fusion. Reciprocal Rank Fusion sums 1 / (60 + rank) across rankers, which needs no score calibration. Reranking. A cross-encoder or an LLM scores (query, candidate) pairs jointly. It is accurate and expensive, so it runs only on the top 30 to 100. Typos and vocabulary mismatch. BM25 and full-text search match tokens exactly, so retreive finds nothing; embeddings tolerate small typos but drift on rare identifiers. Trigram similarity (Postgres pg_trgm) still matches a misspelled identifier: retreive_chunks scores 0.6 against retrieve_chunks, above the default threshold of 0.3. A cheap model can also rewrite a question into several queries (multi-query) or into a hypothetical answer to embed (HyDE); each adds a model call before retrieval. Code-specific retrieval without embeddings. A symbol graph (definitions and references) ranked with PageRank, which is Aider's repo map. RAG versus agentic search. RAG retrieves once and prepends; agentic search lets the model issue many cheap queries. For code the agent's own grep is a strong baseline, so retrieval enters rig as a tool, not as automatic context. Retrieval metrics: recall@k and MRR on labeled query-to-file pairs first; end-to-end task impact second. Day by day Nine Build steps this week follow one build order: ground truth, then lexical, then dense and approximate, then the tool, then polish. The schedule below follows that same order so each day's work is usable by the next. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts above; note the ranking framing Half-page note: BM25's three factors, dense vs lexical, what HNSW trades for speed Tue 3 to 4 h Build steps 1 to 3 40 labeled questions on openai-agents-python; BM25 from scratch matching rank_bm25; an ast-based chunker Wed 3 to 4 h Build steps 4 to 7 Chunks embedded and in pgvector with an HNSW index; an HNSW toy with a measured recall@10 curve; hybrid RRF plus a reranker; retrieve(query, k=10) wired in Thu 1.5 to 2 h Build steps 8 to 9; read BM25, hnswlib, pgvector and Aider; trace three paths A repo map rendered into the system prompt; typo tolerance working; you can narrate hnswlib's insert and Aider's PageRank from memory Fri 1 to 1.5 h Experiments 2, 5 and 6 Chunking, staleness and typo results written down Sat 3 to 4 h Project increment: v0.4, T18 to T23; Experiments 1, 3 and 7 Six new tasks graded against file:line keys; the full recall@10/MRR matrix and the HNSW-vs-hnswlib-vs-pgvector comparison Sun 2 to 3 h Experiment 4; answer remaining questions; attempt Checkpoint Pass rate, steps and tokens with and without retrieve; a documented ship/no-ship call Monday — ranking, before the algorithms. Every technique this week is either a way to score a candidate or a way to make scoring fast at scale. Fix that framing before you write a line of BM25, or HNSW will look like a separate subject instead of \"approximate scoring, fast.\" Read Concepts above. Write a half-page note: what k1 and b control in BM25, what dense scoring depends on, and what HNSW trades for speed. Tuesday — the labeled set and lexical scoring. You can't tell if retrieval helps without ground truth, so today starts there: 40 real questions against a real repo, with answers you wrote by reading the code yourself. Then build the lexical baseline every later method gets compared against. Build step 1: write the 40 labeled questions against openai-agents-python v0.23.1 by reading the code, not guessing. Build step 2: BM25 from scratch, about 80 lines, with a code-aware tokenizer; check your scores against rank_bm25 on the same corpus. Build step 3: a chunker using ast, one chunk per function or class, prefixed with path and qualified name. Wednesday — dense scoring, approximate search, and the first real tool. Today you build everything between \"a chunk\" and \"an answer the agent can act on\": embeddings in Postgres with an HNSW index, your own HNSW toy so the index stops being a black box, hybrid fusion with a reranker on top, and the tool that exposes all of it to the agent. Build step 4: embed every chunk, exact cosine in NumPy first, then into Postgres with pgvector — a chunks table with model name, content hash, a tsvector column and an HNSW index. Build step 5: an HNSW toy of about 200 lines; plot recall@10 against brute force for ef of 10, 50 and 200. Build step 6: hybrid retrieval with RRF, first in Python then as one SQL query fusing pgvector and full-text, then an LLM reranker over the top 30. Build step 7: retrieve(query, k=10) returning path:start-end plus the symbol name and a two-line preview. Thursday — polish the tool, then read four reference implementations. Two small Build steps left, both easiest to understand right after reading their reference: the repo map next to Aider's repomap.py, typo tolerance next to pgvector's trigram docs. Spend the rest of the day on the reads themselves — this is the day the mystery comes out of vector databases. Build step 8: a Python-only repo map — definitions and references from ast, PageRank over files, rendered into about 1,000 tokens. Build step 9: a pg_trgm index on symbol names for fuzzy identifier lookup, plus an optional multi-query/HyDE rewrite step behind a flag. Read the files listed under Read above: rank_bm25 (and bm25s for contrast), hnswlib's hnswalg.h, pgvector's C source, and Aider's repomap.py. Trace the three paths given there: hnswlib insert, hnswlib query, and Aider's get_repo_map. Friday — cheap experiments only. No new modules today. Three quick comparisons on the harness you already built, before the weekend's full metrics run. Run Experiments 2, 5 and 6 above: whole-file vs function vs window chunking; an unreindexed edit misleading retrieval; and the misspelled-questions test with and without trigram matching and a rewrite step. Saturday — the full comparison, then the project increment. This is the day the week pays off: the complete recall@10/MRR matrix across every method you built, your HNSW toy benchmarked against the real thing, and retrieve wired into rig as v0.4 against a second target repo. Run Experiment 1: recall@10 and MRR on the 40 questions for BM25 (plain and code-aware tokenizer), dense, hybrid, hybrid plus rerank, the repo map, and agentic grep. Run Experiment 3 and Experiment 7: your HNSW toy's recall/latency curve against hnswlib's, then the four-way comparison (NumPy brute force, your toy, hnswlib, pgvector) on the same vectors. Ship Project increment above: rig v0.4 with retrieve backed by Postgres, and T18 to T23 graded against file:line answer keys. Sunday — does retrieval earn its keep, then the checkpoint. No new code today. The only question that matters is whether retrieve actually helps rig's agent, not whether the benchmarks look good in isolation. Run Experiment 4: T18 to T23 with and without retrieve — pass rate, steps to first relevant file, tokens. Answer the remaining questions in You should be able to answer. Attempt Checkpoint above. With numbers in hand, write down, honestly, whether rig should ship retrieve and for which kinds of question. Build A labeled set: 40 natural-language questions about openai-agents-pythonv0.23.1, each with its relevant files and functions. Write them by reading the code (\"where is the max-turns limit enforced?\", \"where are handoff input filters applied?\"). This doubles as Week 11 preparation. BM25 from scratch (about 80 lines) with a code-aware tokenizer. Check your scores against rank_bm25 on the same corpus. A chunker using Python's ast: one chunk per function or class, prefixed with path and qualified name. Embeddings for every chunk from one embedding model, and exact cosine search in NumPy. Then move the vectors into Postgres with pgvector: a chunks table with the model name, the content hash, a generated tsvector column and an HNSW index. docker compose with the pgvector/pgvector image is enough. An HNSW toy of about 200 lines: random levels, greedy descent through upper layers, beam search with ef on layer 0, the neighbor-selection heuristic. Plot recall@10 against brute force for ef of 10, 50 and 200. Hybrid retrieval with RRF, first in Python, then as one SQL query that fuses the pgvector and full-text rankings; then an LLM reranker (the cheap model) over the top 30. A retrieve(query, k=10) tool that returns path:start-end plus the symbol name and a two-line preview, so the agent decides what to read. A repo map in the Aider style for Python only: definitions and references from ast, PageRank over files, rendered into about 1,000 tokens of the system prompt. Typo tolerance and rewriting, each behind a flag: a pg_trgm index on symbol names for fuzzy identifier lookup, and an optional rewrite step with the cheap model (multi-query and HyDE). Project increment rig v0.4 gains retrieve, backed by Postgres with pgvector, and works on the second target. Add six question-answering tasks on openai-agents-python (T18 to T23), graded against answer keys of file:line ranges. Read dorianbrown/rank_bm25, rank_bm25.py (257 lines): BM25.__init__ and _initialize, then BM25Okapi._calc_idf (85) and get_scores (107). The whole BM25 family fits in one file, and the epsilon floor for negative IDF is a real-world detail most write-ups skip. For contrast, xhluca/bm25s precomputes every term-document score into a sparse matrix at index time (BM25.index and retrieve in bm25s/__init__.py), so a query is a sparse-row sum. nmslib/hnswlib, hnswlib/hnswalg.h: getRandomLevel (227), searchBaseLayer (246), searchBaseLayerST (337), getNeighborsByHeuristic2 (475), mutuallyConnectNewElement (538), addPoint (1100 and the overload after it), and searchKnn. Then bruteforce.h (193 lines) as the baseline. This is the reference HNSW, and most vector databases embed it or a close descendant, so reading it removes most of the mystery from vendor comparisons. pgvector/pgvector (second read, C). The same algorithm inside a database, where updates, deletes and filters are the hard part. In src/hnswinsert.c read HnswInsertTupleOnDisk (696), UpdateGraphOnDisk (669) and HnswUpdateNeighborsOnDisk (546). In src/hnswscan.c read hnswgettuple (195), GetScanItems (26) and ResumeScanItems (67). In src/hnswvacuum.c read RepairGraph (379) and MarkDeleted (595), which answer the deletion question below. Then read the README's \"Iterative Index Scans\" section: with a WHERE filter, approximate search filters after the index scan and can return fewer than k rows, so pgvector keeps scanning until it has enough. Filtered nearest-neighbour search is where vector databases actually differ. Finish with the README's \"Hybrid Search\" section, then the PostgreSQL documentation for pg_trgm: similarity, the % operator and its threshold, and trigram GIN indexes. Aider-AI/aider, aider/repomap.py (867 lines): get_tags_raw (279, tree-sitter queries), get_ranked_tags (365, the reference graph and personalized PageRank), get_ranked_tags_map_uncached (629, a binary search on how many tags fit the token budget), to_tree (748). It is retrieval for code with no embeddings at all. Trace these paths: hnswlib insert: addPoint → getRandomLevel → greedy descent from the entry point through layers above the new level → for each lower layer, searchBaseLayer with ef_construction → getNeighborsByHeuristic2 → mutuallyConnectNewElement (shrinking neighbors' lists past M) → update the entry point if the new level is the highest. hnswlib query: searchKnn → greedy descent → searchBaseLayerST on layer 0 with ef → top k. Aider: get_repo_map → get_ranked_tags_map → get_ranked_tags (definitions, references, PageRank personalized toward files in the chat and identifiers mentioned) → to_tree → token-budget fit. You should be able to answer What do k1 and b control, and why does Okapi BM25 need an IDF floor? Can answer What does bm25s gain by scoring at index time, and what does it lose? Can answer Why do HNSW levels follow an exponentially decaying distribution, and what does ef change at construction versus query time? Can answer Why choose neighbors with a heuristic instead of the M nearest? Can answer How does hnswlib delete, and why is true deletion hard in a graph index? Can answer When does brute force beat HNSW outright? Can answer Why does RRF work without calibrating scores across rankers? Can answer How does Aider personalize PageRank, and how does it fit the map into a token budget? Can answer On your own eval, which query types did retrieval win and which did grep win? Can answer When does a rewrite step help retrieval, and what does it cost in latency and in queries that drift from what was asked? Can answer Why does trigram similarity catch retreive when BM25 and full-text search do not, and where does it produce false matches? Can answer Experiments Recall@10 and MRR on the 40 questions for: BM25 with a plain tokenizer, BM25 with the code-aware tokenizer, dense, hybrid, hybrid plus rerank, the repo map, and agentic grep (the files rig opens in its first five steps). Chunking: whole file versus function chunks versus 50-line windows. Your HNSW recall and latency curve against hnswlib's on the same vectors. T18 to T23 with and without retrieve: pass rate, steps to first relevant file, tokens. Stale index: let the agent edit a file without reindexing, and watch retrieval mislead it. Then reindex by content hash after every edit. Typos: a misspelled copy of the 40 questions (one or two edits in each identifier). Recall@10 for BM25, dense and hybrid, then with trigram identifier matching and with a rewrite step. NumPy brute force, your HNSW toy, hnswlib and pgvector's HNSW on the same vectors: recall@10, p95 latency, build time and memory. Production lens Freshness. The agent's own edits make the index stale mid-run. Key chunks by content hash and reindex changed files after each mutating tool call. Model versioning. Vectors from different embedding models are not comparable; store the model id beside every vector and refuse mixed queries. Access control. In multi-tenant systems, filter by permission before ranking, not after, or top-k quietly returns fewer results. Week 14 measures how few. Retrieved text is untrusted. Comments and docs can carry prompt injections; Week 9 tests this. Cost and latency: embedding is a batch job with retries and rate limits; reranking adds a model call to every query. Not yet Hosted vector-database comparisons, GraphRAG, late-interaction models, fine-tuned embeddings, trained query rewriters, and RAG frameworks. Checkpoint You can write BM25 from memory and explain each factor. Your HNSW toy reaches recall@10 of at least 0.95 against brute force at some ef on 50,000 vectors, and you can explain the shape of the curve. With numbers from your own eval, you can say whether rig should ship retrieve, and for which kinds of question.", "tasks": 30}, {"id": "w5", "group": "Weeks", "title": "Week 5: tracing, evals and trajectory evaluation", "short": "Week 5", "html": "<p>You have been tracing and evaluating since Day 1. This week you make the results trustworthy: standard spans, graders you have validated, trajectory metrics, and statistics that tell you whether a change was real. By Sunday you should distrust any single-run improvement, including your own. Everything from Week 10 on is graded by a model, so the grader you validate this week is the instrument for the rest of the plan.</p>\n<h2 id=\"w5-concepts\">Concepts</h2>\n<ul>\n<li><strong>Spans, not logs.</strong> A trace is a tree of timed spans with attributes. The OpenTelemetry GenAI conventions name the agent operations: <code>invoke_agent</code>, <code>chat</code>, <code>execute_tool</code>, <code>plan</code>, <code>invoke_workflow</code>, <code>create_agent</code>. Usage lands in <code>gen_ai.usage.*</code>, tools in <code>gen_ai.tool.*</code>. Capturing message content is opt-in for privacy reasons.</li>\n<li><strong>The anatomy of an eval:</strong> a dataset of tasks with pinned environments, a solver (the agent), a grader, and metrics. Graders are deterministic (tests, exact match), model-graded (a judge with a rubric), or human.</li>\n<li><strong>Outcome versus trajectory.</strong> Outcome grading checks the final state. Trajectory grading checks the path: wasted steps, repeated reads, edits outside scope, tests never run after the last edit, policy violations, recovery after tool errors. A pass with a bad trajectory is a future failure.</li>\n<li><strong>The SWE-bench rule.</strong> An instance is resolved only if every FAIL_TO_PASS test now passes and every PASS_TO_PASS test still passes. Your T04 to T11 already follow it.</li>\n<li><strong>Statistics.</strong> pass@k (at least one of k runs passes) flatters agents; pass^k (all k pass) measures reliability. Use Wilson intervals for rates and paired comparisons on the same tasks for A/B tests. Twelve tasks run three times cannot resolve small differences.</li>\n<li><strong>Judges need validation.</strong> An LLM judge is a classifier; measure its agreement with your labels and watch for verbosity and position bias, and for prompt injection from the transcript it grades.</li>\n<li><strong>Prompts are code.</strong> System prompts, tool descriptions, routing policies and grader rubrics live in files under version control. Each run records the hash of every prompt it used, so a regression points at the change that caused it.</li>\n<li><strong>Eval hygiene:</strong> infrastructure failures are excluded from model metrics, a held-out set is never used for tuning, and eval data never leaks into prompts.</li>\n</ul>\n<h2 id=\"w5-day-by-day\">Day by day</h2>\n<p>Eight Build steps this week, but the real deliverable is trust: by Sunday you should distrust any single-run improvement, including your own. The schedule below front-loads the instruments (spans, graders, statistics) so the weekend's noise-floor and judge-calibration runs have something real to measure against.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read <strong>Concepts</strong> above; note the eval anatomy</td>\n<td>Half-page note: spans vs logs, outcome vs trajectory, pass@k vs pass^k</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>3 to 4 h</td>\n<td>Build steps 1 and 2</td>\n<td>A root <code>invoke_agent</code> span per run with <code>chat</code>/<code>execute_tool</code> children; <code>graders.py</code> with all five graders returning verdict plus evidence</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>3 to 4 h</td>\n<td>Build steps 3 to 5</td>\n<td>Trajectory metrics extracted from traces; <code>report.py</code> with Wilson intervals and a paired bootstrap; a CI gate wired to every prompt/tool change</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Build steps 6 and 7; read SWE-bench, inspect_ai and the OTel conventions; trace both paths</td>\n<td>Prompt hashes shown in every report; the nightly suite running through the Batches API with a measured cache-hit rate</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>Experiments 3 and 5</td>\n<td>A labeled pass-with-bad-trajectory and fail-with-good-trajectory example each; a decision on what trace content you must keep</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td>Build step 8; Experiments 1 and 2</td>\n<td>The sealed 20-task held-out set; the noise floor from five identical runs; judge agreement measured against 30 hand-labeled answers</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Experiment 4; answer remaining questions; attempt <strong>Checkpoint</strong></td>\n<td>One earlier change re-decided with a paired bootstrap; checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w5-day-by-day-mon\">Monday — the vocabulary this week makes precise.</h3>\n<p>\"It passed\" and \"it got better\" are claims you've been making loosely since Week 1. Today you read the vocabulary that lets you stop: spans instead of logs, outcome versus trajectory, pass@k versus pass^k. Everything you build this week exists to make those claims checkable.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> above.</li>\n<li>Write a half-page note: the OTel GenAI span types, and why pass@k flatters an agent while pass^k measures its reliability.</li>\n</ol>\n<h3 id=\"w5-day-by-day-tue\">Tuesday — spans and graders.</h3>\n<p>Today you build the two things every later measurement depends on: a trace that's actually a tree of timed spans instead of a flat JSONL, and a set of graders that return evidence, not just a boolean. Get the grader contract right now, because this week's whole point is that you validate these graders before trusting any of them.</p>\n<ol type=\"1\">\n<li>Build step 1: OTel instrumentation — a root <code>invoke_agent</code> span per run, <code>chat</code> per model call, <code>execute_tool</code> per tool call, with GenAI attributes; a JSONL-to-OTLP converter, not a replacement for the JSONL.</li>\n<li>Build step 2: <code>evals/graders.py</code> — <code>tests_pass</code>, <code>no_test_edits</code>, <code>hidden_tests</code>, <code>answer_mentions</code>, <code>llm_judge</code>, each returning a verdict plus evidence.</li>\n</ol>\n<h3 id=\"w5-day-by-day-wed\">Wednesday — trajectory, statistics, and a gate.</h3>\n<p>A pass rate alone doesn't tell you if a run was good, and a single run's pass rate doesn't tell you if a change was real. Today you build the metrics that grade the path, the statistics that grade the comparison, and the gate that runs both automatically.</p>\n<ol type=\"1\">\n<li>Build step 3: trajectory metrics from traces — redundant reads, repeated calls, time to first relevant file, edit churn, tests run after the last edit, tool-error recovery, policy events, cost.</li>\n<li>Build step 4: <code>evals/report.py</code> — pass@1 and pass^3 with Wilson intervals, and a paired bootstrap between two rig versions on the same tasks.</li>\n<li>Build step 5: a CI gate — T01 to T09 once on every prompt or tool change, the full suite three times nightly.</li>\n</ol>\n<h3 id=\"w5-day-by-day-thu\">Thursday — prompt hashes and batches, then read the two canonical harnesses.</h3>\n<p>Two small Build steps left; both fit before the day's main work, reading SWE-bench's grading code and inspect_ai's task/solver/scorer split, the two references your own harness has been converging on since Week 1.</p>\n<ol type=\"1\">\n<li>Build step 6: versioned prompts — every prompt loaded from <code>prompts/</code>, its content hash on the root span, changed hashes surfaced in every comparison report.</li>\n<li>Build step 7: the nightly suite through the Message Batches API with a 1-hour cache on the shared prefix; record the actual cache-hit rate you get.</li>\n<li>Read SWE-bench's <code>grading.py</code> and <code>run_evaluation.py</code>, and inspect_ai's <code>_react.py</code>, <code>scorer/_model.py</code> and <code>_call_tools.py</code>, listed under <strong>Read</strong> above.</li>\n<li>Trace both paths given there: SWE-bench's <code>main</code> through <code>get_resolution_status</code>, and inspect_ai's <code>eval</code> through <code>task_run_sample</code> to the scorer.</li>\n</ol>\n<h3 id=\"w5-day-by-day-fri\">Friday — look at your own traces, not new numbers.</h3>\n<p>No new runs today, just a close read of what you already have. The point is to find the gap between \"passed\" and \"good,\" and to decide what a trace absolutely must capture before you turn content capture off by default.</p>\n<p>Run Experiments 3 and 5: find one passing run with a bad trajectory and one failing run with a good one, and write a grader for each pattern; then turn off content capture and try to debug three failures, and decide what you must keep.</p>\n<h3 id=\"w5-day-by-day-sat\">Saturday — seal the held-out set, then find your noise floor.</h3>\n<p>Today's Build step is a one-line discipline with real consequences: twenty tasks you write and then don't look at again until Week 18. The rest of the day answers the question this whole week has been building toward — how much of what you called \"progress\" in Weeks 2 to 4 was actually noise.</p>\n<ol type=\"1\">\n<li>Build step 8: write 20 held-out tasks (new seeds, new questions); do not open this set again before Week 18.</li>\n<li>Run Experiment 1, the noise floor: the full suite five times with identical configuration; compute per-task pass rates and intervals.</li>\n<li>Run Experiment 2: label 30 answers from T02 and T18 to T23 yourself, then measure the judge's agreement with and without a rubric.</li>\n</ol>\n<h3 id=\"w5-day-by-day-sun\">Sunday — re-decide one earlier change, then the checkpoint.</h3>\n<p>No new code today. Pick one change from Weeks 2 to 4 you were proud of and find out, with a real paired comparison, whether it actually did anything.</p>\n<ol type=\"1\">\n<li>Run Experiment 4: re-decide one earlier change (fuzzy edits, the repo map, observation masking) with a paired bootstrap against Saturday's noise floor.</li>\n<li>Answer the remaining questions in <strong>You should be able to answer</strong>.</li>\n<li>Attempt <strong>Checkpoint</strong> above. If your judge disagrees with your own labels more than 15% of the time, document why before leaning on it again.</li>\n</ol>\n<h2 id=\"w5-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w5.build.1\"><input aria-label=\"Done\" data-id=\"w5.build.1\" id=\"c-w5-build-1\" type=\"checkbox\"/><div class=\"task-body\">OTel instrumentation: a root <code>invoke_agent</code> span per run, a <code>chat</code> span per model call, an <code>execute_tool</code> span per tool call, with the GenAI attributes. Write a converter from your JSONL to OTLP rather than replacing the JSONL, so the mapping is explicit. View traces in any local OTLP backend.</div></li>\n<li class=\"task do\" data-id=\"w5.build.2\"><input aria-label=\"Done\" data-id=\"w5.build.2\" id=\"c-w5-build-2\" type=\"checkbox\"/><div class=\"task-body\"><code>evals/graders.py</code>: <code>tests_pass(f2p, p2p)</code>, <code>no_test_edits()</code>, <code>hidden_tests(path)</code>, <code>answer_mentions(items, ordered=True)</code>, <code>llm_judge(rubric)</code>. Every grader returns a verdict plus evidence.</div></li>\n<li class=\"task do\" data-id=\"w5.build.3\"><input aria-label=\"Done\" data-id=\"w5.build.3\" id=\"c-w5-build-3\" type=\"checkbox\"/><div class=\"task-body\">Trajectory metrics from traces: redundant reads, repeated identical calls, time to first relevant file, edit churn (lines changed then reverted), tests run after the last edit, tool-error recovery, policy events, cost.</div></li>\n<li class=\"task do\" data-id=\"w5.build.4\"><input aria-label=\"Done\" data-id=\"w5.build.4\" id=\"c-w5-build-4\" type=\"checkbox\"/><div class=\"task-body\"><code>evals/report.py</code>: pass@1 and pass^3 with Wilson intervals, and a paired bootstrap between two rig versions on the same task set.</div></li>\n<li class=\"task do\" data-id=\"w5.build.5\"><input aria-label=\"Done\" data-id=\"w5.build.5\" id=\"c-w5-build-5\" type=\"checkbox\"/><div class=\"task-body\">A CI gate: T01 to T09, one run
