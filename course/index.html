etween the user falling silent and your bot's first sound, each a real number you'll measure Thursday. Read Concepts and map every stage onto the pipeline so Tuesday's build already has a shape in your head. Read Concepts in full. For VAD stop delay, final transcription, model time to first token, TTS time to first audio, and buffering, write one sentence on what determines each. Note which stages a speech-to-speech model would collapse, and why that doesn't make them free. Tuesday — assemble the pipeline. Today you wire pipecat's frame graph end to end for the first time — VAD, STT, rig's runtime, TTS — with no interruption handling and no instrumentation yet. A spoken question producing a spoken answer, however slowly, is the only goal; barge-in and latency come once the happy path exists. Implement Build step 1: Silero VAD, a streaming STT service, rig's runtime in research or personal mode, a streaming TTS service. Run one full turn by voice and confirm the answer comes back as audio. Wednesday — real-time behavior: barge-in and sentence streaming. Today the pipeline stops assuming the user waits politely. Add barge-in (stop playback, cancel the model stream and any not-yet-started tool calls, truncate the transcript to what was actually played) and sentence-level streaming (send the first sentence to TTS before the model finishes) — the two mechanisms that make a voice agent feel real-time instead of like a slow phone tree. Implement Build step 2 (barge-in); confirm interrupting mid-sentence stops audio immediately. Implement Build step 4 (sentence-level streaming); confirm the first sentence reaches TTS before the model's full response is generated. Interrupt yourself mid-bot-sentence a few times by hand and read the resulting transcript: it must say what was actually played, not what was generated. Thursday — read pipecat, then instrument. pipecat's own frame types and VAD defaults are the reference for exactly the mechanism you built Wednesday by feel. Read it to see the real implementation, then add Build step 3's instrumentation with those frame boundaries in mind — you now know exactly which frame transition each timestamp belongs to. Read Read: pipecat in full, following the given trace path. Implement Build step 3: timestamps at end of user speech, VAD stop, final transcript, model first token, first synthesized audio, playback start. Report p50 and p95 per segment on a handful of turns. Friday — find the knobs that actually move latency. No new code today. Run the four experiments in Experiments below against the pipeline you built Tuesday to Thursday. Write up what moved in notes/week17-experiments.md: which knob changed perceived latency, and which just moved cost around. Saturday — the voice eval ladder. Today you run V01 to V10, covering the failure modes a pure latency number hides — a correction mid-answer, a long pause that must not get cut off, a tool request. Passing them is what lets you claim rig works by voice, not just that it's fast. Run Build step 5's evals V01 to V10. Confirm Project increment: a voice front end for research and personal modes, with barge-in and a latency report. Sunday — optional extras, then checkpoint. Optional if time allows; otherwise go straight to the checkpoint, the real signal for whether Week 17 is done. Optional: an on-device wake word, or an image-input path (Build step 6). Attempt Checkpoint below cold. Build rig/voice/: a pipecat pipeline with Silero VAD, a streaming speech-to-text service, rig's runtime (research or personal mode) and a streaming text-to-speech service. Barge-in: when the user starts speaking, stop playback, cancel the model stream and any tool calls not yet started, and truncate the assistant's message to what was played. Latency instrumentation: timestamps for end of user speech, VAD stop, final transcript, model first token, first synthesized audio and playback start; report p50 and p95 per segment. Sentence-level streaming: send the first sentence to text-to-speech before the model finishes. Voice evals V01–V10: short factual questions, a multi-turn task with a correction mid-answer, an interruption mid-sentence, a noisy-room recording, a long pause mid-thought (the agent must not cut in), and a tool request (\"what's on my calendar tomorrow?\"). Optional: an on-device wake word, and an image input path (a photo of a document, then a question about it). Project increment rig v0.17: a voice front end for research and personal modes, with barge-in and a latency report. Read: pipecat pipecat-ai/pipecat at a3b149f, an open-source framework for realtime voice and multimodal agents. src/pipecat/frames/frames.py (2,662 lines; skim): InterruptionFrame (1241), UserStartedSpeakingFrame (1253), BotStartedSpeakingFrame (1411). src/pipecat/processors/frame_processor.py: FrameProcessor (194), queue_frame (699), process_frame (819), push_frame (1007) and _start_interruption (1133). src/pipecat/pipeline/pipeline.py (202 lines): PipelineSource (21), PipelineSink (55) and Pipeline (91). Then pipeline/worker.py: PipelineWorker (202), run (866) and queue_frame (911). PipelineTask is deprecated in favour of PipelineWorker. src/pipecat/audio/vad/vad_analyzer.py: VADParams (47; defaults of confidence 0.7, start 0.2 s, stop 0.2 s) and VADAnalyzer (63). Then silero.py: SileroVADAnalyzer (130) and voice_confidence (199). src/pipecat/turns/: the end-of-turn strategies, including speculation_gate.py and eager_end_of_turn_mixin.py. Trace this path: an input audio frame → the VAD analyzer → UserStartedSpeakingFrame → if the bot is speaking, an InterruptionFrame, and _start_interruption clears queued frames → speech-to-text frames → the user stops (after stop_secs) → the aggregated user turn → the model service streams text frames → text-to-speech streams audio frames → BotStartedSpeakingFrame → output. You should be able to answer Where does each millisecond between the end of the user's speech and the first audio go in your pipeline? Can answer What does stop_secs trade off, and why isn't silence alone a good end-of-turn signal? Can answer What happens to queued frames when an interruption arrives, and why are interruptions system frames? Can answer After a barge-in, what should the transcript say the assistant said? Can answer Which tool calls can be cancelled mid-flight during a barge-in, and which must be allowed to finish (Week 15)? Can answer What leaves an always-listening device before and after the wake word? Can answer Experiments stop_secs at 0.2, 0.5 and 0.8 s: false cut-ins against latency. Sentence streaming to text-to-speech on and off: time to first audio. A cascaded pipeline against a speech-to-speech model, if you have access to one: latency, quality and tool-calling reliability. Interrupt at 20 random points; check the transcript is truthful and no tool runs twice. Production lens Per-segment latency SLOs, with p95 mattering more than p50 for how a conversation feels. Audio is sensitive data: consent, retention, and on-device processing where possible. Transport: WebRTC against WebSockets, jitter buffers, packet loss. Cost per minute adds speech-to-text, model and text-to-speech. Not yet Training speech models, echo-cancellation internals, and building a WebRTC stack. Checkpoint Median time from end of speech to first audio is reported with a breakdown, and you can name the biggest segment and what would shrink it. Barge-in stops audio, cancels generation and leaves a truthful transcript in all 20 interruptions. V01–V10 pass with the same policy and memory behaviour as text mode.", "tasks": 19}, {"id": "w18", "group": "Weeks", "title": "Week 18: production architecture, capability evals and your graduation project", "short": "Week 18", "html": "<p>This week you put research, work and personal modes behind one runtime, evaluate by capability rather than one score, run the held-out set once, and finish the graduation project for your track. The architecture is the diagram in \"The central project\"; the point of the week is that every box has an eval and every risk has a mechanism you can point to in code.</p>\n<h2 id=\"w18-concepts\">Concepts</h2>\n<ul>\n<li><strong>One runtime, three modes.</strong> A mode is a configuration: system prompt, tool set, grants and budgets. A hard upfront router is a classifier with its own error rate; prefer one agent with mode-scoped tools, and if you keep a router, evaluate it like any other component.</li>\n<li><strong>Trust layering.</strong> The sandbox wraps only code execution and the browser. Sessions, memory, the tool ledger, workflows, artifacts and the policy service live on the trusted side, where sandboxed code cannot write them.</li>\n<li><strong>Evaluate by capability.</strong> One headline score hides regressions; a suite per capability shows them. Report pass@1 and pass^3, cost per success, p50 and p95 latency, peak input tokens and compaction events, and tool-error and policy-violation rates for each.</li>\n<li><strong>Online evaluation.</strong> Offline suites catch the regressions you thought of; production traffic finds the rest. Collect explicit feedback (thumbs, a reason) and implicit signals (regenerations, edits, abandoned turns), sample traces into a review queue graded by your judge, and ship changes behind A/B splits or as shadow runs on copies of live requests. Open WebUI turns side-by-side votes into Elo ratings per model.</li>\n<li><strong>Cross-mode regressions.</strong> A prompt or tool change for one mode runs every suite before it merges.</li>\n</ul>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Suite</th>\n<th>Core metrics</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Research</td>\n<td>Accuracy, citation precision and recall, freshness, source quality, time to first token</td>\n</tr>\n<tr class=\"even\">\n<td>Work</td>\n<td>Task, computation and artifact correctness; tool and sandbox errors</td>\n</tr>\n<tr class=\"odd\">\n<td>Personal</td>\n<td>Memory precision and recall, connector correctness, approval and schedule correctness</td>\n</tr>\n<tr class=\"even\">\n<td>Runtime</td>\n<td>Resume success, duplicate side effects, timeouts, retries, overflows, budget exits</td>\n</tr>\n<tr class=\"odd\">\n<td>Browser</td>\n<td>Task completion, wrong clicks, forbidden actions, approval compliance, injection resistance</td>\n</tr>\n<tr class=\"even\">\n<td>Voice</td>\n<td>End of speech to first audio, false cut-ins, barge-in transcript truthfulness</td>\n</tr>\n<tr class=\"odd\">\n<td>Multi-user</td>\n<td>Cross-user reads (target zero), p95 time to first token under load, fairness when one user floods</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"w18-day-by-day\">Day by day</h2>\n<p>Last week of the plan, and the heaviest skew toward the graduation project of any week: Tuesday to Thursday wire the plumbing (one front door, CI, feedback, retention, the held-out run), and Friday through Sunday are almost entirely your track's project and the write-ups it feeds.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read Concepts; commit to your track if you haven't</td>\n<td>A half-page note on why one agent with mode-scoped tools beats a hard router</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2 to 3 h</td>\n<td><code>rig/app/</code>: one front door for all three modes; capability suites wired into CI</td>\n<td>Every request carries user, mode, budget and grants; CI runs a subset on a trivial change</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2 to 4 h</td>\n<td>Feedback and experiment plumbing; a retention policy per store</td>\n<td>Thumbs and regenerate events land on every answer; <code>rig admin delete-user</code> actually clears every store</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>2 h</td>\n<td>Run the Week 5 held-out set once; scope your track's graduation project</td>\n<td>The held-out write-up exists, with intervals, and is not rerun; your task is picked and its fixtures lined up</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>3 to 4 h</td>\n<td>Graduation project, day one</td>\n<td>Your track's project runs end to end at a basic level; the other two tracks' basic versions also pass</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td>Graduation project, day two; the production concerns document</td>\n<td>Your track's project is at public-write-up quality, with numbers; every row of Production concerns, mapped points at code</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>2 to 3 h</td>\n<td>Publish the write-up; final checkpoint</td>\n<td>Write-up published; Final checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w18-day-by-day-mon\">Monday — one runtime, three modes.</h3>\n<p>No code today. Everything else this week assumes modes are configuration, not separate agents, and that one headline score would hide exactly the regressions you're about to spend the week catching. Read <strong>Concepts</strong>, and if you haven't committed to a track yet, decide now — Thursday's scoping depends on it.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> in full.</li>\n<li>Write a half-page note on why a hard upfront router is a classifier with its own error rate, and what that costs you against mode-scoped tools on one agent.</li>\n<li>If undecided, pick your track from <strong>Graduation projects</strong> below.</li>\n</ol>\n<h3 id=\"w18-day-by-day-tue\">Tuesday — the front door and CI.</h3>\n<p>Today all three modes stop being separate code paths and become configuration behind one API — Week 14's surface, extended so every request carries a mode alongside its budget and grants. Wire the capability suites into CI now, before the rest of the week's changes need a regression gate to run against.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: <code>rig/app/</code> as the one front door for conversations, runs, approvals and schedules across modes.</li>\n<li>Implement <strong>Build</strong> step 2: CI running capability-suite subsets on every change, full suites nightly, blocking on regressions judged with Week 5's paired comparisons.</li>\n<li>Make a trivial change in one mode and confirm CI catches a deliberate regression in another.</li>\n</ol>\n<h3 id=\"w18-day-by-day-wed\">Wednesday — feedback loop and retention.</h3>\n<p>Today you close two loops that don't show up in any offline eval: online signal (thumbs, regenerations, a sampled review queue, an experiment flag) and the deletion path a real multi-user service owes its users. Neither is exciting; both are load-bearing for the production document you write Saturday.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 3: feedback and regenerate events, a nightly sampling job into your Week 5 judge, an experiment flag reported with a paired comparison.</li>\n<li>Implement <strong>Build</strong> step 4: a retention policy per store (messages, traces, caches, artifacts, backups), enforced by a Week 15 scheduled job.</li>\n<li>Run <code>rig admin delete-user</code> against a fixture account and confirm every store is actually clean.</li>\n</ol>\n<h3 id=\"w18-day-by-day-thu\">Thursday — the held-out set, once, then scope the graduation project.</h3>\n<p>The held-out set only means something if you run it exactly once and don't tune on it, so do that before the graduation project tempts you to go patch something it exposes. Then scope your track's project: what you'll build, what fixture data or repo you need, and what your graders check for it.</p>\n<ol type=\"1\">\n<li>Run <strong>Build</strong> step 5: the Week 5 held-out set, once, written up with intervals. Do not rerun it.</li>\n<li>Read your track's prompt under <strong>Graduation projects</strong> below and write down, before coding, what each grader needs to see.</li>\n<li>Line up whatever fixtures the project needs: nothing extra for the research prompt; the two CSVs, the PDF and a repo for the work prompt; fixture email and calendar for the personal prompt.</li>\n</ol>\n<h3 id=\"w18-day-by-day-fri\">Friday — graduation project, day one.</h3>\n<p>Today you build your track's project to a basic, end-to-end level, and confirm the other two tracks' basic versions also run — the task asks for all three at a basic level before your own track goes deep. This is the week's biggest block of new code; Tuesday through Thursday exist to support it.</p>\n<ol type=\"1\">\n<li>Build your track's project from <strong>Graduation projects</strong> end to end at a basic level.</li>\n<li>Get the other two tracks' projects running at a basic level too, even if shallow.</li>\n<li>Run your track's graders against your first end-to-end pass and read every failure.</li>\n</ol>\n<h3 id=\"w18-day-by-day-sat\">Saturday — graduation project, day two, and the production document.</h3>\n<p>Today you take your own track's project from \"runs\" to \"published with numbers,\" and write the two-page \"rig in production\" document that <strong>Production concerns, mapped</strong> structures for you. The document is not new prose per concern — it's a pointer, row by row, to the actual mechanism in your code.</p>\n<ol type=\"1\">\n<li>Finish your track's project to public-write-up quality: fix what Friday's grader run exposed, and compute the numbers your track's graders ask for.</li>\n<li>Write <strong>Build</strong> step 7's document, one line per row of <strong>Production concerns, mapped</strong> pointing at a file and mechanism, using the failed-run traces from <strong>Read</strong> where a row needs evidence you don't already have.</li>\n</ol>\n<h3 id=\"w18-day-by-day-sun\">Sunday — publish, then the final checkpoint.</h3>\n<p>The last day of the plan is paperwork that matters: get the write-up out where someone else can read it, then attempt the checkpoint cold. Passing it, not finishing eighteen weeks on the calendar, is the actual finish line.</p>\n<ol type=\"1\">\n<li>Publish the final write-up (<strong>Build</strong> step 8, Appendix E).</li>\n<li>Attempt <strong>Final checkpoint</strong> below cold; if a row has no code to point to, that's your redo list, not a footnote.</li>\n</ol>\n<h2 id=\"w18-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w18.build.1\"><input aria-label=\"Done\" data-id=\"w18.build.1\" id=\"c-w18-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/app/</code>: Week 14's API becomes the one front door for all three modes (conversations, runs, approvals, schedules). Modes are configurations; every request carries user, mode, budget and grants.</div></li>\n<li class=\"task do\" data-id=\"w18.build.2\"><input aria-label=\"Done\" data-id=\"w18.build.2\" id=\"c-w18-build-2\" type=\"checkbox\"/><div class=\"task-body\">CI that runs capability-suite subsets on every change and the full suites nightly, blocking merges on regressions judged with Week 5's paired comparisons.</div></li>\n<li class=\"task do\" data-id=\"w18.build.3\"><input aria-label=\"Done\" data-id=\"w18.build.3\" id=\"c-w18-build-3\" type=\"checkbox\"/><div class=\"task-body\">Feedback and experiments: thumbs and regenerate events on every answer, a nightly job that samples traces into a review queue graded by your Week 5 judge, and an experiment flag that splits users between two configurations, reported with Week 5's paired comparison.</div></li>\n<li class=\"task do\" data-id=\"w18.build.4\"><input aria-label=\"Done\" data-id=\"w18.build.4\" id=\"c-w18-build-4\" type=\"checkbox\"/><div class=\"task-body\">Retention: a policy per store (messages, traces, caches, artifacts, backups), enforced by a Week 15 scheduled job and checked by <code>rig admin delete-user</code>.</div></li>\n<li class=\"task do\" data-id=\"w18.build.5\"><input aria-label=\"Done\" data-id=\"w18.build.5\" id=\"c-w18-build-5\" type=\"checkbox\"/><div class=\"task-body\">Run the Week 5 held-out set exactly once and write it up with intervals.</div></li>\n<li class=\"task do\" data-id=\"w18.build.6\"><input aria-label=\"Done\" data-id=\"w18.build.6\" id=\"c-w18-build-6\" type=\"checkbox\"/><div class=\"task-body\">Your graduation project (below).</div></li>\n<li class=\"task do\" data-id=\"w18.build.7\"><input aria-label=\"Done\" data-id=\"w18.build.7\" id=\"c-w18-build-7\" type=\"checkbox\"/><div class=\"task-body\">\"rig in production\": a two-page design document organized by the table below.</div></li>\n<li class=\"task do\" data-id=\"w18.build.8\"><input aria-label=\"Done\" data-id=\"w18.build.8\" id=\"c-w18-build-8\" type=\"checkbox\"/><div class=\"task-body\">Publish the final write-up (Appendix E).</div></li>\n</ol>\n<h2 id=\"w18-project-increment\">Project increment</h2>\n<p>rig v1.0: one runtime with research, work and personal modes, every capability suite in CI, and your graduation project.</p>\n<h2 id=\"w18-graduation-projects\">Graduation projects</h2>\n<p>Do all three at a basic level, then take your track's project to a public write-up with numbers. These three come from the 12-week draft and are kept as written.</p>\n<ol type=\"1\">\n<li><strong>Research track.</strong> \"Research how NVIDIA's datacenter strategy has changed over the past six months. Reconcile conflicting reports and support every major factual claim with sources.\" Exercises fresh search, query decomposition, ranking and deduplication, iterative research, citation provenance and synthesis. Score with your R-suite graders plus a manual citation audit.</li>\n<li><strong>Work track.</strong> Input: two CSVs, one PDF and a git repository. \"Determine why this metric regressed. Validate your hypothesis using code and repository evidence. Produce a report and charts.\" Exercises file understanding, code search, shell and Python execution, long-context management, and artifact creation and verification.</li>\n<li><strong>Personal track.</strong> Using fixture email and calendar first: \"Over the next month, help me prepare for a conference. Track important deadlines, research attendees before meetings, generate a Monday briefing, and adjust when my calendar changes. Ask before changing anything important.\" Exercises memory, connectors, research, scheduled execution, durable state, change detection, approvals and proactive work.</li>\n</ol>\n<h2 id=\"w18-production-concerns-mapped\">Production concerns, mapped</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Concern</th>\n<th>Mechanism in rig</th>\n<th>Where you saw it in real code</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Timeouts</td>\n<td>HTTP 300 s; tool timeout inside the sandbox; run wall clock; approval expiry; voice turn budget</td>\n<td>mini-swe-agent <code>_run</code>; pi <code>bash.ts</code>; pipecat <code>VADParams</code></td>\n</tr>\n<tr class=\"even\">\n<td>Retries</td>\n<td>Model calls only, jittered backoff honouring <code>retry-after</code>; tools never retried by the harness</td>\n<td>SDK <code>_should_retry</code>; pi <code>_prepareRetry</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Context limits</td>\n<td>Accounting, masking, tool-result clearing, compaction, one retry after overflow; deliberate cache breakpoints and TTLs</td>\n<td>pi <code>compaction.ts</code>; inspect <code>_handle_overflow</code>; OpenHands view properties</td>\n</tr>\n<tr class=\"even\">\n<td>Duplicate tool execution</td>\n<td>Ledger keyed on run, step and call index; intent and result rows; reconcile by tool class</td>\n<td>DBOS <code>operation_outputs</code>; your crash fuzzer</td>\n</tr>\n<tr class=\"odd\">\n<td>Process crashes</td>\n<td>Model responses recorded before tools run; resume replays recorded outputs</td>\n<td>DBOS recovery; LangGraph checkpoints; pi durable</td>\n</tr>\n<tr class=\"even\">\n<td>Provider failures and rate limits</td>\n<td>Typed errors, circuit breaker, global token bucket, eval-approved fallback</td>\n<td>pi <code>_isRetryableError</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Idempotency</td>\n<td>Keys passed to external APIs; content-hash preconditions; run ids derived from schedule slots</td>\n<td>your <code>edit_file</code> v3; OpenHands automation <code>SKIP LOCKED</code></td>\n</tr>\n<tr class=\"even\">\n<td>Checkpointing</td>\n<td>Postgres (SQLite WAL locally), a row per step, committed before output</td>\n<td>LangGraph <code>BaseCheckpointSaver</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Permissions</td>\n<td>A separate policy service; scoped, expiring grants; durable approvals; audit events</td>\n<td>Muse's Sentinel (as described); Codex <code>execpolicy</code>; srt</td>\n</tr>\n<tr class=\"even\">\n<td>Sandboxing</td>\n<td>Per-user workspace; OS sandbox or container; no secrets inside; egress allowlist; isolated browser profile</td>\n<td>sandbox-runtime; OpenHands workspaces; browser-use profiles</td>\n</tr>\n<tr class=\"odd\">\n<td>Multi-tenancy</td>\n<td>Row-level security; caches and vectors keyed by user; one run per conversation; per-user quotas</td>\n<td>Open WebUI tenant collections; procrastinate locks; your isolation suite</td>\n</tr>\n<tr class=\"even\">\n<td>Data retention and deletion</td>\n<td>A policy per store; deletion as a workflow with a checker</td>\n<td>Open WebUI <code>delete_user_by_id</code></td>\n</tr>\n<tr class=\"odd\">\n<td>Untrusted input</td>\n<td>Tagging; research mode without shell or writes; destination-aware gate; inbound email treated as data</td>\n<td>Brave's Comet disclosure; your red-team suites</td>\n</tr>\n<tr class=\"even\">\n<td>Cost and token budgets</td>\n<td>Hierarchical budgets; caps per run; per-call model and effort routing; cost per success in reports</td>\n<td>mini-swe-agent <code>cost_limit</code>; search_evals cost accounting</td>\n</tr>\n<tr class=\"odd\">\n<td>Latency</td>\n<td>Time-to-first-token budgets for research and voice; effort ceilings per mode; prefix caching; streaming</td>\n<td>Perplexity's Search API post; nano-vllm; pipecat</td>\n</tr>\n<tr class=\"even\">\n<td>Observability</td>\n<td>OTel spans, trajectory metrics, capability suites, regression gate</td>\n<td>OTel GenAI conventions; SWE-bench grading</td>\n</tr>\n<tr class=\"odd\">\n<td>Online quality</td>\n<td>Feedback events, sampled judge review, A/B splits</td>\n<td>Open WebUI evaluations and Elo</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"w18-read\">Read</h2>\n<p>Your own system. Pick three failed runs from each capability suite and trace each one end to end, from the request to the failing step, using only your traces. Then re-read Perplexity's Search API post and the Muse coverage and list every mechanism they describe that rig does not have. Then Open WebUI's feedback loop at <code>v0.11.4</code>: <code>backend/open_webui/models/feedbacks.py</code> (<code>Feedback</code>, 20) and <code>routers/evaluations.py</code>: <code>_calculate_elo</code> (86) and <code>get_leaderboard</code> (223), which reweights votes by how similar their tags are to a query.</p>\n<h2 id=\"w18-not-yet\">Not yet (after the eighteen weeks)</h2>\n<p>Temporal's internals, building a workflow engine at scale, agent hosting on Kubernetes, and training models on your own trajectories. With the primitives in hand, each is a reading project rather than a new field.</p>\n<h2 id=\"w18-final-checkpoint\">Final checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w18.check.1\"><input aria-label=\"Done\" data-id=\"w18.check.1\" id=\"c-w18-check-1\" type=\"checkbox\"/><div class=\"task-body\">One runtime serves all three modes; every capability suite runs in CI; a change in one mode cannot merge if another regresses.</div></li>\n<li class=\"task do\" data-id=\"w18.check.2\"><input aria-label=\"Done\" data-id=\"w18.check.2\" id=\"c-w18-check-2\" type=\"checkbox\"/><div class=\"task-body\">The held-out result is reported once, with intervals, and you did not tune on it.</div></li>\n<li class=\"task do\" data-id=\"w18.check.3\"><input aria-label=\"Done\" data-id=\"w18.check.3\" id=\"c-w18-check-3\" type=\"checkbox\"/><div class=\"task-body\">Your graduation project is published with numbers, and your \"rig in production\" document covers every row of the table; a reviewer finds no concern you cannot point to in code.</div></li>\n</ul>\n", "toc": [["w18-concepts", "Concepts", []], ["w18-day-by-day", "Day by day", [["w18-day-by-day-mon", "Monday — one runtime, three modes."], ["w18-day-by-day-tue", "Tuesday — the front door and CI."], ["w18-day-by-day-wed", "Wednesday — feedback loop and retention."], ["w18-day-by-day-thu", "Thursday — the held-out set, once, then scope the graduation project."], ["w18-day-by-day-fri", "Friday — graduation project, day one."], ["w18-day-by-day-sat", "Saturday — graduation project, day two, and the production document."], ["w18-day-by-day-sun", "Sunday — publish, then the final checkpoint."]]], ["w18-build", "Build", []], ["w18-project-increment", "Project increment", []], ["w18-graduation-projects", "Graduation projects", []], ["w18-production-concerns-mapped", "Production concerns, mapped", []], ["w18-read", "Read", []], ["w18-not-yet", "Not yet (after the eighteen weeks)", []], ["w18-final-checkpoint", "Final checkpoint", []]], "text": "This week you put research, work and personal modes behind one runtime, evaluate by capability rather than one score, run the held-out set once, and finish the graduation project for your track. The architecture is the diagram in \"The central project\"; the point of the week is that every box has an eval and every risk has a mechanism you can point to in code. Concepts One runtime, three modes. A mode is a configuration: system prompt, tool set, grants and budgets. A hard upfront router is a classifier with its own error rate; prefer one agent with mode-scoped tools, and if you keep a router, evaluate it like any other component. Trust layering. The sandbox wraps only code execution and the browser. Sessions, memory, the tool ledger, workflows, artifacts and the policy service live on the trusted side, where sandboxed code cannot write them. Evaluate by capability. One headline score hides regressions; a suite per capability shows them. Report pass@1 and pass^3, cost per success, p50 and p95 latency, peak input tokens and compaction events, and tool-error and policy-violation rates for each. Online evaluation. Offline suites catch the regressions you thought of; production traffic finds the rest. Collect explicit feedback (thumbs, a reason) and implicit signals (regenerations, edits, abandoned turns), sample traces into a review queue graded by your judge, and ship changes behind A/B splits or as shadow runs on copies of live requests. Open WebUI turns side-by-side votes into Elo ratings per model. Cross-mode regressions. A prompt or tool change for one mode runs every suite before it merges. Suite Core metrics Research Accuracy, citation precision and recall, freshness, source quality, time to first token Work Task, computation and artifact correctness; tool and sandbox errors Personal Memory precision and recall, connector correctness, approval and schedule correctness Runtime Resume success, duplicate side effects, timeouts, retries, overflows, budget exits Browser Task completion, wrong clicks, forbidden actions, approval compliance, injection resistance Voice End of speech to first audio, false cut-ins, barge-in transcript truthfulness Multi-user Cross-user reads (target zero), p95 time to first token under load, fairness when one user floods Day by day Last week of the plan, and the heaviest skew toward the graduation project of any week: Tuesday to Thursday wire the plumbing (one front door, CI, feedback, retention, the held-out run), and Friday through Sunday are almost entirely your track's project and the write-ups it feeds. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts; commit to your track if you haven't A half-page note on why one agent with mode-scoped tools beats a hard router Tue 2 to 3 h rig/app/: one front door for all three modes; capability suites wired into CI Every request carries user, mode, budget and grants; CI runs a subset on a trivial change Wed 2 to 4 h Feedback and experiment plumbing; a retention policy per store Thumbs and regenerate events land on every answer; rig admin delete-user actually clears every store Thu 2 h Run the Week 5 held-out set once; scope your track's graduation project The held-out write-up exists, with intervals, and is not rerun; your task is picked and its fixtures lined up Fri 3 to 4 h Graduation project, day one Your track's project runs end to end at a basic level; the other two tracks' basic versions also pass Sat 3 to 4 h Graduation project, day two; the production concerns document Your track's project is at public-write-up quality, with numbers; every row of Production concerns, mapped points at code Sun 2 to 3 h Publish the write-up; final checkpoint Write-up published; Final checkpoint passed or a redo list Monday — one runtime, three modes. No code today. Everything else this week assumes modes are configuration, not separate agents, and that one headline score would hide exactly the regressions you're about to spend the week catching. Read Concepts, and if you haven't committed to a track yet, decide now — Thursday's scoping depends on it. Read Concepts in full. Write a half-page note on why a hard upfront router is a classifier with its own error rate, and what that costs you against mode-scoped tools on one agent. If undecided, pick your track from Graduation projects below. Tuesday — the front door and CI. Today all three modes stop being separate code paths and become configuration behind one API — Week 14's surface, extended so every request carries a mode alongside its budget and grants. Wire the capability suites into CI now, before the rest of the week's changes need a regression gate to run against. Implement Build step 1: rig/app/ as the one front door for conversations, runs, approvals and schedules across modes. Implement Build step 2: CI running capability-suite subsets on every change, full suites nightly, blocking on regressions judged with Week 5's paired comparisons. Make a trivial change in one mode and confirm CI catches a deliberate regression in another. Wednesday — feedback loop and retention. Today you close two loops that don't show up in any offline eval: online signal (thumbs, regenerations, a sampled review queue, an experiment flag) and the deletion path a real multi-user service owes its users. Neither is exciting; both are load-bearing for the production document you write Saturday. Implement Build step 3: feedback and regenerate events, a nightly sampling job into your Week 5 judge, an experiment flag reported with a paired comparison. Implement Build step 4: a retention policy per store (messages, traces, caches, artifacts, backups), enforced by a Week 15 scheduled job. Run rig admin delete-user against a fixture account and confirm every store is actually clean. Thursday — the held-out set, once, then scope the graduation project. The held-out set only means something if you run it exactly once and don't tune on it, so do that before the graduation project tempts you to go patch something it exposes. Then scope your track's project: what you'll build, what fixture data or repo you need, and what your graders check for it. Run Build step 5: the Week 5 held-out set, once, written up with intervals. Do not rerun it. Read your track's prompt under Graduation projects below and write down, before coding, what each grader needs to see. Line up whatever fixtures the project needs: nothing extra for the research prompt; the two CSVs, the PDF and a repo for the work prompt; fixture email and calendar for the personal prompt. Friday — graduation project, day one. Today you build your track's project to a basic, end-to-end level, and confirm the other two tracks' basic versions also run — the task asks for all three at a basic level before your own track goes deep. This is the week's biggest block of new code; Tuesday through Thursday exist to support it. Build your track's project from Graduation projects end to end at a basic level. Get the other two tracks' projects running at a basic level too, even if shallow. Run your track's graders against your first end-to-end pass and read every failure. Saturday — graduation project, day two, and the production document. Today you take your own track's project from \"runs\" to \"published with numbers,\" and write the two-page \"rig in production\" document that Production concerns, mapped structures for you. The document is not new prose per concern — it's a pointer, row by row, to the actual mechanism in your code. Finish your track's project to public-write-up quality: fix what Friday's grader run exposed, and compute the numbers your track's graders ask for. Write Build step 7's document, one line per row of Production concerns, mapped pointing at a file and mechanism, using the failed-run traces from Read where a row needs evidence you don't already have. Sunday — publish, then the final checkpoint. The last day of the plan is paperwork that matters: get the write-up out where someone else can read it, then attempt the checkpoint cold. Passing it, not finishing eighteen weeks on the calendar, is the actual finish line. Publish the final write-up (Build step 8, Appendix E). Attempt Final checkpoint below cold; if a row has no code to point to, that's your redo list, not a footnote. Build rig/app/: Week 14's API becomes the one front door for all three modes (conversations, runs, approvals, schedules). Modes are configurations; every request carries user, mode, budget and grants. CI that runs capability-suite subsets on every change and the full suites nightly, blocking merges on regressions judged with Week 5's paired comparisons. Feedback and experiments: thumbs and regenerate events on every answer, a nightly job that samples traces into a review queue graded by your Week 5 judge, and an experiment flag that splits users between two configurations, reported with Week 5's paired comparison. Retention: a policy per store (messages, traces, caches, artifacts, backups), enforced by a Week 15 scheduled job and checked by rig admin delete-user. Run the Week 5 held-out set exactly once and write it up with intervals. Your graduation project (below). \"rig in production\": a two-page design document organized by the table below. Publish the final write-up (Appendix E). Project increment rig v1.0: one runtime with research, work and personal modes, every capability suite in CI, and your graduation project. Graduation projects Do all three at a basic level, then take your track's project to a public write-up with numbers. These three come from the 12-week draft and are kept as written. Research track. \"Research how NVIDIA's datacenter strategy has changed over the past six months. Reconcile conflicting reports and support every major factual claim with sources.\" Exercises fresh search, query decomposition, ranking and deduplication, iterative research, citation provenance and synthesis. Score with your R-suite graders plus a manual citation audit. Work track. Input: two CSVs, one PDF and a git repository. \"Determine why this metric regressed. Validate your hypothesis using code and repository evidence. Produce a report and charts.\" Exercises file understanding, code search, shell and Python execution, long-context management, and artifact creation and verification. Personal track. Using fixture email and calendar first: \"Over the next month, help me prepare for a conference. Track important deadlines, research attendees before meetings, generate a Monday briefing, and adjust when my calendar changes. Ask before changing anything important.\" Exercises memory, connectors, research, scheduled execution, durable state, change detection, approvals and proactive work. Production concerns, mapped Concern Mechanism in rig Where you saw it in real code Timeouts HTTP 300 s; tool timeout inside the sandbox; run wall clock; approval expiry; voice turn budget mini-swe-agent _run; pi bash.ts; pipecat VADParams Retries Model calls only, jittered backoff honouring retry-after; tools never retried by the harness SDK _should_retry; pi _prepareRetry Context limits Accounting, masking, tool-result clearing, compaction, one retry after overflow; deliberate cache breakpoints and TTLs pi compaction.ts; inspect _handle_overflow; OpenHands view properties Duplicate tool execution Ledger keyed on run, step and call index; intent and result rows; reconcile by tool class DBOS operation_outputs; your crash fuzzer Process crashes Model responses recorded before tools run; resume replays recorded outputs DBOS recovery; LangGraph checkpoints; pi durable Provider failures and rate limits Typed errors, circuit breaker, global token bucket, eval-approved fallback pi _isRetryableError Idempotency Keys passed to external APIs; content-hash preconditions; run ids derived from schedule slots your edit_file v3; OpenHands automation SKIP LOCKED Checkpointing Postgres (SQLite WAL locally), a row per step, committed before output LangGraph BaseCheckpointSaver Permissions A separate policy service; scoped, expiring grants; durable approvals; audit events Muse's Sentinel (as described); Codex execpolicy; srt Sandboxing Per-user workspace; OS sandbox or container; no secrets inside; egress allowlist; isolated browser profile sandbox-runtime; OpenHands workspaces; browser-use profiles Multi-tenancy Row-level security; caches and vectors keyed by user; one run per conversation; per-user quotas Open WebUI tenant collections; procrastinate locks; your isolation suite Data retention and deletion A policy per store; deletion as a workflow with a checker Open WebUI delete_user_by_id Untrusted input Tagging; research mode without shell or writes; destination-aware gate; inbound email treated as data Brave's Comet disclosure; your red-team suites Cost and token budgets Hierarchical budgets; caps per run; per-call model and effort routing; cost per success in reports mini-swe-agent cost_limit; search_evals cost accounting Latency Time-to-first-token budgets for research and voice; effort ceilings per mode; prefix caching; streaming Perplexity's Search API post; nano-vllm; pipecat Observability OTel spans, trajectory metrics, capability suites, regression gate OTel GenAI conventions; SWE-bench grading Online quality Feedback events, sampled judge review, A/B splits Open WebUI evaluations and Elo Read Your own system. Pick three failed runs from each capability suite and trace each one end to end, from the request to the failing step, using only your traces. Then re-read Perplexity's Search API post and the Muse coverage and list every mechanism they describe that rig does not have. Then Open WebUI's feedback loop at v0.11.4: backend/open_webui/models/feedbacks.py (Feedback, 20) and routers/evaluations.py: _calculate_elo (86) and get_leaderboard (223), which reweights votes by how similar their tags are to a query. Not yet (after the eighteen weeks) Temporal's internals, building a workflow engine at scale, agent hosting on Kubernetes, and training models on your own trajectories. With the primitives in hand, each is a reading project rather than a new field. Final checkpoint One runtime serves all three modes; every capability suite runs in CI; a change in one mode cannot merge if another regresses. The held-out result is reported once, with intervals, and you did not tune on it. Your graduation project is published with numbers, and your \"rig in production\" document covers every row of the table; a reviewer finds no concern you cannot point to in code.", "tasks": 11}, {"id": "app-a", "group": "Appendices", "title": "Appendix A: reading order", "short": "Appendix A: reading order", "html": "<p>Read in this order; each repository arrives only after the week that gives you the primitive it implements. Pins are the commits or tags that the file paths and line numbers in this plan were checked against. Two repositories moved organizations: <code>badlogic/pi-mono</code> is now <code>earendil-works/pi</code>, and <code>anthropic-experimental/sandbox-runtime</code> is now <code>anthropics/sandbox-runtime</code>; the old URLs redirect and the pinned commits are the same.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>#</th>\n<th>Repository</th>\n<th>Pin</th>\n<th>Weeks</th>\n<th>Why it earns the time</th>\n<th>Start with</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td><a href=\"https://github.com/anthropics/anthropic-sdk-python\" rel=\"noopener\" target=\"_blank\">anthropics/anthropic-sdk-python</a></td>\n<td><code>22feda0</code></td>\n<td>1</td>\n<td>A production retry policy in about 40 lines</td>\n<td><code>_base_client.py</code> <code>_should_retry</code></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td><a href=\"https://github.com/SWE-agent/mini-swe-agent\" rel=\"noopener\" target=\"_blank\">SWE-agent/mini-swe-agent</a></td>\n<td><code>04d809c</code></td>\n<td>1</td>\n<td>The whole loop on two screens; the bash-only baseline</td>\n<td><code>agents/default.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td><a href=\"https://github.com/earendil-works/pi\" rel=\"noopener\" target=\"_blank\">earendil-works/pi</a></td>\n<td><code>75a9972</code></td>\n<td>2, 3, 8, 9, 15</td>\n<td>Provider, runtime and harness as separate packages; compaction and cache accounting; virtual-model routing; an MCP client; a durable harness</td>\n<td><code>packages/agent/src/agent-loop.ts</code></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td><a href=\"https://github.com/Aider-AI/aider\" rel=\"noopener\" target=\"_blank\">Aider-AI/aider</a></td>\n<td><code>5dc9490</code></td>\n<td>2, 4</td>\n<td>Text-format edits with fallbacks; code retrieval with PageRank</td>\n<td><code>coders/editblock_coder.py</code>, <code>repomap.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td><a href=\"https://github.com/sgl-project/sglang\" rel=\"noopener\" target=\"_blank\">sgl-project/sglang</a></td>\n<td><code>0b63526</code></td>\n<td>3</td>\n<td>The radix tree behind prefix caching</td>\n<td><code>srt/mem_cache/radix_cache.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td><a href=\"https://github.com/openai/codex\" rel=\"noopener\" target=\"_blank\">openai/codex</a></td>\n<td><code>72c9595</code></td>\n<td>3, 8, 9, 13</td>\n<td>A compaction prompt, cache-preserving effort updates, sandbox profiles, a two-phase memory pipeline</td>\n<td><code>codex-rs/memories/README.md</code></td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td><a href=\"https://github.com/dorianbrown/rank_bm25\" rel=\"noopener\" target=\"_blank\">dorianbrown/rank_bm25</a></td>\n<td><code>47aa3dd</code></td>\n<td>4</td>\n<td>The BM25 family in one 257-line file</td>\n<td><code>rank_bm25.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td><a href=\"https://github.com/nmslib/hnswlib\" rel=\"noopener\" target=\"_blank\">nmslib/hnswlib</a></td>\n<td><code>ca42672</code></td>\n<td>4</td>\n<td>The reference HNSW</td>\n<td><code>hnswlib/hnswalg.h</code></td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td><a href=\"https://github.com/pgvector/pgvector\" rel=\"noopener\" target=\"_blank\">pgvector/pgvector</a></td>\n<td><code>f37c13f</code></td>\n<td>4, 14</td>\n<td>HNSW inside a database: inserts, deletes, filtered search, iterative scans for tenants</td>\n<td><code>src/hnswinsert.c</code>, <code>src/hnswscan.c</code></td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td><a href=\"https://github.com/SWE-bench/SWE-bench\" rel=\"noopener\" target=\"_blank\">SWE-bench/SWE-bench</a></td>\n<td><code>02e7a74</code></td>\n<td>5</td>\n<td>The canonical definition of \"resolved\"</td>\n<td><code> ed lines</td>\n<td><code>routellm/routers/routers.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>17</td>\n<td><a href=\"https://github.com/BerriAI/litellm\" rel=\"noopener\" target=\"_blank\">BerriAI/litellm</a></td>\n<td><code>v1.102.0</code></td>\n<td>8, 10</td>\n<td>A production gateway: complexity routing, session pinning, cache-aware load balancing, semantic cache</td>\n<td><code>router_strategy/complexity_router/README.md</code></td>\n</tr>\n<tr class=\"even\">\n<td>18</td>\n<td><a href=\"https://github.com/modelcontextprotocol/python-sdk\" rel=\"noopener\" target=\"_blank\">modelcontextprotocol/python-sdk</a></td>\n<td><code>v2.3.0</code></td>\n<td>9</td>\n<td>The protocol's version history in code</td>\n<td><code>mcp_types/version.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>19</td>\n<td><a href=\"https://github.com/anthropics/sandbox-runtime\" rel=\"noopener\" target=\"_blank\">anthropics/sandbox-runtime</a></td>\n<td><code>d9aac20</code></td>\n<td>9</td>\n<td>OS-level sandboxing plus an allowlisting egress proxy</td>\n<td><code>src/sandbox/sandbox-manager.ts</code></td>\n</tr>\n<tr class=\"even\">\n<td>20</td>\n<td><a href=\"https://github.com/searxng/searxng\" rel=\"noopener\" target=\"_blank\">searxng/searxng</a></td>\n<td><code>6671d89</code></td>\n<td>10</td>\n<td>Metasearch: fan-out with a deadline, merge, score</td>\n<td><code>searx/search/__init__.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>21</td>\n<td><a href=\"https://github.com/adbar/trafilatura\" rel=\"noopener\" target=\"_blank\">adbar/trafilatura</a></td>\n<td><code>e2f85c9</code></td>\n<td>10</td>\n<td>A main-content extraction cascade</td>\n<td><code>trafilatura/core.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>22</td>\n<td><a href=\"https://github.com/openai/openai-cookbook\" rel=\"noopener\" target=\"_blank\">openai/openai-cookbook</a></td>\n<td><code>0eac144</code></td>\n<td>10</td>\n<td>The two-tool search and fetch contract</td>\n<td><code>examples/deep_research_api/how_to_build_a_deep_research_mcp_server/main.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>23</td>\n<td><a href=\"https://github.com/openai/swarm\" rel=\"noopener\" target=\"_blank\">openai/swarm</a></td>\n<td><code>6af0b4c</code></td>\n<td>11</td>\n<td>Handoffs specified in 292 lines (archived)</td>\n<td><code>swarm/core.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>24</td>\n<td><a href=\"https://github.com/openai/openai-agents-python\" rel=\"noopener\" target=\"_blank\">openai/openai-agents-python</a></td>\n<td><code>v0.23.1</code></td>\n<td>4, 11</td>\n<td>Swarm's ideas hardened: input filters, agent-as-tool</td>\n<td><code>src/agents/handoffs/__init__.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td><a href=\"https://github.com/perplexityai/search_evals\" rel=\"noopener\" target=\"_blank\">perplexityai/search_evals</a></td>\n<td><code>cab4c5d</code></td>\n<td>11</td>\n<td>Perplexity's deep-research benchmark runner</td>\n<td><code>harnesses/base.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>26</td>\n<td><a href=\"https://github.com/OpenHands/software-agent-sdk\" rel=\"noopener\" target=\"_blank\">OpenHands/software-agent-sdk</a></td>\n<td><code>69e2688</code></td>\n<td>12</td>\n<td>Agent, workspace and context cleanly separated</td>\n<td><code>sdk/workspace/base.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>27</td>\n<td><a href=\"https://github.com/docling-project/docling-core\" rel=\"noopener\" target=\"_blank\">docling-project/docling-core</a></td>\n<td><code>v2.101.1</code></td>\n<td>12</td>\n<td>Document structure and chunking that keeps tables and headings</td>\n<td><code>transforms/chunker/hybrid_chunker.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>28</td>\n<td><a href=\"https://github.com/letta-ai/letta-code\" rel=\"noopener\" target=\"_blank\">letta-ai/letta-code</a></td>\n<td><code>42397c7</code></td>\n<td>13</td>\n<td>Memory as a git-backed filesystem</td>\n<td><code>src/agent/memory-filesystem.ts</code></td>\n</tr>\n<tr class=\"odd\">\n<td>29</td>\n<td><a href=\"https://github.com/open-webui/open-webui\" rel=\"noopener\" target=\"_blank\">open-webui/open-webui</a></td>\n<td><code>v0.11.4</code></td>\n<td>5, 10, 14, 18</td>\n<td>A real multi-user assistant: auth, conversations, tenant-scoped vectors, query rewriting, feedback</td>\n<td><code>backend/open_webui/retrieval/vector/dbs/pgvector.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>30</td>\n<td><a href=\"https://github.com/procrastinate-org/procrastinate\" rel=\"noopener\" target=\"_blank\">procrastinate-org/procrastinate</a></td>\n<td><code>3.10.0</code></td>\n<td>14</td>\n<td>A job queue in Postgres: <code>SKIP LOCKED</code>, per-lock ordering, heartbeats</td>\n<td><code>procrastinate/sql/schema.sql</code></td>\n</tr>\n<tr class=\"odd\">\n<td>31</td>\n<td><a href=\"https://github.com/dbos-inc/dbos-transact-py\" rel=\"noopener\" target=\"_blank\">dbos-inc/dbos-transact-py</a></td>\n<td><code>f8f9ee7</code></td>\n<td>15</td>\n<td>Durable execution as readable tables</td>\n<td><code>dbos/_recovery.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>32</td>\n<td><a href=\"https://github.com/langchain-ai/langgraph\" rel=\"noopener\" target=\"_blank\">langchain-ai/langgraph</a></td>\n<td><code>87f1c8e</code></td>\n<td>15</td>\n<td>Superstep checkpoints, pending writes, <code>interrupt</code></td>\n<td><code>checkpoint/base/__init__.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>33</td>\n<td><a href=\"https://github.com/OpenHands/automation\" rel=\"noopener\" target=\"_blank\">OpenHands/automation</a></td>\n<td><code>b43294c</code></td>\n<td>15</td>\n<td>A scheduler and dispatcher with row locks</td>\n<td><code>openhands/automation/scheduler.py</code></td>\n</tr>\n<tr class=\"even\">\n<td>34</td>\n<td><a href=\"https://github.com/browser-use/browser-use\" rel=\"noopener\" target=\"_blank\">browser-use/browser-use</a></td>\n<td><code>c75e847</code></td>\n<td>16</td>\n<td>A browser agent runtime with domain controls</td>\n<td><code>browser/watchdogs/security_watchdog.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td>35</td>\n<td><a href=\"https://github.com/pipecat-ai/pipecat\" rel=\"noopener\" target=\"_blank\">pipecat-ai/pipecat</a></td>\n<td><code>a3b149f</code></td>\n<td>17</td>\n<td>Frames, interruptions and VAD for realtime voice</td>\n<td><code>processors/frame_processor.py</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>Target codebase: <a href=\"https://github.com/pallets/click\" rel=\"noopener\" target=\"_blank\">pallets/click</a> at <code>8.5.0</code>.</p>\n<p><strong>Bootstrap the reading set once.</strong> This clones everything with history but without file contents until checkout, then pins each repository. It was tested on a sample of the list, including the two moved repositories at their pinned commits.</p>\n<div class=\"code-wrap\"><pre><code class=\"language-bash\">mkdir -p reading &amp;&amp; cd reading\nwhile read -r repo ref; do\n  dir=$(basename \"$repo\")\n  git clone --quiet --filter=blob:none --no-checkout \"https://github.com/$repo.git\" \"$dir\"\n  git -C \"$dir\" checkout --quiet \"$ref\"\ndone &lt;&lt;'EOF'\npallets/click 8.5.0\nanthropics/anthropic-sdk-python 22feda0\nSWE-agent/mini-swe-agent 04d809c\nearendil-works/pi 75a9972\nAider-AI/aider 5dc9490\nsgl-project/sglang 0b63526\nopenai/codex 72c9595\ndorianbrown/rank_bm25 47aa3dd\nnmslib/hnswlib ca42672\npgvector/pgvector f37c13f\nSWE-bench/SWE-bench 02e7a74\nUKGovernmentBEIS/inspect_ai 6d252fe\nopen-telemetry/semantic-conventions-genai 06ec68e\nkarpathy/nanochat 92d63d4\nGeeeekExplorer/nano-vllm bb823b3\nPrimeIntellect-ai/verifiers da75527\nlm-sys/RouteLLM 0b64fda\nBerriAI/litellm v1.102.0\nmodelcontextprotocol/python-sdk v2.3.0\nanthropics/sandbox-runtime d9aac20\nsearxng/searxng 6671d89\nadbar/trafilatura e2f85c9\nopenai/openai-cookbook 0eac144\nopenai/swarm 6af0b4c\nopenai/openai-agents-python v0.23.1\nperplexityai/search_evals cab4c5d\nOpenHands/software-agent-sdk 69e2688\ndocling-project/docling-core v2.101.1\nletta-ai/letta-code 42397c ved) swarm/core.py 24 openai/openai-agents-python v0.23.1 4, 11 Swarm's ideas hardened: input filters, agent-as-tool src/agents/handoffs/__init__.py 25 perplexityai/search_evals cab4c5d 11 Perplexity's deep-research benchmark runner harnesses/base.py 26 OpenHands/software-agent-sdk 69e2688 12 Agent, workspace and context cleanly separated sdk/workspace/base.py 27 docling-project/docling-core v2.101.1 12 Document structure and chunking that keeps tables and headings transforms/chunker/hybrid_chunker.py 28 letta-ai/letta-code 42397c7 13 Memory as a git-backed filesystem src/agent/memory-filesystem.ts 29 open-webui/open-webui v0.11.4 5, 10, 14, 18 A real multi-user assistant: auth, conversations, tenant-scoped vectors, query rewriting, feedback backend/open_webui/retrieval/vector/dbs/pgvector.py 30 procrastinate-org/procrastinate 3.10.0 14 A job queue in Postgres: SKIP LOCKED, per-lock ordering, heartbeats procrastinate/sql/schema.sql 31 dbos-inc/dbos-transact-py f8f9ee7 15 Durable execution as readable tables dbos/_recovery.py 32 langchain-ai/langgraph 87f1c8e 15 Superstep checkpoints, pending writes, interrupt checkpoint/base/__init__.py 33 OpenHands/automation b43294c 15 A scheduler and dispatcher with row locks openhands/automation/scheduler.py 34 browser-use/browser-use c75e847 16 A browser agent runtime with domain controls browser/watchdogs/security_watchdog.py 35 pipecat-ai/pipecat a3b149f 17 Frames, interruptions and VAD for realtime voice processors/frame_processor.py Target codebase: pallets/click at 8.5.0. Bootstrap the reading set once. This clones everything with history but without file contents until checkout, then pins each repository. It was tested on a sample of the list, including the two moved repositories at their pinned commits. mkdir -p reading && cd reading\nwhile read -r repo ref; do\n  dir=$(basename \"$repo\")\n  git clone --quiet --filter=blob:none --no-checkout \"https://github.com/$repo.git\" \"$dir\"\n  git -C \"$dir\" checkout --quiet \"$ref\"\ndone <<'EOF'\npallets/click 8.5.0\nanthropics/anthropic-sdk-python 22feda0\nSWE-agent/mini-swe-agent 04d809c\nearendil-works/pi 75a9972\nAider-AI/aider 5dc9490\nsgl-project/sglang 0b63526\nopenai/codex 72c9595\ndorianbrown/rank_bm25 47aa3dd\nnmslib/hnswlib ca42672\npgvector/pgvector f37c13f\nSWE-bench/SWE-bench 02e7a74\nUKGovernmentBEIS/inspect_ai 6d252fe\nopen-telemetry/semantic-conventions-genai 06ec68e\nkarpathy/nanochat 92d63d4\nGeeeekExplorer/nano-vllm bb823b3\nPrimeIntellect-ai/verifiers da75527\nlm-sys/RouteLLM 0b64fda\nBerriAI/litellm v1.102.0\nmodelcontextprotocol/python-sdk v2.3.0\nanthropics/sandbox-runtime d9aac20\nsearxng/searxng 6671d89\nadbar/trafilatura e2f85c9\nopenai/openai-cookbook 0eac144\nopenai/swarm 6af0b4c\nopenai/openai-agents-python v0.23.1\nperplexityai/search_evals cab4c5d\nOpenHands/software-agent-sdk 69e2688\ndocling-project/docling-core v2.101.1\nletta-ai/letta-code 42397c7\nopen-webui/open-webui v0.11.4\nprocrastinate-org/procrastinate 3.10.0\ndbos-inc/dbos-transact-py f8f9ee7\nlangchain-ai/langgraph 87f1c8e\nOpenHands/automation b43294c\nbrowser-use/browser-use c75e847\npipecat-ai/pipecat a3b149f\nEOF\nfor d in */; do printf \"%-40s %s\\n\" \"${d%/}\" \"$(git -C \"$d\" rev-parse HEAD)\"; done > SHAS.txt After the eighteen weeks, in this order: vLLM's vllm/v1/core (the production version of Week 7), the rest of Codex CLI's codex-rs/core, Temporal's documentation on deterministic replay, and Perplexity's research blog. Each will read as a variation on something you have already built.", "tasks": 0}, {"id": "app-b", "group": "Appendices", "title": "Appendix B: glossary, term to primitive", "short": "Appendix B: glossary", "html": "<p>Every entry reduces a term to something you have built in rig. \"Framework-ism\" means the term names a packaging choice rather than a new mechanism.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Term</th>\n<th>Underlying primitive</th>\n<th>Kind</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prompt</td>\n<td>The bytes of one request</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>System prompt</td>\n<td>The first, privileged segment of a request</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Context window</td>\n<td>The maximum tokens one request may hold (input plus output)</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Context engineering</td>\n<td>Choosing and ordering the bytes of each request</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Tokenizer, BPE</td>\n<td>Learned merges from bytes to token ids</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Special token</td>\n<td>A reserved id that marks roles and tool calls; a chat template is these ids around text</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Tool or function calling</td>\n<td>Special tokens the model emits plus an engine that intercepts them; over an API, id-correlated results in the transcript</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Tool schema</td>\n<td>JSON Schema for arguments, sent (and billed) on every request</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Structured output</td>\n<td>Output constrained by a grammar compiled from a schema, or validated against it</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Stop reason</td>\n<td>Why generation ended; the loop's branch condition</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Reasoning or thinking tokens</td>\n<td>Output tokens spent before the answer; billed, sometimes hidden</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Prefill, decode</td>\n<td>Processing the prompt in parallel; generating one token at a time</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>KV cache</td>\n<td>Per-layer attention keys and values for processed tokens</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Prompt caching</td>\n<td>Provider-side reuse of the KV cache for an identical prefix</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Paged KV cache</td>\n<td>The KV cache stored in fixed blocks with a block table, like virtual memory</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Cache TTL, breakpoint</td>\n<td>How long a cached prefix lives and where a request marks it; a bet on when the next request comes</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Tool-result clearing, context editing</td>\n<td>Replacing old tool outputs with placeholders, client- or server-side</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Continuous batching</td>\n<td>Admitting and retiring sequences at every decode step</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Post-training, RLVR, GRPO</td>\n<td>Raising the probability of completions that score well on a checkable reward</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>RL environment</td>\n<td>Task set-up, tools and a reward: an eval harness</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Reward hacking</td>\n<td>Optimizing the grader instead of the task</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Reasoning effort</td>\n<td>A request parameter that scales how many output tokens, thinking and tool calls a model spends</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Model routing</td>\n<td>Choosing the model and effort for each call from features, rules or a learned predictor</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Cascade, escalation</td>\n<td>Trying a cheaper setting first and moving up when a check fails or the task stalls</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Session affinity, pinning</td>\n<td>Keeping a session on one model and effort so its prompt cache stays valid</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Semantic cache</td>\n<td>Reusing a stored answer when a new question's embedding is close enough to an old one</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Agent</td>\n<td>Model plus system prompt plus tools plus a loop plus a stop policy</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Agent loop, ReAct</td>\n<td>A <code>while</code> loop alternating model calls and tool execution</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Runtime</td>\n<td>The machinery that runs loops reliably: events, cancellation, retries, persistence</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Harness, scaffold</td>\n<td>Everything around the model for one product</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Coding agent</td>\n<td>A harness over a repository with read, search, edit and shell tools, verified by tests</td>\n<td>Specialization</td>\n</tr>\n<tr class=\"even\">\n<td>Steering</td>\n<td>A user message injected at the next turn boundary</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Workflow</td>\n<td>Code-defined control flow with model calls as steps</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Durable execution</td>\n<td>Recorded step outputs plus deterministic replay</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Checkpoint</td>\n<td>Serialized state at a step boundary</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Scheduler</td>\n<td>Durable execution with a clock: due slots, leases, missed-run policy</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Short-term memory</td>\n<td>The transcript</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Working memory, scratchpad, todo list</td>\n<td>A file or message the agent rewrites</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Long-term memory</td>\n<td>Text written after one session and loaded into later prompts</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Compaction, condensation</td>\n<td>Replacing a transcript prefix with a summary</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Observation masking</td>\n<td>Replacing old tool outputs with placeholders</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>RAG</td>\n<td>Ranking, then prepending the top results to the prompt</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Agentic search</td>\n<td>The model issuing its own searches through tools</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Answer engine</td>\n<td>Search, fetch, extract, rank passages, synthesize with citations</td>\n<td>Composition</td>\n</tr>\n<tr class=\"odd\">\n<td>Deep research</td>\n<td>An answer engine run for many rounds, often with parallel researchers</td>\n<td>Composition</td>\n</tr>\n<tr class=\"even\">\n<td>Citation provenance</td>\n<td>Claim → evidence id → character offsets in stored source text</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Embedding</td>\n<td>A vector from an encoder model; similarity is a dot product</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Vector database</td>\n<td>An ANN index plus storage, metadata filtering and updates</td>\n<td>Packaging</td>\n</tr>\n<tr class=\"odd\">\n<td>HNSW</td>\n<td>A layered proximity graph searched greedily</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Hybrid search</td>\n<td>Several rankers fused, usually with reciprocal rank fusion</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Query rewriting, multi-query, HyDE</td>\n<td>A model call that turns a message into better search queries before retrieval</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Contextual retrieval</td>\n<td>Prefixing each chunk with a short note on where it sits in its document before indexing</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Trigram matching</td>\n<td>Similarity over three-character substrings, which survives typos</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Reranker</td>\n<td>A pairwise scorer applied to a short list</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Subagent</td>\n<td>A recursive loop call with a fresh transcript that returns a string</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Handoff</td>\n<td>A tool call that swaps the active system prompt and tools</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Agent as tool</td>\n<td>A subagent whose caller keeps control</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Planner/executor</td>\n<td>One call that emits a list, then a loop over the list</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Orchestrator-workers</td>\n<td>Fan-out of subagents plus a merge step</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Multi-agent system</td>\n<td>Several loops connected by function calls or messages</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Guardrail</td>\n<td>A check function before or after a model or tool call</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Skill</td>\n<td>A prompt file, often with scripts, loaded on demand</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>Tool search, deferred tools</td>\n<td>Names in context; schemas loaded on demand</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"even\">\n<td>Code mode</td>\n<td>The model writes a script that calls tools as functions, run in a sandbox</td>\n<td>Framework-ism</td>\n</tr>\n<tr class=\"odd\">\n<td>MCP</td>\n<td>JSON-RPC for listing and calling tools, resources and prompts across processes</td>\n<td>Protocol</td>\n</tr>\n<tr class=\"even\">\n<td>MCP server</td>\n<td>A process that answers those JSON-RPC methods</td>\n<td>Protocol</td>\n</tr>\n<tr class=\"odd\">\n<td>Connector</td>\n<td>An OAuth-scoped API client with incremental sync</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Sandbox</td>\n<td>OS isolation: namespaces, seccomp, Seatbelt, containers or VMs</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Per-user workspace, VM</td>\n<td>An isolated execution environment per user behind a narrow interface</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Multi-tenancy</td>\n<td>Many users on shared infrastructure, separated by keys the database enforces</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Row-level security</td>\n<td>A database policy that filters every query by the current user</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Job queue</td>\n<td>A table of work claimed with row locks (<code>SKIP LOCKED</code>), with heartbeats and retries</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Artifact lineage</td>\n<td>The inputs, code and step that produced an output</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Policy gate (Muse's \"Sentinel\")</td>\n<td>A separate service that decides allow, deny or ask for each proposed action</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Grant</td>\n<td>A scoped, expiring permission: service, access, scope, expiry</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Permission, approval</td>\n<td>A policy check; \"ask\" is a wait for a human</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Approval fatigue</td>\n<td>People approving reflexively because they are asked too often</td>\n<td>Human factors</td>\n</tr>\n<tr class=\"even\">\n<td>Human in the loop</td>\n<td>A durable wait for external input</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Agentic browser</td>\n<td>A loop whose observation is a page and whose actions are navigate, click and type</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Computer use</td>\n<td>A loop whose observation is a screenshot and whose actions are mouse and keyboard</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>VAD, end-of-turn detection</td>\n<td>Detecting speech, then deciding the user has finished</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Barge-in</td>\n<td>Cancelling speech and generation when the user interrupts</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Wake word</td>\n<td>An on-device detector that gates which audio leaves the device</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Trace, span</td>\n<td>A timed tree of operations with attributes</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Trajectory</td>\n<td>The full sequence of model outputs and tool calls in a run</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>Eval</td>\n<td>Dataset plus solver plus grader plus metric</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Trajectory evaluation</td>\n<td>Grading properties of the path, not only the end state</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>LLM as judge</td>\n<td>A model used as a classifier, valid only once measured against labels</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"odd\">\n<td>Online evaluation, A/B test</td>\n<td>Grading live traffic: feedback, sampled review and randomized splits between configurations</td>\n<td>Fundamental</td>\n</tr>\n<tr class=\"even\">\n<td>pass@k, pass^k</td>\n<td>Probability that at least one, or all, of k runs pass</td>\n<td>Fundamental</td>\n</tr>\n</tbody>\n</table></div>\n", "toc": [], "text": "Every entry reduces a term to something you have built in rig. \"Framework-ism\" means the term names a packaging choice rather than a new mechanism. Term Underlying primitive Kind Prompt The bytes of one request Fundamental System prompt The first, privileged segment of a request Fundamental Context window The maximum tokens one request may hold (input plus output) Fundamental Context engineering Choosing and ordering the bytes of each request Fundamental Tokenizer, BPE Learned merges from bytes to token ids Fundamental Special token A reserved id that marks roles and tool calls; a chat template is these ids around text Fundamental Tool or function calling Special tokens the model emits plus an engine
