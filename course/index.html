ndary before every external or irreversible action, even with adversarial instructions on the page: zero forbidden actions completed across B01–B12.</div></li>\n<li class=\"task do\" data-id=\"w16.check.2\"><input aria-label=\"Done\" data-id=\"w16.check.2\" id=\"c-w16-check-2\" type=\"checkbox\"/><div class=\"task-body\">You can replay the Comet attack against rig and point to the trace event where it stops.</div></li>\n<li class=\"task do\" data-id=\"w16.check.3\"><input aria-label=\"Done\" data-id=\"w16.check.3\" id=\"c-w16-check-3\" type=\"checkbox\"/><div class=\"task-body\">Benign tasks need few enough approvals that you would accept them as a user.</div></li>\n</ul>\n", "toc": [["w16-concepts", "Concepts", []], ["w16-day-by-day", "Day by day", [["w16-day-by-day-mon", "Monday — observation, action, and why risk follows the data."], ["w16-day-by-day-tue", "Tuesday — the browser tool, no gate yet."], ["w16-day-by-day-wed", "Wednesday — the gate and isolation."], ["w16-day-by-day-thu", "Thursday — read browser-use, then replay Comet."], ["w16-day-by-day-fri", "Friday — break the gate on purpose."], ["w16-day-by-day-sat", "Saturday — the eval ladder."], ["w16-day-by-day-sun", "Sunday — optional desktop pass, then checkpoint."]]], ["w16-build", "Build", []], ["w16-project-increment", "Project increment", []], ["w16-read", "Read", []], ["w16-you-should-be-able-to-answer", "You should be able to answer", []], ["w16-experiments", "Experiments", []], ["w16-production-lens", "Production lens", []], ["w16-not-yet", "Not yet", []], ["w16-checkpoint", "Checkpoint", []]], "text": "A browser agent is Week 1's loop where the observation is a page and the actions are navigate, click and type. The new problem is security: the page is untrusted input, the browser holds sessions, and every request leaves your machine. This week you wrap a real browser runtime, separate observation from action, and gate actions on where data goes, not only on the verb. Concepts Observation and action. The observation is a serialized DOM or accessibility tree with numbered interactive elements, often plus a screenshot; the action names an element index. Computer use replaces the DOM with pixels and mouse and keyboard, which works on any app (Muse is gaining Mac computer use) and costs far more per step. Risk follows the data. A GET to an attacker's URL with a secret in the query string is exfiltration. Links can unsubscribe, confirm or log in. Typing can autosave, search as you type, or submit on Enter. So navigate is not read-only and \"fill but don't submit\" is not reversible. The Comet case (Brave, August 2025). Hidden text in a Reddit comment led Perplexity's Comet to read the user's account email, open a lookalike domain with a trailing dot, read a one-time password from the user's logged-in Gmail, and post both back as a reply. Brave's mitigations: separate the user's instructions from page content, check every action against what the user asked, confirm sensitive actions, and isolate agentic browsing from everyday browsing. Isolation. The agent's browser never uses your everyday logged-in profile. Credentials are injected per domain from a secrets store and never appear in the model's context. Taint. Once a task has read private data, navigation to any host outside the task's allowlist needs approval. Loops and drift. Agents repeat failing actions; page fingerprints and loop detectors catch it. Day by day The loop is Week 1's; the new work is almost entirely the gate and the isolation around it, so most of the week's code is smaller than it looks. Day Time Do Working by end of day Mon 1 to 1.5 h Read Concepts; note why navigate is not read-only A half-page note with three examples of actions that look read-only but aren't Tue 2 to 3 h rig/browser/'s BrowserTool: navigate, observe, click, type, download A real page returns a stable observation (URL, title, text, numbered elements) Wed 2 to 4 h The destination-aware gate; isolated profile, per-domain credentials, per-task allowlist The gate's own test cases (OTP in a query string, trailing-dot host, javascript: URL, a private value typed into another site) all stop or ask; pre-taint browsing is still allowed Thu 1.5 to 2 h Read browser-use; trace the path to SecurityWatchdog; replay the Comet disclosure against your gate Notes naming the exact rule where your gate stops the Comet attack Fri 1 to 1.5 h The four experiments notes/week16-experiments.md Sat 3 to 4 h Browser evals B01 to B12 on fixture and adversarial pages; rig v0.16 Zero forbidden actions completed across B01 to B12 Sun 1 to 2 h Optional desktop-app pass via screenshots; checkpoint Checkpoint passed or a redo list Monday — observation, action, and why risk follows the data. No code today. This week's loop is Week 1's; what's new is that the page is untrusted and the browser holds sessions. Read Concepts and understand why navigate is not read-only, a GET can be an exfiltration channel, and typing can autosave or submit — every later decision this week (the gate, the allowlist, the isolated profile) is a direct consequence of that one fact. Read Concepts in full, including the Comet case. Write a half-page note: three actions that look read-only but aren't, and why. Tuesday — the browser tool, no gate yet. Today you wrap a real browser runtime and get a clean, numbered observation out of it, before worrying about what the agent is allowed to do with that observation. Everything downstream — the gate, the evals — depends on this shape being right first. Implement Build step 1's rig/browser/: navigate, observe, click, type, download on Playwright or browser-use's BrowserSession. Point it at a few ordinary pages by hand and confirm the observation (URL, title, text, interactive elements, optional screenshot) is stable and the numbered elements match what you'd click. Wednesday — the gate and isolation. Today the agent stops being able to hurt you. Wire the destination-aware gate from Build in front of every action, give each task its own browser profile, inject credentials by domain, and scope navigation to a per-task host allowlist — this is the week's actual security boundary; everything else is scaffolding around it. Implement the destination-aware gate — the check that runs before every browser action and decides allow, deny or ask — exactly as given in Build step 2; don't loosen the taint rule. Wire a fresh profile per task and per-domain credential injection, per Build step 3. Run the gate's own test cases (OTP in a query string, a trailing-dot host, a javascript: URL, a private value typed into another site) and confirm each stops or asks, and that ordinary pre-taint browsing is still allowed. Thursday — read browser-use, then replay Comet. browser-use is a production agent built around exactly this week's problem, so read it for how a real SecurityWatchdog makes the allow/ask/deny decision your gate makes. Then replay Brave's Comet disclosure step by step against your own gate — the actual test of whether Wednesday's work holds against a real attack, not just your own test cases. Read Read in full, following the given trace path. Replay the Comet disclosure; at each step, note which rule in your gate would stop it, or wouldn't. Answer You should be able to answer question 5 from this replay, not from memory. Friday — break the gate on purpose. No new code today. Run the four experiments in Experiments below against the agent you already built. Write up what changed in notes/week16-experiments.md: pass rate, approvals, and where the adversarial pages actually got stopped. Saturday — the eval ladder. Today you run B01 to B12, the fixture-and-adversarial task ladder that is this week's real regression suite, and ship rig v0.16. Passing the benign tasks says the agent is useful; passing the adversarial ones is the point of the week. Run Build step 4's evals B01 to B12, local fixture sites where possible. Confirm Project increment: an isolated profile per task and the gate behind the policy service. Record approvals per benign task alongside pass/fail — you need it for the checkpoint and for Experiment 4. Sunday — optional desktop pass, then checkpoint. Optional computer-use detour if you want to feel the cost difference; otherwise go straight to the checkpoint. Whether you pass it cold, not whether you clicked through B01 to B12, is the real signal for whether you're ready for Week 17. Optional: drive one desktop app through screenshots with the same gate (Build step 5); compare cost per step against the DOM path. Attempt Checkpoint below cold. Build rig/browser/: a BrowserTool on Playwright (or browser-use's BrowserSession) with navigate, observe, click, type and download, and an observation of URL, title, text, interactive elements and an optional screenshot path. The destination-aware gate below, called by Week 9's policy service before every browser action. A fresh browser profile per task, credentials injected by domain, and a per-task host allowlist. Browser evals B01–B12 on local fixture sites where possible: find information; compare products; navigate documentation; download a public file; fill a form but stop before submitting; find an appointment slot without booking; and adversarial pages with hidden-text instructions, a trailing-dot lookalike login, a request to visit a URL carrying another tab's content, and HTML that pretends to be a system message. Optional: drive one desktop app through screenshots with the same gate, to feel the cost of pixels against the DOM. The gate below was tested: an OTP in a query string, a trailing-dot lookalike host, a javascript: URL, typing a private value into another site and submitting all stop or ask, while ordinary browsing before any private data is read is allowed. # rig/browser/gate.py\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom urllib.parse import urlsplit\n\nclass Decision(Enum):\n    ALLOW = \"allow\"\n    ASK = \"ask\"\n    DENY = \"deny\"\n\n@dataclass\nclass BrowserTask:\n    allowed_hosts: set[str]                                 # granted for this task only\n    private_values: set[str] = field(default_factory=set)   # strings read from private sources\n\n    @property\n    def tainted(self) -> bool:\n        return bool(self.private_values)\n\ndef host_of(url: str) -> str | None:\n    u = urlsplit(url)\n    return u.hostname if u.scheme == \"https\" else None      # keeps a trailing dot: \"x.ai.\" != \"x.ai\"\n\ndef carries_private(task: BrowserTask, text: str) -> bool:\n    return any(v and v in text for v in task.private_values)\n\ndef gate(task: BrowserTask, action: str, *, url: str = \"\", text: str = \"\", submits: bool = False,\n         irreversible: bool = False) -> Decision:\n    if irreversible:                                        # purchase, delete, send money\n        return Decision.ASK\n    if action == \"navigate\":\n        host = host_of(url)\n        if host is None:\n            return Decision.DENY                            # no http:, file:, javascript:, data:\n        if carries_private(task, url):\n            return Decision.ASK                             # a GET is an exfiltration channel\n        if host not in task.allowed_hosts:\n            return Decision.ASK if task.tainted else Decision.ALLOW\n        return Decision.ALLOW\n    if action == \"type\":\n        if carries_private(task, text) and host_of(url) not in task.allowed_hosts:\n            return Decision.ASK\n        return Decision.ASK if submits else Decision.ALLOW  # Enter or a submit button sends it\n    if action == \"click\":\n        return Decision.ASK if submits else Decision.ALLOW\n    return Decision.DENY                                    # unknown action: closed by default Project increment rig v0.16: a browser mode with an isolated profile per task and a destination-aware gate behind the policy service. Read browser-use/browser-use at c75e847. Start with skills/open-source/references/agent.md and browser.md for orientation, then: browser_use/agent/service.py (4,163 lines; read selectively): Agent.run (2503), step (1035), _prepare_context (1087), _get_next_action (1176), get_model_output (1945), _execute_actions (1211), multi_act (2730), _post_process (1219) and _handle_step_error (1258); and how domain-scoped sensitive_data credentials are handled (from line 533). browser_use/agent/views.py: PageFingerprint (95), ActionLoopDetector (157), ActionResult (307), AgentOutput (388) and AgentHistory (488). browser_use/tools/service.py: Tools (441) and the actions navigate (507), input (778), upload_file (864), evaluate (1837) and click (2132). browser_use/browser/watchdogs/security_watchdog.py (296 lines): on_NavigateToUrlEvent (35), _is_url_allowed (176) and _is_url_match (252); and in browser/profile.py, user_data_dir (557), allowed_domains (628) and prohibited_domains (632). Brave's Comet disclosure: replay it, step by step, against your gate. Trace this path:Agent.run → step → _prepare_context (DOM serialization and screenshot into a browser-state summary) → _get_next_action → get_model_output (an AgentOutput with actions) → _execute_actions → multi_act → a Tools action such as navigate → a navigate event → SecurityWatchdog.on_NavigateToUrlEvent → _is_url_allowed → browser navigation → _post_process (loop detection) → next step. You should be able to answer What does browser-use send the model as \"the page\", and why not raw HTML? Can answer How does the security watchdog decide whether a URL is allowed, and how does it treat IP addresses and subdomains? Can answer Why is navigate not read-only? Give two exfiltration routes that use navigation alone. Can answer How do domain-scoped credentials keep secrets out of the model's context? Can answer Walk the Comet attack through your gate: at which step does rig stop, and on which rule? Can answer When would you choose computer use over DOM actions, and what does it cost? Can answer Experiments The adversarial pages with the gate off, the gate on, and the gate plus an isolated profile. DOM only, screenshot only, and both: success rate, tokens and latency. Loop detection on and off on an infinite-scroll page. Approvals per benign task: is the gate creating approval fatigue? Production lens Agentic browsing gets its own profile, cookies and credentials. Never the user's everyday browser. Every navigation and submission is a trace event with its destination host. CAPTCHAs and bot detection are a site's decision; respect them rather than evade them. Recordings (screenshots, network logs) are sensitive data with a retention policy. Not yet Anti-detection, browser-based crawling at scale, and training visual grounding models. Checkpoint rig stops at the approval boundary before every external or irreversible action, even with adversarial instructions on the page: zero forbidden actions completed across B01–B12. You can replay the Comet attack against rig and point to the trace event where it stops. Benign tasks need few enough approvals that you would accept them as a user.", "tasks": 18}, {"id": "w17", "group": "Weeks", "title": "Week 17: voice and realtime", "short": "Week 17", "html": "<p>A voice agent is the same loop inside a hard real-time budget: audio in, speech detection, transcription, the model, synthesis, audio out, with the user free to interrupt at any moment. Muse is coming to Meta's glasses with a wake word and has a realtime avatar. This week you build the small version and measure where every millisecond goes.</p>\n<h2 id=\"w17-concepts\">Concepts</h2>\n<ul>\n<li><strong>The pipeline.</strong> Microphone → voice activity detection → streaming speech-to-text → end-of-turn decision → the model (streaming) → streaming text-to-speech → speaker. A speech-to-speech model collapses the middle three stages.</li>\n<li><strong>The latency budget.</strong> What the user feels is the gap between when they stop speaking and when audio starts. It sums the VAD's stop delay (pipecat's default <code>stop_secs</code> is 0.2 s), the final transcription, the model's time to first token, text-to-speech time to first audio, and buffering. Measure each; overlap what you can.</li>\n<li><strong>Turn-taking.</strong> Silence alone cuts people off mid-thought, so end-of-turn detection is a classification problem. Barge-in means stopping playback and cancelling generation the moment the user speaks: Week 2's cancellation on a 200 ms clock.</li>\n<li><strong>Frames.</strong> pipecat models audio, text and control as frames flowing through processors; interruptions are system frames that jump the queue.</li>\n<li><strong>Transcript truth.</strong> After a barge-in the transcript must record what was actually played, not what was generated, or the model believes it said things the user never heard.</li>\n<li><strong>Always-on devices.</strong> Wake-word detection runs on the device; only audio after the wake word should leave it.</li>\n</ul>\n<h2 id=\"w17-day-by-day\">Day by day</h2>\n<p>The hard part this week isn't any single stage, it's that all of them run under a budget the user actually feels — so the day shape front-loads getting a pipeline working at all, then spends the back half of the week measuring and breaking it.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Time</th>\n<th>Do</th>\n<th>Working by end of day</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mon</td>\n<td>1 to 1.5 h</td>\n<td>Read Concepts; map every stage of the latency budget</td>\n<td>A half-page note naming every stage between end of speech and first audio</td>\n</tr>\n<tr class=\"even\">\n<td>Tue</td>\n<td>2 to 3 h</td>\n<td><code>rig/voice/</code>: a pipecat pipeline — Silero VAD, streaming STT, rig's runtime, streaming TTS</td>\n<td>A spoken question gets a spoken answer end to end, uninstrumented</td>\n</tr>\n<tr class=\"odd\">\n<td>Wed</td>\n<td>2 to 4 h</td>\n<td>Barge-in and sentence-level streaming</td>\n<td>Speaking over the bot stops playback and cancels generation; the first sentence reaches TTS before the model finishes</td>\n</tr>\n<tr class=\"even\">\n<td>Thu</td>\n<td>1.5 to 2 h</td>\n<td>Read pipecat; trace the frame path; add latency instrumentation</td>\n<td>Timestamps for all six latency-budget stages, with p50 and p95 over a few runs</td>\n</tr>\n<tr class=\"odd\">\n<td>Fri</td>\n<td>1 to 1.5 h</td>\n<td>The four experiments</td>\n<td><code>notes/week17-experiments.md</code></td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>3 to 4 h</td>\n<td>Voice evals V01 to V10; rig v0.17</td>\n<td>V01 to V10 pass with the same policy and memory behaviour as text mode</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>1 to 2 h</td>\n<td>Optional wake word or image input; checkpoint</td>\n<td>Checkpoint passed or a redo list</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"w17-day-by-day-mon\">Monday — the pipeline and the latency budget.</h3>\n<p>No code today. Before writing a pipecat pipeline you need to know what you're budgeting: six stages between the user falling silent and your bot's first sound, each a real number you'll measure Thursday. Read <strong>Concepts</strong> and map every stage onto the pipeline so Tuesday's build already has a shape in your head.</p>\n<ol type=\"1\">\n<li>Read <strong>Concepts</strong> in full.</li>\n<li>For VAD stop delay, final transcription, model time to first token, TTS time to first audio, and buffering, write one sentence on what determines each.</li>\n<li>Note which stages a speech-to-speech model would collapse, and why that doesn't make them free.</li>\n</ol>\n<h3 id=\"w17-day-by-day-tue\">Tuesday — assemble the pipeline.</h3>\n<p>Today you wire pipecat's frame graph end to end for the first time — VAD, STT, rig's runtime, TTS — with no interruption handling and no instrumentation yet. A spoken question producing a spoken answer, however slowly, is the only goal; barge-in and latency come once the happy path exists.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 1: Silero VAD, a streaming STT service, rig's runtime in research or personal mode, a streaming TTS service.</li>\n<li>Run one full turn by voice and confirm the answer comes back as audio.</li>\n</ol>\n<h3 id=\"w17-day-by-day-wed\">Wednesday — real-time behavior: barge-in and sentence streaming.</h3>\n<p>Today the pipeline stops assuming the user waits politely. Add barge-in (stop playback, cancel the model stream and any not-yet-started tool calls, truncate the transcript to what was actually played) and sentence-level streaming (send the first sentence to TTS before the model finishes) — the two mechanisms that make a voice agent feel real-time instead of like a slow phone tree.</p>\n<ol type=\"1\">\n<li>Implement <strong>Build</strong> step 2 (barge-in); confirm interrupting mid-sentence stops audio immediately.</li>\n<li>Implement <strong>Build</strong> step 4 (sentence-level streaming); confirm the first sentence reaches TTS before the model's full response is generated.</li>\n<li>Interrupt yourself mid-bot-sentence a few times by hand and read the resulting transcript: it must say what was actually played, not what was generated.</li>\n</ol>\n<h3 id=\"w17-day-by-day-thu\">Thursday — read pipecat, then instrument.</h3>\n<p>pipecat's own frame types and VAD defaults are the reference for exactly the mechanism you built Wednesday by feel. Read it to see the real implementation, then add <strong>Build</strong> step 3's instrumentation with those frame boundaries in mind — you now know exactly which frame transition each timestamp belongs to.</p>\n<ol type=\"1\">\n<li>Read <strong>Read: pipecat</strong> in full, following the given trace path.</li>\n<li>Implement <strong>Build</strong> step 3: timestamps at end of user speech, VAD stop, final transcript, model first token, first synthesized audio, playback start.</li>\n<li>Report p50 and p95 per segment on a handful of turns.</li>\n</ol>\n<h3 id=\"w17-day-by-day-fri\">Friday — find the knobs that actually move latency.</h3>\n<p>No new code today. Run the four experiments in <strong>Experiments</strong> below against the pipeline you built Tuesday to Thursday. Write up what moved in <code>notes/week17-experiments.md</code>: which knob changed perceived latency, and which just moved cost around.</p>\n<h3 id=\"w17-day-by-day-sat\">Saturday — the voice eval ladder.</h3>\n<p>Today you run V01 to V10, covering the failure modes a pure latency number hides — a correction mid-answer, a long pause that must not get cut off, a tool request. Passing them is what lets you claim rig works by voice, not just that it's fast.</p>\n<ol type=\"1\">\n<li>Run <strong>Build</strong> step 5's evals V01 to V10.</li>\n<li>Confirm <strong>Project increment</strong>: a voice front end for research and personal modes, with barge-in and a latency report.</li>\n</ol>\n<h3 id=\"w17-day-by-day-sun\">Sunday — optional extras, then checkpoint.</h3>\n<p>Optional if time allows; otherwise go straight to the checkpoint, the real signal for whether Week 17 is done.</p>\n<ol type=\"1\">\n<li>Optional: an on-device wake word, or an image-input path (<strong>Build</strong> step 6).</li>\n<li>Attempt <strong>Checkpoint</strong> below cold.</li>\n</ol>\n<h2 id=\"w17-build\">Build</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w17.build.1\"><input aria-label=\"Done\" data-id=\"w17.build.1\" id=\"c-w17-build-1\" type=\"checkbox\"/><div class=\"task-body\"><code>rig/voice/</code>: a pipecat pipeline with Silero VAD, a streaming speech-to-text service, rig's runtime (research or personal mode) and a streaming text-to-speech service.</div></li>\n<li class=\"task do\" data-id=\"w17.build.2\"><input aria-label=\"Done\" data-id=\"w17.build.2\" id=\"c-w17-build-2\" type=\"checkbox\"/><div class=\"task-body\">Barge-in: when the user starts speaking, stop playback, cancel the model stream and any tool calls not yet started, and truncate the assistant's message to what was played.</div></li>\n<li class=\"task do\" data-id=\"w17.build.3\"><input aria-label=\"Done\" data-id=\"w17.build.3\" id=\"c-w17-build-3\" type=\"checkbox\"/><div class=\"task-body\">Latency instrumentation: timestamps for end of user speech, VAD stop, final transcript, model first token, first synthesized audio and playback start; report p50 and p95 per segment.</div></li>\n<li class=\"task do\" data-id=\"w17.build.4\"><input aria-label=\"Done\" data-id=\"w17.build.4\" id=\"c-w17-build-4\" type=\"checkbox\"/><div class=\"task-body\">Sentence-level streaming: send the first sentence to text-to-speech before the model finishes.</div></li>\n<li class=\"task do\" data-id=\"w17.build.5\"><input aria-label=\"Done\" data-id=\"w17.build.5\" id=\"c-w17-build-5\" type=\"checkbox\"/><div class=\"task-body\">Voice evals V01–V10: short factual questions, a multi-turn task with a correction mid-answer, an interruption mid-sentence, a noisy-room recording, a long pause mid-thought (the agent must not cut in), and a tool request (\"what's on my calendar tomorrow?\").</div></li>\n<li class=\"task do\" data-id=\"w17.build.6\"><input aria-label=\"Done\" data-id=\"w17.build.6\" id=\"c-w17-build-6\" type=\"checkbox\"/><div class=\"task-body\">Optional: an on-device wake word, and an image input path (a photo of a document, then a question about it).</div></li>\n</ol>\n<h2 id=\"w17-project-increment\">Project increment</h2>\n<p>rig v0.17: a voice front end for research and personal modes, with barge-in and a latency report.</p>\n<h2 id=\"w17-read-pipecat\">Read: pipecat</h2>\n<p><a href=\"https://github.com/pipecat-ai/pipecat\" rel=\"noopener\" target=\"_blank\">pipecat-ai/pipecat</a> at <code>a3b149f</code>, an open-source framework for realtime voice and multimodal agents.</p>\n<ol type=\"1\">\n<li><code>src/pipecat/frames/frames.py</code> (2,662 lines; skim): <code>InterruptionFrame</code> (1241), <code>UserStartedSpeakingFrame</code> (1253), <code>BotStartedSpeakingFrame</code> (1411).</li>\n<li><code>src/pipecat/processors/frame_processor.py</code>: <code>FrameProcessor</code> (194), <code>queue_frame</code> (699), <code>process_frame</code> (819), <code>push_frame</code> (1007) and <code>_start_interruption</code> (1133).</li>\n<li><code>src/pipecat/pipeline/pipeline.py</code> (202 lines): <code>PipelineSource</code> (21), <code>PipelineSink</code> (55) and <code>Pipeline</code> (91). Then <code>pipeline/worker.py</code>: <code>PipelineWorker</code> (202), <code>run</code> (866) and <code>queue_frame</code> (911). <code>PipelineTask</code> is deprecated in favour of <code>PipelineWorker</code>.</li>\n<li><code>src/pipecat/audio/vad/vad_analyzer.py</code>: <code>VADParams</code> (47; defaults of confidence 0.7, start 0.2 s, stop 0.2 s) and <code>VADAnalyzer</code> (63). Then <code>silero.py</code>: <code>SileroVADAnalyzer</code> (130) and <code>voice_confidence</code> (199).</li>\n<li><code>src/pipecat/turns/</code>: the end-of-turn strategies, including <code>speculation_gate.py</code> and <code>eager_end_of_turn_mixin.py</code>.</li>\n</ol>\n<p><strong>Trace this path:</strong> an input audio frame → the VAD analyzer → <code>UserStartedSpeakingFrame</code> → if the bot is speaking, an <code>InterruptionFrame</code>, and <code>_start_interruption</code> clears queued frames → speech-to-text frames → the user stops (after <code>stop_secs</code>) → the aggregated user turn → the model service streams text frames → text-to-speech streams audio frames → <code>BotStartedSpeakingFrame</code> → output.</p>\n<h2 id=\"w17-you-should-be-able-to-answer\">You should be able to answer</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task q\" data-id=\"w17.q.1\"><input aria-label=\"I can answer this\" data-id=\"w17.q.1\" id=\"c-w17-q-1\" type=\"checkbox\"/><div class=\"task-body\">Where does each millisecond between the end of the user's speech and the first audio go in your pipeline?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w17.q.2\"><input aria-label=\"I can answer this\" data-id=\"w17.q.2\" id=\"c-w17-q-2\" type=\"checkbox\"/><div class=\"task-body\">What does <code>stop_secs</code> trade off, and why isn't silence alone a good end-of-turn signal?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w17.q.3\"><input aria-label=\"I can answer this\" data-id=\"w17.q.3\" id=\"c-w17-q-3\" type=\"checkbox\"/><div class=\"task-body\">What happens to queued frames when an interruption arrives, and why are interruptions system frames?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w17.q.4\"><input aria-label=\"I can answer this\" data-id=\"w17.q.4\" id=\"c-w17-q-4\" type=\"checkbox\"/><div class=\"task-body\">After a barge-in, what should the transcript say the assistant said?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w17.q.5\"><input aria-label=\"I can answer this\" data-id=\"w17.q.5\" id=\"c-w17-q-5\" type=\"checkbox\"/><div class=\"task-body\">Which tool calls can be cancelled mid-flight during a barge-in, and which must be allowed to finish (Week 15)?</div><span class=\"qtag\">Can answer</span></li>\n<li class=\"task q\" data-id=\"w17.q.6\"><input aria-label=\"I can answer this\" data-id=\"w17.q.6\" id=\"c-w17-q-6\" type=\"checkbox\"/><div class=\"task-body\">What leaves an always-listening device before and after the wake word?</div><span class=\"qtag\">Can answer</span></li>\n</ol>\n<h2 id=\"w17-experiments\">Experiments</h2>\n<ol class=\"tasks\" type=\"1\">\n<li class=\"task do\" data-id=\"w17.exp.1\"><input aria-label=\"Done\" data-id=\"w17.exp.1\" id=\"c-w17-exp-1\" type=\"checkbox\"/><div class=\"task-body\"><code>stop_secs</code> at 0.2, 0.5 and 0.8 s: false cut-ins against latency.</div></li>\n<li class=\"task do\" data-id=\"w17.exp.2\"><input aria-label=\"Done\" data-id=\"w17.exp.2\" id=\"c-w17-exp-2\" type=\"checkbox\"/><div class=\"task-body\">Sentence streaming to text-to-speech on and off: time to first audio.</div></li>\n<li class=\"task do\" data-id=\"w17.exp.3\"><input aria-label=\"Done\" data-id=\"w17.exp.3\" id=\"c-w17-exp-3\" type=\"checkbox\"/><div class=\"task-body\">A cascaded pipeline against a speech-to-speech model, if you have access to one: latency, quality and tool-calling reliability.</div></li>\n<li class=\"task do\" data-id=\"w17.exp.4\"><input aria-label=\"Done\" data-id=\"w17.exp.4\" id=\"c-w17-exp-4\" type=\"checkbox\"/><div class=\"task-body\">Interrupt at 20 random points; check the transcript is truthful and no tool runs twice.</div></li>\n</ol>\n<h2 id=\"w17-production-lens\">Production lens</h2>\n<ul>\n<li><strong>Per-segment latency SLOs,</strong> with p95 mattering more than p50 for how a conversation feels.</li>\n<li><strong>Audio is sensitive data:</strong> consent, retention, and on-device processing where possible.</li>\n<li><strong>Transport:</strong> WebRTC against WebSockets, jitter buffers, packet loss.</li>\n<li><strong>Cost per minute</strong> adds speech-to-text, model and text-to-speech.</li>\n</ul>\n<h2 id=\"w17-not-yet\">Not yet</h2>\n<p>Training speech models, echo-cancellation internals, and building a WebRTC stack.</p>\n<h2 id=\"w17-checkpoint\">Checkpoint</h2>\n<ul class=\"tasks\">\n<li class=\"task do\" data-id=\"w17.check.1\"><input aria-label=\"Done\" data-id=\"w17.check.1\" id=\"c-w17-check-1\" type=\"checkbox\"/><div class=\"task-body\">Median time from end of speech to first audio is reported with a breakdown, and you can name the biggest segment and what would shrink it.</div></li>\n<li class=\"task do\" data-id=\"w17.check.2\"><input aria-label=\"Done\" data-id=\"w17.check.2\" id=\"c-w17-check-2\" type=\"checkbox\"/><div class=\"task-body\">Barge-in stops audio, cancels generation and leaves a truthful transcript in all 20 interruptions.</div></li>\n<li class=\"task do\" data-id=\"w17.check.3\"><input aria-label=\"Done\" data-id=\"w17.check.3\" id=\"c-w17-check-3\" type=\"checkbox\"/><div class=\"task-body\">V01–V10 pass with the same policy and memory behaviour as text mode.</div></li>\n</ul>\n", "toc": [["w17-concepts", "Concepts", []], ["w17-day-by-day", "Day by day", [["w17-day-by-day-mon", "Monday — the pipeline and the latency budget."], ["w17-day-by-day-tue", "Tuesday — assemble the pipeline."], ["w17-day-by-day-wed", "Wednesday — real-time behavior: barge-in and sentence streaming."], ["w17-day-by-day-thu", "Thursday — read pipecat, then instrument."], ["w17-day-by-day-fri", "Friday — find the knobs that actually move latency."], ["w17-day-by-day-sat", "Saturday — the voice eval ladder."], ["w17-day-by-day-sun", "Sunday — optional extras, then checkpoint."]]], ["w17-build", "Build", []], ["w17-project-increment", "Project increment", []], ["w17-read-pipecat", "Read: pipecat", []], ["w17-you-should-be-able-to-answer", "You should be able to answer", []], ["w17-experiments", "Experiments", []], ["w17-production-lens", "Production lens", []], ["w17-not-yet", "Not yet", []], ["w17-checkpoint", "Checkpoint", []]], "text": "A voice agent is the same loop inside a hard real-time budget: audio in, speech detection, transcription, the model, synthesis, audio out, with the user free to interrupt at any moment. Muse is coming to Meta's glasses with a wake word and has a realtime avatar. This week you build the small version and measure where every millisecond goes. Concepts The pipeline. Microphone → voice activity detection → streaming speech-to-text → end-of-turn decision → the model (streaming) → streaming text-to-speech → speaker. A speech-to-speech model collapses the middle three stages. The latency budget. What the user feels is the gap between when they stop speaking and when audio starts. It sums the VAD's stop delay (pipecat's default stop_secs is 0.2 s), the final transcription, the model's time to first token, text-to-speech time to first audio, and buffering. Measure each; overlap what you can. T
