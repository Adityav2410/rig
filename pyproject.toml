[project]
name = "rig"
version = "0.1.0"
description = "A coding agent built from first principles on the raw Anthropic Messages API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Raj Verma" }]
requires-python = ">=3.14"
keywords = ["agent", "llm", "anthropic", "claude", "coding-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=1.14.0",
    "pytest",
    "types-pyyaml>=6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/Adityav2410/rig"
Course = "https://ai.labs-nature.com/study-plan/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["study-plan.md"]  # course plan copied from rig-study; its snippets are illustrative

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

ignore = ["SIM103"]

[tool.ruff.lint.isort]
known-first-party = ["rig"]

[tool.mypy]
python_version="3.14"
strict = true
